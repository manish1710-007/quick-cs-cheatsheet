<style>

<script>

const R=String.raw;

LES('m01-what','m01','What software documentation is (and is not)',1,7,[
P(R`Software documentation is any artifact that preserves and transmits knowledge about a software system: what it does, how to build and run it, how to change it safely, and why it is the way it is. Code documents <i>how</i>; tests document <i>expected behavior</i>; documentation carries everything else — intent, context, constraints and decisions — across people and time.`),
P(R`The useful mental model is <b>documentation as an engineering deliverable</b>, produced with the same care as code: versioned, reviewed, tested where possible, and owned. A document nobody maintains is not documentation; it is a fossil that actively misleads.`),
TB(['Kind','Answers the question','Typical artifacts','Primary audience'],[
['User documentation','How do I use this?','User guides, tutorials, FAQs, help center','End users, customers'],
['Developer documentation','How do I build, change and operate this?','README, ADRs, API reference, runbooks','Engineers, SREs, contributors'],
['Internal documentation','What do we know inside the team?','Design docs, RFCs, on-call runbooks, postmortems','The owning organization'],
['External documentation','What do we promise to outsiders?','Public API reference, integration guides, status pages','API consumers, partners, open-source users'],
['Static documentation','Snapshot at a moment in time','Signed-off specs, audit records, release notes','Auditors, future readers'],
['Living documentation','Evolves with the system','READMEs, runbooks, generated API docs, owned wikis','Current team, future you']]),
H('Documentation versus communication'),
P(R`Documentation is a subset of communication, not a replacement for it. A design conversation in a chat thread is communication; an RFC distilled from that thread is documentation, because it is <b>findable, durable and reviewable</b>. The test is simple: if a new team member could not find it six months later, it was communication only. Good teams convert important communication into documentation instead of pretending the scrollback will survive.`),
CALL('note',R`Static versus living is a spectrum per artifact, not per project. Release notes are frozen by design; a runbook must evolve or it becomes dangerous. Decide explicitly for each document which side of the spectrum it lives on, and say so in the document itself.`)
]);
LES('m01-why','m01','Why documentation matters, and what it costs to skip it',1,6,[
P(R`Documentation pays for itself in four currencies: <b>onboarding speed</b> (a good README and onboarding guide can cut time-to-first-commit from weeks to days), <b>collaboration quality</b> (reviewers and adjacent teams argue from a shared written context), <b>knowledge preservation</b> (bus-factor protection when the one person who understood the payment flow leaves), and <b>misunderstanding prevention</b> (a written contract prevents two teams from implementing two different fantasies of the same API).`),
H('Documentation debt'),
P(R`Like technical debt, documentation debt accumulates silently and compounds. Every undocumented decision forces the next reader to reverse-engineer intent from code — or worse, from git blame and guesswork. Unlike code, docs rarely scream when they rot: a stale runbook looks exactly like a fresh one until 3 a.m., when someone follows it into an outage.`),
TB(['Symptom of documentation debt','What it costs','First payment'],[
['New hires shadow seniors for weeks to absorb tribal knowledge','Onboarding cost, senior time','An onboarding guide with a maintainer'],
['The same architectural question is re-litigated quarterly','Meeting time, churn, inconsistency','An ADR capturing the decision and its context'],
['Integration teams open tickets asking for API examples','Support load, slow partners','A worked-examples API guide'],
['"Check with Dana" appears in incident channels','Single point of failure','A runbook owned by the team, not a person'],
['Two wikis describe the deploy process differently','Outages caused by following the wrong one','One source of truth; archive the rest']]),
CALL('trap',R`The most expensive documentation is the confidently wrong kind. A document that contradicts the system is worse than no document, because readers extend it trust. When you cannot maintain a document, delete it or clearly mark it stale — an honest gap beats a misleading answer.`)
]);
LES('m01-ownership','m01','Ownership, lifecycle and the source of truth',2,7,[
P(R`Documentation without an owner is abandoned on arrival. Every document that matters needs three properties written into it: an <b>owner</b> (a team, not a person — people change teams), a <b>purpose</b> (which reader, which question), and a <b>freshness signal</b> (last reviewed, or a trigger for review such as "review whenever the deploy pipeline changes").`),
H('The documentation lifecycle'),
TB(['Stage','What happens','Common failure'],[
['Create','Written for a real reader with a real question','Written because "we should have docs" — no reader in mind'],
['Review','Peers check accuracy and clarity, like code review','Skipped; published unreviewed, first reader finds errors'],
['Publish','Placed where the audience already looks','Published in a tool the audience never opens'],
['Maintain','Updated with the code it describes','Updated "later"; drift begins immediately'],
['Retire','Archived, marked stale, or deleted deliberately','Left standing, silently wrong']]),
H('One source of truth'),
P(R`For any given fact — the deploy command, the on-call rotation, the API base URL — exactly one location should be authoritative, and every other mention should link to it rather than copy it. Copies diverge; links do not. When migration is unavoidable, leave a tombstone: a one-line redirect saying "this moved", with the new location.`),
UL([R`<b>Rule:</b> facts live in one place; everywhere else links.`,
R`<b>Rule:</b> generated artifacts (API references) are never hand-edited — regenerate them or fix the source.`,
R`<b>Rule:</b> a document with no owner and no reader question is deleted on sight during audits.`]),
CALL('tip',R`Put ownership metadata in the document itself: "Owner: Payments team · Last reviewed: 2026-03 · Review trigger: schema changes." Reviewers, audits and future maintainers all read the same line.`)
]);
LES('m01-failures','m01','Documentation anti-patterns and when not to write',2,8,[
P(R`Most documentation failures are structural, not stylistic. Recognizing the patterns lets you fix the system instead of nagging individuals to "write more".`),
TB(['Anti-pattern','What it looks like','Why it hurts','Healthier alternative'],[
['The fossil wiki','Pages last touched years ago; structure mirrors an old org chart','Readers cannot tell fresh from stale; trust collapses','Docs-as-code beside the source; owner + last-reviewed on every page'],
['The silo','Each team maintains a private knowledge base','Cross-team questions answered three different ways','One searchable space with per-team namespaces'],
['Big design up front, never again','A 90-page spec written before line one, untouched after','Reality diverged on day two; the spec is fiction','Short living docs + decision records as decisions happen'],
['The dump','Everything pasted in: chats, screenshots, meeting notes','Findability zero; readers give up','Curated pages organized by reader question'],
['Documentation theater','Docs written for an audit, not for readers','Effort spent, zero value returned','Write for the next engineer; let audits read those'],
['Fear-driven duplication','The same fact copy-pasted "so my team can find it"','Copies diverge; incidents follow','One source of truth plus links']]),
H('When not to write documentation'),
P(R`Documentation is not free, and some of it should not exist. Do not write it when the information is <b>self-evident from the code or types</b> (a getter needs no prose), when it would be <b>generated better than written</b> (API references, dependency graphs), or when a <b>test asserts it</b> better than prose ever could. Also skip anything you are not willing to maintain — an honest "we have not documented this; ask in #payments" note beats a page that lies.`),
CALL('note',R`Balance depth against maintenance cost explicitly: a document read by hundreds and changed monthly justifies polish; a document read by two people once justifies a paragraph. Match the investment to expected readership × change frequency, not to an abstract ideal of completeness.`)
]);

LES('m02-audience','m02','Audience analysis: writing for the reader you actually have',1,6,[
P(R`The number one cause of bad technical writing is writing for the wrong reader — usually "everyone", which means no one. Before writing a paragraph, answer three questions: <b>Who is the reader?</b> (role and context), <b>What do they already know?</b> (vocabulary, concepts, environment), and <b>What are they trying to do?</b> (task, decision, or understanding).`),
TB(['Reader','Already knows','Trying to do','Give them'],[
['New joiner on your team','General engineering, not your domain','Get productive fast','Onboarding guide, glossary, pointers to ADRs'],
['Adjacent team engineer','Their domain, not yours','Integrate correctly','API contract, examples, error behavior'],
['Reviewer of your RFC','The system, not your proposal','Judge the trade-offs','Context, options, decision rationale'],
['On-call engineer','The system, badly, at 3 a.m.','Mitigate and recover','Runbook: symptoms, diagnosis, buttons to press'],
['External API consumer','Their own stack only','Ship their feature today','Reference plus copy-paste examples for common cases'],
['Engineering leadership','Impact and risk, not internals','Approve and resource','One-paragraph summary, then details on demand']]),
H('Knowledge levels and the trap of jargon'),
P(R`Calibrate jargon to the audience: with a new joiner, define terms on first use or link to a glossary; with your own team, internal shorthand is fine. The failure mode is invisible jargon — words the reader does not know they are misreading. "The service is eventually consistent" reads fine to a distributed-systems engineer and means nothing to a mobile developer.`),
CALL('tip',R`The Diátaxis framework (tutorials, how-to guides, reference, explanation) solves audience analysis structurally: instead of guessing one reader, you write four document types, each with a known reader mode. A person learning needs a tutorial; a person stuck mid-task needs a how-to; they are not the same person at the same moment.`)
]);
LES('m02-clarity','m02','Clear and concise technical writing',1,7,[
P(R`Clarity in technical writing is mechanical, not mystical. The reader must extract one unambiguous meaning with minimal effort. Two levers do most of the work: <b>active voice</b> (the actor acts) and <b>concrete language</b> (names, numbers, commands — not "appropriate", "several", "as needed").`),
CMP('Rewriting an ambiguous instruction','markdown',R`
## Deploy the service

The application should be deployed using the appropriate tooling when
necessary. Configuration can be adjusted as needed for the target
environment. A restart may be required after changes.
`,R`
## Deploy the service

Deploy with the staging pipeline:

    ./deploy.sh payments --env staging

Override defaults in ${BT}config/staging.env${BT}; every variable is
listed in ${BT}config/README.md${BT}. After changing
${BT}application.yml${BT}, restart the service:
${BT}systemctl restart payments${BT}.
`,[R`Names the exact command instead of "appropriate tooling".`,
R`Points to where every config variable lives instead of "as needed".`,
R`States the restart as a definite step with the actual command, not a vague "may".`,
R`Active constructions throughout: the pipeline deploys; the reader overrides; you restart.`],R`Precision beats politeness in instructions. If a step is optional, say "optional" and say when.`),
H('Removing ambiguity'),
TB(['Ambiguous phrase','Why it fails','Write instead'],[
['"Should be backward compatible"','Should = uncertain; compatible for whom?','"Existing clients sending v1 payloads continue to work unchanged."'],
['"This may fail under load"','Probability unknown, "load" undefined','"At over ~2,000 req/s the pool saturates and requests queue (see load test LT-2026-01)."'],
['"Configure the database properly"','"Properly" delegates the whole problem to the reader','"Set <code>POOL_SIZE=20</code> and <code>MAX_CONN=100</code>; values from the capacity plan."'],
['"Soon" / "later" / "in the future"','No date, no owner, no trigger','"Ships in release 4.2 (Q3); until then use the legacy endpoint."']]),
CALL('note',R`Passive voice is not banned — it is right when the actor is irrelevant: "the schema is validated at startup" needs no actor. The trap is passive that <i>hides</i> a meaningful actor: "it was decided that…" (who decided? where is the ADR?).`)
]);
LES('m02-structure','m02','Structure: headings, paragraphs and flow',2,7,[
P(R`Readers of technical documentation do not read; they hunt. Structure is what makes hunting succeed: descriptive headings that work as a table of contents, short paragraphs with one idea each, and a predictable information order within every section.`),
UL([R`<b>Headings are navigation.</b> "Configure connection pooling" beats "Overview" — the reader should know what a section contains from the heading alone.`,
R`<b>One idea per paragraph, 3–5 sentences.</b> A paragraph that covers setup <i>and</i> troubleshooting cannot be linked to, found, or skimmed.`,
R`<b>Parallel structure.</b> If three sections are "Installing", "Configuring", "Running", the fourth is not "How to debug" — it is "Debugging".`,
R`<b>Progressive disclosure.</b> Most-used information first; edge cases and rationale after; deep background at the end or behind a link.`,
R`<b>Lists for parallel items, prose for reasoning.</b> Never bury a causal argument inside a bullet; never serialize steps as prose.`]),
CMP('Restructuring a wall of text','markdown',R`
## Setup

To set up the project you need several tools. First install Java,
which comes in different versions, and you should use version 17 or
newer, although 21 is also fine and in fact recommended for the
profiling tools. Maven is used for building and it must be 3.8+. The
database is PostgreSQL 15 or newer, and Redis is needed for caching,
any 7.x is fine. Docker is optional but recommended, and Docker
Compose is used for the local stack. You also need to create a .env
file based on .env.example before running tests, which use
Testcontainers so Docker is actually required for the test suite
even though running the app itself does not require it.
`,R`
## Prerequisites

| Tool | Version | Required for |
|---|---|---|
| JDK | 21 (17 minimum) | Build and run |
| Maven | 3.8+ | Build |
| Docker + Compose | any recent | Test suite, local stack |
| PostgreSQL | 15+ | Local stack (via Compose) |
| Redis | 7.x | Local stack (via Compose) |

## Setup

1. Copy ${BT}.env.example${BT} to ${BT}.env${BT} and fill in the values.
2. Start the local stack: ${BT}docker compose up -d${BT}
3. Run the tests: ${BT}./mvnw verify${BT}

The app itself runs without Docker, but the test suite uses
Testcontainers and will fail without it.
`,[R`A prerequisites table replaces a paragraph the reader had to parse line by line.`,
R`Steps the reader performs become a numbered list in execution order.`,
R`The one non-obvious fact (tests need Docker even though the app does not) becomes a standalone sentence that cannot be skimmed past.`,
R`Versions move from prose to scannable cells; "any 7.x is fine" becomes "7.x".`],R`The information order — what you need, then what you do, then the gotcha — is the shape readers expect.`)
]);
LES('m02-style','m02','Terminology, tone, and writing for everyone',2,7,[
P(R`Inconsistent terminology is the quiet killer of technical documents: the reader cannot tell whether "user", "account" and "member" are one concept or three. Pick one term per concept, record it in a glossary, and use it with discipline. The same discipline applies to tone: technical writing is neutral, direct, and respectful of the reader's time.`),
TB(['Principle','Do','Avoid'],[
['Consistent terminology','One term per concept, defined on first use','Synonyms for variety ("service", "microservice", "component" for the same thing)'],
['Sentence economy','15–20 words average; cut every word that changes nothing','Stacked clauses; "in order to"; "it should be noted that"'],
['Neutral tone','"Running the tests requires Docker"','"Obviously you need Docker"; "simply run the command"'],
['International readers','Plain vocabulary; expand acronyms once','Idioms ("out of the box", "boil the ocean"), sports metaphors, humor that does not translate'],
['Inclusive language','"Chair", "allow-list", "primary/replica"','Gendered defaults, ability slurs, culturally loaded examples'],
['Accessibility','Alt text for meaningful images; meaning never carried by color alone','Screenshots without captions; "click the green one"']]),
H('Editing: the pass that makes it good'),
P(R`First drafts are for the writer; edits are for the reader. Three passes cover most documents: a <b>structure pass</b> (right sections, right order), a <b>sentence pass</b> (active voice, concrete terms, cut filler), and a <b>consistency pass</b> (terminology, formatting, capitalization, code style in examples). Reading aloud catches rhythm problems the eye forgives; a colleague from the target audience catches everything else.`),
CALL('tip',R`Style guides encode these decisions so every document does not re-litigate them: the Microsoft Writing Style Guide for general technical English, Google's developer documentation style guide for docs-as-code contexts, and Vale to enforce both automatically in CI (see Module 16).`)
]);

LES('m03-syntax','m03','Markdown and GitHub Flavored Markdown reference',1,8,[
P(R`Markdown is the lingua franca of documentation-as-code: READMEs, ADRs, RFCs, wikis and static site generators all speak it. The reference below is the working set you need for real documentation — core syntax plus GitHub Flavored Markdown (GFM) extensions.`),
TB(['Element','Syntax','Notes'],[
['Heading','<code># H1</code> · <code>## H2</code> · <code>### H3</code>','One H1 per document; never skip levels'],
['Paragraph','Blank line between blocks','A single newline is not a paragraph break'],
['Bold / italic','<code>**bold**</code> · <code>*italic*</code>','Asterisks are the convention; underscores also work'],
['Bullet list','<code>- item</code> (or <code>* item</code>)','Consistent marker; 2-space indent per nesting level'],
['Numbered list','<code>1. item</code>','Use all <code>1.</code> and let the renderer number; real numbers when order matters'],
['Task list (GFM)','<code>- [ ] todo</code> · <code>- [x] done</code>','Renders as checkboxes on GitHub'],
['Blockquote','<code>&gt; quoted text</code>','Nests with <code>&gt;&gt;</code>'],
['Inline code','Backtick-delimited','Double backticks to escape a backtick itself'],
['Fenced code block','Three backticks + language','Always tag the language for highlighting'],
['Link','<code>[text](https://example.com)</code>','Reference-style <code>[text][ref]</code> for repeated URLs'],
['Image','<code>![alt](images/arch.png)</code>','Alt text is not optional'],
['Table (GFM)','<code>| a | b |</code> + <code>|---|---|</code>','Alignment colons <code>:---:</code>; a pipe inside a cell needs escaping'],
['Horizontal rule','<code>---</code> on its own line','Blank lines around it, or it becomes a heading underline'],
['Strikethrough (GFM)','<code>~~removed~~</code>','Deprecation notices, changelogs'],
['Autolink (GFM)','Bare URL becomes a link','Prefer explicit links in prose'],
['Escaping','Backslash before the punctuation','<code>\\*not italic\\*</code>'],
['HTML inline','<code>&lt;kbd&gt;</code>, <code>&lt;sub&gt;</code>, <code>&lt;details&gt;</code>','Works on GitHub; portability risk in other renderers']]),
H('Anchors and cross-references'),
P(R`Every heading gets an auto-generated anchor: "## Retry policy" becomes <code>#retry-policy</code> (lowercase, spaces to hyphens, punctuation stripped). Linking between documents uses relative paths — <code>[ADR-0007](../adr/0007-postgres-for-orders.md)</code> — which is what keeps docs navigable in editors, on GitHub and in generated sites alike.`),
CODE('markdown',R`
## Document title

Introductory sentence with ${BT}inline code${BT} and a [link](../related/doc.md).

> A quote that carries weight.

- First parallel item
- Second item with **emphasis**
  - Nested, two spaces in

| Option | Default | Effect |
|---|---|---|
| ${BT}retries${BT} | ${BT}3${BT} | Attempts before the DLQ |
| ${BT}timeout${BT} | ${BT}30s${BT} | Per attempt |

1. Preparation
2. Execution
3. Verification

${F3}yaml
# fenced block with a language tag
server:
  port: 8080
${F3}
`),
CALL('warn',R`Tabs versus spaces inside code fences are preserved literally — the classic broken-README cause. Configure an .editorconfig and markdownlint (Module 16) so the tooling argues about it instead of the humans.`)
]);
LES('m03-conventions','m03','Documentation conventions that scale',2,6,[
P(R`Syntax is the small half of Markdown. Conventions decide whether a docs tree stays navigable at 500 files: predictable file names, stable anchors, relative links, and a predictable internal structure per document type.`),
UL([R`<b>File naming:</b> <code>kebab-case.md</code> (lowercase, hyphens) — sorts cleanly, survives every filesystem, becomes clean URLs.`,
R`<b>Relative links between docs:</b> <code>./runbook.md</code>, <code>../adr/0001-*.md</code> — works on GitHub, in editors and in static site generators. Absolute repo paths break the moment the repo is forked or renamed.`,
R`<b>One H1 per file</b>, matching the file's title; the H2s become the anchor namespace.`,
R`<b>Minimal front matter</b> when the generator needs it (title, description, weight) — every extra field is a maintenance tax.`,
R`<b>Images</b> in an <code>images/</code> directory next to the doc, referenced relatively; named after what they show (<code>deploy-pipeline.png</code>, not <code>screenshot-2.png</code>).`,
R`<b>Tables over prose</b> for anything with three or more parallel facts; <b>lists</b> for steps; <b>fenced code with language tags</b> always.`]),
H('The document skeleton'),
CODE('markdown',R`
# <Title matching the file name>

One-paragraph summary: what this document covers and for whom.

## Overview            (context the reader needs first)
## <Core content>      (the reason the document exists)
## <Core content>
## See also            (related docs, ADRs, runbooks)
`),
P(R`A reader who lands mid-document (from search, not your table of contents) relies on this skeleton to reorient in seconds. The <b>See also</b> section is cheap insurance against the doc becoming an island.`),
CALL('note',R`GitHub renders Markdown, but so do GitLab, editors, previews and every static generator — with small differences (anchors, task lists, HTML support). Restrict yourself to the portable set above and your docs survive any platform move.`)
]);

P(R`The README is the single most-read document in any repository and, for open-source projects, the front door of the product. A good one answers, in the first two screens: <b>What is this? Should I care? Can I run it? Where do I go deeper?</b>`),
TB(['Section','Question it answers','Signs it is failing'],[
['Title + one-liner','What is this?','Cute name with no explanation of the problem solved'],
['Badges','Can I trust it?','Stale or decorative badges that mislead about build state'],
['Features','What does it do?','A feature dump indistinguishable from the competition'],
['Requirements','What do I need?','Versions hidden in prose ("Java, preferably recent")'],

# ADR-NNNN: <short title, decision phrased as an action>

- **Status:** proposed | accepted | rejected | deprecated | superseded by ADR-MMMM
- **Date:** YYYY-MM-DD
- **Deciders:** <team or roles>

## Context
The forces at play: technical, organizational, deadlines, existing
systems. Facts with numbers, not opinions. This section is what makes
the ADR valuable in two years — record what was true *then*.

## Decision
We will <decision, stated in the active voice, no hedging>.
One paragraph to a few bullets. The decision itself, not its defense —
that belongs to context and alternatives.

## Alternatives considered
### <Alternative A>
What it is in one or two lines; why it lost — with evidence.

### <Alternative B>
…

## Consequences
**Positive:** what becomes easier, cheaper, faster.
**Negative / trade-offs:** what becomes harder; what we accepted.
New work the decision creates (monitoring, migrations, training).

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|

## References
Tickets, RFCs, benchmarks, prior ADRs, specs.

# ADR-0001: Use PostgreSQL for order and payment data

- **Status:** accepted
- **Date:** 2025-11-04
- **Deciders:** Platform team, Order domain team

## Context
The order domain captures orders, payments and refunds with strict
invariants: an order's charge total must equal the sum of its line
items; refunds can never exceed the payment; double capture must be
impossible. Volumes at decision time: ~40k orders/day, 12M order
rows projected for year one. The team is Java-heavy with strong SQL
skills; ops already runs one PostgreSQL 15 cluster for billing.

## Decision
We will store order, payment and refund data in PostgreSQL 16.

## Alternatives considered
### MongoDB
The document model fits the flexible order-manifest shape; but every
money invariant becomes application-side logic without the
cross-document transaction guarantees we need at our consistency
level. Finance's weekly rollup reporting would need a secondary
analytics pipeline from day one.
### MySQL 8
Viable; no decisive advantage over the existing PostgreSQL skills
and operations base. JSONB plus partial indexes tipped it.

## Consequences
**Positive:** ACID across money operations; finance-grade reporting
in plain SQL; one operational skill set; JSONB absorbs the genuinely
flexible manifest fields.
**Negative:** schema migrations are now mandatory (see ADR-0008);
sharding later means application-level partitioning work we are
consciously deferring.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Row growth slows order lookups | medium | medium | Index review per release; partition by month beyond 50M rows |
| Relational reflex forces RDBMS onto poor fits elsewhere | medium | low | Escalate per-service store choices to their own ADRs |

## References
Capacity sheet CAP-2025-11; billing PostgreSQL runbook; MongoDB
evaluation notes attached to RFC-003.
`,R`The context section is dated facts — volumes, existing skills, ops reality — which is exactly what makes the decision auditable later.`),
TPL('ADR-0002 · Modular monolith first','A sequencing decision, not an ideology.','markdown',R`
# ADR-0002: Start as a modular monolith; extract services on evidence

- **Status:** accepted
- **Date:** 2025-11-20
- **Deciders:** Architecture guild

## Context
Team of 9, one product, 18 months of runway to first revenue. The
domain has clear bounded contexts (orders, dispatch, tracking,
notifications) but unknown load distribution. No on-call rotation
exists yet; deployment infrastructure is a single ECS cluster.

## Decision
We will build a single deployable with enforced module boundaries
(Maven modules + ArchUnit rules), and extract services only when a
module shows independent scaling, independent release cadence, or a
distinct availability profile — with each extraction getting its own
ADR.

## Alternatives considered
### Microservices from day one
Matches the target org chart; but 4 services × CI/CD + observability
× 9 engineers means more platform than product in year one, and the
domain boundaries are still guesses.
### Single module, no enforcement
Fastest start; boundaries rot within months, making the later split
a rewrite.

## Consequences
**Positive:** one deploy, one pipeline; refactors stay cheap while we
learn the domain; boundaries enforced in CI, not in slide decks.
**Negative:** the extraction trigger must be watched — monoliths
drift toward a big ball of mud if boundary tests lapse; runtime
isolation is only logical (one blast radius).

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Boundary rules decay quietly | high | high | ArchUnit in the build (fails CI); quarterly conformance review |
| "Temporary" cross-module hacks | high | medium | PR review checklist item; exceptions need an issue with an expiry |

## References
Team topology notes; ArchUnit rule set in ${BT}fleet-common/arch${BT}.
`,R`The decision is reversible by design: each future extraction is pre-declared as its own ADR. Sequencing decisions should state their own exit conditions.`),
TPL('ADR-0003 · Spring Boot as the framework','A default choice still worth its record.','markdown',R`
# ADR-0003: Adopt Spring Boot 3 as the backend framework

- **Status:** accepted
- **Date:** 2025-11-22
- **Deciders:** Architecture guild, hiring lead

## Context
Java 21 is the org standard. Team history: 6 of 9 engineers have
shipped production Spring; 2 come from Micronaut; 1 from Quarkus.
Needs: REST + Kafka + scheduled jobs + security. Hiring pipeline
favors mainstream skills; maintenance horizon is 7+ years.

## Decision
All new JVM services use Spring Boot 3.3.x on Java 21.

## Alternatives considered
### Quarkus
Fastest startup and lowest memory — the best fit for GraalVM native
and serverless shapes. Team familiarity is low; the ecosystem depth
we lean on (spring-kafka, spring-data, spring-security) would be
rebuilt as glue code.
### Micronaut
A similar profile to Quarkus with compile-time DI; the same
familiarity trade-off applies.

## Consequences
**Positive:** maximum hiring pool and community depth; battle-tested
integrations for everything on the roadmap; Spring Security covers
the OAuth2/OIDC needs without custom code.
**Negative:** slower cold starts and heavier footprint than
Quarkus/Micronaut — accepted because our workloads are long-running
services, not scale-to-zero functions.
**Consciously accepted:** framework lock-in at the DI/idiom level.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Framework coupling pollutes domain code | high | medium | Hexagonal packaging enforced by ArchUnit; domain modules import no Spring types |
| Security-driven upgrades become painful | high | low | Depend on the BOM only; no version wildcards; weekly CI run against the latest patch |

## References
ADR-0002; spike results in SPK-118.
`,R`Even "boring default" choices deserve one page — the alternatives section is what stops the annual "should we be on Quarkus?" debate.`),
TPL('ADR-0004 · JWT access tokens with revocation','The stateless/stateful compromise, honestly recorded.','markdown',R`
# ADR-0004: Short-lived JWT access tokens + server-side revocation

- **Status:** accepted
- **Date:** 2025-12-02
- **Deciders:** Security guild, mobile + platform leads

## Context
Clients: mobile apps, courier devices (often offline), a dispatcher
SPA. Requirements: password login; "log out all devices"; admin bans
take effect within seconds; no sticky sessions (multi-region load
balancing planned for Q3). The threat model includes stolen devices.

## Decision
15-minute JWT access tokens (HS256, rotated keys) plus 30-day opaque
refresh tokens stored server-side in Redis with per-device metadata.
A revocation list (jti deny-list, TTL = token TTL) enables immediate
ban/logout; refresh-token rotation detects replay.

## Alternatives considered
### Server-side sessions (opaque cookie)
The simplest revocation story; but multi-region session stores and
courier offline needs make cookies plus central sessions the awkward
fit.
### Long-lived pure JWTs (no revocation)
Fully stateless; a 30-day ban latency is unacceptable for the threat
model, and logout becomes cosmetic.

## Consequences
**Positive:** stateless auth for services; instant ban via the
deny-list; the device list enables "log out all devices".
**Negative:** we carry a Redis dependency on the auth path. If Redis
is unavailable, tokens younger than 5 minutes pass without a
deny-list check — a bounded risk window we accept consciously.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Signing key leakage | low | critical | Keys in KMS; 90-day rotation; separate keys per environment |
| Redis outage opens the 5-minute window during an active ban | medium | high | Fallback policy documented in runbook AUTH-04; alerts on Redis health |

## References
Threat model TM-2025-4; runbook AUTH-04; OWASP Session Management
Cheat Sheet.
`,R`The trade-off is named precisely — a 5-minute bounded risk — and the mitigation is already a runbook link. That specificity is what makes ADRs actionable.`),
TPL('ADR-0005 · Kafka over RabbitMQ','Event backbone choice with workload reasons.','markdown',R`
# ADR-0005: Kafka as the domain-event backbone

- **Status:** accepted
- **Date:** 2025-12-10
- **Deciders:** Architecture guild, ops

## Context
Planned producers/consumers: the order lifecycle (8 event types),
the tracking location firehose (~2k msgs/s peak, batchable), and
notification fan-out. Consumers need replay (new services backfill
from history), and finance wants a durable 7-year audit trail of
order events with a lake offload planned.

## Decision
Kafka (3 brokers, RF=3) for domain events. RabbitMQ remains for
existing RPC-style async commands until the service extraction
(per ADR-0002) completes, then retires.

## Alternatives considered
### RabbitMQ only
Excellent for command routing and priority queues; but replay means
re-publishing, retention is not a first-class concept, and the
location firehose would need sharding workarounds.
### Managed cloud pub/sub
Removes the ops burden; egress cost at 2k msgs/s continuous plus the
7-year retention requirement favored self-managed Kafka on the
existing Kubernetes cluster.

## Consequences
**Positive:** durable, replayable log; consumer groups scale location
ingestion naturally; transactional outbox gives the order sagas
effectively-once semantics; the lake offload rides Kafka Connect.
**Negative:** broker operations cost (rebalances, disk); a team
learning curve; request/reply stays awkward (hence the interim
RabbitMQ).

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Rebalance storms | medium | high | Static group membership; consumer tuning documented in runbook KAF-02 |
| Unowned topics proliferate | high | medium | Topic naming + ownership registry (Module 10) |

## References
Load model EV-2025-12; ADR-0002; RabbitMQ migration note.
`,R`The workload facts (2k msgs/s, replay, 7-year retention) carry the decision — an ADR without these numbers is an opinion.`),
TPL('ADR-0006 · Redis read-through caching','A cache decision with explicit invalidation answers.','markdown',R`
# ADR-0006: Redis read-through cache for product and pricing reads

- **Status:** accepted
- **Date:** 2026-01-08
- **Deciders:** Order domain team, ops

## Context
Product and pricing reads are ~85% of read traffic (catalog pages,
driver-app order composition). P95 today is 180ms, dominated by six
joined queries. Pricing writes are rare (nightly batch plus
emergency corrections). A Redis cluster already runs for sessions
(ADR-0004) with ops tooling in place.

## Decision
Read-through caching in Redis with a 10-minute TTL as the safety net
plus explicit event-driven invalidation (pricing-updated events
flush keys) as the fast path. Cache-aside in code via a thin shared
library; no distributed locking.

## Alternatives considered
### PostgreSQL materialized views
Helps the joins but not network and app-server cost; the refresh
story for emergency corrections was clumsy.
### No cache; add read replicas
Removes invalidation complexity; the 80ms P95 target is unreachable
for the six-way joins at our access shape.

## Consequences
**Positive:** projected P95 at or under 60ms for hot keys; DB load
halves, delaying the replica build by about a year.
**Negative:** a new consistency class to reason about (stale ≤ 10
minutes worst case without events, seconds with); stampede risk on
cold keys; one more failure mode in the read path.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Stampede on expiry | high | medium | Jittered per-key TTL + single-flight in the cache library |
| Stale pricing leaking into orders | medium | high | Order composition pins prices at order start (event-sourced), never read from cache |

## References
Load test LT-2026-01; ADR-0004 (Redis already present).
`,R`"TTL as safety net + events as fast path" is the two-layer invalidation answer that makes cache ADRs reviewable.`),
TPL('ADR-0007 · Async between services','Communication style decision tied to coupling goals.','markdown',R`
# ADR-0007: Event-based communication between services

- **Status:** accepted
- **Date:** 2026-01-15
- **Deciders:** Architecture guild

## Context
After the first extractions (per ADR-0002) the services are orders,
dispatch, tracking and notifications. Cross-service flows are long
(order → assignment → pickup → delivery spans minutes to days),
consumers evolve independently, and the 2026-01 spike showed
synchronous chains coupling availability: one slow consumer timed
out the whole chain.

## Decision
Service-to-service state changes propagate as events on Kafka
(naming and versioning rules in Module 10). Synchronous REST is
reserved for user-facing reads that need fresh data and commands
that must fail in the caller's face (validation, payment
authorization).

## Alternatives considered
### REST everywhere (synchronous)
Simple request/response and a perception of strong consistency; but
it couples availability and latency, and makes retroactive consumers
impossible.
### gRPC synchronous
Better than REST for internal sync calls — kept for the two
remaining synchronous paths; does not address the coupling problem.

## Consequences
**Positive:** independent deployability; consumers can be added
without producer changes; replay makes new consumers cheap.
**Negative:** eventual consistency becomes the default mental model
for everyone (a training cost); debugging spans tracing plus event
inspection; flows that must complete need saga orchestration
(outbox + orchestrator in order-service).

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Eventual consistency surprises product owners | high | medium | UI state model documented per screen; pending states made explicit |
| Poison messages | medium | high | DLQ per consumer with a runbook; schema registry gating deploys |

## References
ADR-0005; saga design doc; the 2026-01 spike trace.
`,R`The decision names where synchronous REMAINS — the boundary list is half the decision.`),
TPL('ADR-0008 · Flyway for migrations','A small decision, recorded because it gates every schema change.','markdown',R`
# ADR-0008: Flyway for database schema migrations

- **Status:** accepted
- **Date:** 2026-01-20
- **Deciders:** Order domain team

## Context
PostgreSQL per ADR-0001; two services already had out-of-band schema
changes in month one (a hand-run ALTER that mismatched staging).
Requirements: migrations in git, reviewed like code, repeatable in
CI (Testcontainers) and in production, with a defined rollback
story.

## Decision
Flyway with plain SQL migrations, versioned
${BT}V<timestamp>__description.sql${BT}, one change per file, applied
by the service at startup in dev/CI and by the deploy pipeline in
staging/production (profile-gated).

## Alternatives considered
### Liquibase
XML/YAML changelogs abstracting across databases; we are
single-database and prefer plain SQL diffs — the abstraction layer
was cost without benefit here.
### dbmate / sqitch
Solid CLI-first tools; no decisive edge over Flyway's Spring
integration for this stack.

## Consequences
**Positive:** schema history in git per service; CI proves every
migration against a real PostgreSQL from scratch; production parity
of migration mechanics.
**Negative:** no automatic down-migrations (Flyway community) —
rollback is a forward-fix migration, documented in runbook DB-07.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| A long-locking migration in production | medium | high | Migration review checklist: no implicit table rewrites without a reviewed plan |

## References
ADR-0001; runbook DB-07 (forward-fix procedure).
`,R`A small-scope ADR is fine — it gates every schema change forever, which is significance enough.`),
TPL('ADR-0009 · Docker containers','Packaging decision with the operational why.','markdown',R`
# ADR-0009: Docker containers as the deployment unit

- **Status:** accepted
- **Date:** 2026-02-01
- **Deciders:** Ops, architecture guild

## Context
Target infrastructure: a small Kubernetes cluster (existing,
ops-owned). Services are JVM (Spring Boot 3) plus one Node SPA.
Local development uses Compose. The same artifact must run on
laptops, CI and production; configuration strictly via environment
variables.

## Decision
Every service ships as an OCI image built by CI (multi-stage: Maven
build on a JRE 21 runtime layer, distroless base), tagged by git
SHA, promoted dev → staging → production as the same digest.

## Alternatives considered
### Fat JARs deployed to VMs
No container orchestration needed; loses the uniform runtime, the
self-contained process model, and the Compose-to-production parity
that Testcontainers-based integration tests rely on.
### Jib
Excellent layer caching without Docker-in-CI; BuildKit cache
achieved the same for us while keeping the standard Dockerfile as
the single source of the runtime image.

## Consequences
**Positive:** one artifact shape for JVM and Node; immutable
deploys; local/production parity; the Kubernetes target is
satisfied naturally.
**Negative:** JVM container memory quirks require flag care; image
scanning and base-image patching join the ops checklist.

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| CVEs in base images | medium | medium | Trivy scan gate in CI; weekly base rebuild |
| OOMKills from misconfigured heap | medium | high | ${BT}MaxRAMPercentage=75${BT} documented in every runbook's known-values section |

## References
ADR-0002; CI pipeline doc; runbook DEP-01.
`,R`Recording the JVM-specific known-good flags prevents every service from rediscovering them in production.`),
TPL('ADR-0010 · Multi-module Maven architecture','A build-level decision that enforces the module boundaries.','markdown',R`
# ADR-0010: Multi-module Maven build for the platform

- **Status:** accepted
- **Date:** 2026-02-14
- **Deciders:** Architecture guild

## Context
ADR-0002 chose a modular monolith with enforced boundaries. We need
build-time enforcement, per-module test runs, a shared
${BT}fleet-common${BT}, and a path where one module can later become a
service without repository surgery.

## Decision
One Maven reactor, one module per bounded context
(${BT}fleet-common${BT}, ${BT}fleet-order${BT}, ${BT}fleet-dispatch${BT}, …),
each with its own ${BT}pom.xml${BT} inheriting the parent BOM. Modules
depend on each other only through ${BT}fleet-common${BT} interfaces —
enforced by ArchUnit plus maven-enforcer banned-dependency rules.

## Alternatives considered
### Gradle multi-project
Faster builds and a cleaner DSL; team Maven depth and the hiring
pool argued for Maven. Build speed addressed with ${BT}-T 1C${BT} and
caching.
### Single module with packages only
No build isolation; nothing stops the import that rots the
boundary.

## Consequences

review; per-module CI filtering (${BT}-pl fleet-order -am${BT});
future extraction means moving one directory into a repo and
adjusting the parent.
**Negative:** reactor discipline needed (version drift, parent
snapshots); IDE import quirks for newcomers — covered by the
onboarding guide (Module 11).

## Risks & mitigations
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| ${BT}fleet-common${BT} becomes a dumping ground | high | medium | Review rule: no domain logic; ArchUnit forbids implementation dependencies there |

## References
ADR-0002; the onboarding guide; enforcer rules in the repo.

LES('m05-judgment','m05','When to write an ADR, and when it is overhead',2,5,[
P(R`The ADR habit fails in two ways: never writing them (decisions evaporate) and writing them for everything (nobody reads them). Calibrate with three questions: <b>Will anyone ask "why" in six months?</b> <b>Is it expensive to reverse?</b> <b>Does it constrain other teams?</b> Two or three yeses → write the ADR. Zero → a commit message suffices.`),

LES('m06-what','m06','What an RFC is; RFC versus ADR versus design doc',1,6,[
P(R`A Request for Comments is a <b>proposal document that invites review before a decision</b>. Where an ADR records a decision already made, an RFC exists to make the decision well: it lays out a problem, a proposed solution, alternatives and consequences, then circulates for structured feedback from everyone affected. The output of an RFC process is a better decision (and usually an ADR recording it).`),
TB(['Document','Question it answers','Written when','Typical size','Outcome'],[
['RFC','Should we do this, and how?','Before a significant change','2–6 pages','A decision, recorded as an ADR; the RFC is then marked accepted/rejected'],
['ADR','Why did we decide this?','At decision time','½–2 pages','A durable record; supersedable only by a new ADR'],
['Design doc / spec','How exactly will this be built?','After the decision','5–20 pages','The implementation contract: data models, API contracts, tests'],
['Issue / ticket','What is the next unit of work?','Any time','A few paragraphs','A merged change']]),

LES('m06-process','m06','The RFC process: from problem to recorded decision',2,8,[
P(R`An RFC is a process wrapped around a document. The document is easy; the process is what turns opinion into an informed decision.`),
TB(['Stage','What happens','Failure mode to avoid'],[
['1. Problem statement','Author writes the problem (not the solution) first; confirms it with the affected teams','Solution in search of a problem — the classic doomed RFC'],
['2. Draft','Author fills the template: context, proposal, alternatives, risks','Polishing prose while skipping alternatives ("there was no other option")'],
['3. Circulation','Shared in the RFC index/channel; reviewers assigned by affected area','Silent circulation — nobody knows they are expected to comment'],
['4. Discussion','Time-boxed (e.g. 5 business days); comments land in the doc or threaded issues','Debate forks across three chat tools; decisions made in the loudest room'],
['5. Revision','Author updates the proposal, answering substantive comments inline','Comments ignored silently — reviewers learn not to bother'],
['6. Decision','Owner decides: accept, accept-with-changes, reject, or defer with a date','Consensus-waiting: weeks of silence treated as agreement'],
['7. Recording','Outcome + date recorded in the RFC status; accepted decisions spawn an ADR','Accepted RFCs with no ADR — the "why" evaporates'],[
'8. Archive','RFC moved to the archive; superseded ones point forward','Zombie RFCs that half-implemented years ago still read as plans']]),

R`<b>Do your alternatives honestly.</b> The straw-man alternative ("we could also do nothing") tells reviewers you are not listening.`,
R`<b>Pre-socialize the scary parts.</b> A 30-minute conversation with the two people most affected before circulation converts your harshest reviewers into co-authors.`,
R`<b>Time-box everything.</b> "Comments by Friday" with a default outcome ("no comment = accept") beats an open-ended consensus hunt.`]),

LES('m06-template','m06','The RFC template, section by section',2,8,[

# RFC-NNNN: <title>

- **Author:** <name>
- **Status:** draft | in review | accepted | rejected | withdrawn
- **Created:** YYYY-MM-DD · **Decides by:** YYYY-MM-DD

## Summary
Three sentences: problem, proposal, asked-for decision.

## Problem statement
What hurts, for whom, since when, with evidence (incidents, costs,
tickets). Not the solution.

## Goals
What "better" looks like after this change — measurable where
possible.

## Non-goals
Explicitly out of scope; the scope-creep firewall.

## Requirements
Hard constraints the solution must satisfy (compliance, latency
budgets, backward compatibility, deadlines).

## Proposed design
The design itself: components, data flow, interfaces. Diagrams
where they carry weight. Alternatives get their own section — this
one states the proposal, not its defense.

## Alternatives considered
Each with: what it is, why it loses (or wins) against the criteria
above. Include "do nothing".

## Architecture impact
Which services/modules change; new dependencies; coupling created
or removed.

## Security and privacy considerations
Authn/z changes, new trust boundaries, data classification, PII
flows, threat-model deltas.

## Performance implications
Expected latency/throughput deltas, load changes, capacity needs —
with the numbers you have, labeled as estimates where estimated.

## Migration and rollout plan
Phases, feature flags, dual-write/dual-read windows, rollback
per phase.

## Testing strategy
How each phase is verified before the next: tests, canaries,
soak runs, game days.

## Risks
Table: risk × likelihood × impact × mitigation. Include the
"we accept this" rows.

## Open questions
Numbered, with owners and dates. The reviewer's aiming points.

## References
Incidents, ADRs, prior RFCs, benchmarks, external docs.
`,R`If a section genuinely does not apply, keep the heading and write "none — because X": visible reasoning beats silent omission.`)
]);

# RFC-011: Replace synchronous order→dispatch calls with events

- **Author:** A. Okafor (Order domain)
- **Status:** accepted (decision recorded in ADR-0007)
- **Created:** 2026-01-28 · **Decided:** 2026-02-05

## Summary
Order-service calls dispatch-service synchronously during checkout.
We propose publishing ${BT}OrderConfirmed${BT} to Kafka and letting
dispatch consume it, removing the availability coupling. We ask the
guild to approve the migration plan for release 4.2.

## Problem statement
Checkout fails whenever dispatch-service is deploying or slow:
four incidents in Q4 (IM-2026-011…014), 620 failed checkouts,
~€9k refunded credits. Dispatch deploy freezes (10/week) currently
gate order deploys.

## Goals
- Checkout succeeds while dispatch is unavailable (target: zero
  order failures attributable to dispatch in Q2).
- Decouple deploy windows.
- Allow a future routing-optimization consumer without touching
  order-service.

## Non-goals
- Replacing the payment authorization call (must fail fast in the
  caller's face).
- Batch/lambda architecture — Kafka stays the transport.
- Re-platforming dispatch itself.

## Requirements
- No lost orders: exactly-once effect on assignment creation.
- Assignment within 60s of confirmation (P95) in steady state.
- Replay: new consumers backfill 30 days of history.

## Proposed design
Order-service keeps a transactional outbox table; a poller publishes
${BT}OrderConfirmed${BT} (schema: Module 10) to
${BT}order.events.v1${BT}. Dispatch-service consumes with a consumer
group, creates assignments idempotently by ${BT}orderId${BT}, and
exposes an internal reassignment API for edge cases. Checkout flow:
order → payment (sync) → outbox → 202 to customer.

## Alternatives considered
### Keep synchronous calls, add retries + circuit breaker
Cheapest change; reduces but does not remove coupling (the Q4
incidents were during brownouts, where retries amplify).
### Request/reply over RabbitMQ (RPC pattern)
Removes HTTP coupling; keeps temporal coupling (caller waits for
the reply) — the actual failure mode we are fixing.

## Architecture impact
order-service: +outbox table, publisher; dispatch-service: consumer
group, idempotent assignment creation. New shared contract:
${BT}OrderConfirmed${BT} v1 schema (owned by order domain).

## Security and privacy considerations
Event carries customer address (PII): encrypted at rest (Kafka TLS
+ volume encryption); consumers authenticate via mTLS; retention
30 days, lake offload drops address fields (documented in the
schema).

## Performance implications
Checkout latency drops by the dispatch RTT (~120ms P95 today).
Kafka: +8 msg/s average, 40/s peak — trivial against the firehose
(ADR-0005 capacity).

## Migration and rollout plan
Phase 1: dual-write (call + publish), consumers shadow-compare
(2 weeks). Phase 2: dispatch reads events, sync kept as fallback
(2 weeks, feature-flagged per region). Phase 3: sync path removed.
Rollback per phase = flag flip.

## Testing strategy
Contract tests on the event schema (producer CI); shadow-compare
dashboards in phase 1; chaos test: kill dispatch during checkout in
staging (game day) before phase 3.

## Risks
| Risk | Likelihood | Impact | Mitigation |
|---|---|---|---|
| Outbox poller lag exceeds 60s target | low | medium | Batch size + poll interval tuned; alert on lag > 30s |
| Duplicate assignments during replays | medium | high | Idempotent consumer keyed on orderId; DLQ + runbook |

## Open questions
1. Who owns the reassignment API SLA? (Dispatch — answer by Feb 3)
2. Does finance need the event for revenue recognition? (Asked — no)

## References
Incidents IM-2026-011…014; ADR-0005; ADR-0007; outbox pattern
references in ${BT}docs/adr/0002-outbox-pattern.md${BT}.

LES('m07-complete','m07','Complete example: documenting the logistics platform',3,12,[
P(R`Diagrams are half of architecture documentation; the other half is the <b>prose the diagrams cannot carry</b>. This is the full skeleton for the platform, filled to working depth — the shape to imitate.`),
TPL('Architecture overview — Fleet Logistics platform','The one-page map plus the boundary facts.','markdown',R`
# Fleet Logistics Platform — architecture

Owner: Platform guild · Last reviewed: 2026-03 · Review trigger:
any container change

One paragraph: door-to-door parcel dispatch for metro couriers;
~40k orders/day, 2k location updates/s peak, 4 services + 1 SPA
on Kubernetes, PostgreSQL 16 per service, Kafka event backbone.

## System responsibilities
- Order capture, payment orchestration, cancellation/refund
- Driver assignment and live dispatch (the routing core)
- Location ingestion and geofenced stop detection
- Customer/driver/dispatcher notification fan-out

## Context and containers
[Context diagram — Mermaid source: docs/diagrams/context.mmd]
[Container diagram — Mermaid source: docs/diagrams/containers.mmd]
One line per container: responsibility · technology · owning team.

## Boundaries and contracts
| Boundary | Contract | Owner |
|---|---|---|
| Client ↔ platform | REST /v1 + JWT (OpenAPI: docs/api) | API guild |
| order ↔ dispatch | OrderConfirmed v1 (Kafka, AsyncAPI) | Order domain |
| tracking ↔ all | tracking.locations.v1 (read-only consumers) | Tracking team |
| platform ↔ PSP | PSP's API + webhooks (signed) | Payments team |

## Data ownership
Each service owns its schema exclusively; no cross-service reads.
Cross-service data needs flow through events. One exception
(documented, ADR-0001): finance reads a replicated read-only
replica of order data for reporting.

## Failure paths (the section readers thank you for)
- Kafka down: orders buffer in the outbox (bounded 30 min at peak);
  checkout keeps working; assignment lags. Runbook KAF-01.
- Redis down: auth falls back to the 5-minute window (ADR-0004);
  pricing reads hit PostgreSQL (P95 180ms, degraded but alive).
- dispatch-service down: orders queue; dispatchers fall back to
  manual assignment via the console. Runbook DIS-02.

## Security boundaries
Trust boundaries: client edge (WAF, rate limits), service mesh
(mTLS), database (VPC-only). PII: customer names/addresses —
encrypted volumes, masked in logs, dropped before lake offload.

## Deployment topology
3 Kubernetes nodes per region, 2 regions active-active for reads,
leader-region for writes. Full topology + escalation:
docs/runbooks/ and infra repo README.

## Decisions
ADR index: docs/adr/ — data store, eventing, auth, caching,
migration tooling, packaging, build architecture.

## Further reading
Per-service design docs; Module 15's order-processing spec;
observability overview.
`,R`The failure-paths section is what separates architecture documentation from architecture marketing. It is also the section on-call reads first.`),
CALL('tip',R`Keep the overview at this density — a dense page and a half. Everything deeper is one link away in per-service docs. The overview's job is orientation, not completeness.`)

LES('m08-principles','m08','Why diagrams work, and the rules that keep them working',1,6,[
P(R`Humans extract structure from diagrams far faster than from prose — but only from diagrams that follow rules. A diagram is a sentence with a subject and one predicate; the moment it tries to say two things, it says neither.`),
TB(['Rule','Meaning','Symptom of violation'],[
['One message per diagram','Every diagram answers exactly one question, stated in its title','Titles like "System overview v3 FINAL 2"'],
['Consistent direction','Data flows one way across the page (usually left→right or top→down)','Arrows doubling back everywhere; spaghetti crossings'],
['Named by meaning','Nodes say what/why, not acronyms nobody new can decode','"SVC-B → K (async)"'],
['Labeled relationships','Every edge says what flows and how (REST, event, batch)','Naked arrows the reader must reverse-engineer'],
['Bounded complexity','≤ ~9 nodes, ≤ ~15 edges; beyond that, split into levels','Nobody can trace any path through the diagram'],
['Same shape, same meaning','Boxes, cylinders and queues always mean the same thing across all your diagrams','Random icon soup from template libraries']]),

P(R`A diagram nobody can regenerate is a screenshot with a deadline. The maintained-diagram rule set: source in text (Mermaid, PlantUML, D2, Structurizr DSL), stored next to the docs that use it, changed in the same PR as the architecture change, and reviewed like code. When a diagram and reality disagree, the reader loses — and they cannot tell which one is wrong.`),

LES('m09-fundamentals','m09','API documentation fundamentals',1,8,[
P(R`API documentation is a <b>contract</b>: every documented behavior is something a consumer may build against, and every undocumented behavior is an incident waiting for a support ticket. The discipline: document what the API <i>actually does</i>, including the failure modes, or fix the API until it is documentable.`),
TB(['Element','What to document','Common omission'],[
['Endpoint + method','Path with parameter names in place: <code>POST /v1/orders</code>','Version segment left implicit'],
['Purpose','One sentence: what this does and when to use it','"Creates an order" without the when — so consumers use it for bulk imports too'],
['Authentication','Scheme, scopes, and what happens with none/invalid tokens','Scope requirements discovered by 403 in production'],
['Parameters','Name, location (path/query/header/body), type, required, defaults, validation rules','Validation rules — the #1 integration-ticket source'],
['Request body','Full schema + a realistic example (not <code>{"foo":"bar"}</code>)','Examples that omit required fields'],
['Responses','Per status code: when, body schema, example','Error bodies documented only for 200-family fantasies'],
['Status codes','Every code the endpoint can actually return','429/5xx treated as "impossible" until the first retry storm'],
['Headers','Rate limits, pagination, idempotency, ETag/If-Match','Response headers left undocumented because "they are standard"']]),
H('Error responses are the contract too'),
P(R`Consumers build retry logic, monitoring and user messages from your errors. A machine-readable envelope plus stable codes is the difference between a resilient client and a switch statement full of string matching.`),
CODE('json',R`
{
  "code": "ORDER_CUSTOMER_BLOCKED",
  "message": "Customer is blocked from placing orders.",
  "details": { "customerId": "7f3a…" },
  "retryable": false,
  "docs": "https://api.fleetlogistics.example/errors#order_customer_blocked",
  "traceId": "a1b2c3d4"
}
`),
UL([R`<code>code</code> — stable, documented, greppable. Never change a code's meaning; add a new one.`,
R`<code>message</code> — human-readable, explicitly <i>not</i> a contract (may be localized).`,
R`<code>retryable</code> — tells the client whether to retry, back off, or give up.`,
R`<code>traceId</code> — the support bridge; the same id appears in your logs.`,
R`Document every code in one place (the errors reference page) and link it from each endpoint.`]),
CALL('trap',R`The most-documented lie in APIs: "returns 404 if not found". Which not-found — the path, the order id, or the customer? Distinguish: 404 for the resource, 400 for a malformed id format, 403 when it exists but is not yours. Vague 404s cost integrators days.`)
]);
LES('m09-behaviors','m09','Documenting API behaviors: pagination, idempotency, versioning',2,9,[
P(R`Beyond single endpoints, APIs have cross-cutting behaviors. These deserve their own reference section — documented once, linked from every endpoint — because they are what consumers' frameworks must be configured around.`),
TB(['Behavior','Document exactly this','Anti-pattern'],[
['Pagination','Style (cursor/offset), parameters, defaults, max page size, how to detect the end','"Standard pagination" (there is no such thing)'],
['Filtering & sorting','Parameter grammar, allowed fields, operator syntax, case sensitivity','Undocumented allowed-fields list that silently grows'],
['Rate limiting','Windows, quotas, headers returned (<code>RateLimit-*</code>), 429 body, Retry-After semantics','Limits that exist but are never documented'],
['Idempotency','Which methods honor keys, key format, key lifetime, what repeats return','Retry-safe POSTs claimed with no key mechanism'],
['Versioning','Where the version lives, what a version promises, deprecation policy','"We version when needed" (that is: never, then suddenly)'],
['Webhooks','Event catalog, payload schema, signature verification, retry schedule, your egress IPs','Webhooks documented only from the sender\'s side'],
['Concurrency','ETag/If-Match optimistic locking, 409 semantics','Last-write-wins silently documented as "updates"']]),
H('Idempotency, written down properly'),
CODE('markdown',R`
## Idempotency

POST /v1/orders and POST /v1/payments accept an
${BT}Idempotency-Key${BT} header (UUID v4 recommended).

- Send a fresh key for each logical operation, reuse it for retries.
- Keys are retained 24 hours; a retry after expiry is treated as a
  new operation.
- A retry with the same key and the same body returns the original
  response (including the original status code) with
  ${BT}Idempotent-Replay: true${BT}.
- A retry with the same key and a *different* body returns
  ${BT}409 ${BT}${BT}IDEMPOTENCY_KEY_REUSE${BT} — treat it as a client bug.

GET, PUT and DELETE are idempotent by construction and ignore the
header.
`),
H('Deprecation with a straight face'),
P(R`A deprecation notice answers four questions or it is noise: <b>what</b> is deprecated (exactly which field/endpoint), <b>since when</b> (version + date), <b>until when</b> (removal version + date), and <b>what to do instead</b> (link to migration). Announce in the changelog, mark in the reference (<code>~~deprecated~~</code> with the removal version), return a <code>Deprecation</code> + <code>Sunset</code> header from the API itself, and monitor usage before removal — the header is what your consumers' monitoring can actually see.`),
CALL('tip',R`Edge cases are a documentation genre: the empty result, the unicode name, the 10k-item cart, the clock skew, the duplicate webhook. Write a "Behavior in edge cases" section per API; every entry there is a support ticket you will never receive.`)
]);
LES('m09-openapi','m09','OpenAPI mastery',3,12,[
P(R`OpenAPI is the machine-readable contract format for REST APIs: one YAML (or JSON) file describing paths, operations, schemas, security and examples. From it, tooling generates interactive docs (Swagger UI, Redoc), client SDKs, mocks and contract tests. The spec's canonical home is spec.openapis.org; this module teaches the working structure.`),
TB(['Spec section','What it holds','Documentation-relevant habits'],[
['<code>info</code>','Title, version, description, contact, license','The description is your API\'s front page — write it for humans'],
['<code>servers</code>','Base URLs per environment','List dev/staging/prod explicitly'],
['<code>paths</code>','Operations per path + method','One <code>operationId</code> per operation — codegen and docs link on it'],
['<code>components/schemas</code>','Reusable data models','Name models after domain concepts, not endpoints'],
['<code>components/responses</code>','Reusable responses (validation errors)','Reuse beats copy: one ValidationError, referenced everywhere'],
['<code>components/securitySchemes</code>','Auth mechanisms','Document scopes here once, reference per operation'],

openapi: 3.1.0
info:
  title: Fleet Logistics User API
  version: 1.4.0
  description: |
    User registration, authentication and profile management for
    the Fleet Logistics platform. All timestamps are RFC 3339 UTC.
  contact: { name: API support, email: api@fleetlogistics.example }
servers:

  - url: https://api.staging.fleetlogistics.example.com/v1
tags:
  - name: Users
    description: Registration and profiles
  - name: Auth
    description: Token issuance and refresh
security:
  - bearerAuth: []
paths:
  /users:
    post:
      tags: [Users]
      operationId: registerUser
      summary: Register a new user
      description: Creates a customer, courier or admin account and
        sends a verification email. The response is the created
        profile; the password is never returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
            examples:
              courier:
                summary: Courier registration
                value:
                  email: maya.chen@fastmove.example
                  password: correct-horse-battery
                  role: COURIER
      responses:
        '201':
          description: User created. Location header points to the profile.
          headers:
            Location:
              schema: { type: string }
              description: URL of the created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for new tokens
      description: Rotates the refresh token; the old one is
        invalidated immediately (replay attempts revoke the family).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, format: uuid }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token invalid, expired or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserRegistration:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          writeOnly: true
        role:
          type: string
          enum: [CUSTOMER, COURIER, ADMIN]
    User:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        email: { type: string, format: email }
        role: { type: string, enum: [CUSTOMER, COURIER, ADMIN] }
        createdAt: { type: string, format: date-time, readOnly: true }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT, 15 min TTL' }
        refreshToken: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: ORDER_CUSTOMER_BLOCKED }
        message: { type: string }
        retryable: { type: boolean, default: false }
        traceId: { type: string }
`),

LES('m09-tooling','m09','Swagger UI, Redoc and the generated-docs reality',2,6,[
P(R`Generated references (Swagger UI from your OpenAPI file, Redoc's three-pane layout, springdoc's runtime generation) solve the <i>field-by-field accuracy</i> problem completely — the docs cannot drift from the spec. What generation cannot do is teach integration: which endpoints to call, in what order, with what retries. That is why mature API documentation is a pair: <b>generated reference + hand-written guide</b>.`),

['Spec-first','OpenAPI written by hand; code implements it','Low — CI contract-tests code against spec','Public APIs, multi-team contracts'],

R`<b>Publication:</b> publish the reference at a stable URL per API version, from CI, on every merge — never by a laptop.`,

LES('m10-events','m10','Documenting events, schemas and evolution',2,8,[
P(R`In an event-driven system, the <b>event schema is the API</b>. Everything Module 9 says about REST contracts applies, plus a harder constraint: you cannot force consumers to upgrade on your schedule. Event documentation therefore has one extra headline topic — <b>compatibility</b> — and it is non-negotiable.`),
H('Event naming and anatomy'),
TB(['Part','Convention','Example'],[
['Topic','Domain + entity family + version: <code>domain.entity.vN</code>','<code>order.events.v1</code>'],
['Event type','Past-tense fact, singular entity: <code>EntityActioned.vN</code>','<code>OrderConfirmed.v1</code>'],
['Key','The entity id — ordering is per-key','<code>orderId</code>'],
['Envelope','id, type, version, occurredAt, producer, correlationId, payload','See below']]),
CODE('json',R`
{
  "eventId": "018f6a1e-7c2b-7a3e-9f1d-2b8c4e9a1100",
  "type": "OrderConfirmed",
  "version": 1,
  "occurredAt": "2026-03-04T09:12:33.512Z",
  "producer": "order-service",
  "correlationId": "c-8842",
  "payload": {
    "orderId": "7f3a2b...",
    "customerId": "1c9d...",
    "total": { "amount": "42.50", "currency": "EUR" },
    "items": 3,
    "deliveryWindow": { "from": "2026-03-04T16:00:00Z", "to": "2026-03-04T18:00:00Z" }
  }
}
`),
P(R`Note the envelope/payload split: infrastructure (consumers, tracing, routing) reads the envelope and never breaks; business fields live in the payload and evolve under compatibility rules.`),
H('Schema evolution rules — the compatibility contract'),
TB(['Change','Backward compatible (old consumers read new events)','Forward compatible (new consumers read old events)'],[
['Add optional field with default','Yes','Yes'],
['Remove optional field','No (unless never read)','Yes'],
['Add required field','No — break old consumers','No'],
['Rename field','No','No'],
['Change type (string → int)','No','No'],
['Add enum value','Consumers must tolerate unknown values','No']]),
P(R`Publish the rules, not just the current schema: "producers may add optional fields with defaults; consumers must ignore unknown fields and treat unknown enum values as errors routed to review." Those two sentences, enforced by schema-registry compatibility checks in CI, are the entire governance a healthy event ecosystem needs.`),
CALL('trap',R`The silent killer is the "harmless" required-field addition. Old consumers crash or, worse, misprocess; and because events flow asynchronously, the blast radius is discovered hours later in reconciliation. Breaking changes need a new topic version (order.events.v2) with a documented dual-publish window and migration dates — never an in-place surprise.`)
]);
LES('m10-contracts','m10','Reliability documentation: headers, retries, DLQs and failure paths',2,8,[
P(R`Event-driven systems fail differently from REST: the producer is gone by the time the consumer stumbles. Documentation must therefore specify, per consumer contract, <b>delivery semantics, ordering, and what happens when processing fails</b> — the operational contract that keeps async systems debuggable.`),
TB(['Contract element','Document exactly this'],[
['Delivery semantics','At-least-once (the norm) — and therefore that consumers MUST be idempotent, keyed on <code>eventId</code>'],
['Ordering','Per-key ordering guaranteed; no global ordering. Consumers that need cross-key ordering must state it and get a design review'],
['Retries','Consumer-side retries: attempts, backoff schedule, which errors are retryable'],
['Dead-letter queue','DLQ name, when messages land there, who owns draining, the runbook link'],
['Poison messages','Schema violations route to DLQ immediately (no retry) — stated, not implied'],
['Replay','How to replay (consumer group reset, tooling), retention window, what consumers must tolerate'],
['Lag & alerting','Which lag metrics exist, alert thresholds, where the dashboard lives'],
['Ownership','Producer team, consumer team(s), escalation path — by name of team, not person']]),
H('Failure scenarios as documentation'),
P(R`For each significant flow, write the failure table. It is the async equivalent of REST's error reference, and it is what on-call reads at 3 a.m.:`),
TB(['Failure','Customer impact','Detection','Mitigation'],[
['order-service down','Checkout fails fast (sync edge), no events produced','Synthetic checkout alarm','Restore service; consumers see a gap, not corruption'],
['Kafka unavailable','Orders buffer in outbox (~30 min at peak)','Broker health + outbox depth alerts','Runbook KAF-01; drain after recovery'],
['dispatch-service consumes slowly','Assignments lag; SLA risk','Consumer lag dashboard','Scale consumer group; investigate poison message if paired with DLQ entries'],
['Schema-violating event','None (routed to DLQ untouched)','DLQ depth alarm','Runbook DLQ-02: inspect, fix producer, replay']]),
CALL('note',R`Delivery-semantics prose must match reality — verify with tests, not vibes. A consumer built for at-least-once under an actually at-most-once broker (or vice versa) produces exactly the class of bug that takes a week to find: rare, order-dependent, invisible in staging.`)
]);
LES('m10-asyncapi','m10','AsyncAPI and the schema zoo: JSON Schema, Avro, Protobuf',3,10,[
P(R`AsyncAPI is to event-driven APIs what OpenAPI is to REST: a machine-readable contract (YAML) describing topics, operations, messages and schemas, from which docs, code and mocks generate. The example below documents the order-events channel used throughout this guide.`),
CODE('yaml',R`
asyncapi: '2.6.0'
info:
  title: Fleet Logistics Event Contracts
  version: 1.2.0
  description: |
    Domain events published by order-service. At-least-once
    delivery; consumers must be idempotent (eventId key).
servers:
  production:
    url: kafka.fleetlogistics.example:9092
    protocol: kafka
    security:
      - mtls: []
channels:
  order.events.v1:
    subscribe:
      summary: Order lifecycle events (per-order ordering).
      operationId: consumeOrderEvent
      message:
        oneOf:
          - $ref: '#/components/messages/OrderCreated'
          - $ref: '#/components/messages/OrderConfirmed'
          - $ref: '#/components/messages/OrderCancelled'
components:
  securitySchemes:
    mtls: { type: X509 }
  messages:
    OrderConfirmed:
      name: OrderConfirmed
      title: OrderConfirmed.v1
      payload:
        $ref: '#/components/schemas/OrderConfirmedPayload'
  schemas:
    OrderConfirmedPayload:
      type: object
      required: [orderId, customerId, total, deliveryWindow, occurredAt]
      properties:
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        total:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: string, pattern: '^\d+\.\d{2}$' }
            currency: { type: string, enum: [USD, EUR, INR] }
        deliveryWindow:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        occurredAt: { type: string, format: date-time }
`),
H('The six platform events, documented once, consumed everywhere'),
TB(['Event','Published when','Key fields','Consumers'],[
['OrderCreated','Cart converted; order persisted','orderId, customerId, items, total','Analytics, notification'],
['PaymentCompleted','PSP confirms capture','orderId, paymentId, amount, pspRef','order-service (confirm), analytics'],
['DriverAssigned','Dispatch matches a driver','orderId, driverId, eta, zone','notification, tracking'],
['ShipmentDispatched','Driver departs pickup','orderId, driverId, departedAt','notification, customer-app'],
['LocationUpdated','Driver app ping (2/s, batched)','driverId, lat, lon, ts, orderId?','tracking only'],
['DeliveryCompleted','Proof of delivery captured','orderId, driverId, proofType, deliveredAt','order-service, billing, notification']]),
H('JSON Schema, Avro, Protobuf — which and why'),
TB(['Format','Where it shines','Documentation angle'],[
['JSON Schema','HTTP/JSON events; AsyncAPI-native','Human-readable; validate in CI with the same file you publish'],
['Avro','Kafka + schema registry ecosystems','Compact binary + registry-enforced compatibility modes; document the registry rules'],
['Protobuf','gRPC-adjacent, polyglot performance','Field-number discipline gives wire-level compatibility; document proto files as the source of truth']]),
P(R`All three encode compatibility structurally (optional fields, defaults, unknown-field tolerance). The documentation job is the same regardless of format: publish the schema from the repo where it is enforced, and let generated references replace hand-copied field lists.`),

{t:'RabbitMQ was considered but is not as good.',issue:'Straw-man alternative',why:'"Not as good" at what, for whom? Without the losing reason, future readers cannot tell whether their new context changes the verdict.',fix:'"RabbitMQ: excellent command routing, but replay means re-publishing and retention is not first-class (see ADR-0005)."'},
{t:'(end of document)',issue:'Missing sections',why:'No status, no date, no deciders, no context — the sections that make the record auditable and re-evaluable later. This is a memo, not an ADR.',fix:'Add Status/Date/Deciders header and a Context section with dated facts: volumes, retention needs, existing skills.'}]},
{id:'q3',title:'API reference with holes',cat:'API documentation',brief:'Endpoint documentation for POST /v1/orders. Flag the lines that fail the documentation contract.',
lines:[
{t:'POST /v1/orders — creates an order.',issue:'Purpose without "when"',why:'What it does, but not when to use it — so consumers will also use it for bulk imports it was never shaped for.',fix:'Add one sentence of scope: "Creates a single order from a cart; for bulk, see /v1/batch-orders."'},
{t:'Authentication: standard auth is used.',issue:'Auth unspecified',why:'"Standard" does not exist. Which scheme, which scopes, what happens with a missing token?',fix:'"Bearer JWT with orders:write scope; missing/invalid → 401 AUTH_INVALID_TOKEN."'},
{t:'Body: send the order details as JSON.',issue:'No schema',why:'The consumer is left guessing field names, types and required-ness — the number one integration-ticket source.',fix:'Schema or link to it: items[] (1–100 lines of {sku, qty}), deliveryWindow (from/to RFC 3339).'},
{t:'Returns 200 with the order.',issue:'Wrong success code',why:'Creation is 201 (with Location); 200-for-create blinds retry logic and idempotency handling.',fix:'201 Created + Location header; document 202 if acceptance is asynchronous.'},
{t:'Errors: returns an error if something goes wrong.',issue:'Errors unspecified',why:'Every retry policy, monitor and user message is built from error behavior. This line documents none of it.',fix:'Per-code docs: 409 IDEMPOTENCY_KEY_REUSE, 422 with field details, 402 PAYMENT_DECLINED — with retryability.'},
{t:'The response includes standard pagination headers.',issue:'Claims a standard that is not stated',why:'Which headers, which semantics? "Standard" pagination has at least three conventions.',fix:'Name them: X-Next-Cursor + nextCursor in the body; absent on the last page.'}]}];
V.quality=()=>{
  const st=S.lab;
  main.innerHTML=crumbs([['Quality analyzer']])+`<h1>Documentation quality analyzer</h1><p class="lede">Three documents with real, representative problems. Click every line you believe has an issue — flagging is your review — then check. Green = caught, amber = missed, red = false positive (a fine line you flagged). Scores persist in this browser.</p>
  <div class="row" id="qsseg">${QSAMPLES.map((x,i)=>`<button class="btn ${i===0?'pri':''}" data-qs="${x.id}">${x.title}</button>`).join('')}</div><div id="qsbody"></div>`;
  let cur=QSAMPLES[0].id;
  const draw=()=>{const x=QSAMPLES.find(q=>q.id===cur);const key='q_'+x.id;const done=st[key]!=null;
    $('#qsbody').innerHTML=`<div class="card" style="margin:12px 0"><p style="color:var(--dim);margin:0 0 8px">${x.brief}</p><div id="qslines">${x.lines.map((l,i)=>`<button class="qline" data-ln="${i}" aria-pressed="false"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(l.t)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="qssub" ${done?'disabled':''}>Check my review</button>${done?`<span class="tag ok">best score ${st[key]}%</span>`:''}<button class="btn" id="qsclr">Reset flags</button></div><div id="qsres"></div></div>`;
    if(done)$('#qsres').innerHTML='<p style="color:var(--dim);margin:8px 0 0">Already reviewed — reset flags to try again (your best score is kept).</p>';
    $$('#qslines .qline').forEach(b=>b.onclick=()=>{if(b.classList.contains('miss2')||b.classList.contains('hit')||b.classList.contains('fp2'))return;b.classList.toggle('flag');b.setAttribute('aria-pressed',String(b.classList.contains('flag')))});
    $('#qsclr').onclick=()=>draw();
    $('#qssub').onclick=()=>{let ok=0,miss=0,fp=0;
      $$('#qslines .qline').forEach((b,i)=>{const l=x.lines[i];const flagged=b.classList.contains('flag');
        b.classList.remove('flag');
        if(l.issue){if(flagged){ok++;b.classList.add('hit')}else{miss++;b.classList.add('miss2')}}
        else if(flagged){fp++;b.classList.add('fp2')}
        if(l.issue)b.insertAdjacentHTML('beforeend',`<span class="why2"><b>${esc(l.issue)}.</b> ${esc(l.why)} <b>Fix:</b> ${esc(l.fix)}</span>`)});
      const tot=x.lines.filter(l=>l.issue).length;const sc=Math.max(0,Math.round(100*(ok-fp)/tot));
      st[key]=Math.max(st[key]||0,sc);save();
      $('#qssub').disabled=true;
      $('#qsres').innerHTML=`<div class="fb ${sc>=70?'ok':'no'}" style="margin-top:10px"><b>Score ${sc}%.</b> Caught ${ok} of ${tot} problems, missed ${miss}, false-flagged ${fp}. Green = caught, amber = missed (annotations inline), red = a fine line you flagged. ${sc>=70?'Solid review instincts.':'Re-read the amber annotations — each is a documentation failure class from Modules 02, 05 and 09.'}</div>`}};
  $$('[data-qs]').forEach(b=>b.onclick=()=>{cur=b.dataset.qs;$$('[data-qs]').forEach(x=>x.classList.toggle('pri',x===b));draw()});
  draw()};

let mermaidPromise=null;
function loadMermaid(){if(window.mermaid)return Promise.resolve(window.mermaid);
  if(mermaidPromise)return mermaidPromise;
  mermaidPromise=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    const to=setTimeout(()=>{if(!window.mermaid){mermaidPromise=null;rej(new Error('timeout'))}},12000);
    s.onload=()=>{clearTimeout(to);try{window.mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'strict'})}catch(e){}res(window.mermaid)};
    s.onerror=()=>{clearTimeout(to);mermaidPromise=null;rej(new Error('cdn'))};
    document.head.appendChild(s)});
  return mermaidPromise}

const WSAMPLES=[
{id:'w1',title:'The deployment instruction',brief:'An instruction block from a deployment guide, read by a new joiner. Rewrite it for precision and actionability.',
bad:`The application should be deployed using the appropriate pipeline
when necessary. Configuration can be adjusted as needed for the
target environment, and a restart may be required after changes
are made. In order to ensure a smooth deployment, it is recommended
that the team verifies that everything is working correctly.`,
better:`Deploy with the staging pipeline:

    ./deploy.sh payments --env staging

Override defaults in config/staging.env; every variable is listed
in config/README.md. After changing application.yml, restart the
service: systemctl restart payments.

Verify before closing the ticket:
    ./scripts/smoke.sh payments staging   # expect: 6/6 green`,
notes:['"Appropriate tooling" and "as needed" replaced by the exact command and the exact config file — vague delegations became named artifacts.','The "may be required" restart became a definite conditional with its command: the trigger (application.yml change) and the action are both concrete.','"Verify that everything is working" became a verify command with an expected result — success must be observable.','"In order to ensure" and "it is recommended that" deleted: connective tissue that carries no meaning.']},
{id:'w2',title:'The architecture paragraph',brief:'An "Architecture overview" section read by an adjacent team deciding how to integrate. Rewrite for audience and structure.',
bad:`Our platform leverages a cutting-edge, cloud-native architecture
in order to facilitate seamless scalability. We have implemented
numerous microservices that communicate via a robust event-driven
paradigm, which allows us to be extremely agile. Additionally,
various caching layers are utilized for performance optimization
purposes, and the system is highly available by design.`,
better:`The platform runs five services (orders, dispatch, tracking,
notifications, gateway), each deployable independently and owning
its PostgreSQL schema. Services exchange domain events over Kafka
(at-least-once; consumers are idempotent — see the event contracts).

Reads that tolerate seconds of staleness (catalog, pricing) are
served from a Redis cache with event-driven invalidation. The
platform is active-active across two regions for reads;
writes fail over to the leader region.`,
notes:['Every abstraction got instances: "numerous microservices" became the five named services with their ownership rule.','"Event-driven paradigm" became the contract that matters to an integrator: delivery semantics and idempotency, with a link.','"Highly available by design" became the actual topology and its failover behavior — a claim became a mechanism.','Cut: cutting-edge, seamless, robust, extremely agile, purposes. The paragraph is shorter and now answers the integrator\'s real questions.']},
{id:'w3',title:'The incident update',brief:'An update posted to the incident channel mid-outage. Rewrite it for the reader who arrives cold.',
bad:`We are looking into the issues with payments. It seems like
there might be a problem with the database or possibly the cache
after the deploy. Things should improve soon. We will keep everyone
posted. Thanks for your patience as we work through this.`,
better:`[UPDATE 2 — 14:40 UTC] Payment failures — SEV-1

Impact: card payments failing for ~8% of EU customers since 14:05
(≈2.1k customers). No order loss; payments queue client-side.

What we know: token-validation latency spike after the 14:00
config deploy; Redis failover correlation confirmed.

Doing now: config rollback, ETA 15 min.

Next update: 15:10 UTC, or sooner if status changes.`,
notes:['The reader arriving cold now gets impact first, in customer terms with numbers — not gratitude and mood.','"Database or possibly the cache" became the confirmed correlation, clearly separated from what remains under investigation.','"Should improve soon" became an action with an ETA; "keep everyone posted" became a named next-update time — the two commitments readers actually track.','Status severity and update numbering added: the channel can be skimmed top to bottom during the incident.']}];
V.writing=()=>{
  main.innerHTML=crumbs([['Writing lab']])+`<h1>Technical writing improvement lab</h1><p class="lede">Three real-shape passages. Rewrite one in the editor — the statistics update as you type — then compare with the professional revision. The evaluation is guided and honest: there is no automated semantic grading here; the criteria and the reference edit are your instruments.</p>
  <div class="row" id="wlseg">${WSAMPLES.map((x,i)=>`<button class="btn ${i===0?'pri':''}" data-ws="${x.id}">${x.title}</button>`).join('')}</div><div id="wlbody"></div>`;
  let cur=WSAMPLES[0].id;
  const passiveCount=t=>((String(t).match(/\b(am|is|are|was|were|be|been|being)\b\s+\w+(ed|en)\b/gi)||[]).length);
  const stats=t=>{const w=(String(t).trim().match(/\S+/g)||[]).length;
    const sents=(String(t).split(/[.!?]+/).map(x=>x.trim()).filter(Boolean));
    const long=sents.filter(x=>(x.match(/\S+/g)||[]).length>25).length;
    return {w,s:sents.length,avg:sents.length?Math.round(w/sents.length):0,long,passive:passiveCount(t)}};
  const statHtml=t=>{const x=stats(t);return `<div class="row" style="gap:14px;font:12px var(--f-mono);color:var(--dim)"><span>words: ${x.w}</span><span>sentences: ${x.s}</span><span>avg ${x.avg} w/s</span><span style="${x.long?'color:var(--warn)':''}">long (&gt;25w): ${x.long}</span><span style="${x.passive>1?'color:var(--warn)':''}">possible passive: ${x.passive}</span></div>`};
  const draw=()=>{const x=WSAMPLES.find(w=>w.id===cur);const d=S.drafts['wr_'+x.id]||'';
    $('#wlbody').innerHTML=`<div class="card" style="margin:12px 0"><p style="color:var(--dim);margin:0 0 8px">${x.brief}</p>

    <textarea id="wredit" class="ans" style="min-height:160px" placeholder="Rewrite the passage here…">${esc(d)}</textarea>
    <div id="wrstats" style="margin-top:6px">${statHtml(d)}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="wrcmp" ${d.trim()?'':'disabled'}>Compare with the professional edit</button></div>
    <div id="wrout"></div></div>`;
    const ta=$('#wredit');
    ta.oninput=()=>{S.drafts['wr_'+x.id]=ta.value;save();$('#wrstats').innerHTML=statHtml(ta.value);$('#wrcmp').disabled=!ta.value.trim()};
    $('#wrcmp').onclick=()=>{
      $('#wrout').innerHTML=`<div class="wcmp" style="margin-top:12px">
      <div><div style="font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Yours</div>${codeBlock('text',ta.value,{noSave:true})}${statHtml(ta.value)}</div>
      <div><div style="font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Professional edit</div>${codeBlock('text',x.better,{noSave:true})}${statHtml(x.better)}</div></div>
      <h3>What changed and why</h3><ol style="padding-left:20px">${x.notes.map(n=>`<li style="margin:4px 0">${n}</li>`).join('')}</ol>
      <h3>Self-check against the criteria</h3>
      <p style="color:var(--dim);font-size:13.5px;margin:4px 0">Rate your rewrite honestly — the point of the lab is the comparison, not a score.</p>
      ${['Clarity — one unambiguous reading','Structure — right order, right density','Terminology — consistent, concrete, defined','Accuracy — nothing overclaimed','Conciseness — no filler connectives','Audience — written for the stated reader'].map(c=>`<label class="chk"><input type="checkbox"><span>${c}</span></label>`).join('')}`};
  };
  $$('[data-ws]').forEach(b=>b.onclick=()=>{cur=b.dataset.ws;$$('[data-ws]').forEach(x=>x.classList.toggle('pri',x===b));draw()});
  draw()};

V.revision=()=>{
  main.innerHTML=crumbs([['Revision mode']])+`<h1>Revision mode</h1><p class="lede">Build a flashcard session from the sources you have collected: bookmarked lessons, saved templates, glossary terms, and the quiz questions you have missed. Cards you mark "again" return later in the same session.</p>
  <div id="revsrc"></div><div id="revrun"></div>`;
  const sources={bm:{label:'Bookmarked lessons',n:LESSONS.filter(l=>S.bm[l.id]).length},snips:{label:'Saved templates',n:S.snips.length},gloss:{label:'Glossary terms',n:GLOSSARY.length},wrong:{label:'Missed quiz questions',n:QUIZ.filter(q=>S.qw[q.id]).length}};
  const drawSrc=()=>{$('#revsrc').innerHTML=`<div class="card">${Object.entries(sources).map(([k,v])=>`<label class="chk"><input type="checkbox" data-src="${k}" ${v.n?'checked':'disabled'}><span>${v.label} <span class="ex">${v.n} card${v.n===1?'':'s'}</span></span></label>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn pri" id="revgo" ${Object.values(sources).some(s=>s.n)?'':'disabled'}>Start session</button></div>
    ${Object.values(sources).every(s=>!s.n)?'<p style="color:var(--dim);margin:8px 0 0">No sources yet: bookmark a lesson, save a template, or miss a quiz question — they all become cards here.</p>':''}</div>`;
    $('#revgo').onclick=()=>{const sel=$$('#revsrc [data-src]:checked').map(i=>i.dataset.src);run(sel)}};
  const run=sel=>{
    let deck=[];
    if(sel.includes('bm'))LESSONS.filter(l=>S.bm[l.id]).forEach(l=>deck.push({front:l.title,back:`Module ${mod(l.mod).n} — ${mod(l.mod).title}. ${mod(l.mod).blurb}`,link:'#lesson-'+l.id,kind:'Lesson'}));
    if(sel.includes('snips'))S.snips.forEach((s,i)=>deck.push({front:`Template: ${s.lang} (from ${s.from||'lesson'})`,back:'<pre style="overflow-x:auto;font-size:11.5px;margin:0"><code>'+esc(s.code.slice(0,400))+(s.code.length>400?'…':'')+'</code></pre>',kind:'Template'}));
    if(sel.includes('gloss'))GLOSSARY.forEach(g=>deck.push({front:g.t,back:g.d,kind:'Glossary'}));
    if(sel.includes('wrong'))QUIZ.filter(q=>S.qw[q.id]).forEach(q=>deck.push({front:q.q,back:q.why,kind:'Question'}));
    deck=shuffle(deck);let i=0,again=[],got=0,shown=false;
    const step=()=>{if(i>=deck.length){
        $('#revrun').innerHTML=`<div class="card"><h2 style="margin-top:0">Session complete</h2><p>${got} of ${deck.length} marked "got it" first try${again.length?`; ${again.length} sent back for another pass`:''}.</p><div class="row"><button class="btn pri" id="rev2">New session</button></div></div>`;
        $('#rev2').onclick=()=>{drawSrc();$('#revrun').innerHTML=''};return}
      const c=deck[i];shown=false;
      $('#revrun').innerHTML=`<p style="font:12px var(--f-mono);color:var(--dim)">Card ${i+1} of ${deck.length} · ${esc(c.kind)}${again.length?` · ${again.length} waiting for another pass`:''}</p>
      <div class="flash"><div class="fk">${esc(c.kind)}</div><div class="fx2">${esc(c.front)}</div></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="revshow">Show answer</button></div><div id="revback"></div>`;
      $('#revshow').onclick=()=>{if(shown)return;shown=true;
        $('#revback').innerHTML=`<div class="flash" style="margin-top:10px"><div class="fk">Answer</div><div class="fx2" style="font-size:15px">${c.back}${c.link?` <a href="${c.link}">Open →</a>`:''}</div></div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn on" id="revgot">Got it</button><button class="btn" id="revag">Again, later</button></div>`;
        $('#revgot').onclick=()=>{got++;i++;step()};
        $('#revag').onclick=()=>{deck.push(c);i++;step()}}};
    step()};
  drawSrc()};
V.quiz=()=>{
  main.innerHTML=crumbs([['Knowledge checks']])+`<h1>Knowledge checks</h1><p class="lede">${QUIZ.length} questions with immediate feedback and explanations, filterable by module. The revision round re-asks the questions you previously got wrong — answered correctly, they leave the list.</p>

        mountQ($('#run .q'),q,ok=>{record(ok);if(ok)sc++;else wrong.push(q);$('#nxt').hidden=false;$('#nxt').focus()});
        $('#nxt').onclick=()=>{i++;step()}};

  `<div class="notice">This guide is part of the Cyber Formula Library (Formula DB), category 09 — Software Engineering &amp; Professional Practices. Related guides in the series: <a href="clean_code_mastery.html">Clean Code Mastery</a>, <a href="software_testing_patterns.html">Software Testing Patterns</a>, <a href="code_review_mastery.html">Code Review Mastery</a>, Java Mastery, Spring Boot Mastery, PostgreSQL Mastery, Distributed Systems, Microservices, System Design, Design Patterns, Git Mastery and DevOps &amp; CI/CD — see <a href="#network">the library network</a>.</div>`};
V.search=()=>{const q=($('#q').value||'').trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);
  const res=terms.length?INDEX.map(e=>{const hay=(e.t+' '+e.x).toLowerCase();if(!terms.every(t=>hay.includes(t)))return null;let sc=0;terms.forEach(t=>{if(e.t.toLowerCase().includes(t))sc+=5;sc+=Math.min(3,hay.split(t).length-1)});return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40):[];
  const snip=e=>{const x=e.x,l=x.toLowerCase(),k=l.indexOf(terms[0]);const s=Math.max(0,k-50);let t=esc(x.slice(s,s+160));terms.forEach(w=>{t=t.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return (s>0?'…':'')+t+'…'};
  main.innerHTML=crumbs([['Search']])+`<h1>Search</h1><p class="lede">${terms.length?res.length+' result'+(res.length===1?'':'s')+' for “'+esc(q)+'”':'Type in the search box above to search lessons, workshops, references, glossary, challenges, interview questions and resources.'}</p><div class="res">${res.map(r=>`<a class="card" style="text-decoration:none;color:inherit" href="${r.e.href}"><div class="row"><span class="tag">${r.e.ty}</span><span style="color:var(--dim);font-size:12px">${r.e.sub}</span></div><h3 style="margin:6px 0 4px">${r.e.t}</h3><p style="font-size:13px;color:var(--dim);margin:0">${snip(r.e)}</p></a>`).join('')}</div>`};
/* ---- router ---- */
function route(){const r=(location.hash||'#home').slice(1)||'home';side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  if(r.startsWith('lesson-'))V.lesson(r.slice(7));else if(V[r]&&r!=='lesson')V[r]();else V.home();
  navState(V[r]||r.startsWith('lesson-')?r:'home');window.scrollTo(0,0);main.focus({preventScroll:true});document.title=(r.startsWith('lesson-')&&les(r.slice(7))?les(r.slice(7)).title+' · ':'')+'Software Documentation Mastery'}
/* ---- events ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='copy')copy(CODES[+b.dataset.ci]);
  else if(a==='save'){const code=CODES[+b.dataset.ci];if(!S.snips.some(s=>s.code===code)){S.snips.unshift({code,lang:b.dataset.lang,from:(location.hash.startsWith('#lesson-')&&les(location.hash.slice(8))||{}).title});S.snips=S.snips.slice(0,30);save()}toast('Saved to dashboard')}
  else if(a==='cmp'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=b.dataset.v;s.dataset.v=v;$$('.seg button',s).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('.cv',s).innerHTML=cmpView(c,v);const lab=b.textContent;$('.vl',s).textContent=c.lang+' · '+lab.toLowerCase()}
  else if(a==='cmpcopy'||a==='cmpsave'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=s.dataset.v,code=v==='bad'?c.bad:c.good;if(a==='cmpcopy')copy(code);else{if(!S.snips.some(x=>x.code===code)){S.snips.unshift({code,lang:c.lang,from:c.title});save()}toast('Saved to dashboard')}}
  else if(a==='snipcopy')copy(S.snips[+b.dataset.i].code);
  else if(a==='snipdel'){S.snips.splice(+b.dataset.i,1);save();V.home()}});
$('#menu').onclick=()=>{const o=side.classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(o))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
document.addEventListener('click',e=>{if(side.classList.contains('open')&&!side.contains(e.target)&&!$('#menu').contains(e.target)){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}});
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'dark';S.theme=cur==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save()};
$('#q').addEventListener('input',e=>{if(e.target.value.trim()){if(location.hash!=='#search')history.replaceState(null,'','#search');V.search();navState('search');window.scrollTo(0,0)}else if(location.hash==='#search'){location.hash='#home'}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();if(location.hash==='#search')location.hash='#home'}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
const up=$('#up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>700),{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('hashchange',()=>{if(location.hash!=='#search')$('#q').value='';route()});
load();if(S.theme)document.documentElement.dataset.theme=S.theme;
buildSide();route();
</script>
</body>
</html>

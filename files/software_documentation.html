TPL('Onboarding guide — Fleet Logistics platform','Day one to first PR, verified in CI.','markdown',R`
# Onboarding — Fleet Logistics platform

Owner: Platform guild · Last reviewed: 2026-03-10 ·
New joiner? PR one improvement to this file — it is expected.

Stuck for more than 30 minutes? Ask in #platform-onboarding.
That is not a failure; it is the guide's bug tracker.

## Day 1 — run the platform

### Prerequisites
| Tool | Version | Verify |
|---|---|---|
| JDK | 21 | ${BT}java -version${BT} |
| Docker + Compose | 24+ | ${BT}docker compose version${BT} |
| Maven wrapper | included | ${BT}./mvnw -v${BT} |
| Node (fleet-web only) | 20 | ${BT}node -v${BT} |

### Start the local stack
${F3}bash
docker compose up -d        # postgres 16, kafka, redis, mailhog
./mvnw -T 1C install        # build all modules (~4 min)
./scripts/run-all.sh        # all services, dev profile
${F3}
Health check: ${BT}./scripts/health.sh${BT} — all green in ~90s.
Mailhog UI: http://localhost:8025 (email sent locally lands here).

### Repository map
${F3}text
fleet-logistics/
├── fleet-common/       DTOs, error codes, Kafka topic constants
├── order-service/      order capture + saga (start here)
├── dispatch-service/   driver assignment
├── tracking-service/   location ingestion
├── notification-service/ email/SMS/push fan-out
├── fleet-web/          dispatcher console (React)
├── docs/               adr/ · rfcs/ · runbooks/ · api/
└── scripts/            run-all, health, reset-db
${F3}

### Configuration
Copy ${BT}.env.example${BT} to ${BT}.env${BT} (git-ignored; CI
catches commits of real secrets). Everything has a working default
for local dev. Values per environment: 1Password vault "platform".

## Day 2 — first PR
1. Pick an issue labeled ${BT}good-first-issue${BT}.
2. Branch: ${BT}fix/<slug>${BT}.
3. Run one module's tests:
   ${BT}./mvnw -pl order-service -am verify${BT} (~2 min with cache)
4. PR: the template asks for tests + a docs line if behavior
   changed. CI: build, tests, ArchUnit boundaries, Trivy.
5. Reviews land within a day; expect at least one round.

Conventions: Conventional Commits; formatting is formatter-owned
— never argue spacing in review. ADRs in ${BT}docs/adr/${BT} answer
"why" questions; if your change reverses one, link the new ADR.

## Debugging
- Remote debug: ${BT}./scripts/debug.sh order-service${BT} (port 5005).
- Logs: ${BT}docker compose logs -f kafka${BT}; app logs to console
  (JSON in staging/prod, pretty locally).
- Kafka console: ${BT}./scripts/kafka-topics.sh${BT} /
  ${BT}./scripts/kafka-tail.sh order.events.v1${BT}.

## Troubleshooting
| Symptom | Cause | Fix |
|---|---|---|
| Tests: "Could not find a valid Docker environment" | Docker not running | Start Docker; rerun |
| "Cannot resolve fleet-common" | Skipped ${BT}-am${BT} | ${BT}./mvnw -pl <mod> -am verify${BT} |
| Port 8080 taken | Old service still up | ${BT}./scripts/stop-all.sh${BT} |
| Kafka: "Connection refused" | Stack still booting | ${BT}./scripts/health.sh${BT}; wait ~30s |
| Puzzling test failures after switching branches | Stale containers | ${BT}./scripts/reset-db.sh${BT} |

## Week 1 — deep dives
Per-module READMEs; [architecture overview](architecture.md);
[ADR index](adr/); run a [runbook drill](runbooks/) with your buddy.

## Where to ask
#platform-onboarding (anything) · #payments (money paths) ·
#infra (stack/CI) · retro every Thursday.
`,R`The 30-minute rule at the top is the most important line: it converts guide gaps from private suffering into tickets.`)
]);

Owner: <team> · Last drilled: YYYY-MM ·

One paragraph: the condition, the usual blast radius, the
customer-visible symptom. Written for someone who does not know
this service.

- [ ] ${BT}./scripts/health.sh <service>${BT} — green?
- [ ] Recent deploys: <dashboard link> — anything in the last 2h?
- [ ] Dashboards: error rate / latency / saturation — which moved first?
- [ ] #incident channel — already declared?

## Immediate mitigation (do this while diagnosing)
If customer impact is visible: <the fastest safe action —
feature flag, rollback, failover — with the exact command>.

## Diagnosis decision tree
**Symptom A** (e.g. 5xx spike):
1. Check X: ${BT}command${BT} — if Y, go to "Procedure 1".
2. Check Z: ${BT}command${BT} — if W, go to "Procedure 2".

**Symptom B** (e.g. consumer lag):
…

## Procedures
### Procedure 1 — <name>

1. ${BT}exact command${BT}
2. Verify: ${BT}command${BT} — expect <output>.
Rollback of this procedure: …

## Escalation
- Primary: <team> via <rotation tool>
- Secondary: <named team> after 15 min unacknowledged
- Vendor: <PSP/Kafka support> — account and severity process: <link>

## Post-incident

- File the incident report template: <link>. (Module 20 covers
  incident communication.)

## Change log
| Date | Change | Author |
|---|---|---|

# Upgrading from v4 to v5

Estimated effort: 30–60 min for a typical integration.
Breaking: 3 changes. Deprecations removed: 2.

## Before you start
- v4 receives security fixes until 2026-09-30 (EOL policy).
- Use the compatibility report: ${BT}npx api-diff old.yaml new.yaml${BT}

## Breaking changes

### 1. Pagination default 100 → 50
**Who is affected:** any consumer relying on the default page size.
**Action:** pass ${BT}limit${BT} explicitly, or handle the new default.
**Find usages:** grep for ${BT}/v1/orders${BT} without ${BT}limit${BT}.

### 2. ${BT}zone${BT} query parameter removed
**Who is affected:** consumers of the search endpoint.
**Action:** replace ${BT}?zone=X${BT} with ${BT}?filter=zone:X${BT}
(supports multiple: ${BT}filter=zone:A,zone:B${BT}).

### 3. Webhook payloads: envelope change
**Who is affected:** webhook receivers.
**Action:** read fields from the new envelope; verify signatures
against ${BT}X-Fleet-Signature-256${BT}. Test in the sandbox
(__sandbox mode sends fake events on demand).

## Removed deprecations
- ${BT}GET /v1/drivers?all=true${BT} (deprecated since 4.0) →
  paginated ${BT}GET /v1/drivers${BT}.

## Step-by-step
1. Update the client library (npm i @fleet/api@5 — the client
   already handles changes 1 and 3).
2. Run your integration tests against the v5 sandbox.
3. Switch the base URL; watch the ${BT}Sunset${BT} warnings vanish.
`,R`Effort estimate, affected-who, exact action, and how to find your usages — the four fields every breaking-change entry needs.`),

TPL('Tech spec — order-processing v2','Complete specification for the saga-based order core.','markdown',R`
# Spec: order-processing v2 (idempotent checkout saga)

Status: approved 2026-02-20 · RFC-011 · ADRs 0001/0002/0005/0007/0008
Owner: Order domain team · Reviewers: dispatch, payments, security

## Problem
Checkout correctness depends on three remote calls (stock, payment,
dispatch) with no transaction spanning them. Retry storms on the
mobile app double-charge occasionally (INC-2026-004, 11 customers);
dispatch coupling fails checkout during deploys (IM-2026-011…014).

## Goals
1. Zero double-charges under any client retry behavior.
2. Checkout succeeds while dispatch-service is unavailable.
3. Assignment created within 60s P95 of confirmation.
4. New saga steps addable without order-flow downtime.

## Non-goals
Payment provider migration; batch imports; dispatch routing
algorithm changes.

## Requirements
**FR-1** Orders persist before any remote effect (survive crash
between steps). **FR-2** Duplicate submissions with the same
idempotency key return the original result. **FR-3** Cancellation
refunds captured payments exactly once. **FR-4** Saga state
queryable by orderId for support.
**NFR-1** Checkout P95 ≤ 400ms (currently 520ms). **NFR-2** Saga
throughput ≥ 50 orders/s sustained. **NFR-3** PII fields encrypted
at rest; logs mask them. **NFR-4** Recovery point objective 0
(accepted orders never lost).

## Constraints
Spring Boot 3 / PostgreSQL 16 / Kafka (ADRs 0003/0001/0005).
Flyway forward-only migrations (0008). No new external services.

## Solution overview
Orchestrated saga in order-service; steps: reserve-stock →
charge-payment → publish OrderConfirmed → await DriverAssigned.
State machine persisted per order (diagram: docs/diagrams/
order-saga.mmd). Outbox table bridges DB and Kafka transactionally
(poller, 250ms). Compensation: release-stock, refund-payment.
Duplicate detection: idempotency key table, 24h retention.

## Data model
${F3}sql
-- V20260220__order_saga.sql (Flyway, forward-only)
CREATE TABLE saga_state (
  order_id UUID PRIMARY KEY REFERENCES orders(id),
  step SMALLINT NOT NULL,
  status TEXT NOT NULL,          -- RUNNING|COMPENSATING|DONE|FAILED
  last_error TEXT,
  updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE TABLE outbox (
  event_id UUID PRIMARY KEY,
  aggregate_id UUID NOT NULL,
  topic TEXT NOT NULL,
  payload JSONB NOT NULL,
  published_at TIMESTAMPTZ
);
CREATE INDEX outbox_unpublished ON outbox(published_at)
  WHERE published_at IS NULL;
CREATE TABLE idempotency (
  key TEXT PRIMARY KEY,
  order_id UUID NOT NULL,
  response_code SMALLINT NOT NULL,
  response_body JSONB NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
${F3}

## API / event contracts
- REST unchanged externally; adds ${BT}Idempotency-Key${BT} (Module 9).
- Publishes ${BT}OrderConfirmed${BT} v1 (schema: Module 10) — new
  consumers only, no breaking change.
- Consumes ${BT}PaymentCompleted${BT}, ${BT}DriverAssigned${BT}.

## Failure handling
| Failure | Behavior | Detection |
|---|---|---|
| Payment gateway timeout | Retry 3× backoff; then compensate stock, order FAILED | saga_state alert |
| Outbox poller down | Orders buffer; alert at >30s oldest unpublished | outbox age metric |
| DriverAssigned never arrives | Order stays ASSIGNED_PENDING; dispatcher fallback console | consumer lag + SLA timer |
| Duplicate event delivery | Idempotent on eventId | — |

## Testing strategy
Unit: state machine transitions (all paths). Integration
(Testcontainers): saga happy path + each compensation. Contract:
OrderConfirmed schema + REST OpenAPI. Chaos game day: kill dispatch
mid-checkout before phase 3 (RFC-011 rollout).

## Rollout
Phase 1 dual-write behind ${BT}saga_v2${BT} flag, shadow-compare 2
weeks. Phase 2 flag on for internal couriers. Phase 3 all traffic,
sync path code removed. Abort criteria per phase: mismatch rate
>0.01% or checkout error budget burn.

## Alternatives considered
Choreography (pure events, no orchestrator): fewer moving parts in
the happy path; support/debugging of scattered flows failed the
"3 a.m. test" — state lives nowhere. Two-phase commit across
services: no broker/DB combination supports it honestly here.

## Open questions
1. Does finance need a saga-completion event for revenue
   recognition? (Finance — 2026-02-28)
2. Retention for idempotency table beyond 24h for B2B partners?
   (Author — 2026-03-05)
`,R`Numbered requirements, measurable NFRs, per-failure behavior, phased rollout with abort criteria — the four sections that make a spec reviewable rather than aspirational.`)
]);

LES('m18-quality','m18','Documentation quality: attributes and the audit',2,8,[
P(R`Quality in documentation is multidimensional — accurate but unfindable helps nobody; beautiful but stale is worse than nothing. The audit below scores each dimension separately, because they fail separately and are fixed by different people.`),
TB(['Attribute','Question','How to check','Typical fix owner'],[
['Accuracy','Does it match reality?','Run the commands; diff the doc against the spec/code','Doc owner + code owner'],
['Completeness','All steps present? Prerequisites stated?','Follow it cold, on a clean machine/account','Doc owner'],
['Clarity','One unambiguous reading?','Newcomer walkthrough (Module 02 tests)','Doc owner'],

['Consistency','Same terms, same formats as siblings?','Terminology lint; manual spot checks','Champions'],
['Freshness','How old, and does it matter?','Last-reviewed date vs change frequency of subject','Auto-flag; owner triages']]),
H('The 30-minute team audit'),
UL([R`<b>Inventory (5 min):</b> script lists every doc in the repo with last-commit date and owner from CODEOWNERS.`,
R`<b>Spot-check (10 min):</b> pick the three most-visited docs (analytics) and the three oldest — run their core instructions cold.`,
R`<b>Classify (10 min):</b> each doc → keep / fix / retire. Retirements get a PR immediately (the audit's cheapest wins).`,
R`<b>One improvement (5 min):</b> fix the single worst finding before leaving the audit — momentum beats a backlog.`]),

LES('m18-drift','m18','Fighting drift: the maintenance war',2,8,[
P(R`Documentation drift — the silent divergence between docs and reality — is inevitable, so the question is not "how do we prevent it" but "<b>how fast do we detect and repair it</b>". Drift prevention is a detection strategy plus a repair loop.`),
TB(['Drift type','Detection','Repair loop'],[
['Broken links','lychee/htmltest in CI + scheduled weekly re-check of main','Auto-issue to the doc owner; fix is a 2-line PR'],
['Outdated commands (docs ran on old versions)','README quick start executed by scheduled CI','Red workflow = doc bug with a failing test attached'],
['Generated-vs-real contract drift','Spec diff in CI (OpenAPI export vs committed spec)','Fails the PR that changed the API without the spec'],
['Conflicting documents (two truths)','Source-of-truth rule + link checkers on redirects','Search for the fact\'s keywords; merge to one page, tombstone the other'],
['Silent staleness (nothing broke, nothing changed)','Last-reviewed flags by subject change cadence','Owner triages: refresh, re-date, or retire']]),
H('The conflicting-documents resolution'),
P(R`When two documents disagree, the fix is procedural: (1) determine which is true <i>now</i> (ask the code, or the owner); (2) make the winner the single source and turn the loser into a redirect or a tombstone ("moved to X, 2026-03"); (3) if both were true for different versions, split by version explicitly. What you never do is edit both to "compromise" — a fact does not negotiate.`),
CALL('warn',R`The most dangerous drift is the confident stale document: correct formatting, correct tone, wrong commands. Every mitigation above exists to break its camouflage — dates, CI execution, diff gates. If a document cannot carry a freshness signal, ask why it exists at all.`)

## Recommendation: multi-region session storage (ADR-0019)

**Ask:** approve 6 engineering-weeks + $2.1k/mo infra, decision by
Mar 15, for Q3 regional launch.

**Why now:** the July outage (PM-2026-031) — single-region Redis —
cost 4.5h of SEV-1 and €31k in credits. Q3 launch doubles the
exposure.

| Option | Cost | Time | Residual risk |
|---|---|---|---|
| Accept (do nothing) | €0 | — | Repeat outage likely; launch blocked |
| Warm standby region | 2 wks + $0.9k/mo | 4 weeks | Failover is manual (15 min RTO) |
| Active-active (recommended) | 6 wks + $2.1k/mo | 8 weeks | Sub-minute RTO; complexity we staff for |

**Recommendation:** active-active. The deciding argument is
reversibility — the fallback path keeps the current architecture
working behind a flag, so the risk is schedule, not architecture.
Detail: ADR-0019 · capacity sheet CAP-2026-02.
`),
P(R`Two disciplines make this work: numbers with sources (the incident reference, the capacity sheet) and <b>reversibility stated explicitly</b> — leadership tolerates expensive reversible bets far better than cheap irreversible ones, and telling them which is which is your job.`),

**[UPDATE 3 — 14:40 UTC] Payment processing degradation — SEV-1**

**Status:** mitigating. Impact unchanged: card payments failing
for ~8% of EU customers since 14:05 (≈2.1k customers).

config deploy; correlation with the Redis failover is confirmed.

**Next update:** 15:10 UTC, or sooner on status change.

**Escalation:** PSP support engaged as precaution. Cmd: I. Okoro.
`,R`Five slots: status, impact in customer terms, what we know (facts, not theories), what we are doing, next update time. Never skip the next-update time — it is what stops the channel from filling with "any news?".`),

{id:'q11',topic:'m05',type:'tf',q:'If ADR-0007 is superseded, its number should be reused for the replacement record.',opts:['True','False'],a:1,why:'Numbers are immutable identities that other documents cite. The replacement gets the next number and links back.'},
{id:'q12',topic:'m06',type:'mcq',q:'The essential difference between an RFC and an ADR:',opts:['RFCs are longer','An RFC invites review before the decision; an ADR records the decision after it is made','ADRs are only for architecture; RFCs are for features','They are two names for the same document'],a:1,why:'RFC decides, ADR records, spec details. An accepted RFC usually spawns the ADR that preserves its why.'},
{id:'q13',topic:'m06',type:'mcq',q:'The "non-goals" section of an RFC exists to:',opts:['List features the product will never have','Firewall scope creep by making exclusions explicit and reviewable','Credit the authors','Satisfy the template'],a:1,why:'Explicit non-goals stop reviewers smuggling scope in and stop future readers imagining the RFC promised more than it did.'},
{id:'q14',topic:'m07',type:'mcq',q:'The four C4 model zoom levels, from widest to narrowest:',opts:['Container, context, component, code','Context, container, component, code','System, service, class, method','Context, component, container, code'],a:1,why:'Context (system + externals), containers (deployables), components (inside one container), code (generated, rarely drawn).'},
{id:'q15',topic:'m07',type:'mcq',q:'On a C4 container diagram, a "container" is:',opts:['A Docker image specifically','A separately deployable/runnable unit of your system, whatever its packaging','Any external third-party system','A database'],a:1,why:'C4 containers are deployables — a Spring Boot service, a SPA, a serverless function, a database. Docker is one possible packaging, not the definition.'},
{id:'q16',topic:'m08',type:'tf',q:'A single diagram should communicate exactly one message, stated in its title.',opts:['True','False'],a:0,why:'One diagram, one question answered. Multi-message diagrams answer nothing for anyone and cannot be maintained.'},
{id:'q17',topic:'m08',type:'mcq',q:'The decisive advantage of text-sourced diagrams (Mermaid, PlantUML, D2, Structurizr DSL) over canvas-tool exports is:',opts:['They look more professional','The source diffs and reviews like code, so diagrams can evolve with the system','They render faster','They support more node shapes'],a:1,why:'A diagram nobody can regenerate is a screenshot with a deadline. Text sources participate in the same PR flow as code.'},
{id:'q18',topic:'m09',type:'mcq',q:'A consumer requests another customer\'s order id and the resource exists but is not theirs. The most defensible documented response:',opts:['404 — the resource does not exist for this caller','403 — it exists but you may not see it','200 with an empty body','500'],a:0,why:'Both are defensible policies; the documentation crime is ambiguity. The mainstream guidance for privacy-preserving APIs is 404 (do not leak existence); the key is documenting the choice explicitly and consistently.'},
{id:'q19',topic:'m09',type:'mcq',q:'A client retries POST /v1/orders with the same Idempotency-Key but a different body. The documented behavior should be:',opts:['Process the new order','Return the original response','Return 409 IDEMPOTENCY_KEY_REUSE — treat as a client bug','Return 500'],a:2,why:'Same key + different body means client state corruption. Returning the original silently hides the bug; failing loudly with a stable code lets the client fix itself.'},
{id:'q20',topic:'m09',type:'mcq',q:'In OpenAPI, the main purpose of $ref under components/ is:',opts:['Faster rendering','Defining schemas and responses once and reusing them everywhere','Linking to external documentation','Version control'],a:1,why:'Single definition, many references: change the Error schema once and every operation updates. Duplication is how specs start contradicting themselves.'},
{id:'q21',topic:'m09',type:'mcq',q:'A complete deprecation notice states what is deprecated, since when, until when, and:',opts:['Who wrote it','What to use instead, with the migration path','The reason it was originally built','The commit hash'],a:1,why:'The reader upgrading needs the replacement and the path to it. Without the alternative, the notice is just bad news.'},
{id:'q22',topic:'m10',type:'mcq',q:'Which schema change to a published event is backward compatible for existing consumers?',opts:['Adding a required field','Adding an optional field with a default','Renaming a field','Changing a field type from string to int'],a:1,why:'Optional-with-default is the only addition old consumers tolerate. Required adds, renames and type changes all break — they need a new topic version with a dual-publish window.'},
{id:'q23',topic:'m10',type:'tf',q:'With at-least-once delivery, consumers are required to be idempotent.',opts:['True','False'],a:0,why:'At-least-once means duplicates will happen. Idempotent processing keyed on eventId is part of the consumer contract — stated in the documentation, not discovered in production.'},
{id:'q24',topic:'m10',type:'mcq',q:'You must rename a field in a widely consumed event. The documented-compliant path is:',opts:['Rename in place; consumers will adapt','New topic version (v2) with a dual-publish window and migration dates','Email all consumers the new schema','Remove the old field and add the new one in the same release'],a:1,why:'Breaking changes ship as new versions with overlap, so consumers migrate on their schedule. In-place breaks are how async systems produce week-long reconciliation hunts.'},
{id:'q25',topic:'m11',type:'mcq',q:'The single measurable goal of an onboarding guide is:',opts:['Total word count','Time from clone to first merged pull request','Number of diagrams','Search engine ranking'],a:1,why:'Every section either shortens clone-to-first-PR or is noise. Teams that measure it improve it; the guide\'s CI job keeps it honest.'},
{id:'q26',topic:'m12',type:'mcq',q:'A runbook\'s quality bar is best described as:',opts:['Technically exhaustive','Executable by a tired on-call engineer with no domain knowledge at 3 a.m.','Approved by the architecture board','Auto-generated from dashboards'],a:1,why:'The 3 a.m. test: checklists, exact commands, verify steps, explicit branches. Prose that explains architecture belongs one link away.'},
{id:'q27',topic:'m12',type:'tf',q:'Runbook policy should recommend mitigating first and diagnosing second when customer impact is visible.',opts:['True','False'],a:0,why:'A rollback or flag flip in minute one beats a perfect root cause in hour two. Stating the policy in the runbook removes the hesitation.'},
{id:'q28',topic:'m13',type:'mcq',q:'Given/When/Then acceptance criteria are valuable primarily because they:',opts:['Look professional in tickets','Are unambiguous and directly convertible into automated tests','Replace the need for unit tests','Are required by BDD tools'],a:1,why:'The format forces preconditions, triggers and observable outcomes — exactly the triple an automated test needs. Ambiguity cannot hide.'},
{id:'q29',topic:'m14',type:'mcq',q:'A MINOR version bump (SemVer) promises:',opts:['Only bug fixes','New functionality, backward compatibly; nothing breaks','Breaking changes are allowed if documented','Internal refactoring only'],a:1,why:'MINOR = additive and compatible. If a contract test breaks, the bump is a lie regardless of intent — which is why CI must verify the promise.'},
{id:'q30',topic:'m14',type:'mcq',q:'The most reliable point at which to write a changelog entry is:',opts:['Release day','In the pull request that ships the change','The retrospective','Whenever someone remembers'],a:1,why:'The PR knows what changed and why. Release day becomes assembly of already-written entries; nothing ships undocumented.'},
{id:'q31',topic:'m16',type:'mcq',q:'Building a docs site with --strict (mkdocs) or warnings-as-errors matters because it:',opts:['Makes pages load faster','Fails the build on broken internal links and nav references — the drift killer','Reduces file size','Is required by GitHub Pages'],a:1,why:'Strict builds turn silent link rot and stale nav into red CI, which is the only form of documentation freshness engineering reliably respects.'},
{id:'q32',topic:'m18',type:'mcq',q:'The most effective automated detector for "the README quick start no longer works" is:',opts:['A quarterly manual audit','A scheduled CI job that executes the quick start on a clean environment','A link checker','Usage analytics'],a:1,why:'Executing the instructions is the only honest test of instructions. When the workflow goes red, the doc gets a PR with a failing test attached.'}
];
const INTERVIEW=[
{level:1,cat:'Fundamentals',q:'What is software documentation?',a:'Any artifact that preserves and transmits knowledge about a system: what it does, how to build, run and change it safely, and why it is designed that way. The useful framing is documentation as an engineering deliverable — versioned, reviewed, owned — versus communication (chat, meetings) which is not findable or durable. Code shows how; tests show expected behavior; documentation carries intent, context and constraints.'},
{level:1,cat:'Fundamentals',q:'Why is documentation important?',a:'It pays for itself in four currencies: onboarding speed (time-to-first-commit), collaboration quality (reviewers and adjacent teams argue from shared written context), knowledge preservation (bus-factor protection), and misunderstanding prevention (written contracts stop two teams implementing two different fantasies of the same API). The cost side is documentation debt: every undocumented decision forces reverse-engineering later, and stale docs actively mislead — which is why maintenance, not volume, is the hard part.'},
{level:1,cat:'Fundamentals',q:'What makes a good README?',a:'It answers four questions in the first two screens: what is this, should I care, can I run it, where is the depth. Concretely: a one-liner stating the problem solved, automated trust badges, a prerequisites table with versions, a quick start that reaches first success in about five commands, a configuration pointer (env vars, never inline secrets), testing instructions with their requirements, and links to architecture, ADRs and runbooks. The test: watch a newcomer follow it silently; every hesitation is a documentation bug.'},
{level:1,cat:'Fundamentals',q:'What is Markdown and why is it preferred for engineering documentation?',a:'A lightweight markup language that reads as plain text, renders everywhere (GitHub, editors, static generators) and diffs cleanly in review. It is preferred because documentation written in it inherits the engineering toolchain: git history, PR review, linting (markdownlint), link checking and CI builds. GitHub Flavored Markdown adds tables, task lists and fenced code that cover most documentation needs.'},
{level:1,cat:'Fundamentals',q:'What is an API specification?',a:'A machine-readable description of an API\'s contract: endpoints, operations, parameters, schemas, security schemes and examples — OpenAPI for REST, AsyncAPI for event-driven. The specification is the single source from which interactive docs (Swagger UI, Redoc), client SDKs, mocks and contract tests generate, which is what keeps documentation from drifting from implementation.'},
{level:1,cat:'Fundamentals',q:'What is the difference between internal and external documentation?',a:'Internal documents an organization for itself — design docs, RFCs, runbooks, postmortems — with full candor about trade-offs and incidents. External documentation is a promise to outsiders: public API references, integration guides, status pages; it must be versioned, deprecation-managed and held to a higher stability standard because consumers build businesses on it. The audiences differ in context and in what you owe them.'},
{level:2,cat:'ADRs',q:'What is an ADR?',a:'An Architecture Decision Record: a short document capturing one significant decision with its context, alternatives and consequences — the format popularized by Michael Nygard in 2011. The code shows what was chosen; the ADR is the only artifact that shows why, what else was considered, and what trade-offs were consciously accepted. ADRs live in the repo (typically docs/adr/), are numbered immutably, and supersede each other through explicit links.'},
{level:2,cat:'ADRs',q:'When should an ADR be created?',a:'When a decision is hard to reverse (data model, communication style, auth architecture), cross-team visible (public contracts, shared libraries), or surprising (deviates from the org default). The three-question filter: will anyone ask why in six months, is it expensive to reverse, does it constrain other teams? Two-three yeses means write it. Writing them for trivial choices (a date library) taxes the practice into disuse — the greater failure.'},
{level:2,cat:'ADRs',q:'ADR versus RFC — what is the difference?',a:'An RFC is a proposal process that invites review before a decision; an ADR records a decision after it is made. Sequence: RFC decides (problem, options, feedback, revision), ADR preserves the outcome and its why, the design spec details implementation. Merging them into one document produces either a decision nobody reviewed or a review nobody finishes.'},
{level:2,cat:'Proposals',q:'What makes an effective technical proposal?',a:'A real problem stated with evidence first; a proposal stated without its defense; honest alternatives including do-nothing with why each lost; explicit non-goals as the scope firewall; risks with owners; open questions with dates; and a time-boxed decision process. The reviewability test: a reviewer who disagrees with the conclusion can see from the document that their objection was already considered — that is what converts critics into co-authors.'},
{level:2,cat:'API docs',q:'What is OpenAPI and how do you use it well?',a:'A machine-readable REST contract format (YAML/JSON): info, servers, paths with operations, reusable components (schemas, responses, security schemes). Used well: models named after domain concepts, one Error schema referenced everywhere, every operation with examples, security documented once and referenced, the spec validated and diffed in CI (Redocly/Spectral), generated references paired with a hand-written integration guide because generation cannot teach sequencing, retries or rate-limit survival.'},
{level:2,cat:'Docs as code',q:'What is documentation as code?',a:'Managing documentation with software engineering practices: Markdown in git, changes through PRs with review, structural linting (markdownlint), prose linting (Vale), link checking (lychee), strict builds, versioned publication from CI, and generated references where possible. The payoff is that docs inherit every property that keeps code honest — history, review, automation, ownership — while wiki pages inherit none.'},
{level:2,cat:'Architecture docs',q:'What is the C4 model?',a:'Simon Brown\'s model of four zoom levels — system context (the system and its externals), containers (deployable units and their tech), components (inside one container), code (rarely drawn) — each level answering a different audience\'s question. Its discipline is one level per diagram; most "architecture diagram" failures are level-mixing. Levels 1-2 are org-wide assets; level 3 belongs to owning teams; level 4 is what your IDE shows.'},
{level:2,cat:'API docs',q:'How do you document a breaking API change?',a:'A full deprecation cycle: announce in the changelog; mark the reference with the removal version; send Deprecation and Sunset headers on every affected response; log per-consumer usage of the deprecated path so migration is trackable; provide an upgrade guide with effort estimate, who-is-affected, exact diffs and find-your-usages greps; stage a hard failure in a sandbox ahead of removal; and ship the removal only in a MAJOR version. The two-breakage lesson: consumers act on what fails loudly, not on what was merely written down.'},
{level:2,cat:'Maintenance',q:'How do you prevent documentation drift?',a:'You cannot prevent it; you shorten detection and repair. Mechanically: link checkers in CI plus scheduled re-checks, quick starts executed by scheduled jobs, generated-vs-committed spec diffs as PR gates, source-of-truth rules with tombstoned redirects for anything moved, and last-reviewed metadata flagged by the subject\'s change cadence. Culturally: doc changes ride in the same PR as code changes, and quarterly audits retire stale docs — deletion is maintenance too.'},
{level:3,cat:'Distributed systems',q:'How would you document a distributed microservices architecture?',a:'Layered by audience: a current context diagram and container diagram (C4 levels 1-2) as org-wide assets; per-service docs owned by their teams (README, spec, runbook); the event catalog as first-class contracts (AsyncAPI + schemas with compatibility rules); failure-path documentation per flow — what happens when each dependency dies — because that is what on-call and adjacent teams actually read; and the ADR trail as the why-layer. The completeness test: a senior joiner reconstructs the system\'s shape and constraints from the docs in one afternoon without meetings.'},
{level:3,cat:'Governance',q:'How would you establish documentation governance without bureaucracy?',a:'Answer only four questions with enforcement mechanisms, not committees: what must exist (a minimum set per repo, checked by automation), who approves (CODEOWNERS routing to the people who live with the consequences), how quality is checked (lint + link check + strict builds in CI, humans for judgment), and what happens to stale docs (explicit deprecation and retirement). Templates plus one champion per team scale better than a central docs team; every gate must be automated or it becomes a meeting.'},
{level:3,cat:'ADRs',q:'How do you manage conflicting architectural decisions across teams?',a:'First, detect: an ADR index per repo plus a quarterly cross-repo sweep surfaces contradictions and orphaned assumptions. Then resolve procedurally: determine which decision is true now, make it the single source, supersede the other with explicit links both ways — never edit history in place. If both are true for different contexts, document the boundary explicitly. Recurring conflicts about the same theme (build vs buy, sync vs async) graduate to org-level default ADRs that teams supersede only with new context.'},
{level:3,cat:'Event-driven',q:'How do you document asynchronous event contracts?',a:'Like APIs, plus the async-specific contract: topic naming and event type grammar; the envelope/payload split; schema as the source (JSON Schema/Avro/Protobuf) with an AsyncAPI document published from CI; compatibility rules stated as producer and consumer obligations (add optional-only; ignore unknown fields; unknown enum values route to review); delivery semantics and ordering guarantees; retry and DLQ behavior with ownership; and the failure-path table per flow. Breaking changes get a new topic version with a dual-publish window and dated migration.'},
{level:3,cat:'Legacy',q:'How do you document a large legacy application nobody understands?',a:'Reverse archaeology in layers: start with what is observable — the context diagram, the deployment topology, the data stores — because those are verifiable today; capture the tribal knowledge while its carriers still exist (interviews become owned docs, not transcripts); write characterization documentation explicitly labeled as observed behavior with confidence levels; prioritize by blast radius: money paths and on-call pain first; and attach docs to changes — every PR to a legacy area updates its slice of the map. Never attempt the big-bang "document everything" sprint; it produces fiction with a deadline.'},
{level:3,cat:'API docs',q:'How do you maintain versioned API documentation?',a:'Publish the reference per version from CI (latest plus pinned major versions), generated from the spec that lives in the repo; diff specs between released versions so changelogs and upgrade guides are derived, not hand-assembled; keep version lifecycles as policy (N-2 support, sunset dates, EOL calendar); and route deprecation pressure through headers, logs and sandbox hard-failures, not prose alone. The versioning doc itself states what a version promises — because the promise is the product.'},
{level:3,cat:'Docs as code',q:'How would you design a documentation pipeline?',a:'Three stages: check (markdownlint for structure, Vale for prose style, link checking including scheduled re-checks of the published site), build (strict mode — warnings fail; previews per PR so reviewers see rendered output), publish (from CI only, per version, to a stable URL). Wire it to the same review routing as code via CODEOWNERS, add the generated references (OpenAPI/AsyncAPI/Javadoc) as build artifacts, and track the failure classes the pipeline exists to catch — that dashboard is the governance.'},
{level:3,cat:'Judgment',q:'How do you balance documentation completeness against maintenance cost?',a:'Match investment to expected readership × change frequency: a page hundreds read monthly justifies polish; a page two people read once justifies a paragraph. Prefer generated over written for anything derivable; prefer one source of truth plus links over copies; explicitly mark accepted gaps ("not documented — ask in #team") because honest gaps get filled and fictional coverage rots. And measure deletion as an outcome: retiring a stale page reduces risk more than adding a fresh one increases value.'}
];
const PRACTICAL=[
{t:'Write an ADR for choosing PostgreSQL over MongoDB',lvl:1,task:R`Your service stores orders and payments with strict money invariants (charge total = sum of line items; refunds ≤ payments; no double capture), ~40k orders/day, team is strong in SQL, ops already runs PostgreSQL. Produce the full ADR.`,
solution:R`Follow ADR-0001 in Module 05: Status accepted, dated context with the invariants and volumes, decision in one line, alternatives with real losing reasons (MongoDB: money invariants become application-side logic without the transaction guarantees needed, finance rollups need a secondary pipeline; MySQL 8: no decisive edge, JSONB tipped it), consequences both ways (ACID and finance-grade SQL vs mandatory migrations and deferred sharding), risks with existing mitigations. The calibration: under a page, every number real, negative consequences present.`},
{t:'Create an RFC for introducing Kafka',lvl:2,task:R`Domain events need replay for new consumers, a location firehose at ~2k msgs/s peak, and finance wants a 7-year audit trail. RabbitMQ exists today. Draft the RFC skeleton with the load-bearing sections filled.`,
solution:R`Summary in three sentences; problem with the replay/retention/throughput facts; goals (replay, audit, consumer scaling); non-goals (replacing request/reply — keep RabbitMQ interim per ADR-0005); requirements with numbers; proposed design (brokers, RF, outbox); alternatives with why-lost (RabbitMQ only: replay = re-publishing, no retention model; managed pub/sub: egress cost + retention); architecture impact; security (PII in events, TLS, retention); performance with the firehose numbers; rollout phases with flags and rollback per phase; risks table; open questions with owners. Module 06's full example is the worked answer.`},
{t:'Document a REST endpoint using OpenAPI',lvl:1,task:R`Write the OpenAPI fragment for POST /v1/orders: bearer auth, request body with customerId + items[], responses 201 (order), 409 (duplicate idempotency key), 422 (validation). Include reusable schemas.`,
solution:R`Paths entry with operationId, tags, security; requestBody with $ref to OrderRequest schema (required customerId, items minItems 1); responses referencing components/responses for the reusable ValidationError; schemas Order, OrderLine, Error (code/message/traceId); examples with realistic values on .example domains. Verify with the Module 09 checklist: every operation has a summary, description, auth declared, examples per response. Then paste it into the API playground's checker.`},
{t:'Create a C4 system context diagram',lvl:1,task:R`A dispatch platform with customers (mobile app), courier drivers (driver app), dispatchers (web console), a payment PSP, a maps provider and SMS/email providers. Draw the context diagram as Mermaid.`,
solution:R`One box for the whole platform; six external actors/systems; labeled edges stating intent ("places orders", "charges/refunds"); people separated from systems; title phrased as the message. Module 07's context.mmd source is the model answer — verify: no internal containers leaked into the context level, every edge says what flows, and the accompanying prose states system responsibilities in one paragraph.`},
{t:'Write a developer onboarding guide',lvl:2,task:R`A 9-engineer team, multi-module Maven + React SPA, Compose stack (Postgres/Kafka/Redis), known newcomer failures: missing -am, Docker not running, port conflicts. Draft the guide's skeleton with the day-1 narrative.`,
solution:R`Follow Module 11: the 30-minute ask rule at top; prerequisites table with verify commands; local stack + health check with expected timing; repository map as a tree with one line per module; day-2 first-PR path (good-first-issue label, branch naming, the exact test command); debugging section (debug script, log tails, kafka tail); troubleshooting table covering the three known failures with exact fixes; teams (not people) as contacts; and the new-joiner PR rule that keeps the guide alive.`},
{t:'Create a deployment runbook',lvl:2,task:R`Service: order-service, deploys via GitHub Actions, canary 5%, health-gated, migrations forward-only via Flyway. Write the runbook an on-call engineer follows when deploy health fails.`,
solution:R`Module 12's template filled: alert meaning in one paragraph; fast checks (health script, recent deploys dashboard, error-rate board, incident channel); immediate mitigation = rollback command with the digest, plus the explicit migration caveat pointing to DB-07 forward-fix; decision tree keyed on symptom (5xx spike vs saturation vs lag); verify command after every step; escalation by rotation; post-incident closure condition; last-drilled date. The 3 a.m. test decides quality: checklists and exact commands, architecture one link away.`},
{t:'Document a breaking API change',lvl:3,task:R`v5 removes GET /v1/orders?zone= in favor of filter=zone:. Nine consumers, three already migrated. Produce the deprecation package.`,
solution:R`The full cycle from Module 14: changelog entry (Deprecated, with removal version); reference marked with strikethrough + removal version; Deprecation and Sunset headers specified on affected responses; usage logging per consumer so the six unmigrated are visible; the v4→v5 upgrade guide with effort estimate, who-is-affected, exact old→new parameter mapping, find-your-usages grep; sandbox hard-failure 30 days before removal; client library pinned to MAJOR. State the policy: consumers act on what fails loudly — the package exists to make ignoring it impossible.`},
{t:'Improve a poorly written README',lvl:1,task:R`Fix: "## Setup — To set up the project you need several tools. First install Java, which comes in different versions, and you should use version 17 or newer, although 21 is also fine…" (60 more lines of prose). Rewrite the section.`,
solution:R`Module 02's restructure: prerequisites table (JDK 21 / Maven 3.8+ / Docker, each with "required for"); numbered steps with exact commands (copy .env.example, compose up, ./mvnw verify); the non-obvious gotcha (tests need Docker though the app does not) as a standalone sentence; prose-only facts converted to scannable structure. Then apply the README checklist: one-liner stating the problem, quick start ≤ 5 commands to first success, links to depth.`},
{t:'Write release notes',lvl:1,task:R`Ship: pagination default 100→50 (breaking, MAJOR), new optional deliveryWindow field on OrderConfirmed, fixed double-charge on mobile retries, deprecated zone= parameter. Write the changelog section and the user-facing release notes lead.`,
solution:R`Changelog per Keep a Changelog: Changed (breaking — pagination, with the explicit action), Added (deliveryWindow), Deprecated (zone=, removal version + link), Fixed (symptom-first phrasing: "Checkout no longer double-charges on mobile retry storms"). Release notes lead with required actions first: the pagination change and what integrators must do, then breaking changes, then highlights. Module 14's templates are the format.`},
{t:'Document an event-driven workflow',lvl:3,task:R`Flow: OrderConfirmed → DriverAssigned → ShipmentDispatched → DeliveryCompleted, with PaymentCompleted arriving in parallel. Document it for a consumer team joining the platform.`,
solution:R`Module 10's structure: the event catalog entries (type, published-when, key fields, consumers) for each of the five events; the AsyncAPI fragment for the order channel; envelope/payload split; ordering per orderId and the parallel-payment caveat stated (consumers must not assume PaymentCompleted precedes DriverAssigned); delivery semantics + idempotency obligation; retry/DLQ behavior and ownership; the failure-path table (what the consumer sees when each producer or the broker is down); and the compatibility rules they must build against.`}
];
const CHALLENGES=[
{id:'c01',cat:'README',lvl:1,title:'The quick start that is not quick',prompt:R`A repository's README quick start reads:

${F3}text
## Quick Start

Install the dependencies and set up the database. Then configure
the application as appropriate for your environment and run the
tests to make sure everything is working. You may need to adjust
memory settings. See the wiki for more details.
${F3}

Find every reason this quick start fails a newcomer.`,
hints:['Count the vague nouns: "the dependencies", "the database", "the application" — none are named.','"As appropriate" and "may need" delegate every hard decision to the reader at their most vulnerable moment.','Where does the wiki live, and who maintains it relative to this repo?'],
answer:R`The fixes, concretely: name the prerequisites with versions (JDK 21, Docker 24+) in a table; give the exact setup commands (docker compose up -d, ./mvnw verify); state what success looks like (health check green, expected output); link the wiki claim to a real URL or delete it; make the memory note a specific flag with the value. Five commands to first success, or it is not a quick start.`,
explain:R`Every vague phrase here is a support ticket: the reader cannot self-serve, so they ask. The quick start is the most valuable paragraph in a repository precisely because its failure mode is measured in interrupted seniors. Module 04's anatomy table is the checklist; the scheduled CI job that executes the quick start is what keeps it fixed.`},
{id:'c02',cat:'ADR',lvl:2,title:'The context-free decision',prompt:R`An ADR reads, in full:

${F3}markdown
# ADR-0042: Use Redis for caching

- **Status:** accepted

## Decision
We will use Redis for caching because it is fast and widely
adopted.

## Consequences
Caching will improve performance.
${F3}

What is missing, and why does each omission matter?`,
hints:['Two years from now, what would a reader need to judge whether this decision still holds?','"Fast" compared to what, at what workload? An ADR without numbers is an opinion.','Where are the alternatives, the negative consequences, and the risks?'],
answer:R`Missing: date and deciders; context (what was slow, at what load, for whom); alternatives considered and why they lost; consequences both ways; risks with mitigations; references. The decision statement also overclaims — "because it is fast and widely adopted" is marketing, not reasoning.`,
explain:R`This ADR cannot be re-evaluated later, only obeyed or ignored — the exact failure ADRs exist to prevent. The context section is what future readers use to decide whether changed circumstances reopen the decision; without it, the record is a rule with no rationale. Compare ADR-0006 in Module 05, which makes the same choice with numbers, alternatives, and a named staleness risk`},
{id:'c03',cat:'Requirements',lvl:1,title:'The requirement that means three things',prompt:R`A product ticket states: "The system should handle high volumes of orders efficiently and scale as we grow."

Identify the ambiguities a spec writer must resolve.`,
hints:['"High volumes" — what number, over what window, sustained or burst?','"Efficiently" — latency? cost? CPU? Efficiency for whom?','"Scale as we grow" — grow how: 2×, 100×, in users, in data, in regions?'],
answer:R`Rewrite as measurable requirements: NFR-1: order submission P95 ≤ 400ms at 50 orders/s sustained, 200/s burst for 10 min. NFR-2: throughput scales horizontally to 500 orders/s with ≤ 3 additional nodes. NFR-3: cost per order within X at Y volume. Each number becomes testable, and the test becomes the acceptance criterion.`,
explain:R`Unmeasurable non-functionals are the spec failure that surfaces latest — at load test, or worse, at launch. The fix pattern is always the same: attach numbers with time windows and conditions, and name the metric source. Module 15 requires NFRs to be measurable precisely because "fast" and "scales" are not requirements but moods`},
{id:'c04',cat:'OpenAPI',lvl:2,title:'The spec that lies',prompt:R`Review this OpenAPI fragment:

${F3}yaml
openapi: 3.1.0
info:
  title: Orders API
paths:
  /orders:
    post:
      summary: Create order
      responses:
        '200':
          description: Order created
${F3}

List what is missing or wrong.`,
hints:['What does the consumer send? There is no requestBody at all.','200 or 201? Successful creation has a precise code — and where is the created resource?','No components, no examples, no security, no server, no version in info — and can a build even validate this?'],
answer:R`Fixes: add info.version and servers; security scheme (bearer) and per-operation security; requestBody with a $ref'd OrderRequest schema (required fields, validation); 201 with Location header and the Order schema in the body; 400/422 via a reusable ValidationError response; 409 for idempotency conflicts; 401; examples with realistic values; operationId and tags for generated docs. The 200-for-created is a contract bug consumers encode forever.`,
explain:R`Each omission maps to a class of integration failure: no request schema → consumers guess payloads; 200-for-create → client retry logic cannot distinguish created from returned; no error responses → consumers string-match messages. The Module 09 checklist (endpoint, purpose, auth, params, examples, statuses, errors, edge cases) exists to make this review mechanical — and the API playground's checker runs the structural subset`},
{id:'c05',cat:'Diagrams',lvl:1,title:'Pick the diagram',prompt:R`You need to document, for a consumer team: (a) what your platform integrates with externally, (b) how a checkout traverses your services over time, (c) the states an order moves through. Which diagram type for each, and why?`,
hints:['One of these is about who you talk to; one is about message order between parties; one is about the lifecycle of one entity.','C4 level 1 answers (a) — what is it called?','Sequence diagrams own ordering; state machines own lifecycles.'],
answer:R`(a) C4 system context diagram — one box for your platform, every external actor and system, labeled edges; it is the integration answer by definition. (b) Sequence diagram — participant-to-participant messages over time, including async boundaries; ordering is its entire semantics. (c) State diagram — the states, the transitions, the events that cause them; it enumerates exactly the paths QA must cover.`,
explain:R`Choosing the diagram IS the documentation skill: context for shape, sequence for order, state for lifecycle, ER for data, deployment for infra. The failure in the wild is using one diagram type for everything — usually a flowchart — which then cannot express time or state. Module 08\'s rule: one message per diagram, and the message dictates the type`},
{id:'c06',cat:'Writing',lvl:2,title:'Untangle the explanation',prompt:R`Rewrite for a new-joiner audience:

"The system leverages a polyglot persistence strategy in order to
facilitate optimal storage characteristics per domain, with
eventual consistency being embraced across bounded contexts so as
to enable independent deployability and scalability."`,
hints:['Who is the reader, and what do they already know? Define jargon or remove it.','"Leverage", "facilitate", "so as to" — which words carry zero meaning?','Three ideas are stacked in one sentence. How many sentences should it be?'],
answer:R`"Each service picks the database that fits its data: orders and payments use PostgreSQL because money needs strict transactions; driver locations use a time-series store because they are append-heavy. Services do not share databases — they exchange events, which means data between them is eventually consistent (seconds, not minutes), and each service can deploy on its own schedule."`,
explain:R`The rewrite names the concrete instances (polyglot persistence becomes two real examples), defines eventual consistency inline with a bound, and splits one abstract sentence into three explanatory ones. Same content, different reader. This is the Module 02 pair of levers: concrete language and one idea per sentence — plus audience calibration`},
{id:'c07',cat:'Outdated',lvl:2,title:'The command that rots',prompt:R`A deployment doc from 18 months ago says:

${F3}text
Deploy with: kubectl set image deployment/payments
payments=payments:latest

Then run the smoke tests and check the dashboard.
${F3}

Beyond the commands themselves, what is structurally wrong with this documentation?`,
hints:['":latest" — what did you actually deploy, and can you roll back to it?','Which dashboard? Where is it? "The smoke tests" run by whom, from where?','What mechanism should have caught this rot before a human did?'],
answer:R`Facts first: image tags must be immutable digests or git SHAs (latest is un-deployable-in-reverse); the smoke test needs its command or script path; the dashboard needs a link. Structurally: the doc has no owner, no last-reviewed date, and no verification mechanism — it was write-once documentation for a change-driven subject. The fix is the pipeline: deploys happen through the workflow that runs the smoke suite, and the doc links it instead of duplicating its steps.`,
explain:R`This is the confident-stale document — correct formatting, wrong commands, the most dangerous drift class (Module 18). The durable lesson: documentation for change-driven subjects needs either automation (the pipeline IS the doc) or freshness signals (owner, review date, CI execution). Prose that names commands without a mechanism to verify them has a half-life measured in deploys`},
{id:'c08',cat:'RFC',lvl:3,title:'The proposal that cannot be reviewed',prompt:R`An RFC titled "Move to microservices" contains: 12 pages of target-state architecture diagrams, one paragraph of problem statement ("the monolith is slowing us down"), no alternatives, no rollout plan, and ends with "thoughts?". Diagnose the review-process failure.`,
hints:['What decision is the reviewer being asked to make, and by when?','Where is the evidence that the problem is real — and what would "slower" have to show to justify this?','A 12-page target design without phases is asking to approve what, exactly?'],
answer:R`Restructure: three-sentence summary naming the ask; problem with numbers (deploy frequency, incident counts, team coupling evidence); goals and non-goals; the target architecture moved to a separate spec; alternatives including strangler-incremental vs big-bang with why-lost; rollout in phases with per-phase rollback; risks with owners; open questions with dates; a decision date. Reviewers can then argue about a decision instead of proofreading a design.`,
explain:R`The original asks reviewers to approve an end-state with no decision frame — every comment becomes design feedback, nothing converges, and the proposal dies of silence (Module 06\'s failure modes). The fix is the RFC/ADR/spec separation: RFC decides with evidence, spec details the accepted design. Mixing them produces documents too heavy to review and too vague to build`},
{id:'c09',cat:'Breaking change',lvl:3,title:'The removal that broke partners',prompt:R`Your team removed a deprecated webhook field in a minor release, with the deprecation announced in CHANGELOG.md three months earlier. Two of nine consumers broke in production. Post-mortem: what went wrong in the deprecation process, and what is the corrected playbook?`,
hints:['A changelog entry is passive. What signals do consumers\' monitoring and code actually see?','Did you know which consumers still used the field? Could you have known?','What is the last loud signal before removal — and in which environment should it fail first?'],
answer:R`The corrected playbook: Deprecation + Sunset headers on every affected response (visible to monitoring and code); per-consumer usage logging so the six unmigrated are a dashboard, not a surprise; direct contact with the owners of unmigrated usage; sandbox hard-failure 30 days before production removal; removal only in a MAJOR release; client library pinned to MAJOR accordingly. The changelog stays — as the human-readable record, not the mechanism.`,
explain:R`Consumers act on what fails loudly, not on what was written down politely. The two broken partners had read nothing — which is the predictable baseline for any integration population. Module 14\'s deprecation cycle exists precisely because passive announcement plus silent removal equals guaranteed breakage; headers + usage data + staged hard-failure convert a surprise into a schedule`},
{id:'c10',cat:'Ops docs',lvl:2,title:'The runbook without a run',prompt:R`An on-call engineer opens the runbook for "payments latency high" and finds: two paragraphs explaining the payment architecture, a link to the dashboard (404), and "restart the service if needed". What is missing for the 3 a.m. test, in priority order?`,
hints:['What are the exact first 60 seconds of action? Checklist them.','"If needed" — needed when, exactly? What observable condition decides?','What does verify look like after the restart — and who escalates, how fast?'],
answer:R`Priority order: fast checks (health command, recent-deploys board, which metric moved first, incident channel); explicit mitigation criteria (restart when error rate > X% and rising, with the exact command); a verify step after mitigation (latency recovering, error budget); the decision tree for when restart does not work; escalation by rotation with timing; the fixed dashboard link. Architecture prose moves to one link away, clearly labeled as background.`,
explain:R`The 3 a.m. test (Module 12): a tired engineer with zero domain knowledge must mitigate without judgment calls the doc was supposed to make. "If needed" is the tell of an undrilled runbook — every conditional must be an observable condition with an action. The 404 dashboard link is drift, and the fix is structural: runbook links checked in CI like any other doc`},
{id:'c11',cat:'README',lvl:2,title:'The feature nobody can find',prompt:R`A README's Features section lists 23 bullets, all starting with the product name ("AcmeSync syncs files", "AcmeSync supports Linux"...). Users open tickets asking whether the product supports scheduled sync — bullet 17. Diagnose and fix.`,
hints:['What question is the Features section answering, and for whom — evaluator or power user?','Bullet 17 is invisible because the section has no structure. What are the natural sub-groups?','Which three features deserve the top position and why?'],
answer:R`Regroup into audience-shaped clusters (Platforms, Sync modes incl. scheduled, Sharing, Automation/API) with the top three being the differentiators; convert claims to links (scheduled sync → the scheduling guide); cut the 23 bullets to the 8 that decide adoption. Add a table of contents so the section is navigable rather than scannable-only.`,
explain:R`Feature lists fail by being flat: 23 parallel bullets encode no priority and no taxonomy, so the deciding capability hides at position 17 (Module 02\'s structure lesson applied to the README). The README is hunting grounds — readers search, and search needs structure: groups, links, and order-of-priority`},
{id:'c12',cat:'Events',lvl:3,title:'The event nobody documented',prompt:R`A team consumed order.events for months. Then a producer added a required field to the payload, and the consumer's parsing broke in production at 2 a.m. What was missing in the event contract, on both sides?`,
hints:['What document should have told the producer that adding a required field is a breaking change?','What should the consumer have been built to do with fields it does not know?','Where should this rule be enforced so it is not just prose — schema registry? CI?'],
answer:R`Missing on the producer side: a published compatibility policy (add optional-with-default only; required/renames/types need v2 topic + dual-publish window) and a schema that CI validates against. Missing on the consumer side: the obligation to tolerate unknown fields (ignore-and-log), and the delivery-semantics contract (at-least-once, idempotent on eventId) that makes parsing defensive by default. Enforcement: schema-registry compatibility checks or CI schema diffs — the rule must fail a build, not a night.`,
explain:R`Event systems fail exactly here because there is no caller to receive a 400 — the "error" arrives as silent data loss downstream (Module 10). The compatibility contract is two-sided prose PLUS machine enforcement; either alone fails. This is also why the AsyncAPI document and the topic README naming the producer team are not optional maturity signals — they are the incident prevention`}
];

const GLOSSARY=[
{t:'ADR (Architecture Decision Record)',d:'A short document capturing one significant decision with context, alternatives and consequences. Records why, supersedes forward, never renumbers.'},
{t:'ADR status',d:'proposed → accepted → (rejected | deprecated | superseded). Supersession links both directions in the same commit.'},
{t:'AsyncAPI',d:'The machine-readable contract format for event-driven APIs: topics, operations, messages, schemas — OpenAPI\'s counterpart for events.'},
{t:'arc42',d:'A 12-section architecture documentation template; use sections à la carte rather than filling it as ritual.'},
{t:'At-least-once delivery',d:'Delivery guarantee where duplicates occur; the consumer contract therefore requires idempotency keyed on eventId.'},
{t:'Backward compatibility',d:'Old consumers read new messages correctly. The producer obligation: add optional fields with defaults only.'},
{t:'Forward compatibility',d:'New consumers read old messages; enabled by consumers tolerating unknown fields.'},
{t:'C4 model',d:'Four zoom levels for architecture diagrams: context, containers, components, code — one audience question per level.'},
{t:'Changelog',d:'Reverse-chronological, human-readable record of notable changes per version; Keep a Changelog is the standard format.'},
{t:'Conventional Commits',d:'Commit message grammar (feat:, fix:, feat!:) that makes history machine-parseable and changelogs generatable.'},
{t:'Correlation ID',d:'Identifier propagated across services and events to reconstruct one logical flow across logs and traces.'},
{t:'Diátaxis',d:'A documentation framework separating tutorials, how-to guides, reference and explanation — four reader modes, four document types.'},
{t:'Dead-letter queue (DLQ)',d:'Where messages that exhaust retries or violate schemas land; documented with ownership and a draining runbook.'},
{t:'Docs-as-code',d:'Managing documentation with engineering practices: git, PRs, linting, CI builds, versioned publication.'},
{t:'Documentation drift',d:'Silent divergence between documentation and reality; managed by detection speed (CI) not prevention.'},
{t:'Deprecation window',d:'The announced interval between deprecation and removal, enforced with Sunset headers, usage logs and sandbox hard-failures.'},
{t:'Envelope (event)',d:'The infrastructure part of an event message (eventId, type, version, occurredAt, correlationId) kept stable across payload evolution.'},
{t:'Expand-migrate-contract',d:'Zero-downtime schema change pattern: add nullable → backfill → switch reads → drop old. The documented path for big tables.'},
{t:'GFM',d:'GitHub Flavored Markdown: tables, task lists, strikethrough, autolinks on top of core Markdown.'},
{t:'Idempotency key',d:'Client-supplied key making retries safe; same key + different body = 409 (a client bug), not a new resource.'},
{t:'JSON Schema',d:'The vocabulary for validating JSON documents; the source of truth for event payloads in the JSON ecosystem.'},
{t:'Keep a Changelog',d:'The convention giving changelogs their standard sections and per-version compare links.'},
{t:'MADR',d:'Markdown ADR variant with structured options and decision outcome; one of the popular ADR templates.'},
{t:'OpenAPI',d:'The machine-readable REST contract format from which docs, SDKs, mocks and contract tests generate.'},
{t:'RTO / RPO',d:'Recovery Time / Recovery Point objectives — must come from tested drills, never from aspirations.'},
{t:'Runbook',d:'An operational procedure executable at 3 a.m. by an engineer with no domain knowledge; drilled quarterly.'},
{t:'Schema registry',d:'A broker-adjacent store enforcing schema compatibility on publish; the machine enforcement of event contracts.'},
{t:'SemVer',d:'MAJOR.MINOR.PATCH versioning promise: MAJOR may break, MINOR adds compatibly, PATCH fixes. CI must verify the promise.'},
{t:'Source of truth',d:'The single authoritative location for a fact; everywhere else links. Copies diverge; links do not.'},
{t:'Structurizr',d:'Architecture-as-code tool generating all C4 views from one DSL model; the reference C4 implementation.'},
{t:'Sunset header',d:'HTTP response header announcing a removal date for a deprecated endpoint — the signal consumer monitoring can actually see.'},
{t:'Vale',d:'A prose linter enforcing style guides in CI; the editorial equivalent of markdownlint.'}

const RE_C=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?[dDfFlL]?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
const RE_P=/(#.*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
function hl(code,lang){
  const re=lang==='python'||lang==='yaml'||lang==='bash'||lang==='markdown'||lang==='text'||lang==='dot'||lang==='d2'||lang==='plantuml'?RE_P:RE_C;
  let out='',last=0,m;
  re.lastIndex=0;
  while((m=re.exec(code))!==null){
    out+=esc(code.slice(last,m.index));
    const s=m[0];
    if(m[1])out+=`<span class="t-c">${esc(s)}</span>`;
    else if(m[2])out+=`<span class="t-s">${esc(s)}</span>`;
    else if(m[3])out+=`<span class="t-n">${esc(s)}</span>`;
    else if(m[4])out+=`<span class="t-a">${esc(s)}</span>`;
    else out+=KW.has(s)?`<span class="t-k">${esc(s)}</span>`:(/^[A-Z]/.test(s)?`<span class="t-t">${esc(s)}</span>`:esc(s));
    last=m.index+s.length;
  }
  return out+esc(code.slice(last));
}
function diff(a,b){const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const o=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){o.push([' ',A[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push(['-',A[i++]]);else o.push(['+',B[j++]])}
  while(i<n)o.push(['-',A[i++]]);while(j<m)o.push(['+',B[j++]]);return o}

  ${c.notes&&c.notes.length?`<div class="why"><b>What changed and why</b><ol>${c.notes.map(n=>`<li>${n}</li>`).join('')}</ol>${c.trade?`<div class="tr">${c.trade}</div>`:''}</div>`:''}</section>`}

function blockHtml(b){

context:'Clients are mobile apps, courier devices (often offline) and a dispatcher SPA. Requirements: password login; "log out all devices"; admin bans within seconds; no sticky sessions (multi-region LB planned Q3). Threat model includes stolen devices.',
decision:'15-minute JWT access tokens (HS256, rotated keys) plus 30-day opaque refresh tokens in Redis with per-device metadata. A jti deny-list with TTL = token TTL enables immediate ban/logout.',
alts:[{t:'Server-side sessions (opaque cookie)',n:'Simplest revocation story; but multi-region session stores and courier offline needs make cookies plus central sessions the awkward fit.'},{t:'Long-lived pure JWTs, no revocation',n:'Fully stateless; a 30-day ban latency is unacceptable for the threat model, and logout becomes cosmetic.'}],

function adrDefaults(){return {num:String(MODS.length*0+11).padStart(4,'0'),title:'',status:'proposed',date:'',deciders:'',context:'',decision:'',alts:[{t:'',n:''}],pos:'',neg:'',risks:'',refs:''}}
function adrMd(d){const L=[];
  L.push(`# ADR-${(d.num||'0000').replace(/\D/g,'')||'0000'}: ${d.title||'<title>'}`,'',
    `- **Status:** ${d.status}`,
    `- **Date:** ${d.date||'<YYYY-MM-DD>'}`,
    `- **Deciders:** ${d.deciders||'<team or roles>'}`,'',
    '## Context','');
  d.context.split('\n').forEach(x=>x.trim()&&L.push(x.trim(),''));if(!d.context.trim())L.push('<The forces at play: technical, organizational, deadlines, existing systems — facts with numbers.>','');
  L.push('## Decision','');
  d.decision.split('\n').forEach(x=>x.trim()&&L.push(x.trim(),''));if(!d.decision.trim())L.push('We will <decision, active voice, no hedging>.','');
  const alts=d.alts.filter(a=>a.t.trim()||a.n.trim());
  if(alts.length){L.push('## Alternatives considered','');
    alts.forEach(a=>{L.push(`### ${a.t||'<alternative>'}`,'');const n=(a.n||'').trim();L.push(n||'<what it is; why it lost — with evidence>','')})}
  else L.push('## Alternatives considered','','<none recorded>','');
  L.push('## Consequences','',
    `**Positive:** ${d.pos||'<what becomes easier, cheaper, faster>'}`,'',
    `**Negative / trade-offs:** ${d.neg||'<what becomes harder; what we accepted>'}`,'',
    '## Risks & mitigations','',
    '| Risk | Likelihood | Impact | Mitigation |','|---|---|---|---|');
  const riskRows=d.risks.split('\n').map(x=>x.trim()).filter(Boolean);
  if(riskRows.length)riskRows.forEach(r=>L.push('| '+r.replace(/\s*;\s*/g,' | ')+' |'));
  else L.push('| <risk> | <likelihood> | <impact> | <mitigation> |');
  L.push('','## References','',d.refs||'<tickets, RFCs, benchmarks, prior ADRs>');
  return L.join('\n')}
/* minimal markdown preview */
function mdPreview(src){
  const lines=src.split('\n');let out='',list=false,para=[];
  const flushP=()=>{if(para.length){out+=`<p>${esc(para.join(' ')).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}</p>`;para=[]}};
  const flushL=()=>{if(list){out+='</ul>';list=false}};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^### /.test(l)){flushP();flushL();out+=`<h3>${esc(l.slice(4))}</h3>`}
    else if(/^## /.test(l)){flushP();flushL();out+=`<h2>${esc(l.slice(3))}</h2>`}
    else if(/^# /.test(l)){flushP();flushL();out+=`<h1>${esc(l.slice(2))}</h1>`}
    else if(/^\|/.test(l)){flushP();flushL();
      const cells=l.split('|').slice(1,-1).map(c=>c.trim());
      if(/^-+$/.test(cells.join('')))continue;
      out+=out.endsWith('</table>')||/<\/table>\s*$/.test(out)?'':/<table>\s*$/.test(out)?'':'';
      if(!/<table>\s*$/.test(out)&&!out.endsWith('<table>'))out+='<table><tbody>';
      out+=`<tr>${cells.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`}
    else if(/^> /.test(l)){flushP();flushL();out+=`<blockquote>${esc(l.slice(2))}</blockquote>`}
    else if(/^[-*] /.test(l)){flushP();if(!list){out+='<ul>';list=true}out+=`<li>${esc(l.slice(2))}</li>`}
    else if(l===''){flushP();flushL();
      if(/<\/table>\s*$/.test(out))out+='</tbody></table>'}
    else{if(/<\/table>\s*$/.test(out))out+='</tbody></table>';para.push(l)}}
  if(/<\/table>\s*$/.test(out))out+='</tbody></table>';
  flushP();flushL();return out}

function rfcMd(d){const sec=(t,v,ph)=>{const L=[`## ${t}`,''];const rows=(v||'').split('\n').map(x=>x.trim()).filter(Boolean);

function exToSpec(e){const j=s=>{try{return JSON.parse(s)}catch(x){return null}};
  return {method:e.method,path:e.path,summary:e.name,desc:e.desc,auth:e.auth.startsWith('Bearer')?'bearer':'none',tags:'Users',
    params:e.params,req:j(e.req)||e.req,
    resps:e.resps.map(r=>({code:r.code,desc:r.desc,body:j(r.body)||r.body}))}}
function yamlScalar(v){if(v==null)return 'null';const s=String(v);
  if(/[:#\-?\[\]{},&*!|>'"%@`]/.test(s)||/^\s|\s$/.test(s)||s===''||/^(true|false|null|~|\d+(\.\d+)?)$/.test(s))return JSON.stringify(s);
  return s}
function buildOpenApiYaml(d){
  const L=['paths:',`  ${d.path}:`,`    ${d.method.toLowerCase()}:`,
    `      summary: ${yamlScalar(d.summary||'')}`,'      description: |',...(d.desc||'').split('\n').map(x=>`        ${x}`),'      tags: ['+ (d.tags||'Users') +']',
    d.auth==='none'?'      security: []':'      security:','        - bearerAuth: []'];
  if(d.params&&d.params.length){const hasQuery=d.params.some(p=>p.in==='query'),hasPath=d.params.some(p=>p.in==='path');
    if(hasPath||hasQuery){L.push('      parameters:');
      d.params.filter(p=>p.in==='query'||p.in==='path').forEach(p=>L.push(`        - name: ${yamlScalar(p.name)}`,`          in: ${p.in}`,'          required: '+(p.req?'true':'false'),`          description: ${yamlScalar(p.desc||'')}`,`          schema: { type: ${yamlScalar((p.type||'string').split(' ')[0])} }`))}}
  if(d.req&&String(d.req).trim()&&d.method!=='GET'){L.push('      requestBody:','        required: true','        content:','          application/json:','            example: '+JSON.stringify(d.req,null,2).split('\n').join('\n            '))}
  L.push('      responses:');
  (d.resps||[]).forEach(r=>{L.push(`        '${r.code}':`,`          description: ${yamlScalar(r.desc)}`);
    if(r.body!=null&&String(r.body).trim())L.push('          content:','            application/json:','              example: '+JSON.stringify(r.body,null,2).split('\n').join('\n              '))});
  return L.join('\n')}
function endpointDocHtml(e){
  const code=s=>s==null||s===''?'':String(s);
  return `<div class="eyebrow">${e.method} ${esc(e.path)}</div><h3 style="margin:2px 0 6px">${esc(e.name)}</h3>
  <p>${e.desc}</p>
  <div class="meta"><span class="tag l3">auth: ${esc(e.auth)}</span></div>
  ${e.params&&e.params.length?`<h3>Parameters</h3><div class="tw"><table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th><th>Notes</th></tr></thead><tbody>${e.params.map(p=>`<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.in)}</td><td>${esc(p.type)}</td><td>${p.req?'yes':'no'}</td><td>${esc(p.desc)}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${e.req&&code(e.req).trim()&&e.req!=='(no body)'?`<h3>Request example</h3>${codeBlock('json',code(e.req))}`:''}
  <h3>Responses</h3>${(e.resps||[]).map(r=>`<div class="call ${r.code[0]==='2'?'tip':r.code[0]==='4'||r.code[0]==='5'?'trap':'note'}" style="max-width:none"><b class="lb">${esc(r.code)} — ${esc(r.desc)}</b>${r.body?codeBlock('json',code(r.body),{noSave:true}):''}</div>`).join('')}
  ${e.errors&&e.errors.length?`<h3>Error codes</h3><div class="tw"><table><thead><tr><th>Code</th><th>When</th></tr></thead><tbody>${e.errors.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${esc(x.when)}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${e.validation&&e.validation.length?`<h3>Validation rules</h3><ul class="b">${e.validation.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}
  ${e.edges&&e.edges.length?`<h3>Edge cases</h3><ul class="b">${e.edges.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}`}

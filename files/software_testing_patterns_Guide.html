LES('m01-what','m01','What software testing is (and is not)',1,7,[
P(R`Software testing is the process of evaluating a software item to detect differences between given input and expected output, and to assess whether it satisfies its requirements. Edsger Dijkstra framed the fundamental limitation in 1970: testing shows the presence of defects, never their absence. Testing is therefore a sampling activity — you pick inputs that maximize the chance of finding bugs within the time and budget you have, because exhaustive testing of all input combinations is impossible for any non-trivial program.`),
P(R`Testing exists to reduce risk: the risk of lost revenue, corrupted data, security breaches, reputation damage and wasted engineering time. It also supplies information for decisions — a green suite is evidence that a change is safe to ship; a failing test is cheaper feedback than a 2 a.m. incident page.`),
TB(['Common misconception','Reality'],[
['Testing proves the software works','Testing can falsify defects, not prove correctness. Absence of failures is not proof of absence of defects'],
['Testing is the tester&#39;s job','In agile teams, developers test continuously; testers contribute design, exploration and quality advocacy'],
['More tests always means better quality','A thousand slow, flaky, assertion-free tests are worse than a hundred sharp ones'],
['The goal is zero bugs','The goal is acceptable risk at acceptable cost; some low-risk defects are rationally shipped'],
['Testing starts after coding','The cheapest defects to fix are the ones prevented or caught while designing the code']]),
H('Testing and the rest of quality'),
UL([R`<b>Verification</b>: "are we building the thing right?" — does the software match its specification.`,
R`<b>Validation</b>: "are we building the right thing?" — does the software meet real user needs. A perfectly verified feature that nobody wants still fails validation.`,
R`<b>Quality assurance (QA)</b>: process-level activities that prevent defects (standards, reviews, CI gates).`,
R`<b>Quality control (QC)</b>: product-level activities that detect defects (testing, inspection). Testing is one QC technique, not the whole of QA.`,
R`<b>Debugging</b>: after a failure is observed, find and fix its cause. Testing finds the failure; debugging explains it.`]),
CALL('note',R`The seven classic testing principles (as taught by ISTQB) are worth internalizing: testing shows presence of defects; exhaustive testing is impossible; early testing saves money; defects cluster; tests stop finding new bugs unless they evolve (the pesticide paradox); testing is context-dependent; and finding no bugs does not mean the software is correct (absence-of-errors fallacy).`)
]);
LES('m01-terms','m01','Errors, defects, failures and oracles',1,7,[
P(R`Precise vocabulary keeps bug reports and test designs honest. The chain from human mistake to observable breakage matters because different tests target different links.`),
TB(['Term','Meaning','Example'],[
['Error / mistake','A human action producing an incorrect result','A developer inverts a comparison in a validation rule'],
['Defect / bug / fault','The flaw in the code or design left by the error','<code>if (age &lt; 18)</code> should have been <code>if (age &lt;= 18)</code>'],
['Failure','Incorrect observable behavior when the defect executes','A 17-year-old is allowed to register; the API returns wrong data'],
['Incident','The event of a failure being observed and reported','A QA ticket with steps, expected and actual results']]),
H('Test cases, suites and scenarios'),
P(R`A <b>test case</b> is a specification of inputs, execution conditions and expected results. A <b>test suite</b> is a collection of test cases, usually grouped by component or purpose. A <b>test scenario</b> is a higher-level user or business situation ("a returning customer renews a subscription") that may be covered by several test cases. A <b>test run</b> executes a suite in a specific environment and records outcomes.`),
TB(['Test case element','Purpose'],[
['Identifier / name','Unique, searchable reference for reports and defects'],
['Preconditions','State required before the test can run (user exists, data seeded)'],
['Inputs','Concrete values fed to the system, chosen with a technique such as equivalence partitioning'],
['Execution steps','What the tester or harness does'],
['Expected result / oracle','The source of truth the actual result is compared against']]),
H('Test oracles'),
P(R`An oracle is the mechanism that tells you whether an observed result is correct. Oracles are the hard part of testing because they are always partial. Common oracles: explicit specification, an older version of the system (regression), a reference implementation, invariants ("the sorted output contains exactly the input elements"), domain properties (a discounted price is never negative), or simply an informed human&#39;s judgment.`),
CALL('tip',R`When you cannot state the expected result before running the test, you do not have a test — you have an experiment. Pin the observed behavior in a characterization test, then decide whether it is actually correct.`)
]);
LES('m01-kinds','m01','Kinds of testing: the major axes',1,6,[
P(R`Testing is classified along several independent axes. Knowing the axes stops arguments like "is this a system test or an integration test?" from hiding the real question: what scope does it cover, and against what oracle?`),
TB(['Axis','Options','What decides the choice'],[
['Direction','Positive (valid input, expect success) vs negative (invalid input, expect clean rejection)','Negative testing is where most production incidents come from'],
['Functionality','Functional (what the system does) vs non-functional (how well: performance, security, usability, reliability)','Non-functional requirements need their own oracles, e.g. latency budgets'],
['Visibility','Black-box (spec only), white-box (code and structure), grey-box (partial knowledge)','White-box techniques like branch coverage need code access; black-box survives refactors'],
['Execution','Manual vs automated','Automate repetitive, deterministic checks; use humans for exploration and judgment'],
['Knowledge','Scripted vs exploratory','Exploratory testing designs tests while executing them, guided by charters']]),
H('Risk-based testing'),
P(R`Risk = likelihood of failure × impact of failure. Risk-based testing allocates effort where risk is highest: payment flows before cosmetic pages, complex calculations before simple CRUD, new code before stable code, frequently changed code before frozen code. Defect clustering — a small share of modules usually contains most defects — makes this strategy empirically sound.`),
TB(['Risk','Priority'],[
['High impact, high likelihood','Test first, deeply, at several levels'],
['High impact, low likelihood','Test the critical paths and failure modes; consider chaos and failure injection'],
['Low impact, high likelihood','Cover with cheap automated checks'],
['Low impact, low likelihood','Accept the risk explicitly; revisit when context changes']]),
H('The economics of defects'),
P(R`The cost of fixing a defect rises steeply with the stage at which it is found: a misunderstanding corrected while writing the specification costs minutes; the same flaw found in production costs triage, fix, re-test, release and sometimes data repair or compensation. This is the economic argument for shift-left (testing earlier) and for fast feedback loops in CI — see the CI/CD module.`),
CALL('warn',R`"The economics of defects" does not mean every defect must be prevented at any cost. It means the cost of finding defects late should be visible when you decide how much to invest in finding them early.`)
]);
LES('m01-context','m01','Choosing what to test, and how much',1,6,[
P(R`A test strategy answers three questions: what to test (scope and risk), how to test (levels, techniques, tools), and when to stop (exit criteria). Exit criteria are explicit statements like "all critical test cases pass, no open severity-1 defects, mutation score above 70% on changed code" — otherwise "done testing" is a feeling, not a decision.`),
TB(['Heuristic','Use it to decide'],[
['Criticality','Does failure cost money, data, security or trust? Test it at multiple levels'],
['Change frequency','Recently changed code is the most likely to fail — the basis of regression selection'],
['Complexity / cyclomatic density','Complex logic needs unit-level branch and boundary analysis'],
['External dependencies','Boundaries to other systems need contract tests and fault scenarios'],
['Past defects','Where bugs clustered before, they cluster again']]),
P(R`Manual testing still matters where human judgment is the oracle: visual layout, usability, exploratory discovery of unknown-unknowns. Automation is the right tool for anything repetitive, precise and deterministic. The failure mode is automating the wrong layer — a thousand Selenium scripts that should have been fifty API tests and ten E2E journeys.`),
CALL('trap',R`Do not confuse test count, test coverage percentage or suite runtime with quality. Each is a proxy that can be gamed. The only real question is: when this code breaks in a way that matters, will a test fail before your customers notice?`)
]);

LES('m02-levels','m02','The testing levels',1,7,[
P(R`Testing levels are scopes, not ceremonies. Each level answers a different question, has a different blast radius when it fails, and runs at a different speed. Naming them consistently ends most "unit vs integration" arguments in review.`),
TB(['Level','Question it answers','Typical scope','Speed'],[
['Unit','Does this smallest testable piece behave correctly in isolation?','One class or function; collaborators replaced with test doubles','Milliseconds'],
['Component','Does this deployable service work as a whole?','One service with its internal layers, doubles at the process boundary','Seconds'],
['Integration',' Do these pieces work together?','Two or more real components: service + database, service + broker','Seconds to minutes'],
['System','Does the assembled application satisfy its requirements?','The whole deployed system in a production-like environment','Minutes'],
['End-to-end (E2E)','Does a real user journey succeed through the real UI?','Browser or mobile client through all services','Minutes, brittle'],
['Acceptance','Is this what the stakeholder asked for?','Business-facing scenarios, often the same E2E flows','Varies']]),
H('Regression, smoke and sanity'),
P(R`These three describe <b>when and why</b> you re-run tests, not a new scope. <b>Smoke tests</b> are a shallow-but-wide pack that answers "is the build stable enough to test or deploy at all?" — run on every build. <b>Sanity tests</b> are a narrow, quick check after a small change or fix: "does the fixed area behave plausibly now?" <b>Regression tests</b> are the accumulated suite that answers "did anything that used to work break?"`),
CALL('note',R`Teams use "smoke" and "sanity" inconsistently. Agree on the local definition and write it in your test strategy; the words matter less than the shared exit criteria. What everyone agrees on: smoke is wide and shallow, sanity is narrow and quick, regression is the full accumulated check.`),
P(R`Acceptance testing is the formal gate where stakeholders confirm requirements. In practice healthy teams make acceptance criteria executable (Given/When/Then scenarios) so the same artifacts serve as living documentation — the idea behind BDD, covered in the philosophy module.`)
]);
LES('m02-pyramid','m02','The testing pyramid and its rivals',2,8,[
P(R`The testing pyramid — many fast unit tests, fewer integration tests, few end-to-end tests — was coined by Mike Cohn and popularized by Martin Fowler and Ham Vocke. Its point is a trade-off, not a geometry rule: as scope grows, tests get slower, flakier and more expensive to maintain, so buy confidence with the cheapest level that can detect the failure.`),
TB(['Property','Unit','Integration','Contract','E2E'],[
['Runtime per test','1–50 ms','0.1–10 s','seconds','tens of seconds'],
['Failure localization','Excellent (one unit)','Good (one seam)','Good (one pair)','Poor (any layer)'],
['Flakiness risk','Low','Medium','Low','High'],
['Confidence in the whole system','Low','Medium','Per seam','High'],
['Maintenance cost','Low','Medium','Medium','High']]),
H('The ice-cream cone anti-pattern'),
P(R`The inverted shape — a thick layer of manual testing, a pile of slow E2E scripts, and almost no unit tests — fails exactly as predicted: releases need days of manual regression, E2E suites are red so often that red stops meaning anything, and every small refactor breaks twenty UI scripts. The fix is not "delete E2E"; it is pushing assertions down to the cheapest level that can hold them.`),
H('The testing trophy'),
P(R`Kent C. Dodds&#39; testing trophy argues that for full-stack applications the highest return comes from <b>integration tests</b>: they exercise real rendering, real routing and real data flow while staying far cheaper than E2E. The trophy keeps a small E2E layer for true journeys and a unit layer for complex logic. It is a reminder to fit the shape to the risk profile of what you build — a UI-heavy product and a pricing engine should not share a test distribution.`),
CALL('note',R`The pyramid, trophy and cone are strategic models, not numerical rules. There is no universal "70/20/10" law. Decide distribution from your failure costs, and revisit it when the system changes. The <a href="#pyramid">Pyramid explorer</a> lab lets you compare the layers interactively.`),
TB(['When a level is appropriate','Choose it because'],[
['Unit','Pure logic with many branches: pricing, validation, state machines'],
['Integration','Boundaries where mismatched assumptions live: SQL, mappings, broker formats'],
['Contract','Independent services that must stay compatible without shared deployments'],
['E2E','A handful of revenue-critical journeys: login, checkout, registration']]),
H('Speed versus confidence'),
P(R`Every level buys a different kind of confidence per millisecond spent. Unit tests buy logical confidence almost for free but say nothing about wiring. Integration tests prove the wiring. E2E proves the journey including the client. Optimizing "total suite runtime subject to acceptable escape rate" is the real objective function — the pyramid is just its usual solution.`)
]);
LES('m02-journey','m02','One feature through every level',2,9,[
P(R`Take a single feature — user registration with email uniqueness and a welcome email — and follow it down the levels. Each level catches a class of defect the previous one cannot, which is the whole argument for keeping several.`),
H('Level 1: unit — the validation rule'),
CODE('java',R`
@Test
void rejectsUnderageApplicant() {
  RegistrationValidator v = new RegistrationValidator();
  Result r = v.validate(new RegistrationForm("ada@example.com", LocalDate.of(2011, 6, 1)));
  assertThat(r.isValid()).isFalse();
  assertThat(r.errors()).containsExactly("age must be 18 or above");
}`),
P(R`Runs in a millisecond, fails with surgical precision, and survives any refactor of the controller, database or mail system.`),
H('Level 2: integration — the uniqueness constraint'),
CODE('java',R`
@DataJpaTest
class UserRepositoryTest {
  @Autowired UserRepository users;

  @Test
  void rejectsDuplicateEmail() {
    users.save(new User("ada@example.com"));
    assertThatThrownBy(() -> users.save(new User("ada@example.com")))
        .isInstanceOf(DataIntegrityViolationException.class);
  }
}`),
P(R`This test would pass at unit level with a mocked repository and fail in production — only the real database proves the unique constraint and its mapping exist.`),
H('Level 3: system / API — the endpoint contract'),
CODE('java',R`
@WebMvcTest(RegistrationController.class)
class RegistrationControllerTest {
  @Autowired MockMvc mvc;
  @MockitoBean RegistrationService service;

  @Test
  void returns201WithLocation() throws Exception {
    given(service.register(any())).willReturn(new UserId(42L));
    mvc.perform(post("/api/users")
            .contentType(MediaType.APPLICATION_JSON)
            .content("{\"email\":\"ada@example.com\"}"))
        .andExpect(status().isCreated())

}`),
H('Level 4: E2E — the journey'),
CODE('javascript',R`
test('new user can register and land on onboarding', async ({ page }) => {
  await page.goto('/register');
  await page.getByLabel('Email').fill(uniqueEmail());
  await page.getByLabel('Password').fill('correct horse battery staple');
  await page.getByRole('button', { name: 'Create account' }).click();
  await expect(page.getByRole('heading', { name: 'Welcome' })).toBeVisible();
});`),
CALL('tip',R`Count what each level caught: the unit test guards the rule, the integration test guards the schema, the API test guards the HTTP contract, the E2E test guards the user. Delete a level only when you accept losing the failures only it can catch.`)
]);

LES('m03-anatomy','m03','Anatomy of a unit test',1,7,[
P(R`A unit test exercises one small, testable piece — typically a class or function — with its collaborators replaced by controllable stand-ins. Three properties make a test a unit test: <b>isolation</b> (failures point at one unit), <b>determinism</b> (same inputs, same result, every run) and <b>speed</b> (thousands per second). A useful acronym is FIRST: Fast, Isolated, Repeatable, Self-validating, Timely.`),
TB(['Property','Violation smell'],[
['Fast','Anything sleeping, dialing the network, or booting a container'],
['Isolated','Failure requires reading four classes to explain'],
['Repeatable','Passes on your machine, fails in CI, or passes on re-run'],
['Self-validating','Prints values for humans instead of asserting'],
['Timely','Written after the code rotted into a 900-line method']]),
H('Choosing the unit boundary'),
P(R`"Unit" is a design decision, not a language rule. In the classical (Detroit) style, a unit is a cluster of domain objects working together — real collaborators stay real. In the mockist (London) style, a unit is one class and every collaborator is doubled. Both produce working suites; they differ in how much refactorings hurt (mock-heavy suites break more) and how realistic the behavior is (real collaborators surface more interaction bugs). Module 4 covers this trade in depth.`),
H('Framework landscape'),
TB(['Ecosystem','Runner','Assertions','Doubles','Extras'],[
['Java','JUnit 5','AssertJ, Hamcrest, JUnit assertions','Mockito','Testcontainers, jqwik, PIT'],
['Python','pytest (and stdlib unittest)','plain assert + pytest.raises','unittest.mock (Mock, MagicMock)','Hypothesis, mutmut'],
['JavaScript / TypeScript','Jest, Vitest','expect / expect.extend','jest-mock, vi.fn()','Testing Library, Stryker']]),
P(R`JUnit 5 is the standard Java runner: @Test marks a method, assertions come from <code>org.junit.jupiter.api.Assertions</code> or (recommended) AssertJ&#39;s <code>assertThat</code>. pytest collects functions named <code>test_*</code> and asserts through plain <code>assert</code> with rich introspection. Jest and Vitest run <code>test()</code> blocks with <code>expect()</code> matchers; Vitest is Jest-compatible and faster with Vite-based projects.`)
]);
LES('m03-aaa','m03','Arrange–Act–Assert and naming',1,6,[
P(R`A test tells a story in three beats. <b>Arrange</b> the world into a known state. <b>Act</b> with one call on the unit under test. <b>Assert</b> observable outcomes. The behavior-driven variant is Given–When–Then — the same beats written from the specification&#39;s point of view, which maps directly onto test method names and cucumber-style scenarios.`),
CODE('java',R`
@Test
void recalculatesTotalWhenLineAdded() {          // name = behavior
  Cart cart = new Cart(ProductTestFixtures.coffee());   // arrange (given)
  cart.add(Line.of(2, Money.eur(350)));                 // act (when)
  assertThat(cart.total()).isEqualTo(Money.eur(700));   // assert (then)
}`),
H('Naming conventions'),
TB(['Style','Example','Note'],[
['Method per behavior','<code>recalculatesTotalWhenLineAdded</code>','Java default; long names are fine'],
['Underscore sentences','<code>add_line_updates_total</code>','Python convention'],
['DisplayName annotation','<code>@DisplayName("cart total includes added lines")</code>','Readable in reports; keep the id too'],
['Should sentences','<code>shouldRejectExpiredCard</code>','Popular but weaker: says expectation, not scenario'],
['Given/When/Then blocks','comments or @Nested classes','Makes AAA visible in bigger tests']]),
CALL('tip',R`Read your test name aloud as a specification: "cart recalculates total when a line is added." If it reads as "testCart2 works," the test does not yet know what it is testing. Avoid names tied to implementation ("callsRepositoryTwice") unless the interaction itself is the requirement.`),
P(R`One logical assertion per test keeps failures diagnostic: when the test fails you know which behavior broke. Multiple related assertions are fine when they verify one outcome — use JUnit 5&#39;s <code>assertAll()</code> so every mismatch is reported, not just the first.`)
]);
LES('m03-design','m03','Equivalence partitioning and boundary values',2,9,[
P(R`You cannot test all inputs, so choose them deliberately. <b>Equivalence partitioning (EP)</b>: divide the input domain into classes where all members should be handled identically, then test one representative per class. <b>Boundary value analysis (BVA)</b>: defects cluster at class edges, so test the exact boundary and both neighbors.`),
P(R`Worked example — a loyalty rule grants a discount for customers aged 18 to 65 inclusive with more than 3 orders:`),
TB(['Partition','Representative','Expected'],[
['Below range','age 17','no discount'],
['Lower boundary','age 18','discount (boundary in range)'],
['Inside range','age 30','discount'],
['Upper boundary','age 65','discount (boundary in range)'],
['Above range','age 66','no discount'],
['Order count boundary','3 orders','no discount (rule is &gt; 3)'],
['Order count boundary','4 orders','discount']]),
P(R`A complete test design for this rule needs about seven cases, not fifty. The pair of techniques generalizes to strings (empty, 1 char, max, over-max), collections (empty, one, page-size, page-size+1), dates (leap day, month end, timezone edges) and money (zero, one cent, rounding boundary 0.005).`),
H('Edge cases that deserve their own tests'),
UL(['null and empty collections, not just valid ones',
'unicode and emoji in strings; leading/trailing whitespace',
'maximum lengths and overflow (int + 1)',
'timezone boundaries and clock changes (inject a Clock — see the flaky tests module)',
'idempotent re-execution: what happens when the same request arrives twice?']),
H('Testing exceptions'),
CODE('java',R`
@Test
void rejectsUnknownCurrency() {
  assertThatThrownBy(() -> Money.of(10, "XYZ"))
      .isInstanceOf(IllegalArgumentException.class)
      .hasMessageContaining("unknown currency");
}`),
CODE('python',R`
def test_rejects_unknown_currency():
    with pytest.raises(ValueError, match="unknown currency"):
        money_of(10, "XYZ")`),
CODE('javascript',R`
test('rejects unknown currency', () => {
  expect(() => moneyOf(10, 'XYZ')).toThrow(/unknown currency/);
});`),
CALL('warn',R`Assert the message or type, not just "some exception was thrown". <code>assertThrows(Exception.class, ...)</code> passes for any failure — including a NullPointerException that means your test setup is broken, not your rule.`)
]);
LES('m03-param','m03','Parameterized tests',2,7,[
P(R`When one rule needs many cases, repeat the logic, not the boilerplate. Parameterized tests declare the pattern once and feed it rows of data; failures report the row that broke.`),
CODE('java',R`
@ParameterizedTest(name = "age {0} with {1} orders -> discount {2}")
@CsvSource({
  "17, 5, false",   // below range
  "18, 5, true",    // lower boundary
  "65, 4, true",    // upper boundary
  "66, 5, false",   // above range
  "30, 3, false",   // order boundary
  "30, 4, true"
})
void discountRule(int age, int orders, boolean expected) {
  boolean actual = policy.isEligible(age, orders);
  assertThat(actual).isEqualTo(expected);
}`),
P(R`JUnit 5 sources: <code>@ValueSource</code> for a single primitive array, <code>@CsvSource</code> for rows, <code>@EnumSource</code> for enum cases, <code>@MethodSource</code> for arbitrary objects (a named static method returning a Stream of Arguments). Python and JavaScript mirror the idea:`),
CODE('python',R`
@pytest.mark.parametrize("age,orders,expected", [
    (17, 5, False), (18, 5, True), (65, 4, True),
    (66, 5, False), (30, 3, False), (30, 4, True),
])
def test_discount_rule(age, orders, expected):
    assert policy.is_eligible(age, orders) is expected`),
CODE('javascript',R`
test.each([[17,5,false],[18,5,true],[65,4,true],[66,5,false]])(
  'discount rule: age %i, %i orders -> %p',
  (age, orders, expected) => {
    expect(policy.isEligible(age, orders)).toBe(expected);
  });`),
CALL('tip',R`Parameterize only when every row shares the same oracle. If one row needs different assertions, it is a different test wearing a disguise. Keep row labels meaningful — the <code>name</code> attribute is what appears in CI logs.`)
]);
LES('m03-fixtures','m03','Fixtures, setup and teardown',2,6,[
P(R`Shared setup belongs in fixtures, not copy-pasted into every test. JUnit 5 lifecycle: <code>@BeforeEach</code> per test, <code>@BeforeAll</code> once per class (static unless <code>@TestInstance(PER_CLASS)</code>), <code>@AfterEach</code>/<code>@AfterAll</code> for teardown. <code>@Nested</code> groups related cases under a readable parent name.`),
CODE('java',R`
class OrderPricingTest {
  private PricingPolicy policy;

  @BeforeEach
  void freshPolicy() { policy = new PricingPolicy(clock.fixedAt(2024, 1, 1)); }

  @Test
  void basePrice() { assertThat(policy.priceFor(cartOf("book"))).isEqualTo(Money.eur(1000)); }

  @Nested
  class WithVipCustomer {
    @Test
    void appliesVipDiscount() { assertThat(policy.priceFor(cartOf("book"), VIP)).isEqualTo(Money.eur(900)); }
  }
}`),
CODE('python',R`
@pytest.fixture
def policy():
    return PricingPolicy(clock=FakeClock(2024, 1, 1))

def test_base_price(policy):
    assert policy.price_for(cart_of("book")) == eur(1000)`),
P(R`pytest fixtures compose and can have scopes (function / module / session); expensive resources like a Testcontainers database are session-scoped while data stays per-test. In Jest/Vitest, <code>beforeEach</code> and <code>afterEach</code> play the same role, with <code>beforeAll</code> for one-time setup.`),
CALL('trap',R`Fixtures that build the world for every test hide what each test actually needs — the "mystery guest" smell. Keep fixtures minimal and let especially revealing values stay visible in the test body. And never use <code>@BeforeAll</code> for mutable shared state; tests must not depend on execution order.`)
]);
LES('m03-quality','m03','Unit test quality and smells',2,8,[
P(R`Good unit tests behave like specifications: they fail for exactly one reason, they pass for anyone who runs them, and they keep passing through harmless refactors. The smells below (names from Meszaros&#39; xUnit Test Patterns) break those promises.`),
SM('Assertion roulette','A test with many unlabelled assertions; when it fails you must diff outputs by hand.','The failure says "expected 900 but was 1000" with no hint which rule broke.','Any test with more than a few assertions and no structure.','Extract intention-revealing helper assertions or split the test; assertAll groups related checks with labels.','java',R`
assertThat(c.total()).isEqualTo(900);
assertThat(c.lines()).hasSize(3);
assertThat(c.tax()).isEqualTo(171);`,R`
assertAll("cart after discount",
  () -> assertThat(c.total()).describedAs("total").isEqualTo(900),
  () -> assertThat(c.lines()).describedAs("lines").hasSize(3),
  () -> assertThat(c.tax()).describedAs("tax").isEqualTo(171));`),
SM('Mystery guest','The test reads values that were created far away, in a fixture or base class.','A hidden fixture makes the cause invisible; the test no longer documents its own inputs.','The test body references objects nobody in this file builds.','Inline what matters; keep only boring setup in fixtures.','java',R`
@Test
void totalsDiscountedCart() {
  Cart c = fixtures.standardCart();
  assertThat(c.total()).isEqualTo(810);
}`,R`
@Test
void totalsDiscountedCart() {
  Cart c = new Cart(Line.of(3, Money.eur(300))); // 900 - 10% = 810
  assertThat(c.total()).isEqualTo(Money.eur(810));
}`),
H('Testing private methods?'),
P(R`You cannot, and mostly should not: private behavior is an implementation detail that refactoring legitimately changes. Test it through the public API. If a private method is too complex to reach that way, that is a design signal: extract the logic into its own class with a public contract and test that. A <code>@VisibleForTesting</code> widening is a last resort — it leaks test pressure into design; document why it exists.`),
H('Avoiding flaky unit tests'),
UL(['No Thread.sleep — wait for conditions (Awaitility) or inject a controllable Clock',
'No randomness without a seed; no iteration over HashMap order when order matters',
'No reliance on the system locale, timezone or environment variables',
'No shared static or mutable state between tests — build fresh objects in @BeforeEach',
'No real network or filesystem unless the test is explicitly an integration test']),
CALL('note',R`Determinism is a contract with your future self: a unit test that fails intermittently trains the team to re-run red builds, and re-runs make every real regression invisible. The debugging module gives you the full investigation workflow when it still happens.`)
]);

LES('m04-taxonomy','m04','The five kinds of test doubles',2,7,[
P(R`Gerard Meszaros coined "test double" (as in stunt double) for any object that stands in for the real one during a test. The five kinds differ in why they exist — picking the weakest one that answers your question keeps tests honest.`),
TB(['Double','Purpose','You use it when','Example'],[
['Dummy','Only to satisfy a signature; never used','A constructor demands a logger the test ignores','<code>new Order(null)</code> with null Logger'],
['Stub','Returns canned answers to direct queries','You must control inputs to the unit under test','A repository that always returns user #42'],
['Spy','A stub that records how it was called','You need to assert that something happened','Mail gateway capturing sent messages'],
['Mock','Pre-programmed with expectations; fails if not used as expected','The interaction is the requirement','Expect exactly one charge of 49.90'],
['Fake','A working lightweight implementation','You need real behavior without production weight','In-memory repository with a Map']]),
CODE('java',R`
// Stub: controls the answer
given(repository.findById(42L)).willReturn(Optional.of(user));

// Spy / verification: records the interaction
verify(gateway).send(anyWelcomeEmail());

// Fake: behaves like the real thing, cheaply
UserRepository fake = new InMemoryUserRepository();`),
CALL('note',R`Colloquially everyone says "mock" for all five; tools blur the line further. The distinction that survives into practice: stubs support <b>state testing</b> (assert results), mocks support <b>interaction testing</b> (assert conversations). Reach for interaction assertions only when the conversation itself is the requirement — "the payment was charged exactly once."`)
]);
LES('m04-mockito','m04','Mockito fundamentals',2,9,[
P(R`Mockito is the standard double framework for Java. Create doubles with <code>@Mock</code>, inject them into the unit under test with <code>@InjectMocks</code> (or construct by hand — explicit is better), then program behavior with <code>when(...)</code> or BDD-style <code>given(...)</code>.`),
CODE('java',R`
@ExtendWith(MockitoExtension.class)
class CheckoutServiceTest {
  @Mock PaymentGateway gateway;
  @Mock OrderRepository repository;
  @InjectMocks CheckoutService service;

  @Test
  void chargesCardOnceForTheOrderTotal() {
    given(gateway.supportsCurrency("EUR")).willReturn(true);
    given(repository.save(any(Order.class))).willAnswer(inv -> inv.getArgument(0));

    Receipt r = service.checkout(cartOf(Money.eur(4990)));

    assertThat(r.charged()).isEqualTo(Money.eur(4990));
    verify(gateway, times(1)).charge(Money.eur(4990));
  }
}`),
H('Argument matchers'),
P(R`Matchers let you stub and verify loosely: <code>any()</code>, <code>any(Order.class)</code>, <code>eq(42L)</code>, <code>contains("ada")</code>, <code>argThat(order -> order.isVip())</code>. Rule: if one argument uses a matcher, all arguments in that call must — <code>charge(eq(Money.eur(100)), anyString())</code>, never <code>charge(Money.eur(100), anyString())</code>.`),
H('Stubbing failure paths'),
CODE('java',R`
given(gateway.charge(any()))
    .willReturn(Receipt.declined("insufficient_funds"));

// throwing from a normal stub:
given(repository.findById(-1L)).willThrow(new IllegalArgumentException());

// void methods need the do-family:
doThrow(new MailServerDown()).when(gateway).send(any());`),
CALL('tip',R`Mockito&#39;s strict stubbing (default since Mockito 2 with the extension) fails tests that stub calls that never happen — dead stubbing is usually stale test design. Use <code>lenient()</code> deliberately and rarely, e.g. in shared base fixtures.`),
P(R`UnnecessaryStubbingException is a feature: it tells you the test no longer exercises the arrangement it declares. Delete the stub or split the test.`)
]);
LES('m04-verify','m04','Verification and argument capture',2,7,[
P(R`Verify interactions after acting: <code>verify(mock)</code> (exactly once), <code>verify(mock, times(2))</code>, <code>never()</code>, <code>atLeastOnce()</code>, and <code>verifyNoInteractions(mock)</code> to prove nothing happened. <code>InOrder</code> asserts sequencing across mocks when order is contractual — for example, audit before delete.`),
CODE('java',R`
@Test
void sendsExactlyOneWelcomeEmail_addressedToTheNewUser() {
  service.register("ada@example.com");

  ArgumentCaptor<Email> sent = ArgumentCaptor.forClass(Email.class);
  verify(gateway, times(1)).send(sent.capture());
  assertThat(sent.getValue().to()).isEqualTo("ada@example.com");
  assertThat(sent.getValue().subject()).contains("Welcome");
}`),
P(R`ArgumentCaptor is how you inspect what your code actually passed to a collaborator — the natural way to assert on data that leaves the unit through a side effect. In BDD style the same flow reads given / when / then with <code>then(gateway).should(times(1)).send(any())</code>.`),
CALL('trap',R`Resist <code>verifyNoMoreInteractions(mock)</code> as a habit. It turns every harmless addition (a log call, a metrics increment) into a red build, and teaches the team to paste the same verification everywhere. Verify the interactions that are requirements; ignore the rest.`)
]);
LES('m04-schools','m04','Interaction vs state, mockist vs classical',2,6,[
P(R`Two schools, one goal. <b>Classical (Detroit)</b>: keep collaborators real (or fakes) inside your unit; mocks live at the process boundary — database, mail, payment gateway. Failures speak about results, so refactors are cheap. <b>Mockist (London)</b>: mock every collaborator; each class is specified in isolation, and interaction failures localize instantly — but renames and call-pattern changes ripple through the suite. Martin Fowler&#39;s "Mocks Aren&#39;t Stubs" is the classic comparison.`),
TB(['Question','Classical answer','Mockist answer'],[
['What is a unit?','A behavior cluster','One class'],
['Where do doubles go?','Awkward seams only','Everywhere'],
['What do tests assert?','State and results','Interactions and state'],
['Refactor pain','Low','Higher: call-shape changes break tests'],
['Guidance for BDD-style specs','Indirect','Natural']]),
H('When to mock, concretely'),
UL(['Mock (or stub) slow, non-deterministic or external systems: payment gateways, SMTP, third-party HTTP, clocks, randomness',
'Prefer real objects and fakes for in-process collaborators: domain services, repositories behind an interface, pricing rules',
'Verify interactions only where the interaction is contractual: "exactly one charge", "audit written before delete"',
'Never mock the type under test, and never mock value objects — build them'])
]);
LES('m04-traps','m04','Mock-heavy tests, and what to do instead',2,8,[
P(R`The signature of over-mocking: a test where the arrange section programs five mocks, the act calls one method, and the assert block verifies every call the implementation happened to make. Such a test documents the current implementation, not the requirement — every refactor is a failure, and every real bug that changes results but not call shapes sails through.`),
CMP('Same rule, two suites','java',R`
@Test
void appliesTenPercentVipDiscount() {
  given(priceRepo.find("book")).willReturn(10.0);
  given(customerRepo.find(1L)).willReturn(vip());
  given(rounding.apply(anyDouble())).willAnswer(a -> a.getArgument(0));

  double total = service.total(1L, List.of("book"));

  verify(priceRepo).find("book");
  verify(customerRepo).find(1L);
  verify(rounding).apply(10.0);
  assertThat(total).isEqualTo(10.0);   // weak: re-states the stub
}`,R`
@Test
void appliesTenPercentVipDiscount() {
  PriceBook prices = PriceBook.fixed("book" -> 10.00);
  Customers customers = Customers.with(vip());

  Money total = new Checkout(prices, customers).total(cart("book"));

  assertThat(total).isEqualTo(Money.eur(900));
}`,[R`The strong version asserts the <b>result</b>: 10% off 10.00 is 9.00 — a fact independent of how many collaborators were consulted.`,
R`Small fakes (<code>PriceBook.fixed</code>) replace three mocks and keep behavior real: three books still add up correctly.`,
R`The weak version passes even if the discount silently becomes 5% — as long as the same methods are called with the same arguments, <code>verify</code> is happy, and the final assertion compares against the stubbed value, which follows the bug.`],R`Trade-off: fakes must be built and kept honest — usually 20–50 lines each, amortized across every test that uses them. Mocks remain right at true process boundaries.`),
H('Mocking static methods and constructors'),
P(R`Mockito 5 (inline maker by default) can mock statics via <code>try (MockedStatic&lt;Clock&gt; ms = mockStatic(Clock.class))</code> and final classes directly. It works, but every use is a design signal: a static call is a hidden dependency. Prefer introducing a seam — inject a Clock, wrap the static in an interface you own — and the test needs no magic at all.`),
CALL('note',R`Try the <a href="#mocklab">Test doubles lab</a> to switch one service between a real database, a mock, a fake and a stub and watch what each choice reveals and hides.`)
]);

LES('m05-what','m05','What integration testing covers',2,6,[
P(R`Integration testing verifies that components work together: service and database, mapper and JSON, producer and broker, client and API. Its value is exactly the gaps unit tests leave: mismatched assumptions, wrong SQL, mapping drift, transaction boundaries, locking behavior, and the difference between "the code is right" and "the system works".`),
TB(['Integration you are testing','Question','Typical tool'],[
['Component integration','Do the layers inside one service cooperate?','@SpringBootTest with real beans'],
['Repository / database','Does the SQL and mapping do what the domain expects?','@DataJpaTest + Testcontainers'],
['REST API','Does the endpoint honor its HTTP contract?','MockMvc, WebTestClient, REST Assured'],
['External service','Do we survive their responses and failures?','WireMock, stub server, contract tests'],
['Message broker','Are messages produced and consumed correctly?','Testcontainers RabbitMQ / Kafka'],
['Auth integration','Do security filters and tokens behave?','@SpringBootTest + token fixtures']]),
P(R`Keep integration tests <b>narrow</b> where possible: one seam per test (service+database, controller+JSON). Wide tests that boot everything catch more but localize worse and decay into mini-E2E. A practical boundary: doubles outside your process, real things inside it, containers for infrastructural dependencies.`),
CALL('note',R`"Integration test" means both "components together" and, in some communities, "any test that isn&#39;t a unit test." Define the term in your team; the level table in <a href="#lesson-m02-levels">Module 02</a> is a good shared vocabulary.`)
]);
LES('m05-spring','m05','Spring Boot test slices',2,9,[
P(R`Spring Boot ships focused test slices that load only the context a layer needs — faster than a full application and more precise about what broke. The general-purpose annotations accept extension through <code>@TestConfiguration</code> beans and run against a dedicated profile.`),
TB(['Annotation','Loads','Use for'],[
['<code>@SpringBootTest</code>','The whole application context','Wiring, startup, end-to-end service behavior'],
['<code>@WebMvcTest(X.class)</code>','MVC layer + one controller','HTTP contract: status, headers, JSON, validation'],
['<code>@DataJpaTest</code>','JPA + embedded swappable DB','Repositories, mappings, constraints'],
['<code>@JsonTest</code>','Jackson only','Serialization round-trips'],
['<code>@SpringBootTest(webEnvironment=RANDOM_PORT)</code>','Real server on a random port','True HTTP through the full stack']]),
CODE('java',R`
@WebMvcTest(OrdersController.class)
class OrdersControllerTest {
  @Autowired MockMvc mvc;
  @MockitoBean OrderService service;      // replaces deprecated @MockBean

  @Test
  void missingBodyReturns400WithProblemJson() throws Exception {
    mvc.perform(post("/api/orders").contentType(MediaType.APPLICATION_JSON)
            .content("{}"))
        .andExpect(status().isBadRequest())
        .andExpect(jsonPath("$.errors[0].field").value("items"));
  }
}`),
P(R`Spring Framework 6.2 (Boot 3.4+) replaces <code>@MockBean</code> with <code>@MockitoBean</code> / <code>@MockitoSpyBean</code> from <code>org.springframework.test.context.bean.override.mockito</code> — same purpose, clearer semantics, no cache pollution. Use the new annotations on current versions.`),
H('Transactions and rollback'),
P(R`By default, <code>@DataJpaTest</code> and <code>@SpringBootTest</code> run each test in a transaction that rolls back — excellent isolation with zero cleanup code. Watch for the trap: code that starts its own transaction (<code>REQUIRES_NEW</code>, scheduled jobs, message listeners) commits for real and escapes the rollback; those tests need explicit cleanup (TRUNCATE via <code>@Sql</code>, or per-test schemas).`),
H('Context caching'),
P(R`Every distinct context configuration spawns a new ApplicationContext and a new pool — the hidden cost of casually varying <code>properties = ...</code> per test class. Keep a small set of standard configurations (e.g. one Testcontainers base class) so most tests share one cached context; the second suite of savings is bigger than the first.`),
CALL('tip',R`If your @DataJpaTest needs database features H2 lacks (JSONB, specific isolation behavior), do not emulate — swap the DataSource for Testcontainers PostgreSQL with one annotation, as the next lesson shows.`)
]);
LES('m05-tc','m05','Testcontainers: the real engine, disposable',2,9,[
P(R`Testcontainers starts a real PostgreSQL, Redis, RabbitMQ or Kafka in Docker for the duration of the test run. You get production engine behavior — SQL dialect, constraints, extensions, protocol — with reproducible, ephemeral environments. Spring Boot 3.1+ connects them with <code>@ServiceConnection</code>, removing all manual URL wiring.`),
CODE('java',R`
@SpringBootTest
@Testcontainers
class OrderRepositoryBootTest {

  @Container
  @ServiceConnection
  static PostgreSQLContainer&lt;?&gt; postgres =
      new PostgreSQLContainer&lt;&gt;("postgres:16-alpine");

  @Autowired OrderRepository orders;

  @Test
  void jsonbIndexesSurviveRoundTrip() {
    Order saved = orders.save(Order.withAttributes(Map.of("tier", "vip")));
    assertThat(orders.findByAttribute("tier", "vip")).contains(saved);
  }
}`),
CODE('java',R`
// Not on Boot 3.1+? Wire properties yourself:
static PostgreSQLContainer&lt;?&gt; pg = new PostgreSQLContainer&lt;&gt;("postgres:16-alpine");

@DynamicPropertySource
static void datasource(DynamicPropertyRegistry r) {
  r.add("spring.datasource.url", pg::getJdbcUrl);
  r.add("spring.datasource.username", pg::getUsername);
  r.add("spring.datasource.password", pg::getPassword);
}`),
P(R`Other engines follow the same shape: <code>GenericContainer&lt;?&gt;</code> with <code>REDIS_PORT = 6379</code> for Redis, <code>RabbitMQContainer</code> for RabbitMQ, and <code>KafkaContainer</code> for a KRaft Kafka — the distributed systems module builds full listener tests on these. Keep containers <code>static</code> so all tests in the class share one start-up; consider the singleton container pattern across your base test class.`),
TB(['Concern','Practice'],[
['Speed','One container per run (static), not per test; reuse via .withReuse(true) locally'],
['Reproducibility','Pin versions; the same image in CI and locally'],
['Parallel suites','Distinct database name or schema per worker'],
['CI','Works on GitHub Actions ubuntu runners (Docker present) out of the box']]),
CALL('note',R`Testcontainers requires a Docker-compatible runtime. On machines without it, tag these tests (<code>@Tag("docker")</code>) so a plain <code>mvn test</code> can still run the pure unit layer — see the CI module for the full pipeline split.`)
]);
LES('m05-db','m05','Test databases, data and cleanup',2,7,[
P(R`The database under your tests should be as close to production as your budget allows. H2 is fast and needs no Docker, but it is a different engine: dialect differences (JSONB, sequences, locking clauses, function behavior) fail only in production. The pragmatic ladder: in-memory for pure mapping smoke tests; Testcontainers PostgreSQL for anything that claims to test persistence; production-parity staging for performance and failover.`),
TB(['Strategy','Pros','Cons'],[
['Embedded H2','Instant, no Docker','Different SQL dialect; green tests can lie'],
['Testcontainers real engine','True behavior, reproducible','Needs Docker, seconds of startup'],
['Shared dev database','None worth the risk','State contamination, order dependence, flakiness'],
['Per-test schema/database','Strong isolation','Slightly more setup code']]),
H('Isolation and cleanup'),
UL([R`Default: <code>@Transactional</code> rollback per test — but remember it hides commit behavior and escapes <code>REQUIRES_NEW</code>.`,
R`For commit-visible behavior: <code>@Sql(scripts = "/cleanup.sql", executionPhase = AFTER_TEST_METHOD)</code> or a <code>@AfterEach</code> that truncates known tables (in dependency order or with <code>TRUNCATE ... CASCADE</code>).`,
R`Seed meaningfully small: builders or factories (Module 15) that make exactly the entity under test, not a 40-column god-fixture.`,
R`Never let one test read what another test wrote; a test must pass alone, in any order, in parallel with its siblings.`]),
CALL('trap',R`The most common integration-suite rot: tests that pass in a full run and fail alone — or the reverse. That is state leakage, and it means some test&#39;s precondition is "the previous test happened to run." Fix isolation the moment you see it; it only compounds.`)
]);
LES('m05-case','m05','Complete example: service, database, external API',2,8,[
P(R`One realistic test class showing the standard shape: real PostgreSQL via Testcontainers, the external payment gateway mocked at the port boundary, and assertions on observable outcomes — data in the database and the receipt returned.`),
CODE('java',R`
@SpringBootTest
@Testcontainers
class PlaceOrderTest {

  @Container @ServiceConnection
  static PostgreSQLContainer&lt;?&gt; db = new PostgreSQLContainer&lt;&gt;("postgres:16-alpine");

  @MockitoBean PaymentGateway payments;   // external boundary: doubled
  @Autowired OrderService service;        // real: service + repo + mapping
  @Autowired OrderRepository orders;

  @Test
  void persistsOrderAndReceiptWhenPaymentApproves() {
    given(payments.charge(Money.eur(4990)))
        .willReturn(PaymentReceipt.approved("tx-881"));

    Receipt receipt = service.placeOrder(customer(42L), cart("book", Money.eur(4990)));

    assertThat(receipt.transactionId()).isEqualTo("tx-881");
    assertThat(orders.findById(receipt.orderId()))
        .hasValueSatisfying(o -> assertThat(o.status()).isEqualTo(PAID));
  }

  @Test
  void orderStaysPendingWhenGatewayDeclines() {
    given(payments.charge(any()))
        .willReturn(PaymentReceipt.declined("insufficient_funds"));

    Receipt receipt = service.placeOrder(customer(42L), cart("book", Money.eur(4990)));

    assertThat(receipt.approved()).isFalse();
    assertThat(orders.findById(receipt.orderId()))
        .hasValueSatisfying(o -> assertThat(o.status()).isEqualTo(PENDING));
  }
}`),
UL([R`The approve test catches mapping and transaction bugs the mock-only unit version cannot: column types, <code>updatedAt</code> triggers, constraint violations.`,
R`The decline test pins the compensation contract: declined payment must not lose the order — the failure mode that costs real money.`,
R`Both fail with useful localization: assertion on status points at persistence; on transactionId, at the gateway seam.`]),
CALL('tip',R`This is the shape to copy: containers for infrastructure you own, mocks only at the process boundary, assertions on outcomes a business person would recognize. If you later replace the payment provider, only the gateway double changes.`)
]);

};

LES('m07-why','m07','Why contract testing exists',3,7,[
P(R`A contract is the agreed interface between a consumer and a provider: request shape, response shape, semantics, error cases. In a monolith, the compiler pins integration. Across microservices, nothing does — provider changes ship independently, and each consumer discovers breakage in production, one outage at a time.`),
TB(['Approach','What it proves','Cost'],[
['Integration test with deployed services','The wiring works today','N × M environments; slow, brittle, order-dependent'],
['E2E journey','The journey works today','Slowest, worst localization, one team&#39;s ownership problem'],
['Contract test','Every published expectation still holds','Fast, independent, per-pair feedback']]),
P(R`Contract testing replaces "deploy everything and click around" with a machine-checkable statement per pair: <b>the consumer&#39;s expectations, verified against the provider, on every provider change</b>. In <b>consumer-driven</b> contract testing (CDC) the consumer writes expectations as tests and publishes them (the contract); the provider verifies against them in its own pipeline. <b>Provider-driven</b> is the inverted flow — the provider publishes a specification (OpenAPI, Spring Cloud Contract) and consumers validate against it locally.`),
CALL('note',R`Pact reports adoption numbers dominated by consumer-driven flows because the incentive lands correctly: the team about to break someone else&#39;s day is the one who finds out first, in their own CI.`)
]);
LES('m07-pact','m07','Consumer-driven contracts with Pact',3,9,[
P(R`The consumer writes a test that names the exact request it will make and the response fragment it needs. Pact runs that against a mock server, records the interaction as a <b>pact file</b> (JSON), and publishes it — classically to a Pact Broker, which tracks versions and tags.`),
CODE('java',R`
// CONSUMER: OrderService tests its dependency on the User API
@ExtendWith(PactConsumerTestExt.class)
@PactTestFor(providerName = "UserApi", port = "9292")
class UserApiContractTest {

  @Pact(consumer = "OrderService")
  RequestResponsePact userExists(PactDslWithProvider builder) {
    return builder
      .given("user 42 exists and is active")
      .uponReceiving("a request for the billing user")
        .path("/users/42")
        .method("GET")
        .matchHeader("Accept", "application/json")
      .willRespondWith()
        .status(200)
        .body(new PactDslJsonBody()
          .integerType("id", 42)
          .stringType("name")
          .stringMatcher("email", ".+@.+\\..+"))
      .toPact();
  }

  @Test
  @PactTestFor(pactMethod = "userExists")
  void billingNameComesFromTheUserApi(MockServer server) {
    UserApiClient client = new UserApiClient(server.getUrl());
    assertThat(client.billingNameFor(42L)).isNotEmpty();
  }
}`),
CODE('java',R`
// PROVIDER: UserApi verifies it satisfies OrderService's expectations
@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)
@Provider("UserApi")
@PactBroker(url = "https://broker.example.com")
class UserApiProviderVerificationTest {

  @TestTemplate
  @ExtendWith(PactVerificationInvocationContextProvider.class)
  void verifyContract(PactVerificationContext context) {
    context.verifyInteraction();
  }

  @State("user 42 exists and is active")
  void seedActiveUser() {
    testUsers.save(User.active(42L, "Ada", "ada@example.com"));
  }
}`),
P(R`The provider&#39;s verification replays every consumer interaction against its real application — same framework, same serializers, same database state via the <code>@State</code> setup. If the provider renames <code>email</code> to <code>mail</code>, the verification fails in the provider&#39;s CI, before merge.`),
CALL('tip',R`Match types, not values, where the value is incidental (<code>stringType("name")</code>) and exact values where they are semantic (status enums, error codes). Over-specific pacts break on harmless data changes; under-specific ones stop guarding the contract.`)
]);
LES('m07-scc','m07','Spring Cloud Contract and OpenAPI',3,7,[
P(R`Spring Cloud Contract takes the provider-driven road: the provider team writes contract definitions (YAML or Groovy DSL) in their repository; the verifier generates consumer stub tests and a runnable stub server (WireMock) from the same source.`),
CODE('yaml',R`
# contracts/userApi/getUser.yml — the provider owns this file
name: get active user
request:
  method: GET
  url: /users/42
  headers:
    Accept: application/json
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    id: 42
    name: "Ada Lovelace"
    email: "ada@example.com"
  matchers:
    body:
      - path: $.name
        type: byRegex
        value: ".+"
      - path: $.email
        type: byRegex
        value: "[^@]+@[^@]+\\.[^@]+"`),
P(R`Providers get generated JUnit tests that fail the provider build when the contract drifts; consumers download stubs and run against WireMock in milliseconds. The trade versus CDC: provider-driven contracts are easier to adopt top-down but can lag behind what consumers actually need — many teams run both, using CDC for critical pairs.`),
H('OpenAPI and AsyncAPI'),
P(R`OpenAPI describes REST APIs as machine-readable specifications; contract discipline then = <b>spec-first development + CI diffing</b> (openapi-diff breaking-change rules) + schema validation of live traffic. AsyncAPI plays the same role for events: it documents topics, payloads and bindings for Kafka and RabbitMQ, so event contracts become reviewable artifacts. Pact also supports message pacts for brokers, shown at the end of this module.`)
]);
LES('m07-compat','m07','Compatibility and versioning',3,8,[
TB(['Change','Backward compatible?','Why'],[
['Add optional response field','Yes','Tolerant readers ignore unknown fields'],
['Add optional request parameter','Yes (for old clients)','New clients can adopt gradually'],
['Remove a response field','No','Consumers reading it break'],
['Rename a field','No','Equivalent to remove + add'],
['Change a field type','No','Deserialization fails'],
['Tighten validation (reject more)','No','Previously accepted requests now fail'],
['Loosen validation / add enum value','Depends','Only if consumers tolerate unseen values'],
['Add required response field','For consumers: yes','They already tolerate it or must now read it'],
['Add required request field','No','Existing clients stop passing validation']]),
P(R`<b>Backward compatibility</b> protects old consumers against a new provider. <b>Forward compatibility</b> protects a new consumer against an old provider — needed for rolling upgrades in both directions. The compatible-change rule set: add fields optionally (or with defaults), never remove or rename, never change types, and retire old fields in stages (deprecate → communicate → wait a deprecation window → remove in a major version).`),
P(R`Version APIs by contract, not by date: URI versioning (<code>/v2/orders</code>) is unambiguous and cache-friendly; header versioning keeps URLs stable but hides the version from logs. Pair it with semantic versioning of the API: breaking change → major, additive change → minor, fix → patch.`),
CALL('warn',R`A "minor" release that renames one field is a major release wearing a costume. Let the contract tests decide version bumps, not the roadmap: if any published consumer pact fails, the change is breaking by definition.`)
]);

P(R`The full lifecycle in five beats, exactly as it plays out in a healthy pipeline.`),
H('1. The consumer publishes an expectation'),
P(R`OrderService&#39;s pact requires <code>GET /users/42</code> to return <code>id</code>, <code>name</code>, <code>email</code> — nothing more. It is published to the broker tagged <code>main</code>.`),

LES('m08-when','m08','When E2E is worth the cost',2,6,[
P(R`E2E tests drive the real application the way a user does — browser or app, real services, real data flow. They buy the highest available confidence and charge the highest price: slowest to run, flakiest by construction (every layer can fail for environmental reasons), and hardest to localize when red. The professional question is not "E2E or not" but <b>which journeys are worth insuring</b>.`),
TB(['Test this with E2E when…','Prefer lower levels when…'],[
['The journey is revenue-critical: login, checkout, registration','Logic can be asserted without the UI: pricing, validation, state machines'],
['Many teams&#39; services must cooperate for one outcome','One team owns the whole behavior'],
['The client itself holds logic (offline, optimistic UI)','The seam is a documented API — use contract tests'],
['You must prove the deployment as a whole (smoke E2E)','You are "testing the CSS" of a server-rendered page']]),
P(R`A mature suite keeps E2E counts in single or double digits: a smoke journey per critical flow, run after deploy, plus nightly full journeys. The distribution argument is the testing pyramid from Module 02 — this is where its cost column becomes real money.`),

]);

LES('m09-why','m09','Why coverage is not enough',3,7,[
P(R`Code coverage measures which lines your tests executed. It says nothing about what the tests <b>asserted</b>. A test can execute every branch and verify nothing; a suite can hold 100% line coverage and let half the logic be wrong. The failure coverage cannot see is the difference between "the code ran" and "the code was checked".`),
CODE('java',R`
// 100% line coverage. Assertion strength: zero.
@Test
void checkoutWorks() {
  Checkout c = new Checkout(new InMemoryCatalog());
  c.addToCart("book");
  c.placeOrder();          // executed -> line covered
  c.placeOrder();          // executed again -> branch covered
}
// No assert. If placeOrder() computes the wrong total,
// this suite stays green while customers are overcharged.`),
P(R`Mutation testing closes that gap by testing the tests. It makes small, mechanical changes to your code — mutants — and runs the suite against each. If tests fail, the mutant is <b>killed</b>: the tests really guard that behavior. If the suite stays green, the mutant <b>survived</b>: a hole in your assertions. The surviving mutants are a prioritized list of exactly where your suite is weak.`),
CALL('note',R`Think of mutation testing as an adversarial reviewer who edits your logic in tiny ways and asks: "would anyone notice?" Coverage asks "did you visit this code?" — mutation asks "did the visit matter?"`)
]);
LES('m09-operators','m09','Mutation operators',3,8,[
P(R`Every mutation engine ships a catalog of operators. Knowing the families by heart makes surviving mutants instantly readable.`),
TB(['Operator family','Original','Mutant','What it probes'],[
['Conditional boundary','<code>age &gt;= 18</code>','<code>age &gt; 18</code>','Boundary-value tests at the edge'],
['Negate conditionals','<code>if (a == b)</code>','<code>if (a != b)</code>','Any meaningful test of the branch'],
['Arithmetic','<code>total - discount</code>','<code>total + discount</code>','Value assertions on results'],
['Return values','<code>return true</code>','<code>return false</code>','Does anyone assert this outcome?'],
['Void method calls','<code>audit.log(event)</code>','(removed)','Do you verify required side effects?'],
['Constant replacement','<code>0.10</code>','<code>0.20</code>','Magic numbers under assertions'],
['Argument replacement','<code>notify(user)</code>','<code>notify(null)</code>','Robustness and interaction tests']]),
H('How a run works'),
UL([R`<b>1. Generate</b>: the engine (PIT on JVM bytecode, Stryker on JS/TS via instrumented copies, mutmut on Python source) produces mutants — typically hundreds per thousand lines.`,
R`<b>2. Run</b>: for each mutant, the engine first runs the tests that covered the mutated code (coverage data makes this fast), then those tests only.`,
R`<b>3. Classify</b>: tests fail → mutant killed; tests pass → survivor; no covering tests → "no coverage" (a hole coverage also reported).`,
R`<b>4. Score</b>: killed / (total − equivalent) — the mutation score, this module&#39;s formula.`]),
CALL('warn',R`Runtime is the price: a mutation run multiplies test execution by the number of mutants. Mitigations: run on changed code only (PIT&#39;s <code>targetTests</code>, Stryker&#39;s <code>mutate</code> globs), run nightly rather than per-commit, and keep the unit suite fast so the multiplier stays affordable.`)
]);
LES('m09-score','m09','Mutants, kills and the score',3,7,[
P(R`The mutation score is the percentage of killable mutants your suite destroys:`),
CODE('text',R`
Mutation Score = (Killed Mutants / Non-Equivalent Mutants) × 100`),
P(R`Worked example: PIT generates 40 mutants for <code>DiscountPolicy</code>. Your suite kills 31. Eight survivors turn out to include one <b>equivalent mutant</b> — a change that does not alter observable behavior (below), so it cannot be killed by any test. Score = 31 / (40 − 1) × 100 = 79.5%. Compare honestly: line coverage for the same class reads 100%.`),
H('Equivalent mutants'),
P(R`A mutant is equivalent if the mutated program behaves identically for every input. Classic example: mutating <code>x * 2</code> to <code>x + x</code>. No test can kill it because the behavior never differs. Equivalent mutants are the unsolvable tax of mutation testing: engines cannot detect them automatically, so humans review survivors — and every surviving-mutant review queue contains a few "not killable, ignore with reason" verdicts.`),
TB(['','Code coverage','Mutation score'],[
['Measures','Execution of code','Sensitivity of assertions'],
['Can be gamed by','Tests without assertions','Harder: assertions must fail on edits'],
['Cost','Near zero','Test-time × mutant count'],
['Finds','Untested code','Weak tests on tested code'],
['Blind to','Assertion quality, missing checks','Untested code (reported as no-coverage), non-functional behavior']]),
H('Mutation testing vs fuzz testing'),
P(R`They sound alike and do opposite jobs. Mutation testing edits <b>the program</b> and keeps inputs fixed, grading your test suite. Fuzzing keeps the program fixed and generates adversarial <b>inputs</b>, grading the program&#39;s robustness (Module 10). A strong team runs both.`),
CALL('tip',R`Treat the score as a direction, not a KPI. A team that hits an 85% target by deleting tests for hard-to-kill mutants has optimized the number and lost the point. The artifact that matters is the reviewed survivor list: each one either becomes a new test or a documented "equivalent / accepted risk".`)
]);

@Test
void breakerOpensThenRecovers() {
  given(gateway.charge(any())).willThrow(new ConnectException());
  Resilience4jCircuitBreaker breaker = new Resilience4jCircuitBreaker(
      CircuitBreakerConfig.custom()
        .failureRateThreshold(50).slidingWindowSize(4)
        .waitDurationInOpenState(Duration.ofMillis(200)).build());

  for (int i = 0; i &lt; 4; i++) {
    assertThatCode(() -> breaker.call(() -> gateway.charge(Money.eur(100))))
        .isInstanceOf(CallNotPermittedException.class);   // fails fast once OPEN
  }

  given(gateway.charge(any())).willReturn(Receipt.approved("tx-ok"));
  sleep(250);                                             // waitDuration elapsed -> HALF_OPEN

  Receipt r = breaker.call(() -> gateway.charge(Money.eur(100)));
  assertThat(r.transactionId()).isEqualTo("tx-ok");       // probe succeeded -> CLOSED
}`),

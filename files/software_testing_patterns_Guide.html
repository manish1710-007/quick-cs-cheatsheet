{id:'q17',topic:'m05',type:'mcq',q:'Spring Framework 6.2 replaced @MockBean with:',opts:['@MockitoField','@MockitoBean','@SpringMock','@TestProxy'],a:1,why:'@MockitoBean (and @MockitoSpyBean) from org.springframework.test.context.bean.override.mockito replace the deprecated @MockBean in Boot 3.4+.'},
{id:'q18',topic:'m06',type:'mcq',q:'A valid, authenticated user requests another customer&#39;s order. The most defensible response pair:',opts:['200 — they are logged in','403 with the order id in the body','401 — re-authenticate','404 or 403 per documented policy — the point is a check that exists and is tested'],a:3,why:'Both 404 (hide existence) and 403 (deny) are valid policies; the defect is a missing authorization check (IDOR). Pick one, document it, assert it on every sensitive route.'},
{id:'q19',topic:'m06',type:'mcq',q:'401 vs 403, in one line:',opts:['401 = who are you; 403 = you may not','401 = server error; 403 = client error','401 = rate limited; 403 = blocked','They are interchangeable'],a:0,why:'401 means unauthenticated (missing/bad credentials); 403 means authenticated but not permitted. Consumers&#39; re-auth logic depends on the distinction.'},
{id:'q20',topic:'m06',type:'scenario',q:'POST /payments returns 201. The client retries the same request after a network timeout and is charged twice. The missing test asserted:',opts:['Response schema','Idempotency: same Idempotency-Key retried → one charge, same response','Rate limiting','Pagination shape'],a:1,why:'Retries are normal behavior; unsafe POST endpoints need idempotency keys, and the test must assert one side effect and an identical response on retry.'},
{id:'q21',topic:'m07',type:'mcq',q:'In consumer-driven contract testing, who publishes expectations and who verifies?',opts:['Provider publishes; consumers verify','Consumer publishes; the provider verifies against them in its own CI','QA publishes; both verify','The broker generates both'],a:1,why:'The consumer writes expectation tests that produce a pact; the provider replays them against its real application, so breaking changes fail in the provider&#39;s pipeline first.'},
{id:'q22',topic:'m07',type:'mcq',q:'Which provider change is backward compatible for existing consumers?',opts:['Renaming a response field','Removing a required response field','Adding an optional response field','Changing a field type'],a:2,why:'Tolerant readers ignore unknown fields. Renames, removals and type changes all break existing consumers.'},
{id:'q23',topic:'m07',type:'scenario',q:'A provider renames a response field. Provider unit and integration tests stay green. What fails?',opts:['Nothing — the provider is fine','The consumer pact verification in the provider&#39;s CI: the contract no longer matches','The build system','The database'],a:1,why:'Exactly the scenario contract testing exists for: the provider satisfies its own tests, but the published consumer expectations now fail verification before merge.'},
{id:'q24',topic:'m08',type:'mcq',q:'The Page Object Model primarily exists to:',opts:['Make tests run faster','Centralize locators and interactions so UI changes touch one file, not every test','Produce screenshots','Replace assertions'],a:1,why:'Page objects are the UI&#39;s contract with the tests. Tests keep the assertions and the story; the object owns the mechanics.'},
{id:'q25',topic:'m08',type:'bug',q:'Why is this E2E step flaky?',code:R`await page.click('#submit');
await page.waitForTimeout(500);
await expect(page.locator('.order-id'))
  .toHaveText('ORD-1043');`,opts:['Wrong selector','Fixed sleep instead of waiting for the outcome; the toast may take longer than 500 ms under load','Missing screenshot','The test needs a real user'],a:1,why:'Fixed sleeps are hopes, not synchronization. Expect() with auto-waiting (or awaiting the confirmation state) waits exactly as long as needed and fails with context.'},
{id:'q26',topic:'m09',type:'mcq',q:'The mutation score formula is:',opts:['Killed / Total mutants × 100','Killed / Non-equivalent mutants × 100','Survived / Total × 100','Coverage × assertions'],a:1,why:'Equivalent mutants behave identically to the original, so no test can kill them; they are excluded from the denominator.'},
{id:'q27',topic:'m09',type:'bug',q:'This test gives the class 100% line coverage. What does mutation testing reveal?',code:R`@Test
void works() {
  var p = new DiscountPolicy();
  p.rateFor(new Customer(true, 7)); // return value ignored
}`,opts:['Nothing — coverage is 100%','The return-value mutant survives: no test asserts the rate, so changing 0.10 to 0.20 stays green','The code is correct','A missing mock'],a:1,why:'Executed does not mean asserted. Mutation testing edits the return value and watches the suite not notice — the precise hole coverage cannot see.'},
{id:'q28',topic:'m09',type:'mcq',q:'An equivalent mutant is one that:',opts:['Is killed by every test','Produces identical observable behavior to the original program, so no test can kill it','Survives only in CI','Is generated by PIT only'],a:1,why:'E.g. mutating x * 2 to x + x. It cannot be killed by any test; humans must review survivors and document these as not-killable.'},
{id:'q29',topic:'m10',type:'mcq',q:'Property-based testing differs from example-based testing because it:',opts:['Runs only in production','Asserts invariants over generated inputs instead of pinning individual cases','Replaces unit tests entirely','Requires a database'],a:1,why:'You state general laws (round-trips, ordering, idempotence); the framework generates inputs, finds violations, and shrinks them to minimal failing cases.'},
{id:'q30',topic:'m10',type:'scenario',q:'A serialization library must not corrupt data. The strongest property to test:',opts:['serialize(x) returns non-null','deserialize(serialize(x)) equals x for generated x (round-trip)','serialize is fast','The output is valid JSON'],a:1,why:'The round-trip invariant captures the actual requirement: no information loss for any input the generator can build, including empty, unicode and extreme values.'},
{id:'q31',topic:'m11',type:'mcq',q:'The pesticide paradox warns that:',opts:['Pesticide is bad for servers','A static test suite eventually stops finding new bugs; evolve it with new scenarios and exploration','Flaky tests spread','Automation kills manual testing'],a:1,why:'Same cases, same blind spots. Rotate charters, feed exploratory findings back into the automated suite, and prune what stopped teaching.'},
{id:'q32',topic:'m11',type:'mcq',q:'Session-based exploratory testing is built around:',opts:['Scripts written in advance','Charters, timeboxed sessions and debriefs','Random clicking','Full regression automation'],a:1,why:'A charter focuses exploration ("payment retries on unstable networks"), the timebox bounds it, and the debrief converts findings into tests and new charters.'},
{id:'q33',topic:'m12',type:'bug',q:'Latencies (ms): 45, 48, 50, 52, 60, 3800, 4200. Why is reporting the mean misleading?',opts:['It is not misleading','The mean (1179 ms) hides that a small share of users wait ~4 s; P50 = 52 ms while P90+ = 4200 ms','The mean should be higher','Percentiles are illegal'],a:1,why:'Latency is a distribution. Two catastrophically slow requests dominate the experience of real users while the mean looks "okay-ish". Report P50/P95/P99.'},
{id:'q34',topic:'m12',type:'mcq',q:'A soak test primarily looks for:',opts:['Peak throughput','Degradation over time: leaks, unbounded growth, filling disks','SQL injection','Broken access control'],a:1,why:'Steady load over hours/days exposes resource leaks that short load tests never see.'},
{id:'q35',topic:'m13',type:'scenario',q:'User A requests /api/orders/1043 belonging to user B and receives 200. This is:',opts:['A CSRF vulnerability','IDOR — broken access control, the #1 OWASP Top 10 category','An SSRF','Acceptable behavior'],a:1,why:'Insecure Direct Object Reference: authorization checked authentication but not ownership. Encode the authorization matrix as tests on sensitive routes.'},
{id:'q36',topic:'m13',type:'mcq',q:'The primary defense against SQL injection is:',opts:['Escaping quotes manually','Parameterized queries — data never reaches the SQL parser as code','WAF rules only','Hiding error messages'],a:1,why:'Prepared statements and named parameters keep values as data. WAFs and error hiding are defense in depth, not the fix.'},
{id:'q37',topic:'m13',type:'mcq',q:'A webhook feature accepts any URL and fetches it server-side. The attack to test for is:',opts:['XSS','SSRF — the server can be pointed at internal endpoints and cloud metadata','CSRF','Clickjacking'],a:1,why:'SSRF: allowlist scheme and host, deny link-local/loopback/private ranges, validate redirects.'},
{id:'q38',topic:'m14',type:'mcq',q:'At-least-once delivery plus what property yields effectively-once processing?',opts:['Faster consumers','Idempotent consumers — duplicate events produce a single side effect','Bigger partitions','Transactions everywhere'],a:1,why:'Duplicates are normal in at-least-once systems. Deduplicate by event id in the same transaction as the state change.'},
{id:'q39',topic:'m14',type:'scenario',q:'A service commits an order to PostgreSQL, then crashes before publishing OrderPlaced to Kafka. The pattern that prevents the lost event is:',opts:['More retries','The transactional outbox — the event is committed with the state, then relayed','Two-phase commit everywhere','Manual republish'],a:1,why:'Dual writes diverge. The outbox makes "state changed" and "event recorded" one atomic fact; the relay publishes afterwards with retries.'},
{id:'q40',topic:'m14',type:'mcq',q:'A circuit breaker in OPEN state does what?',opts:['Slows all requests','Fails fast without calling the dependency, protecting both sides, then probes with HALF_OPEN','Retries forever','Restart the dependency'],a:1,why:'OPEN = fail fast; after a wait duration, HALF_OPEN lets a probe through: success closes the breaker, failure re-opens it.'},
{id:'q41',topic:'m15',type:'mcq',q:'The builder pattern for test data is preferred over copy-pasted fixture construction because:',opts:['It is faster at runtime','Tests override only what they name, keeping the scenario visible and defaults valid','It is required by JUnit','It removes the need for assertions'],a:1,why:'Builders make every test read as its scenario and keep construction noise out; defaults being valid means failures mean the rule under test, not fixture drift.'},
{id:'q42',topic:'m15',type:'scenario',q:'After enabling parallel test execution, previously green tests fail randomly. First diagnosis:',opts:['CPU is too slow','Shared mutable state between tests — statics, singletons, shared fixtures without isolation','JUnit bug','Parallelism is impossible'],a:1,why:'Concurrency is a test-quality audit: tests that only passed by running alone were already order-dependent. Isolate state per test/worker.'},
{id:'q43',topic:'m16',type:'mcq',q:'"Shift-right" testing means:',opts:['Delay all testing to production','Extend testing into production: post-deploy smoke, canaries, synthetic probes, SLO alerting','Only manual testing','Move CI later'],a:1,why:'Shift-right closes the loop on what only production teaches, using monitoring-as-tests rather than human clicking.'},
{id:'q44',topic:'m16',type:'mcq',q:'In a PR pipeline, the primary purpose of quality gates is to:',opts:['Impress auditors','Give fast, blocking feedback on changes before merge — with visible, explicit waivers when bypassed','Replace code review','Increase build time'],a:1,why:'Gates work while honest: minutes-fast, blocking, and bypassed only through recorded decisions — never silently.'},
{id:'q45',topic:'m17',type:'mcq',q:'100% line coverage guarantees:',opts:['No bugs','The software meets requirements','Only that every line executed — nothing about assertions or correctness','Fast tests'],a:2,why:'Coverage measures execution. Assertion strength is measured by mutation testing; correctness is not measurable by either alone.'},
{id:'q46',topic:'m17',type:'scenario',q:'Management mandates "95% coverage everywhere next quarter". The most likely outcome:',opts:['Much better software','Metric gaming: assertion-free tests, excluded packages, test inflation — coverage rises, protection does not','Faster releases','Nothing changes'],a:1,why:'Goodhart&#39;s law: when a proxy becomes a target it stops measuring. Prefer floors on changed code plus mutation testing and trend review.'},
{id:'q47',topic:'m18',type:'bug',q:'This test fails about 1 run in 20 in CI. Why?',code:R`@Test
void projectionUpdates() {
  kafkaTemplate.send("orders", event);
  Thread.sleep(1000);
  assertThat(projection.find(id)).isPresent();
}`,opts:['Wrong topic','Fixed sleep vs asynchronous processing: when the consumer is slower than 1 s, the assertion runs too early','Kafka is down','Missing @BeforeEach'],a:1,why:'Sleeps are timing guesses. await().atMost(...).untilAsserted(...) polls until the condition holds or fails with the actual state.'},
{id:'q48',topic:'m18',type:'scenario',q:'A test fails only on Mondays. The most likely cause:',opts:['Bad luck','Date/time dependency: timezone, DST or a hardcoded date crossed — inject a fixed Clock','CPU overheating','Test order'],a:1,why:'Time-dependent failures follow calendar patterns. Inject Clock and fix all timezones explicitly; run CI with TZ=UTC.'},
{id:'q49',topic:'m20',type:'mcq',q:'A characterization test is a test that:',opts:['Tests character encoding','Pins the current behavior of legacy code — including its bugs — before refactoring','Measures code quality','Replaces documentation'],a:1,why:'It answers "what does it do today?" so refactoring cannot change behavior by accident. Fixing a pinned bug starts by deliberately changing the test.'},
{id:'q50',topic:'m20',type:'scenario',q:'A team tests private methods via reflection to reach buried logic. The best advice:',opts:['Add more reflection','Test through the public API; if the logic is unreachable, extract it into its own class with a public contract','Make everything public','Delete all tests'],a:1,why:'Private behavior is implementation. Reflection tests break on every refactor; extraction both fixes testability and improves the design (testability pressure = design pressure).'},
{id:'q51',topic:'m19',type:'scenario',q:'A payment charge times out ambiguously (it may have succeeded). The safest tested behavior is:',opts:['Retry the charge immediately','Check the transaction status by idempotency key, then charge or reconcile — never blind-retry an ambiguous payment','Refund everything','Disable payments'],a:1,why:'Blind retries double-charge in at-least-once reality. Recovery must resolve the ambiguity first; the Module 19 case study pins exactly this test.'},
{id:'q52',topic:'m19',type:'mcq',q:'For a distributed tracking projection, duplicate and out-of-order events should be handled by:',opts:['Rejecting all duplicates and late events','Idempotent, sequence-aware projection logic, tested with convergence deadlines','Restarting the consumer','Sorting in Kafka'],a:1,why:'Duplicates and reordering are normal in distributed streams. The projection deduplicates by event id and tolerates late arrivals; tests assert convergence within a deadline.'}

{id:'u2',title:'JavaScript: expected outcomes',level:1,lang:'javascript',

  const at = s.indexOf('@');
  if (at &lt;= 0 || at === s.length - 1) return false;
  const [local, domain] = s.split('@');

         !domain.startsWith('.') &amp;&amp; !domain.endsWith('.');
}`,

/* ================= INTERVIEW ================= */
const INTERVIEW=[
{id:'i1',level:1,cat:'Fundamentals',q:'What is software testing?',a:R`Evaluating a software item to detect differences between expected and actual behavior, and to assess whether requirements are satisfied. Key framing: testing shows the presence of defects, never their absence (Dijkstra); it is a risk-reduction and information activity, not proof of correctness.`},
{id:'i2',level:1,cat:'Fundamentals',q:'Unit testing vs. integration testing?',a:R`Unit tests exercise one small piece (class/function) in isolation with doubled collaborators — milliseconds, precise localization. Integration tests verify real components working together: service + database, producer + broker — seconds, catch seam defects (SQL, mapping, transactions, protocol) that mocks cannot see. Both are needed; the ratio is the pyramid trade-off.`},
{id:'i3',level:1,cat:'Fundamentals',q:'What is a test case?',a:R`A specification of preconditions, inputs, execution steps and expected results, with a unique identifier. The expected result comes from an oracle: specification, invariant, reference behavior or informed judgment. If you cannot state the expected result in advance, it is an experiment, not a test.`},
{id:'i4',level:1,cat:'Fundamentals',q:'What is regression testing?',a:R`Re-running accumulated tests after changes to verify that previously working behavior still works. Strategies: full re-run (releases), selective re-run mapped to changed code (per commit), risk-based prioritization (criticality + change frequency + defect history).`},
{id:'i5',level:1,cat:'Fundamentals',q:'What is mocking?',a:R`Replacing a real collaborator with a pre-programmed double so a test can control inputs and verify interactions. Strictly, a mock carries expectations and fails if the interaction differs; colloquially "mock" covers all test doubles (dummy, stub, spy, mock, fake). Use mocks at process boundaries; prefer real objects or fakes in-process.`},
{id:'i6',level:1,cat:'Fundamentals',q:'What is code coverage?',a:R`The percentage of executable code your tests executed (line, branch, condition, function variants). It finds untested code; it cannot say whether executed code was asserted on — a no-assert test can reach 100%. Pair with mutation testing for assertion strength. Use as a trend and map, not a target.`},
{id:'i7',level:1,cat:'Fundamentals',q:'Smoke vs. sanity testing?',a:R`Smoke: wide and shallow, "is this build stable enough to test/deploy?" — runs on every build. Sanity: narrow and quick, "does this specific fix behave plausibly?" — runs after small changes before deeper regression. Terminology varies by team; agree locally and write the exit criteria down.`},
{id:'i8',level:1,cat:'Fundamentals',q:'Black-box vs. white-box testing?',a:R`Black-box derives tests from specifications only — survives refactors, needs no code access. White-box uses code structure (branch coverage, path analysis) — finds unreachable or untested logic. Grey-box mixes both: spec-driven tests plus coverage feedback about what was missed. Mature suites use coverage as a map for black-box design.`},
{id:'i9',level:2,cat:'Test doubles',q:'Mock vs. stub vs. fake?',a:R`Stub: returns canned answers — supports state testing (assert results). Mock: carries expectations and fails when the interaction differs — supports interaction testing ("charged exactly once"). Fake: a working lightweight implementation (in-memory repository) — real behavior, cheap. The interview trap is calling all three "mocks"; the distinction that matters is state vs. interaction assertions.`},
{id:'i10',level:2,cat:'Design',q:'How does dependency injection improve testability?',a:R`DI makes collaborators explicit parameters instead of hidden constructions, creating seams where tests substitute doubles: inject a fixed Clock for time, a fake repository for persistence, a stub gateway for payments. Untestable code ("new UserCache()" inside the method, static calls) becomes a design conversation — testability pressure and good design are the same pressure.`},
{id:'i11',level:2,cat:'Integration',q:'How do you test database interactions?',a:R`Repository/integration tests against the real engine — Testcontainers PostgreSQL for JVM (H2 hides dialect and constraint differences), temporary databases for pytest, transactions or truncation for cleanup. Assert: persisted state read back through the repository, constraint behavior (unique, check), and rollback semantics. @DataJpaTest gives you transaction rollback per test by default; beware REQUIRES_NEW escaping it.`},
{id:'i12',level:2,cat:'Contract testing',q:'What is contract testing?',a:R`A machine-checked agreement between one consumer and one provider: the consumer publishes the requests it makes and responses it needs (a pact); the provider replays them against its real application in its own CI. Breaking provider changes fail the provider build before merge. It replaces much cross-service E2E: fast, independent, localized failures. Tools: Pact (CDC), Spring Cloud Contract (provider-driven), OpenAPI diffing.`},
{id:'i13',level:2,cat:'Flakiness',q:'What makes a test flaky?',a:R`Non-determinism: timing (sleeps, races), shared mutable state, test order dependence, environment (timezone, locale, network), and contaminated data. The fixes follow the causes: wait for conditions (Awaitility), isolate state per test, inject Clock and randomness, use containers, clean up with verification. Flake rate must be measured; quarantine with owners and deadlines; never normalize re-runs.`},
{id:'i14',level:2,cat:'Test design',q:'What is boundary value analysis?',a:R`Defects cluster at partition edges, so test the exact boundary and both neighbors: for "18–65 inclusive" test 17, 18, 65, 66. Pair it with equivalence partitioning (one representative per behavior class) to keep suites small: partitions give coverage, boundaries give precision.`},
{id:'i15',level:2,cat:'Test design',q:'How do you test exceptions?',a:R`Assert type and message/reason, not just "some exception": AssertJ assertThatThrownBy(...).isInstanceOf(...).hasMessageContaining(...); pytest.raises(ValueError, match=...); expect(() =&gt; ...).toThrow(/pattern/). Asserting bare Exception catches NullPointerExceptions from broken test setup — a false pass.`},
{id:'i16',level:2,cat:'Spring',q:'@WebMvcTest vs. @SpringBootTest?',a:R`@WebMvcTest(X) loads only the MVC slice plus one controller — fast, focused on the HTTP contract (status, headers, JSON, validation), with collaborators as @MockitoBean. @SpringBootTest loads the whole context — wiring, startup, cross-layer behavior; with RANDOM_PORT it tests real HTTP. Use slices for controllers, full boots for integration and smoke; watch context caching (each unique configuration spawns a new context).`},
{id:'i17',level:2,cat:'Architecture',q:'What are test data builders and why use them?',a:R`Builders construct valid domain objects with fluent overrides: OrderBuilder.anOrder().placedBy(vip).build(). Defaults are valid, so tests fail for the reason under test; only relevant dimensions appear in the test, so the scenario reads clearly. They replace copy-pasted fixtures and Object Mothers that grow one method per scenario.`},
{id:'i18',level:2,cat:'Strategy',q:'Explain the testing pyramid trade-offs.',a:R`As scope grows (unit → integration → E2E), tests get slower, flakier and costlier to maintain, but each level catches failures the cheaper ones cannot (wiring, journeys). The pyramid buys confidence at the cheapest level that can detect each failure class. It is a strategic model, not a numeric rule — the trophy shape fits full-stack products with UI-heavy risk. The anti-pattern is the ice-cream cone: manual base, heavy E2E, no units.`},
{id:'i19',level:3,cat:'Coverage',q:'Why is 100% code coverage insufficient?',a:R`Coverage measures execution, not assertion. A test with no asserts can execute every line; a suite can be 100% covered while mutations (changed comparison operators, return values) survive untouched. Demonstrate with mutation testing: line coverage 100%, mutation score 40%. Coverage is for finding untested code; mutation score is for finding weak tests; neither proves correctness. And hard 100% targets fund gaming — excluded packages, assertion-free tests.`},
{id:'i20',level:3,cat:'Mutation testing',q:'Explain mutation testing.',a:R`Make small mechanical changes to code (mutants: boundary flips, arithmetic swaps, return-value changes, removed calls), run the suite against each, and classify: killed (tests failed — real protection) vs. survived (assertion hole). Score = killed / non-equivalent mutants × 100. Equivalent mutants behave identically (x*2 → x+x) and cannot be killed — humans review survivors and document them. Tools: PIT (JVM), Stryker (JS/TS), mutmut (Python). Cost: test time × mutants — run on changed code or nightly.`},
{id:'i21',level:3,cat:'Distributed',q:'How would you test an event-driven microservice?',a:R`Layer it: unit tests for handler logic with doubled broker; integration tests with real Kafka/RabbitMQ via Testcontainers asserting publish/consume; idempotency tests for duplicate delivery; ordering tests per key; retry/DLQ tests driving poison messages; eventual-consistency tests with Awaitility convergence deadlines; and contract tests (message pacts) for schema compatibility with additive evolution. A thin cross-service smoke layer, not wide E2E.`},
{id:'i22',level:3,cat:'Distributed',q:'How would you test eventual consistency?',a:R`Trigger the change, then await the projection&#39;s convergence with a deadline — Awaitility&#39;s untilAsserted polling — and treat the deadline breach as its own diagnostic failure ("projection lagging &gt; 5 s"). Test tolerance: duplicate and out-of-order events must converge too (idempotent, sequence-aware projection). In production, measure convergence lag as an SLO, not an assumption.`},
{id:'i23',level:3,cat:'Distributed',q:'How do you test idempotency?',a:R`Deliver the same event/request twice (same idempotency key or event id) and assert: one side effect, and identical responses. The implementation deduplicates in the same transaction as the state change. Also test the ambiguous path — timeout before confirmation — where recovery resolves status before retrying, so "eventually once" without double-charge.`},
{id:'i24',level:3,cat:'Distributed',q:'How do you handle distributed transaction failures in tests?',a:R`Model them as sagas with compensations, and test each failure step: payment fails → reservation released, order marked FAILED, OrderFailed event emitted — asserted in reverse order with Awaitility. Test crash-recovery mid-saga (resume or compensate, never stall). The transactional outbox gets its own invariant test: committed state without its event is impossible, broker-down events park and converge after recovery. 2PC is discussed as the strong-but-blocking alternative most systems avoid.`},
{id:'i25',level:3,cat:'Architecture',q:'How would you design a scalable test automation framework?',a:R`Layered: runners (JUnit/pytest/Vitest), domain builders and fixtures, clients/page objects, assertions, configuration, reporting. Principles: tests express intent and hide mechanics; defaults valid; failures self-diagnosing (traces, artifacts). Parallelism with per-worker isolation (schemas, unique data); CI stages split fast/slow (PR vs nightly); flake detection with quarantine policy; Allure/Surefire reporting with trend metrics. Deliberately boring: avoid deep inheritance and annotation magic — the framework is a product whose users are your teammates.`},
{id:'i26',level:3,cat:'Mutation testing',q:'What are equivalent mutants and how do you handle them?',a:R`Mutants that produce behavior identical to the original for every input (x*2 → x+x; some boundary flips when both sides return the same value). No test can kill them, so they inflate the survivor count unfairly. Handling: human review of survivors; each verdict is "add a test", "equivalent — document why", or "dead code — delete". This review queue is the actual work product of mutation testing.`},
{id:'i27',level:3,cat:'Contract testing',q:'Contract testing vs. end-to-end testing for microservices?',a:R`E2E proves a journey works today in one shared environment: slow, brittle, worst localization, and it only covers deployed combinations. Contract tests prove each consumer-provider pair stays compatible, run independently in both teams&#39; CI in seconds, and catch breaking changes before merge. Use contracts for compatibility, thin E2E for a few critical journeys, and integration tests inside each service for its own seams.`},
{id:'i28',level:3,cat:'Chaos',q:'How do you practice chaos engineering safely?',a:R`Hypothesis first ("if payments is unreachable 30 s, checkout completes within 60 s"), minimized blast radius (staging before production, one dependency at a time), guardrails that auto-abort on error-rate or latency breach, and full recording of what was injected and what happened. Production chaos only after observability and rollback are solid. The output is a learned, fixed weakness — not a random fire drill.`},
{id:'i29',level:3,cat:'Advanced techniques',q:'What is property-based testing and when does it pay off?',a:R`Declare invariants true for all valid inputs (round-trips, ordering, idempotence, conservation) and let a generator produce inputs, with shrinking of failures to minimal cases. Pays off for parsers, serialization, financial arithmetic, collections, state machines — anything with an algebraic law. Not for one-shot orchestration where interactions are the requirement. Tools: jqwik, Hypothesis, fast-check.`},
{id:'i30',level:3,cat:'Metrics',q:'Which testing metrics do you actually track, and how do you avoid gaming them?',a:R`A panel, never a single number: mutation score (assertion strength), execution time (suite health), flaky rate (trust), defect escape rate, MTTD/MTTR (feedback), maintenance cost. Anti-gaming: floors on changed code rather than whole-repo targets, mutation testing to keep coverage honest, trends reviewed by humans in retrospectives. Goodhart&#39;s law applies to every one of them — soft targets, visible trends, human interpretation.`},
{id:'i31',level:2,cat:'Coding challenge',q:'Write unit tests for a calculator (add/subtract/multiply/divide).',a:R`The trap is testing only happy paths. Expected shape: parameterized happy cases; division by zero → ArithmeticException with message; boundary values (Integer.MAX_VALUE overflow — document checked vs wrapping); null arguments → NPE or documented policy. Division by zero and overflow separate junior from mid answers.`},
{id:'i32',level:1,cat:'Coding challenge',q:'Test an email validation function.',a:R`Equivalence partitions: valid (a@b.c), missing @, empty local part, empty domain, no TLD, trailing dot, empty string, non-string input. Boundaries: length limits. Pin implementation-specific choices (does it accept a@b@c?). Use parameterized tests; assert both accept and reject lists exactly.`},
{id:'i33',level:3,cat:'Coding challenge',q:'Test a payment service.',a:R`Cases: approved charge (receipt + persisted transaction), declined (order state per contract, no phantom rows), timeout (ambiguous — resolve status before retry; never double-charge), retry with same idempotency key (one charge, same receipt), refund exceeding capture (rejected), concurrent same-key requests (exactly one outcome). Mock the gateway at the boundary with fault injection; persist against real storage.`},
{id:'i34',level:2,cat:'Coding challenge',q:'Mock a repository using Mockito.',a:R`given(repo.findById(42L)).willReturn(Optional.of(user)); act; verify interaction only if contractual (times(1) on save); capture arguments with ArgumentCaptor and assert mapped fields. Strict stubbing: unused stubs fail the test (a feature). Verify assertions on results, not call shapes — over-verification couples to implementation.`},
{id:'i35',level:2,cat:'Coding challenge',q:'Test a Spring Boot REST controller.',a:R`@WebMvcTest(OrdersController.class) with @MockitoBean service; MockMvc perform + andExpect: status, content type, jsonPath fields, Location header on 201, validation errors as Problem Details (400/422), 404 for missing, 401/403 paths with security. Cover happy + negative + contract details; use RANDOM_PORT + real HTTP for the error-path suite if filters matter.`},
{id:'i36',level:2,cat:'Coding challenge',q:'Test a PostgreSQL repository.',a:R`@DataJpaTest + Testcontainers PostgreSQL (@ServiceConnection): save and read back (mapping round-trip), constraint enforcement (unique, check) expecting DataIntegrityViolationException, query behavior at boundaries (pagination edges), transaction rollback on failure (nothing persists). Cleanup via rollback per test; explicit truncation for REQUIRES_NEW paths.`},
{id:'i37',level:2,cat:'Coding challenge',q:'Identify missing boundary cases in a suite.',a:R`Method: list every comparison and partition; map each to present tests; the gaps are the answer. Typical finds: off-by-one neighbors untested, zero/empty untested, null untested, max-length untested, timezone edges, concurrent access. Deliver as a table: boundary, expected, existing coverage, needed test.`},
{id:'i38',level:3,cat:'Coding challenge',q:'Improve a weak test suite.',a:R`Diagnose first: assertion-free tests, magic numbers, sleeps, mock echo (stub compared to itself), no negative paths, order dependence. Then: make each test assert exact observable outcomes; parameterize duplicated cases; replace sleeps with condition waits; push integration assertions onto real components; add the negative and boundary cases from the failure-mode table. Verify improvement with mutation testing — survivors should fall.`},
{id:'i39',level:3,cat:'Coding challenge',q:'Kill a surviving mutation.',a:R`Read the mutant: which behavior changed? If the change is observable and no test failed, the suite lacks an assertion on that behavior (or the branch is unreachable = dead code). Add the minimal test that asserts the affected outcome at the relevant input (often the boundary). If the mutant is equivalent (behavior identical for all inputs), document it as such with the reasoning.`},
{id:'i40',level:3,cat:'Coding challenge',q:'Design a contract test for two microservices.',a:R`Consumer (OrderService) writes a Pact test: given "user 42 active", upon GET /users/42 expect 200 with id/name/email (types matched, semantic values exact). The pact file publishes to a broker. Provider (UserApi) runs verification replaying the interaction against its real app with @State seeding. Test the breaking scenario: provider renames email → verification fails in provider CI → fix by compatibility (keep field, deprecate, version). Mention message pacts for events.`}

{id:'r-formulas',t:'Testing formulas (and their honest limits)',items:[
'<b>Mutation score</b> = killed mutants / non-equivalent mutants × 100 — measures assertion strength; equivalent mutants are excluded because no test can kill them',
'<b>Coverage</b> = covered items / total measurable items × 100 — measures execution only; a no-assert test can score 100%',
'<b>Defect density</b> = number of defects / size of software (module, KLOC) — normalize per release and per module; compare trends, not teams',
'<b>Pass rate</b> = passed tests / executed tests × 100 — a dropping pass rate with new code is normal; a flapping pass rate is flakiness, not quality',
'Limit of all four: they are proxies. Coverage finds untested code, mutation finds weak tests, density and pass rate describe history — none of them predicts the next defect by itself. Read them as a panel with trends and human interpretation.']},
{id:'r-terms',t:'Testing terminology',items:[
'<b>Test case</b> — preconditions + inputs + steps + expected result (the oracle), uniquely identified',
'<b>Test suite</b> — a collection of test cases run as a unit',
'<b>Test fixture</b> — the fixed state a test runs in (seeded data, objects, containers)',
'<b>Test oracle</b> — the source of truth for "is this result correct?"',
'<b>Assertion</b> — a check that fails the test when actual ≠ expected',
'<b>Test double</b> — any stand-in for a real collaborator (dummy, stub, spy, mock, fake)',
'<b>Mock</b> — a double pre-programmed with interaction expectations',
'<b>Stub</b> — a double returning canned answers',
'<b>Fake</b> — a working lightweight implementation',
'<b>Regression</b> — previously working behavior that broke',
'<b>Mutant</b> — a small mechanical edit of the program under mutation testing',
'<b>Flaky test</b> — a test with non-deterministic outcome (same inputs, different results)',
'<b>Test coverage</b> — proportion of executable code executed by tests',
'<b>Contract</b> — the agreed interface between consumer and provider',
'<b>Test isolation</b> — tests neither affect nor depend on each other',
'<b>Determinism</b> — same inputs and state, same result, every run',
'<b>Idempotency</b> — repeating the operation has the effect of doing it once',
'<b>At-least-once delivery</b> — messages arrive at least once; duplicates are normal',
'<b>Eventual consistency</b> — replicas converge after a delay, tested with convergence deadlines',
'<b>Pesticide paradox</b> — a static suite stops finding new bugs; evolve it']},
{id:'r-junit',t:'JUnit 5 annotations',items:[

{id:'r-design',t:'Test design checklist (before you write the test)',items:[
'Name the behavior as a specification, not as a method call',
'Choose the technique: partitions, boundaries, states, properties, or matrix (authorization)',
'Positive path, then negative, then boundaries and neighbors',
'Invalid input: type, shape, length, encoding, missing fields',
'Security: authentication, authorization, ownership (IDOR), injection payloads',
'Concurrency: simultaneous access, idempotent retry, race windows',
'State: what must be true afterwards — persisted, emitted, audited',
'Time: expiry, timeouts, timezone edges — inject the Clock',
'Failure of every external dependency: reject, timeout, 5xx, duplicate delivery',
'One logical assertion per test; expected result stated before running']},
{id:'r-review',t:'Test review checklist (in pull requests)',items:[
'Does the test name read as a specification?',
'Arrange-Act-Assert visible; act is exactly one call',
'Assertions check observable outcomes, not call shapes',
'No sleeps, no real network, no shared state, no random without a seed',
'Negative and boundary cases for new rules — not just the happy path',
'Bug fix arrives with the failing test first',
'New tests at the cheapest level that can catch the failure',
'Fixtures minimal and meaning visible (no mystery guest)',
'Deleted or updated stale tests; no commented-out tests',
'Runtime cost justified: suite budget is a shared resource']},
{id:'r-flaky',t:'Flaky test triage checklist',items:[
'Reproduce: solo, in suite, repeated (@RepeatedTest(100)), under CI conditions',
'Pattern-match: intermittent → race; only-in-CI → environment; Mondays → timezones; parallel-only → shared state',
'Isolate: shrink the suite, delete collaborators, capture seeds and order',
'Hypothesize in one falsifiable sentence; instrument to confirm',
'Fix the cause: synchronization, isolation, clock injection, cleanup, containerization',
'Add the precondition assertion that would have caught it',
'Quarantine if unfixed today: separate job, ticket, owner, deadline',
'Track the flake rate as a metric with a budget; never normalize re-runs']},
{id:'r-gates',t:'CI quality gates cheat sheet',items:[
'PR: unit + selected integration green in minutes; contracts verified; no new flaky tests',
'PR: branch coverage floor on changed code (60–80% band is common); static analysis clean or explicitly waived',
'Main: full unit + integration; mutation score on changed code above threshold (e.g. 70%)',
'Nightly: full regression + full mutation + performance thresholds + dependency audit',
'Deploy: staging smoke green; canary metrics healthy; automatic rollback on SLO breach',
'Rollback is a deployment too: it gets the same smoke gates (and forward-compatible migrations make it possible)',
'Waivers are written, owned and expiring — never silent',
'Artifacts on failure: reports, traces, screenshots — uploaded with if: always()']},
{id:'r-percentiles',t:'Latency percentiles cheat sheet',items:[
'Report P50 (typical), P95, P99 (tail) — never only the mean',
'Mean hides the tail: [45,48,50,52,60,3800,4200] → mean 1179 ms, P50 52 ms, P90 4200 ms',
'Percentiles are what users experience at that frequency: P99 = one user in a hundred',
'SLOs are testable: k6 thresholds p(95)&lt;400 make latency a gate',
'When p95 rises while CPU is idle → look for waiting: pools, locks, downstream',
'Tail latency usually comes from a few slow paths: retries, GC, cold caches, one slow shard',
'Soak tests watch percentile drift over hours — leaks show up as creeping p99']},
{id:'r-security',t:'Security test checklist (test accounts, staging only)',items:[
'Authorization matrix on sensitive routes: every role × every route, both 404/403 policy pinned',
'IDOR: user A reads/writes user B&#39;s resources → denied',
'All inputs: SQLi payloads, XSS payloads, oversized values, unicode — rejected cleanly',
'Parameterized queries everywhere; no string-concatenated SQL',
'Sessions: fixation (id rotates on login), timeout, server-side logout, cookie flags (Secure, HttpOnly, SameSite)',
'Passwords: bcrypt/argon2id, never plaintext or MD5/SHA-family, policy boundaries tested',
'Rate limits: brute force locked out per account and IP; Retry-After present',
'CSRF tokens on state-changing forms; SameSite asserted',
'URL fetchers: SSRF allowlist blocks link-local, loopback, private ranges',
'Dependency CVEs scanned in CI; secrets never in repo, logs or images']}

function load(){try{const r=localStorage.getItem(KEY);S=Object.assign(DEF(),r?JSON.parse(r):{})}catch(e){S=DEF();memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
const $=(s,r)=> (r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];

const LV=['','Beginner','Intermediate','Advanced'];

const today=()=>dateKey(new Date());
function touch(){const t=today();if(S.streak.last===t)return;const previous=new Date();previous.setHours(12,0,0,0);previous.setDate(previous.getDate()-1);const y=dateKey(previous);S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;save()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function copy(text){const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?'Copied':'Select the text and copy it manually')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copied'),fb)}else fb()}

const les=id=>LESSONS.find(l=>l.id===id);

/* syntax highlighting */
const KW=new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long new package private protected public return short static super switch synchronized this throw throws try void volatile while var record sealed permits yield null true false def lambda from as with pass None True False elif in is not and or async await function let const export type readonly undefined typeof namespace using foreach string decimal bool get set init'.split(' '));
const RE_C=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?[dDfFlL]?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
const RE_P=/(#.*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
function hl(code,lang){
  const re=lang==='python'||lang==='yaml'||lang==='bash'?RE_P:RE_C;
  let out='',last=0,m;
  re.lastIndex=0;
  while((m=re.exec(code))!==null){
    out+=esc(code.slice(last,m.index));
    const s=m[0];
    if(m[1])out+=`<span class="t-c">${esc(s)}</span>`;
    else if(m[2])out+=`<span class="t-s">${esc(s)}</span>`;
    else if(m[3])out+=`<span class="t-n">${esc(s)}</span>`;
    else if(m[4])out+=`<span class="t-a">${esc(s)}</span>`;
    else out+=KW.has(s)?`<span class="t-k">${esc(s)}</span>`:(/^[A-Z]/.test(s)?`<span class="t-t">${esc(s)}</span>`:esc(s));
    last=m.index+s.length;
  }
  return out+esc(code.slice(last));
}
function diff(a,b){const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const o=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){o.push([' ',A[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push(['-',A[i++]]);else o.push(['+',B[j++]])}
  while(i<n)o.push(['-',A[i++]]);while(j<m)o.push(['+',B[j++]]);return o}
const CODES=[];
function codeBlock(lang,code,opts){opts=opts||{};const ci=CODES.push(code)-1;
  return `<div class="code"><div class="ch"><span>${esc(lang)}</span><span class="sp"></span><button class="btn sm" data-act="copy" data-ci="${ci}">Copy</button>${opts.noSave?'':`<button class="btn sm" data-act="save" data-ci="${ci}" data-lang="${esc(lang)}">Save</button>`}</div><pre><code>${hl(code,lang)}</code></pre></div>`}
const CMPS={};let cmpN=0;

  return hl(v==='bad'?c.bad:c.good,lang)}

V.mutlab=()=>{let cur='discount';const st=S.lab.mut||(S.lab.mut={tried:0,killed:0,seen:{}});
  main.innerHTML=crumbs([['Mutation lab']])+`<h1>Mutation lab</h1><p class="lede">Pick a function, pick a mutation operator, and run the suite against the mutant. Killed means a test failed and the suite really guards that behavior; survived means a hole in the assertions. This is a faithful simulation computed in your browser — it is not PIT or Stryker running.</p>
  <div class="row">${MUTX.map(f=>`<button class="btn ${f.id===cur?'pri':''}" data-f="${f.id}">${f.title}</button>`).join('')}</div>
  <p id="mutscore" style="font:12px var(--f-mono);color:var(--dim);margin:10px 0 0">lab score: ${st.killed}/${st.tried} mutants killed ${st.tried?'('+pct(st.killed,st.tried)+'%)':''}</p><div id="mbody"></div>`;
  const draw=()=>{const f=MUTX.find(x=>x.id===cur);const impl=MUTIMPL[cur];
    const rows=f.tests.concat(f.strong.map(t=>({...t,strong:true}))).map(t=>`<tr${t.strong?' style="opacity:.55"':''}><td>${t.name}</td><td>(${t.args.join(', ')}) → ${t.expect}</td><td>${t.strong?'strong suite only':'weak suite'}</td></tr>`).join('');
    $('#mbody').innerHTML=`<div class="card" style="margin:14px 0"><h2 style="margin:0 0 8px">Original</h2>${codeBlock('java',f.java,{noSave:true})}
    <h3>Test suite</h3><div class="tw"><table><thead><tr><th>Test</th><th>Input → expected</th><th>Runs in</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>Choose a mutant</h3><div class="res">${f.mutants.map(m=>`<button class="card" style="text-align:left;${st.seen[m.id]?'border-color:'+(st.seen[m.id]==='killed'?'var(--good)':'var(--bad)'):''}" data-mu="${m.id}"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-mono);font-size:13px">${m.label}</b>${st.seen[m.id]?`<span class="tag ${st.seen[m.id]==='killed'?'ok':'no'}">${st.seen[m.id]}</span>`:''}</div></button>`).join('')}</div></div><div id="run"></div>`;
    $$('[data-f]').forEach(b=>b.onclick=()=>{cur=b.dataset.f;$$('[data-f]').forEach(x=>x.classList.toggle('pri',x===b));draw()});
    $$('[data-mu]').forEach(b=>b.onclick=()=>{const m=f.mutants.find(x=>x.id===b.dataset.mu);const mi=impl.mutants[m.id];
      const runTests=(suite)=>suite.map(t=>({t,got:mi(...t.args)}));
      const weak=runTests(f.tests),strongAll=runTests(f.tests.concat(f.strong));
      const killedW=weak.some(r=>Math.abs(r.got-r.t.expect)>1e-9);
      const killedS=strongAll.some(r=>Math.abs(r.got-r.t.expect)>1e-9);
      if(!st.seen[m.id]){st.tried++;if(killedS)st.killed++;st.seen[m.id]=killedS?'killed':'survived';touch();save();const ms=$('#mutscore');if(ms)ms.textContent='lab score: '+st.killed+'/'+st.tried+' mutants killed ('+pct(st.killed,st.tried)+'%)'}
      const rowHtml=(res)=>res.map(r=>{const bad=Math.abs(r.got-r.t.expect)>1e-9;return `<tr><td>${r.t.name}</td><td>${r.t.expect}</td><td style="color:${bad?'var(--bad)':'var(--good)'}">${r.got}</td><td>${bad?'FAIL':'pass'}</td></tr>`}).join('');

      <h3>Weak suite vs mutant</h3><div class="tw"><table><thead><tr><th>Test</th><th>Expected</th><th>Mutant returned</th><th></th></tr></thead><tbody>${rowHtml(weak)}</tbody></table></div>

      </div>`;

    $('#verdict').innerHTML=`<div class="card"><h2 style="margin:0 0 8px">${breaking.length?'Verification FAILED — breaking changes':'Verification PASSED — compatible'}</h2>

    $('#ex').scrollIntoView({behavior:'smooth'})})};
V.quiz=()=>{
  main.innerHTML=crumbs([['Knowledge checks']])+`<h1>Knowledge checks</h1><p class="lede">${QUIZ.length} questions: multiple choice, true/false, find-the-bug, scenarios and short coding exercises with immediate feedback and explanations. The revision round re-asks the questions you previously got wrong.</p>
  <div class="card row"><div class="seg" id="qmode" role="group" aria-label="Quiz mode"><button aria-pressed="true" data-mode="new">New round</button><button aria-pressed="false" data-mode="rev">Revision round</button></div></div>
  <div id="setup"></div><div id="run"></div>`;
  const setup=()=>{$('#setup').innerHTML=`<div class="card row"><label for="qt">Topic</label><select id="qt" class="btn"><option value="all">All modules</option>${MODS.filter(m=>QUIZ.some(q=>q.topic===m.id)).map(m=>`<option value="${m.id}">${m.n} ${m.title}</option>`).join('')}</select><label for="qn">Questions</label><select id="qn" class="btn"><option>5</option><option selected>10</option><option>20</option></select><button class="btn pri" id="go">Start</button></div>`;$('#go').onclick=()=>run()};
  const setupRev=()=>{const wrong=QUIZ.filter(q=>S.qw[q.id]);
    $('#setup').innerHTML=wrong.length?`<div class="card row"><span>${wrong.length} question${wrong.length>1?'s':''} waiting for revenge.</span><button class="btn pri" id="go">Start revision round</button></div>`:`<div class="card"><p>No wrong answers recorded yet — answer some questions first, and anything you miss will collect here. Answering a revision question correctly removes it from the list.</p></div>`;
    const g=$('#go');if(g)g.onclick=()=>run(wrong)};
  const run=(pool)=>{const rev=!!pool;let list=pool?shuffle(pool).slice(0,20):null;
    const start=()=>{if(!list){const t=$('#qt').value,n=+$('#qn').value;list=shuffle(QUIZ.filter(q=>t==='all'||q.topic===t)).slice(0,n)}
      if(!list.length)return;let i=0,sc=0;const wrong=[];
      const step=()=>{if(i>=list.length){
        $('#run').innerHTML=`<div class="card"><h2 style="margin-top:0">${rev?'Revision round':'Round'} result: ${sc}/${list.length} (${pct(sc,list.length)}%)</h2>${wrong.length?`<h3>Review these</h3><ul class="b">${wrong.map(q=>`<li>${strip(q.q)} <a href="#lesson-${mLessons(q.topic)[0].id}">Open module ${mod(q.topic).n}</a></li>`).join('')}</ul>`:'<p>No misses. Nice work.</p>'}<div class="row"><button class="btn pri" id="again">New round</button><a class="btn" href="#reference">Study the reference</a></div></div>`;
        $('#again').onclick=()=>{list=null;start()};return}
        const q=list[i];$('#run').innerHTML=`<p style="font:12px var(--f-mono);color:var(--dim)">Question ${i+1} of ${list.length} · score ${sc}${rev?' · revision':''}</p>`+qHtml(q)+'<div class="row"><button class="btn pri" id="nxt" hidden>'+(i===list.length-1?'See results':'Next question')+'</button></div>';
        mountQ($('#run .q'),q,ok=>{record(ok);if(ok)sc++;else wrong.push(q);$('#nxt').hidden=false;$('#nxt').focus()});
        $('#nxt').onclick=()=>{i++;step()}};
      step()};
    start()};
  $$('#qmode button').forEach(b=>b.onclick=()=>{$$('#qmode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#run').innerHTML='';(b.dataset.mode==='rev'?setupRev:setup)()});
  setup()};
V.interview=()=>{const cats=[...new Set(INTERVIEW.map(q=>q.cat))];
  main.innerHTML=crumbs([['Interview arena']])+`<h1>Interview preparation arena</h1><p class="lede">${INTERVIEW.length} questions with model answers, from beginner to advanced, covering fundamentals, test doubles, integration, contracts, flakiness, mutation testing, distributed systems, metrics and practical coding challenges. Use mock mode for a randomized run with a summary.</p>
  <div class="row"><div class="seg"><button aria-pressed="true" id="tb">Question bank</button><button aria-pressed="false" id="tm">Mock interview</button></div></div><div id="pane"></div>`;
  const bank=()=>{$('#pane').innerHTML=`<div class="row" style="margin:12px 0"><label for="lf">Level</label><select id="lf" class="btn"><option value="0">All</option><option value="1">Beginner</option><option value="2">Intermediate</option><option value="3">Advanced</option></select><label for="cf">Topic</label><select id="cf" class="btn"><option value="">All</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="ql"></div>`;
    const f=()=>{const l=+$('#lf').value,c=$('#cf').value;$('#ql').innerHTML=INTERVIEW.filter(q=>(!l||q.level===l)&&(!c||q.cat===c)).map(q=>`<details class="acc"><summary><span>${q.q}<br>${lvTag(q.level)} <span class="tag">${q.cat}</span></span></summary><div><p>${q.a}</p></div></details>`).join('')};$('#lf').onchange=f;$('#cf').onchange=f;f()};
  const mock=()=>{$('#pane').innerHTML=`<div class="card" style="margin-top:12px"><p>Eight random questions. Answer in your own words (typing is optional), reveal the model answer, then rate yourself honestly.</p><button class="btn pri" id="ms">Start mock interview</button></div><div id="mr"></div>`;
    $('#ms').onclick=()=>{const qs=shuffle(INTERVIEW).slice(0,8);let i=0;const rate=[];
      const step=()=>{if(i>=qs.length){const tot=rate.reduce((a,b)=>a+b.r,0),mx=qs.length*2;const weak=rate.filter(x=>x.r<2).map(x=>x.q.cat);const wc={};weak.forEach(w=>wc[w]=(wc[w]||0)+1);
        $('#mr').innerHTML=`<div class="card"><h2 style="margin-top:0">Summary: ${pct(tot,mx)}%</h2><p>${tot} of ${mx} self-rated points. ${weak.length?'Topics to revisit: '+Object.entries(wc).map(([k,v])=>`${k} (${v})`).join(', ')+'.':'All answers rated solid.'}</p><ul class="b">${rate.map(x=>`<li>${x.r===2?'Solid':x.r===1?'Partial':'Missed'}: ${x.q.q}</li>`).join('')}</ul><button class="btn pri" id="ms2">Try again</button></div>`;$('#ms2').onclick=()=>$('#ms').click();touch();save();return}
        const q=qs[i];$('#mr').innerHTML=`<div class="q"><div class="qt">Question ${i+1} of ${qs.length} · ${q.cat} · ${LV[q.level]}</div><p style="font-size:17px">${q.q}</p><textarea class="ans" aria-label="Your answer" placeholder="Answer out loud or type it here"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="rv">Reveal model answer</button></div><div id="mans"></div></div>`;
        $('#rv').onclick=()=>{$('#rv').disabled=true;$('#mans').innerHTML=`<div class="fb"><p>${q.a}</p><div class="row"><span>Rate your answer:</span><button class="btn sm" data-r="2">Solid</button><button class="btn sm" data-r="1">Partial</button><button class="btn sm" data-r="0">Missed</button></div></div>`;$$('[data-r]').forEach(b=>b.onclick=()=>{rate.push({q,r:+b.dataset.r});i++;step()})}};step()}};
  $('#tb').onclick=()=>{$('#tb').setAttribute('aria-pressed','true');$('#tm').setAttribute('aria-pressed','false');bank()};$('#tm').onclick=()=>{$('#tm').setAttribute('aria-pressed','true');$('#tb').setAttribute('aria-pressed','false');mock()};bank()};
V.reference=()=>{
  const cards=REF.map(r=>({t:r.t,html:`<ul class="b">${r.items.map(i=>`<li>${i}</li>`).join('')}</ul>`,txt:r.t+'\n'+r.items.map(i=>'- '+strip(i)).join('\n')}));
  main.innerHTML=crumbs([['Quick reference']])+`<h1>Quick reference</h1><p class="lede">Formulas with honest limits, terminology, annotation references, commands and checklists. Filter by any word.</p><label class="search" style="max-width:420px;margin-bottom:14px"><span class="sr">Filter reference</span>⌕<input id="rf" type="search" placeholder="Filter, e.g. mockito, percentile, idempotency"></label><div id="rl"></div>`;
  const draw=q=>{const shown=cards.filter(c=>!q||strip(c.t+' '+c.html).toLowerCase().includes(q));
    $('#rl').innerHTML=shown.map((c,i)=>`<section class="card" style="margin:12px 0"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${c.t}</h2><button class="btn sm" data-cp="${cards.indexOf(c)}">Copy</button></div>${c.html}</section>`).join('')||'<p>No matches. Try a broader term.</p>';
    $$('[data-cp]').forEach(b=>b.onclick=()=>copy(cards[+b.dataset.cp].txt))};
  $('#rf').oninput=e=>draw(e.target.value.toLowerCase().trim());draw('')};
V.resources=()=>{const grp=t=>t==='Book'?'Books':t==='Research'?'Research':t==='Article'?'Articles':t==='Industry guide'?'Industry guides':['Official documentation'].includes(t)?'Official documentation':'Community material';
  const order=['Official documentation','Industry guides','Articles','Books','Research','Community material'];
  main.innerHTML=crumbs([['Resources']])+`<h1>Additional learning resources</h1><p class="lede">Categories are labeled so you can tell official documentation from books, articles and community material. Link status: <b>Link checked</b> means the page was opened and its title confirmed while this guide was built. <b>Link not checked</b> means the URL is the widely published address but was not opened for a check from the build environment. Books without a link have none listed because a link could not be confirmed; find them through your library or publisher.</p>`+order.map(g=>{const rs=RESOURCES.filter(r=>grp(r.type)===g);return rs.length?`<h2>${g}</h2><div class="grid">${rs.map(r=>`<article class="card"><h3 style="margin:0 0 4px">${r.t}</h3><p style="color:var(--dim);font-size:13px;margin:0 0 8px">${r.by}</p><p style="font-size:14px">${r.d}</p><div class="row"><span class="tag">${r.type}</span><span class="tag">${r.lvl}</span>${r.url?`<span class="tag ${r.ver?'ok':'no'}">${r.ver?'Link checked':'Link not checked'}</span>`:'<span class="tag no">No link</span>'}</div>${r.url?`<p style="margin:10px 0 0"><a href="${r.url}" target="_blank" rel="noopener noreferrer">Open resource ↗</a></p>`:''}</article>`).join('')}</div>`:''}).join('')+
  `<div class="notice">This guide is part of the Cyber Formula Library (Formula DB), category 09 — Software Engineering &amp; Professional Practices. Related guides in the series: Java Mastery, Java Concurrency, Spring Boot Mastery, PostgreSQL Mastery, Redis, RabbitMQ &amp; Kafka, Distributed Systems, Microservices, Clean Code Mastery, DevOps &amp; CI/CD, Observability.</div>`};
V.search=()=>{const q=($('#q').value||'').trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);
  const res=terms.length?INDEX.map(e=>{const hay=(e.t+' '+e.x).toLowerCase();if(!terms.every(t=>hay.includes(t)))return null;let sc=0;terms.forEach(t=>{if(e.t.toLowerCase().includes(t))sc+=5;sc+=Math.min(3,hay.split(t).length-1)});return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40):[];
  const snip=e=>{const x=e.x,l=x.toLowerCase(),k=l.indexOf(terms[0]);const s=Math.max(0,k-50);let t=esc(x.slice(s,s+160));terms.forEach(w=>{t=t.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return (s>0?'…':'')+t+'…'};
  main.innerHTML=crumbs([['Search']])+`<h1>Search</h1><p class="lede">${terms.length?res.length+' result'+(res.length===1?'':'s')+' for “'+esc(q)+'”':'Type in the search box above to search lessons, labs, references, interview questions and resources.'}</p><div class="res">${res.map(r=>`<a class="card" style="text-decoration:none;color:inherit" href="${r.e.href}"><div class="row"><span class="tag">${r.e.ty}</span><span style="color:var(--dim);font-size:12px">${r.e.sub}</span></div><h3 style="margin:6px 0 4px">${r.e.t}</h3><p style="font-size:13px;color:var(--dim);margin:0">${snip(r.e)}</p></a>`).join('')}</div>`};
/* ---- router ---- */
function route(){const r=(location.hash||'#home').slice(1)||'home';side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  if(r.startsWith('lesson-'))V.lesson(r.slice(7));else if(V[r]&&r!=='lesson')V[r]();else V.home();
  navState(V[r]||r.startsWith('lesson-')?r:'home');window.scrollTo(0,0);main.focus({preventScroll:true});document.title=(r.startsWith('lesson-')&&les(r.slice(7))?les(r.slice(7)).title+' · ':'')+'Software Testing Patterns'}
/* ---- events ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='copy')copy(CODES[+b.dataset.ci]);
  else if(a==='save'){const code=CODES[+b.dataset.ci];if(!S.snips.some(s=>s.code===code)){S.snips.unshift({code,lang:b.dataset.lang,from:(location.hash.startsWith('#lesson-')&&les(location.hash.slice(8))||{}).title});S.snips=S.snips.slice(0,30);save()}toast('Saved to dashboard')}
  else if(a==='cmp'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=b.dataset.v;s.dataset.v=v;$$('.seg button',s).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('.cv',s).innerHTML=cmpView(c,v);const lab=b.textContent;$('.vl',s).textContent=c.lang+' · '+lab.toLowerCase()}
  else if(a==='cmpcopy'||a==='cmpsave'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=s.dataset.v,code=v==='bad'?c.bad:c.good;if(a==='cmpcopy')copy(code);else{if(!S.snips.some(x=>x.code===code)){S.snips.unshift({code,lang:c.lang,from:c.title});save()}toast('Saved to dashboard')}}
  else if(a==='snipcopy')copy(S.snips[+b.dataset.i].code);
  else if(a==='snipdel'){S.snips.splice(+b.dataset.i,1);save();V.home()}});
$('#menu').onclick=()=>{const o=side.classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(o))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
document.addEventListener('click',e=>{if(side.classList.contains('open')&&!side.contains(e.target)&&!$('#menu').contains(e.target)){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}});
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'dark';S.theme=cur==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save()};
$('#q').addEventListener('input',e=>{if(e.target.value.trim()){if(location.hash!=='#search')history.replaceState(null,'','#search');V.search();navState('search');window.scrollTo(0,0)}else if(location.hash==='#search'){location.hash='#home'}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();if(location.hash==='#search')location.hash='#home'}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
const up=$('#up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>700),{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('hashchange',()=>{if(location.hash!=='#search')$('#q').value='';route()});
load();if(S.theme)document.documentElement.dataset.theme=S.theme;
buildSide();route();
</script>

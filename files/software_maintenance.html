LES('m09-pattern','m09','The strangler fig pattern',2,9,[
P(R`Martin Fowler named the strangler fig pattern in 2004 after the rainforest vine that grows around a host tree, gradually taking over its light and structure until the tree is no longer needed. Applied to software: build the new system <b>around the edge</b> of the old one, let it grow route by route and capability by capability, and keep both running until the legacy core has nothing left to do — then remove it. The pattern is the honest alternative to the big-bang rewrite, because it replaces the highest-risk event in software (one irreversible cutover) with a sequence of small, reversible ones.`),
H('Why incremental replacement wins'),
TB(['Dimension','Big-bang rewrite','Strangler migration'],[
['Risk shape','One enormous cliff at the end','A staircase of small, reversible steps'],
['Value delivery','Zero until the end','New pieces ship continuously from month one'],
['Learning','Requirements frozen at the start; the spec is always wrong','Each slice teaches the next; requirements can change mid-flight'],
['Rollback','"Re-point DNS at the old system" — which has drifted for two years','Per-slice: route traffic back to the still-running legacy path'],
['Team morale','Death-march famous; the finish line moves','Normal engineering work with a visible scoreboard'],
['The trap','Second-system effect; you rebuild 100% to replace 80%','Scope discipline required — or you strangle nothing and run both forever']]),
H('The anatomy'),
UL([R`<b>The facade</b>: a single entry point in front of both systems — an API gateway, a reverse proxy, or a thin routing service. Callers never know which side served them.`,
R`<b>The routing table</b>: the map of what goes where. Routes migrate one at a time; every route has exactly one owner (old or new) at any moment.`,
R`<b>The increments</b>: new services built to serve the routed capabilities, each one complete enough to own its slice end to end.`,
R`<b>The data strategy</b>: the hard part — Module 10 and Module 11 treat data ownership, dual-writes, CDC and the outbox pattern.`,
R`<b>The scoreboard</b>: traffic percentages, feature-parity checklists, error budgets per route — without measurement you are not migrating, you are decorating.`]),
H('Identifying the boundaries'),
P(R`Strangling works only along real seams. Good first candidates: capabilities with clear user-visible boundaries (notifications, search, reporting), modules with low coupling to the core (few shared tables, few synchronous calls), and high-change areas (where the legacy drag hurts most — check the churn data from Module 04). Bad first candidates: the transactional heart of the system (ordering, payments, inventory) — earn your stripes on the edge before touching the money path.`),
CALL('note',R`The pattern&#39;s deepest advantage is epistemic: a rewrite must be right about the whole system on day one; a strangler must be right about one slice for a few weeks. When the slice goes wrong, you route back and lose days — not the program. This reversibility is why Module 21&#39;s decision framework defaults to incremental migration for any system whose business cannot tolerate a rewrite&#39;s failure modes.`)
]);
LES('m09-routing','m09','Routing, facades and anti-corruption layers',3,9,[
P(R`The facade layer is where the strangler lives or dies. This lesson is the concrete engineering: gateway routes, the anti-corruption layer that keeps legacy models from leaking, and the data synchronization problem that dominates the middle phase of every migration.`),
H('Routing at the gateway'),
CODE('yaml',`
# Spring Cloud Gateway: one route at a time moves to the new service
spring:
  cloud:
    gateway:
      routes:
        - id: orders-legacy
          uri: http://monolith.internal:8080
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestSize
              args: { maxSize: 5000000 }
        - id: notifications-new                    # the first strangled slice
          uri: http://notification-service:8080
          predicates:
            - Path=/api/notifications/**
        - id: search-new
          uri: http://search-service:8080
          predicates:
            - Path=/api/search/**
`),
P(R`Routing decisions can be by path, by header, by percentage of traffic, or by customer segment (internal users first, then a friendly pilot cohort, then everyone). Each route flip is a deployment of configuration, not code — which is what makes the migration reversible at fine granularity.`),
H('The anti-corruption layer'),
P(R`New services must not import the legacy system's data model — not its five-column "customer type flags", not its status strings that mean three things. The <b>anti-corruption layer (ACL)</b> translates at the boundary: legacy shapes come in, domain shapes go out, and the translation is the only code that knows both worlds. The ACL is what lets the new side evolve while the old side stays frozen, and it is where you quarantine the undocumented behaviors you discovered in Module 07 — documented as translation rules, tested like everything else.`),
CODE('java',`
// the new service's clean model
public record CustomerRef(UUID id, LoyaltyTier tier, ContactPreferences contact) {}

// the ACL: the only place that understands the legacy columns
public class LegacyCustomerTranslator {
  public CustomerRef toDomain(LegacyCustomerRow row) {
    // documented legacy quirks live here, with tests:
    //  - isVip2 means post-2019 gold; isVip means pre-2019 gold or platinum
    //  - null email means "billing-only customer, never contact"
    LoyaltyTier tier = row.isVip2() ? GOLD : row.isVip() ? PLATINUM_OR_GOLD : BRONZE;
    return new CustomerRef(row.getUuid(), tier,
        row.getEmail() == null ? ContactPreferences.NONE : ContactPreferences.parse(row.getFlags()));
  }
}
`),
H('Data ownership and synchronization'),
P(R`Until decommissioning, both sides need data the other owns. The three standard strategies, in ascending order of sophistication:`),
TB(['Strategy','How it works','Trade-offs'],[
['Shared database (interim)','Both systems read/write the legacy schema; the new service goes through its ACL','Simple; couples deployments; the legacy schema still rules — acceptable only as a staging step'],
['Dual-write','Both systems write on every change','Explains nothing about consistency: the two writes can and will diverge; you must build reconciliation anyway'],
['Change data capture / outbox','The owning side writes once; a CDC pipeline (or transactional outbox + relay) streams changes to the new side','Eventually-consistent but reconcilable; more infrastructure; the strategy that scales to decommissioning']]),
CALL('trap',R`Dual-write is the classic migration trap: it looks like progress and quietly accumulates divergence. If you must use it for a phase, run a reconciliation job from day one that measures divergence per table, and treat any nonzero drift as a page-worthy defect. Module 11 shows the expand-and-contract version of this discipline at the schema level, and Module 20&#39;s notification-extraction case study includes the reconciliation design.`),
P(R`One rule closes the loop: at every moment of the migration, each piece of data has exactly one <b>system of record</b>. Services may cache or project, but writes route to the owner. When the scoreboard says the new service owns a capability completely, ownership of its data flips with it — that flip, repeated, is what "gradually replacing the legacy system" actually means.`)
]);
LES('m09-runbook','m09','The migration runbook: monolith to Spring Boot services',3,10,[
P(R`Here is the full strangler runbook applied to the running example: OrderFlow, the five-year-old Maven monolith from Module 02, being replaced by Spring Boot services while it serves production. Stages are sequential; every stage is independently valuable, so a paused migration leaves the system better, not stranded.`),
H('Stage 0 — Inventory and readiness'),
UL([R`Map capabilities, routes, tables and jobs (Module 02 workflow). Tag each: strangler candidate / core transactional / decommission-when-dead.`,
R`Build the safety net on the first candidate slice (Module 08) — the net is the entry ticket.`,
R`Stand up the gateway in <b>pass-through</b> mode: 100 percent of traffic to the monolith. This changes nothing visible and proves the facade under production load — do not skip the pass-through week.`]),
H('Stage 1 — First slice: notifications'),
UL([R`Why first: low coupling (reads orders, sends email), no transactional writes, high business patience for glitches.`,
R`New notification-service owns its own schema; subscribes to OrderPaid events (outbox on the monolith side, Module 11); the monolith&#39;s email code is deleted, not commented out.`,
R`Cutover by feature flag: flag on for internal users → 5 percent → 100 percent. Rollback = flag off.`]),
H('Stage 2 — Search and reporting'),
UL([R`Event-fed read models (projections) in the new service; no shared tables, only the event stream.`,
R`Backfill historical data once, then let events keep it current; reconciliation counts drift nightly.`]),
H('Stage 3 — The order read path'),
UL([R`The new order-query service serves reads through its projection; writes still go to the monolith. Read-your-write needs are handled by pinning a user&#39;s reads to the monolith for N seconds after their write — a documented, tested compromise.`]),
H('Stage 4 — The order write path (the hard one)'),
UL([R`Split by command first, not by the whole aggregate: cancel-order moves before place-order.`,
R`Data ownership flips per command: for cancelled orders the new service becomes the system of record; the monolith receives a mirror via events (the direction of Stage 3 reverses).`,
R`Every flip keeps a rollback story: route the command back and replay the events into the monolith for the downtime window — tested in staging with replayed production traffic.`]),
H('Stage 5 — Decommission, the neglected art'),
UL([R`A route is removable when: the new path served 100 percent for a full business cycle (month-end included), reconciliation is zero-drift, and the old code path has an owner willing to sign its death certificate.`,
R`Delete code, tables, jobs and config — in that order, each deletion its own revertible commit. "Just disabled for now" is how you end up maintaining two systems (the anti-pattern the whole pattern exists to prevent).`,
R`Retire the facade routes last; the gateway configuration shrinks to the surviving topology.`]),
H('Failure scenarios, rehearsed'),
TB(['Failure','Detection','Response'],[
['New slice serves wrong data','Route-level error budget burn; reconciliation drift','Flip route back to monolith; fix forward; re-migrate with the lessons'],
['Event pipeline lags or drops','Lag metrics on the outbox/CDC; gap alarms','Freeze the flip window; replay from offset; reconcile counts before resuming'],
['Hidden consumer of the old path','404s in logs nobody watched; support tickets','The pass-through gateway should have logged every consumer — find them at Stage 0, not here'],
['Rollback itself broken','Quarterly reversal drill fails','The rollback drill is part of the migration definition of done; a slice without a rehearsed rollback does not flip']]),
CALL('warn',R`The scoreboard keeps the program honest: traffic percentage per route, error rate and latency old vs. new, reconciliation drift, and one flat metric that outranks them all — capabilities fully decommissioned. Strangler programs die by ninety-percent-forever; the decommissioning discipline in Stage 5 is the antidote, and the <a href="#dblab">Database Migration Simulator</a> and <a href="#decsim">Decision Simulator</a> rehearse its mechanics and its judgment calls.`)
]);

/* ================= MODULE 10 ================= */
LES('m10-modular','m10','The modular monolith first',2,9,[
P(R`Before you can extract a service, you must have something coherent to extract — and most monoliths are not coherent; they are one deployable containing several tangled systems. The modular monolith is the discipline of fixing that <i>inside</i> the single deployable first: explicit bounded contexts, enforced boundaries, one team per module. It delivers most of the maintainability that people chase into microservices, without the distributed-systems bill — and if you later do extract, the modules are your extraction units.`),
H('Bounded contexts: drawing the lines'),
P(R`Domain-driven design's bounded context is the unit of modularity: a region of the model where a term means exactly one thing. In OrderFlow, "customer" means a payment relationship in billing, a shipping destination in fulfilment, and an email-open statistic in marketing — three contexts that happen to share an identifier. The modular monolith gives each context its own module, its own model and its own persistence; what crosses the line is an explicit interface or an event, never a shared entity.`),
CODE('text',`
orderflow/                          after modularization
├── ordering/                       bounded context: the order lifecycle
│   ├── api/        (interfaces consumed by other modules)
│   ├── domain/     (entities, rules — no framework annotations)
│   ├── persistence/(ordering-owned tables only)
│   └── application/(use cases: PlaceOrder, CancelOrder)
├── billing/                        owns charges, refunds, payment tokens
├── shipping/                       owns addresses, carriers, tracking
├── notifications/                  owns templates, preferences, sends
└── shared-kernel/                  UUIDs, Money, event contracts — tiny, boring, deliberate
`),
H('Enforcing the boundaries'),
P(R`Boundaries that live only in conventions die in the first deadline. Enforce them mechanically. Maven modules give you compile-time enforcement (shipping cannot import billing&#39;s internals because they are not on its classpath). ArchUnit keeps the rules honest inside each module — and, crucially, the rules are tests, so a boundary violation fails the build:`),
CODE('java',`
@AnalyzeClasses(packages = "com.acme.order")
class ArchitectureRulesTest {

  @ArchTest
  static final ArchRule contextsDoNotDependOnEachOthersInternals =
      noClasses().that().resideInAPackage("..shipping..")
          .should().dependOnClassesThat()
          .resideInAPackage("..billing.internal..");

  @ArchTest
  static final ArchRule domainStaysFrameworkFree =
      noClasses().that().resideInAPackage("..ordering.domain..")
          .should().dependOnClassesThat()
          .resideInAnyPackage("org.springframework..", "jakarta.persistence..");

  @ArchTest
  static final ArchRule cycles = slices().matching("com.acme.order.(*)..")
          .should().beFreeOfCycles();
}
`),
H('The shared-database problem'),
P(R`The last tangle is usually data: three contexts writing one customer table, one order table with columns owned by everyone. The modularization sequence: <b>1.</b> stop cross-context <i>writes</i> (each table gets exactly one writing module — others read through an interface or switch to events); <b>2.</b> split read models per context where coupling is worst; <b>3.</b> physically split tables only when a context actually leaves the deployable. Module 11 owns the schema-change mechanics; the rule here is ownership, not table count.`),
CALL('tip',R`A fast, honest test of whether your modularization is real: pick any module and try to imagine deploying it alone. If the thought is absurd, the boundary is decorative. If the thought is merely expensive, you have a module; when a business reason makes independence worth the price, Module 10&#39;s second lesson covers the extraction.`)
]);
LES('m10-extract','m10','Extraction: from modules to services — and when not to',3,10,[
P(R`Extraction is the promotion of a bounded context from module to independently deployable service. Done well, it is a mechanical application of everything this guide has taught; done badly, it distributes the monolith — same tangle, now with network calls. The decision deserves the skepticism this lesson gives it.`),
H('Extraction order'),
UL([R`<b>Start at the edge</b>: notifications, search, reporting — low coupling, no transactions (Module 09 did exactly this).`,
R`<b>Then bounded, stateful contexts</b>: shipping, catalog — they own their aggregates cleanly.`,
R`<b>Transactional cores last</b>: ordering, payments, inventory — only after the team has migrated something and knows its tooling, and only if the business case survives the cost table below.`,
R`Each extraction follows the strangler mechanics: facade route, data ownership flip per aggregate, reconciliation, decommission.`]),
H('What you are buying, what you are paying'),
TB(['You gain','You pay'],[
['Independent deployment cadence per team','Network calls replace in-process calls: latency, partial failure, retries, timeouts — Module 09&#39;s failure table becomes your life'],
['Independent scaling of hot capabilities','Distributed transactions become sagas/outbox — the hardest code you will write this year'],
['Fault isolation (one service&#39;s crash does not fell all)','Observability requirements explode: tracing, correlation IDs, per-service dashboards'],
['Technology choice per service','Operational surface area: N pipelines, N security postures, N upgrade calendars'],
['Team ownership boundaries match deployment boundaries','Data consistency becomes eventual — every product decision gets a freshness footnote']]),
H('When microservices are the wrong answer'),
UL([R`<b>One team, one product</b>: the coordination cost microservices solve (many teams colliding on one deployable) does not exist; the costs they add all do. A modular monolith is the correct architecture for most single-team systems.`,
R`<b>Unclear domain boundaries</b>: if you cannot draw the bounded contexts, distributed boundaries will be drawn badly and become load-bearing walls. Modularize first; the module boundaries will teach you where the services are.`,
R`<b>No platform engineering</b>: without CI/CD per service, a deployment pipeline, and observability from day one, extraction multiplies toil, not autonomy.`,
R`<b>"Modern" as the requirement</b>: modernization is a means; the end is a system where change is cheap, safe and understood (Module 07). Sometimes the modern architecture for the business you actually have is a well-modularized monolith on a current runtime — a verdict Module 21 formalizes.`]),
H('Architecture as evolution, not event'),
P(R`The healthy mental model: architecture is a property that evolves with the system, checked at each inflection (new team, new scale regime, new business criticality). The roadmap: tangled monolith → modular monolith → extract the modules that earned independence → keep the rest. Some contexts will travel that whole road; most never need to leave the monolith, and that is the system working as designed. Module 20&#39;s monolith-modularization case study walks a realistic version of this road, and the <a href="#decsim">Decision Simulator</a> makes you defend the stops along it.`)
]);
/* ================= MODULE 11 ================= */
LES('m11-versioning','m11','Schema versioning and migration tools',1,9,[
P(R`A schema that evolves by DBAs running hand-crafted SQL on production is a system with no history, no reproducibility and no rollback. Schema migrations fix that: every change to the database is a versioned artifact in version control, applied in order, tracked by a table the tool maintains. The database becomes code — reviewable, diffable, and rebuildable from scratch.`),
H('Flyway: versioned and repeatable migrations'),
CODE('text',`
src/main/resources/db/migration/
├── V1__create_orders_and_customers.sql        # versioned: runs exactly once
├── V2__add_orders_customer_email.sql
├── V3__create_index_orders_created_at.sql
├── V4__backfill_orders_customer_email.sql     # data migration, still versioned
├── V9__split_customer_names.sql
└── R__order_status_summary_view.sql           # repeatable: reruns when its
                                                # checksum changes (views, functions)
`),
CODE('yaml',`
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # adopt an existing schema as V0, then track
    validate-on-migrate: true      # refuse to run if applied files were edited
  jpa:
    hibernate:
      ddl-auto: validate           # never "update" in production (see below)
`),
P(R`Flyway records applied versions in flyway_schema_history and applies pending files in lexical order; a failed versioned migration halts startup — by design, because the schema&#39;s state must never be ambiguous. Liquibase offers the same discipline with XML/YAML/SQL changesets and richer diff tooling; Alembic does it for SQLAlchemy, Prisma Migrate for the TypeScript world, and Django migrations are generated from model changes. The tool matters less than the invariant: <b>the only way a schema changes is a migration in version control</b>.`),
CALL('trap',R`Hibernate&#39;s ddl-auto=update is not a migration tool: it adds what it can, never drops or narrows anything, and its decisions vary across Hibernate versions. In production it is a slow drift generator; use ddl-auto=validate (entities must match the schema or startup fails) and let Flyway own the changes. And never edit an already-applied migration — validate-on-migrate exists to make that a build failure instead of a surprise.`),
H('Testing migrations'),
UL([R`<b>From-scratch test</b> (CI, every commit): empty database → all migrations → assert schema matches entities (that is the ddl-auto=validate startup).`,
R`<b>Migration rehearsal</b> (staging, before release): restore a production snapshot → run the new migrations → measure duration. If it exceeds your tolerance, the migration must be redesigned (next lesson), not scheduled hopefully.`,
R`<b>Data round-trip</b>: after migrating, application smoke tests read and write the money path — a schema that migrates but breaks the ORM mapping passed the wrong test.`]),
P(R`Migration testing is also where you discover the two hard truths of schema work: production data is always dirtier than your fixtures (nulls where constraints are about to go, values outside the expected enums), and migration duration on production volume is a design constraint, not a discovery. Both truths drive the next two lessons.`)
]);
LES('m11-safe','m11','Safe schema changes: locks, indexes, constraints, renames',3,10,[
P(R`Every DDL statement takes locks, and on a live table the wrong lock is an outage. This lesson is the PostgreSQL-flavored catalog of safe patterns — the reasoning transfers to MySQL and SQL Server with their specific lock behaviors substituted.`),
H('What each change actually costs'),
TB(['Change','Lock / cost','Safe pattern'],[
['ADD COLUMN (nullable)','Brief ACCESS EXCLUSIVE; no table rewrite — fast','Safe almost always; do it alone in its own migration'],
['ADD COLUMN NOT NULL with default','PG 11+: metadata-only fast path; earlier versions rewrite the table','Add nullable → backfill → SET NOT NULL when clean'],
['ADD CONSTRAINT CHECK','Validated immediately; full scan <b>blocking writes</b>','ADD ... NOT VALID, then VALIDATE CONSTRAINT (non-blocking scan)'],
['CREATE INDEX','SHARE lock — blocks all writes for the build duration','CREATE INDEX CONCURRENTLY (no blocking; slower; cannot run in a transaction)'],
['RENAME COLUMN','Metadata-only, instant — but every old client breaks at once','Two-phase rename (below); never a bare rename under live traffic'],
['DROP COLUMN','Metadata-only in PG (space reclaimed lazily) — but old app versions still writing it will fail','Only after no deployed code references it (expand-and-contract step 6)'],
['TYPE changes (e.g. VARCHAR → TEXT ok; INT → BIGINT)','Rewrites the table under an exclusive lock','New column + backfill + switch, for anything that rewrites']]),
H('The non-blocking constraint'),
CODE('sql',`
-- step 1: add the constraint without validating — instant, blocks nothing for long
ALTER TABLE orders ADD CONSTRAINT orders_total_positive
  CHECK (total_cents >= 0) NOT VALID;

-- step 2: validate existing rows with a weaker lock (SHARE UPDATE EXCLUSIVE)
-- writes continue; the scan still takes time on a huge table
ALTER TABLE orders VALIDATE CONSTRAINT orders_total_positive;
`),
H('The concurrent index'),
CODE('sql',`
-- CONCURRENTLY: no write-blocking, but it cannot run inside a transaction block,
-- takes two table scans, and on failure leaves an INVALID index you must drop and retry
CREATE INDEX CONCURRENTLY idx_orders_created_at ON orders (created_at);

-- afterwards, verify — an INVALID index is worse than none:
SELECT indexrelid::regclass, indisvalid FROM pg_index
WHERE indexrelid = 'idx_orders_created_at'::regclass;
`),
H('The two-phase rename'),
CODE('sql',`
-- renaming customer_name → full_name while the old app version is still deployed:
-- phase A (expand): add the new column, mirror writes in the application (next lesson)
ALTER TABLE customers ADD COLUMN full_name TEXT;

-- phase B (backfill + switch reads), then, much later (contract):
ALTER TABLE customers DROP COLUMN customer_name;
-- a bare "ALTER TABLE customers RENAME COLUMN customer_name TO full_name" would be
-- metadata-cheap and operationally fatal: every old writer fails in the same second.
`),
H('Transactional DDL, and its limits'),
P(R`PostgreSQL runs DDL inside transactions — a failed migration rolls back cleanly, and Flyway wraps each migration in one. Two exceptions matter operationally: CREATE INDEX CONCURRENTLY cannot run inside a transaction, and MySQL executes DDL with an implicit commit, so a half-applied MySQL migration needs manual repair scripts. Know which regime you are in before you write a migration that assumes atomicity.`),
CALL('warn',R`Backfills and long DDL hold locks that block autovacuum and pile up behind them. The batching discipline for large tables — keyset pagination, small UPDATEs, sleeps between batches — is in the next lesson&#39;s step 3; the rule of thumb here is that any single statement expected to run longer than seconds on a production table is a design smell, not a brave choice. Rehearse durations on the staging snapshot from the previous lesson.`)
]);
LES('m11-expand','m11','Expand-and-contract: zero-downtime schema evolution',3,11,[
P(R`Expand-and-contract (the parallel-change pattern) is the answer to the fundamental conflict of schema evolution: the database must serve <i>old and new application versions simultaneously</i> during a deployment, because canaries, rollbacks and rolling restarts guarantee overlap. The pattern deploys changes in two harmless directions — expand, then contract — and never lets a single migration break either version.`),
H('The six steps'),
TB(['Step','Action','Who must cooperate'],[
['1. Expand','Add new columns/tables/indexes — nullable, optional, non-breaking','Migration only; no app change yet'],
['2. Compat deploy','App writes both old and new shapes (dual-write); reads still prefer old','Application + migration'],
['3. Backfill','Migrate existing rows to the new shape, in batches','Migration (or job) with ops discipline'],
['4. Switch','Reads move to the new shape, behind a flag; verify, then make it primary','Application, feature-flagged'],
['5. Remove deps','Stop writing the old shape once no deployed version reads it','Application (a later release)'],
['6. Contract','Drop old columns/indexes — now merely cleanup','Migration, final and destructive']]),
H('Worked example: splitting customer_name'),
P(R`The goal: replace <code>customers.name</code> with <code>first_name</code> + <code>last_name</code> on a table with millions of rows and zero downtime budget. Step 1, expand:`),
CODE('sql',`
-- V81: expand — instant, harmless to every deployed version
ALTER TABLE customers ADD COLUMN first_name TEXT;
ALTER TABLE customers ADD COLUMN last_name  TEXT;
`),
P(R`Step 2, the compatibility release — the application writes both shapes in the same transaction; reads keep using the old column. The dual-write is the fragile step, so it is also measured (see the reconciliation note in Module 09):`),
CODE('java',`
public void updateCustomer(CustomerUpdate update) {
  // one transaction: both shapes written or neither (atomicity is the whole trick)
  jdbc.update("""
      UPDATE customers
      SET name = ?,                    -- old shape: still the read path
          first_name = ?, last_name = ?
      WHERE id = ?""",
      update.fullName(), update.first(), update.last(), update.id());
}
`),
P(R`Step 3, the backfill — batched, resumable, polite to production:`),
CODE('sql',`
-- run in a loop from a migration job (not a single statement!), resumable by design:
UPDATE customers
SET first_name = split_part(name, ' ', 1),
    last_name  = trim(substring(name from position(' ' in name)))
WHERE id IN (SELECT id FROM customers
             WHERE first_name IS NULL
             ORDER BY id LIMIT 5000);     -- keyset-batched: 5000 rows per pass
-- sleep between passes; commit per pass; progress = count(first_name IS NULL)
-- a crash resumes exactly where it stopped. Verify afterwards:
SELECT count(*) FROM customers WHERE first_name IS NULL OR last_name IS NULL;
`),
P(R`Steps 4 and 5 are application releases behind a flag: reads switch to the new columns (with the old ones still maintained), then a later release deletes the old write. Step 6, contract — only now destructive, and safe because nothing deployed references the old column:`),
CODE('sql',`
-- V89: contract — no deployed version reads or writes "name"
ALTER TABLE customers DROP COLUMN name;
`),
H('Why destructive migrations get special care'),
UL([R`<b>They are the only irreversible step</b>: everything before contract is additive and reversible; DROP discards data a rollback would need. Old application versions still running (a canary, a stuck rolling update, a forgotten batch job) must be provably absent — check deployment logs, not memory.`,
R`<b>Restores are not rollbacks</b>: restoring a pre-drop snapshot discards every write since. The realistic recovery for a bad contract step is a <b>forward fix</b> — repopulate from the new shape or a backup taken <i>after</i> the expand. Decide which recovery you are signing up for <i>before</i> step 6, and write it into the migration ticket.`,
R`<b>Cron and reporting love dead columns</b>: the warehouse job selecting the dropped column dies at 3 a.m. Inventory consumers at expand time (Module 02&#39;s integration list), not at drop time.`]),
CALL('note',R`The <a href="#dblab">Database Migration Simulator</a> in the workshop walks all six steps of this exact scenario with the schema state, the app code and the failure buttons — including "what happens if you drop at step 2" and "what if the backfill is one giant UPDATE". The pattern&#39;s shape is always the same: <b>expand, migrate, switch, contract — and never let one release span two steps at once.</b>`)
]);

LES('m12-lifecycle','m12','Dependencies as liabilities: SemVer, conflicts and EOL',1,9,[
P(R`Every dependency is a decision to let someone else's release calendar affect your system. Used well, libraries are leverage — you do not maintain a JDBC driver or a JSON parser. Used carelessly, they become liabilities: unmaintained code you ship to production, upgrade cliffs that get taller every year, and attack surface you did not choose. This lesson is the vocabulary of dependency risk; the next is the upgrade craft.`),
H('Semantic Versioning — a promise with limits'),
TB(['Bump','Contract (SemVer 2.0)','What you still must do'],[
['PATCH 2.7.3 → 2.7.4','Bug fixes only; no API change','Read the diff anyway: "fix" and "behavior change" disagree at the edges'],
['MINOR 2.7 → 2.8','Backward-compatible additions','Run full tests; new defaults in "minor" releases are the classic surprise'],
['MAJOR 2 → 3','Breaking changes allowed','Migration guide, compatibility review, staged rollout — a project, even if small']]),
P(R`SemVer is a promise about API signatures, and the promise has known limits: performance behavior, serialization output, log formats and timing are not covered, yet all can break you. And a version number only tells you the <i>maintainer's</i> intent for their API — your system's sensitivity is your own analysis. A patch bump of a hashing library changed output formatting once and broke downstream systems: signatures intact, contract shattered.`),
H('Transitive dependencies and conflicts'),
CODE('bash',`
# who pulls what — the dependency tree is the map
mvn dependency:tree -Dverbose | grep -B2 -A2 "jackson"

# conflicts appear as "omitted for conflict with x.y.z"
# resolution: nearest-wins in Maven, highest-wins in older npm — either way, know it:

mvn -pl orderflow-service dependency:tree -Dincludes=com.fasterxml.jackson.core:jackson-databind
`),
UL([R`<b>Conflicts</b> surface as NoSuchMethodError and ClassNotFoundException at runtime — the classpath loaded a different version than you compiled against. Fix by pinning in dependencyManagement (Maven) or resolutions/overrides (Gradle/npm), with a comment naming the reason.`,
R`<b>Duplicates</b> (two versions of a library on the classpath) are silent until class loading order changes — usually during the next upgrade. Dependency convergence rules (Maven Enforcer) make them build failures.`,
R`<b>Transitive drift</b>: your own code changed nothing, but a minor bump of a framework pulled new transitive versions. Lockfiles (package-lock.json, Gradle platform pins) convert drift from ambient risk into reviewable diffs.`]),
H('End-of-life: the slow emergency'),
P(R`EOL is when the maintainers stop shipping fixes — security patches included. An EOL runtime or framework is unbounded security debt: the CVE scanner keeps flagging, and the remediation is always "upgrade past the cliff you have been avoiding". The discipline is horizon tracking: a simple table of every EOL date that matters (Java versions, Spring Boot lines, PostgreSQL majors, Ubuntu LTS, your base images), reviewed quarterly (Module 01&#39;s cadence), so upgrades enter the roadmap as planned work instead of arriving as incidents. Log4Shell in December 2021 was the industry-wide reminder: the cost of the unmaintained dependency is paid at the worst possible moment, at panic prices.`),
CALL('note',R`Health signals for a dependency, checked before you adopt and yearly thereafter: release cadence (alive?), issue response, whether breaking changes ship with migration guides, and whether the project has a security policy. A library with no release in three years is not a dependency — it is source code you have not read yet.`)
]);
LES('m12-workflow','m12','The safe upgrade workflow: Java 17 to 21, Spring Boot 3',3,11,[
P(R`Upgrades fail when they are treated as version-number edits. They succeed when they are treated as small migrations with a repeatable workflow. This is the workflow — the same spine for a patch bump and a framework major, differing only in depth.`),
H('The workflow'),
UL([R`<b>1. Inventory</b>: every direct and transitive version in play; which are EOL, which have known CVEs (the Module 04 audit data).`,
R`<b>2. Read the release notes and migration guide</b> — for the target and for each major transitive that moves with it. This is the highest-leverage 30 minutes of the whole upgrade.`,
R`<b>3. Identify breaking changes relevant to you</b>: grep for them. "Uses javax.servlet" matters; "new configuration property names" matters if you set those properties.`,
R`<b>4. Upgrade incrementally</b>: one major at a time, or even one module at a time in a multi-module build. Never two majors in one PR.`,
R`<b>5. Run the full automated suite</b>; fix compile breaks first, then behavior breaks.`,
R`<b>6. Verify compatibility mechanically</b>: dependency convergence clean; flyway validate; ddl-auto=validate; contract tests against partners (Module 14).`,
R`<b>7. Benchmark critical paths</b> where the release notes warn of performance changes (JIT/GC behavior, connection pool defaults). Compare, do not assume.`,
R`<b>8. Deploy progressively</b>: canary or one instance first (Module 16), with the old version still running.`,
R`<b>9. Monitor</b>: error rates, latency, GC logs, memory — the upgrade is done when a full business cycle has passed, not when the pipeline is green.`,
R`<b>10. Write the ADR</b> (Module 18): what moved, why, what broke, what the next horizon is.`]),
H('Scenario: Java 17 to Java 21'),
CODE('bash',`
# what breaks? jdeps knows which of your classes touch JDK internals
jdeps --jdk-internals --multi-release 17 orderflow-service/target/classes.jar

# typical findings: sun.misc.Unsafe users (old serialization libs),
# javax.* modules that moved (removed APIs are listed by JEP per release)
# then: build with the new --release flag and let the compiler enumerate the rest
mvn clean verify -Dmaven.compiler.release=21
`),
UL([R`Compiler errors are the cheap part; behavioral changes are the real review: GC defaults changed across releases (JDK 18+ shipped different default collectors), tightened security (strong encapsulation of JDK internals since 17), and changed locale/timezone data.`,
R`Run the full suite on 21, then a staging soak, then canary — in that order.`,
R`The new language features are a separate, optional release (Module 13): upgrade first, modernize syntax later, never both at once.`]),
H('Scenario: Spring Boot 2.7 to 3.2'),
UL([R`<b>Baseline first</b>: 3.0 requires Java 17 — sequence the runtime upgrade before the framework upgrade, each in its own release.`,
R`<b>The big one: javax.* → jakarta.*</b> across all EE-related imports (servlet, persistence, validation). Mechanical, global, and it hits every custom integration: sed/IDE assist, then compile.`,
R`<b>Property renames</b>: hundreds of configuration keys changed; add the temporary <code>spring-boot-properties-migrator</code> dependency so startup logs flag every renamed property you use, then fix them and remove the migrator.`,
R`<b>Hibernate 6</b> arrives as a transitive major: review generated SQL (the SQL changed in places), and re-run the Testcontainers suite (Module 08) against real PostgreSQL.`,
R`<b>Automate the mechanical parts</b>: OpenRewrite ships recipes for the Boot 2.7→3.x move (jakarta imports, properties, deprecated APIs) — review the generated diff like any PR, but let the robot do the find-and-replace.`,
R`<b>Rollback plan</b>: Boot 2.7 and 3.x can run side by side behind the gateway during a progressive rollout; the database layer must stay compatible with both (expand-and-contract, Module 11 — Flyway migrations shared by both versions must not use 3.x-only features).`]),
H('Beyond the JVM'),
CODE('bash',`
# Node: upgrade along LTS lines, lockfile committed, engines field pinned
npm outdated && npm install package@latest-2  # deliberate bumps, never npm update everywhere

# Python: constraints + a lockfile-equivalent, one env at a time
pip list --outdated
pip install "django==5.0.*" -c constraints.txt && pytest
`),
CALL('tip',R`Make upgrades boring with automation: Renovate or Dependabot opening small, labeled PRs (patch weekly, minor monthly, majors as tracked issues) turns the dependency calendar into routine review work. The teams with the freshest dependencies are not the bravest — they are the ones who made small upgrades the path of least resistance. The <a href="#deplab">Dependency Upgrade Simulator</a> rehearses the compatibility reasoning on a realistic Boot 2.3 stack.`)
]);

LES('m13-java','m13','Modernizing Java: records, switch, pattern matching',2,9,[
P(R`Language modernization is the tasteful layer of runtime modernization: once the runtime is current (Module 12), the language offers constructs that delete boilerplate and make illegal states unrepresentable. The discipline is to modernize <i>where it pays</i> — hot, changing code — and to leave stable code alone.`),
H('The moves that earn their keep'),
CMP('Records for data carriers — the DTO boilerplate vanishes',
'java',`
public final class Money {
  private final BigDecimal amount;
  private final Currency currency;
  public Money(BigDecimal amount, Currency currency) {
    this.amount = amount; this.currency = currency;
  }
  public BigDecimal getAmount() { return amount; }
  public Currency getCurrency() { return currency; }
  @Override public boolean equals(Object o) {
    if (!(o instanceof Money)) return false;
    Money m = (Money) o; return amount.equals(m.amount) && currency.equals(m.currency);
  }
  @Override public int hashCode() { return Objects.hash(amount, currency); }
  @Override public String toString() { return amount + " " + currency; }
}
`,
`
public record Money(BigDecimal amount, Currency currency) {
  public Money {                       // compact constructor: validation lives here
    Objects.requireNonNull(currency);
    if (amount.signum() < 0) throw new IllegalArgumentException("negative money");
  }
}
// equals, hashCode, toString generated; immutable by construction; 12 lines of intent
`,
[R`Any class that is "fields plus getters plus equals/hashCode" is a record waiting to happen — DTOs, API payloads, query parameters, value objects.`,
R`The compact constructor is the right home for invariants that used to scatter across setters or factory methods.`],
R`Trade: records are shallowly immutable — a record holding a List can still be mutated through it; copy defensively in the constructor where it matters.`),
CMP('Pattern matching for instanceof and switch — collapse the casting chains',
'java',`
public BigDecimal discountFor(Object promotion) {
  if (promotion instanceof PercentageDiscount) {
    PercentageDiscount p = (PercentageDiscount) promotion;
    return p.base().multiply(p.rate());
  } else if (promotion instanceof FixedAmountDiscount) {
    FixedAmountDiscount f = (FixedAmountDiscount) promotion;
    return f.amount();
  } else if (promotion instanceof BulkTierDiscount) {
    BulkTierDiscount b = (BulkTierDiscount) promotion;
    return b.qty() >= 10 ? b.base().multiply(TEN_PCT) : BigDecimal.ZERO;
  }
  return BigDecimal.ZERO;
}
`,
`
public BigDecimal discountFor(Promotion promotion) {
  return switch (promotion) {                       // exhaustive: sealed below
    case PercentageDiscount p -> p.base().multiply(p.rate());
    case FixedAmountDiscount f -> f.amount();
    case BulkTierDiscount b when b.qty() >= 10 -> b.base().multiply(TEN_PCT);
    case BulkTierDiscount b -> BigDecimal.ZERO;
  };
}
public sealed interface Promotion
    permits PercentageDiscount, FixedAmountDiscount, BulkTierDiscount {}
`,
[R`The cast-and-test boilerplate disappears; guarded patterns (<code>when</code>) absorb the sub-conditions that used to nest inside branches.`,
R`Sealed + switch is the payoff: the compiler proves exhaustiveness — adding a fourth Promotion type fails every switch that must handle it, at compile time, in every file.`],
R`Trade: sealed hierarchies are closed by design. Where third parties must extend the type, stay with an interface and accept non-exhaustive switches.`),

R`Switch <i>expressions</i> return values: no break, no fall-through, no mutation-at-a-distance.`],

LES('m14-compat','m14','Evolving APIs without breaking clients',2,9,[
P(R`An API is a promise you cannot unilaterally renegotiate. Somewhere, a client you forgot about — a mobile app version three releases old, a partner's nightly job, a script in a cron container nobody owns — depends on today's shape. API migration is therefore the art of changing the contract while every version of every client keeps working until you have evidence they moved.`),
H('What actually breaks a client'),
TB(['Change','Breaking?','Why'],[
['Adding an optional request field','No','Old clients send what they always sent'],
['Adding a response field','Usually no','JSON clients ignore unknown fields — but strict-schema consumers can reject them; coordinate anyway'],
['Removing or renaming a field','Yes','The single most common break; old readers get undefined where data used to be'],
['Tightening validation (reject values you accepted)','Yes','Requests that worked yesterday now 400 — "fixing" your API breaks clients'],
['Changing a field&#39;s type (string → number)','Yes','Parsers fail or silently misread'],
['Reordering enum values when clients use ordinals','Yes','Ordinal consumers are everywhere; always exchange names'],
['Changing error semantics (409 → 422)','Yes','Retry and fallback logic keys on status codes'],
['Adding a new endpoint','No','Nobody was calling it']] ),
H('Versioning and the deprecation lifecycle'),
P(R`Two coherent strategies exist; mixing them per-endpoint is what actually hurts. <b>URI versioning</b> (/api/v1/, /api/v2/) is explicit, cache-friendly and easy to route at a gateway — at the cost of a slow-moving copy of the surface. <b>Compat-within-version</b> (add-only evolution, never rename or remove inside a major) keeps one surface forever — at the cost of permanent discipline. Whichever you choose, retire versions through a published lifecycle:`),
CODE('text',`
1. ANNOUNCE    changelog + email to registered consumers + docs banner
2. DUAL-RUN    v2 serves new shape; v1 still fully functional
3. SIGNAL      v1 responses carry machine-readable deprecation:
                 Deprecation: version="v1"            (RFC 9745)
                 Sunset: Wed, 31 Dec 2025 23:59 GMT   (RFC 8594 — the removal date)
4. WATCH       v1 traffic dashboards, by consumer; chase the long tail personally
5. TIER-DOWN   410 Gone with a helpful body, for a grace window
6. REMOVE      delete v1 code; the gateway keeps a tombstone redirect for a release
`),

LES('m14-consumers','m14','Migrating consumers, webhooks and authentication',3,9,[
P(R`The shape change is the easy half; the hard half is the people and systems on the other end. This lesson covers the consumer-facing machinery of an API migration: contract tests, communication, webhooks and the authentication overlap.`),
H('Contract testing: breaking changes caught before merge'),
P(R`Consumer-driven contract tests close the gap that integration suites cannot: your consumers&#39; expectations run against <i>your</i> build. Each consumer publishes a pact — the requests it makes and the minimal response shape it needs — and your CI replays those pacts against the real provider. A renamed field fails the provider&#39;s pipeline within the hour, not a partner&#39;s Tuesday. Pact is the reference tool; Spring Cloud Contract serves the same need provider-first; OpenAPI-diff tooling catches the same class of change at the spec level. Module 20&#39;s API-migration case study shows the full loop with the sunset headers from the previous lesson.`),
H('Communicating a migration'),
UL([R`<b>Inventory consumers before announcing</b>: gateway logs, API keys, OAuth client registrations. The consumer you did not know about is the one that pages you.`,
R`<b>Give a timeline with a real sunset date</b> and keep it — vacuous deadlines teach consumers to ignore you; a kept one teaches them to move.`,
R`<b>Make the migration a diff, not a document</b>: a "what changes for v2" table per endpoint, runnable examples, and ideally a staging environment where consumers replay their traffic.`,

LES('m19-plan','m19','Maintenance planning and engineering economics',2,9,[
P(R`Maintenance competes with features for the same hours, and it loses every argument it shows up to unarmed. Economics is the armament: making the cost of <i>not</i> maintaining visible, and the spend on maintaining defensible to people who think in quarters and money.`),
H('The planning questions'),
UL([R`<b>What does this system cost to own?</b> Total cost of ownership: infrastructure, licenses, engineering hours (features + maintenance + on-call), and the drag tax on everything that touches it.`,
R`<b>What is the cost of delay?</b> The deferred upgrade is not free — its price compounds (Module 03&#39;s interest) and occasionally spikes (the CVE that finds the unpatched line). Cost of delay = value lost per unit of time × time, and it reframes "we&#39;ll do it next quarter" as the purchase of risk it actually is.`,
R`<b>What capacity does maintenance legitimately need?</b> Module 05&#39;s budget (the 15-25 percent band) plus incident load plus the EOL horizon calendar (Module 12) — summed, honestly, per quarter.`,
R`<b>What is the payback of the proposed repayment?</b> Principal (the fix) versus interest (the recurring drag): the Module 03 table, applied to this quarter&#39;s candidates.`]),
H('Capacity allocation that survives pressure'),
TB(['Allocation model','Shape','Fits'],[
['Fixed budget','20% maintenance, every sprint, inviolable','Steady-state systems; simplest to defend'],
['Debt-sprint cadence','Feature sprints alternate with maintenance sprints','Teams that lose focus-switching fights; lumpy repayment'],
['Embedded ownership','Maintenance work lives inside each team&#39;s backlog','Platform-healthy orgs with strong review culture'],
['Recovery mode','Majority capacity on reliability until error budget recovers','Post-incident, when the SLO math forces the issue (Module 16)']]),
P(R`The allocation matters less than the accounting: maintenance work that is invisible in the tracker does not exist to the people who fund it. Every maintenance hour gets a label (corrective / adaptive / perfective / preventive — Module 01&#39;s vocabulary) so the quarterly conversation starts from data instead of impressions.`),
CALL('note',R`The economic argument that lands with executives is not "the code is bad" — it is the <b>velocity curve</b>: lead time per feature, plotted over two years against the periods of deferred maintenance. Nothing else in this guide turns technical debt into a management priority as reliably as that one honest chart.`)
]);
LES('m19-metrics','m19','Measuring maintenance: the honest dashboard',3,10,[
P(R`Metrics close the loop: they make Module 03&#39;s interest visible, Module 05&#39;s prioritization checkable, and Module 19&#39;s economics arguable. The discipline is the same as Module 04&#39;s — cameras, not targets — and the closing callout is the reason this lesson ends the module cluster on a caution.`),
H('The DORA four keys'),
TB(['Metric','Definition','What it really tells you'],[
['Deployment frequency','How often you ship to production','The batch size of your change process — small ships are safer ships'],
['Lead time for changes','Commit → running in production','The speed of your pipeline and your review process'],
['Change failure rate','Share of deployments causing incidents','The quality of your safety nets — tests, review, progressive delivery'],
['Time to restore (MTTR)','Incident → recovery','Your rollback and incident-response capability']]),
P(R`The four keys come from the DORA research program (the Accelerate book lineage). Their power is that they are <i>delivery</i> metrics, not code metrics — they measure the outcome of maintenance investment, not its activity. A team paying down debt watches change failure rate fall and lead time shrink; those are the interest payments, returned.`),
H('The maintenance-specific additions'),
TB(['Metric','Shape','Honest reading'],[
['Defect recurrence','Same defect class returning within N months','Problem-management health (Module 16); above zero is a learning-system failure'],
['Dependency freshness','Share of dependencies within one major of current; EOL exposure count','Module 12 as a trend; spikes predict emergency work'],
['Vulnerability exposure','Open findings by severity × age','Module 17&#39;s queue, aging; oldest items tell the culture&#39;s story'],
['On-call load','Pages per rotation, ack-to-mitigate time','The human price of operational debt'],
['Codebase health indicators','Hotspot count (Module 04), coverage on changed code, duplication trend','Leading indicators — they move before the delivery metrics do'],
['Incident frequency','Incidents per month by component','Recurring components are register rows, not bad luck']]),
H('An illustrative dashboard'),
CODE('text',`
Maintenance dashboard — SAMPLE DATA (illustrative, not from a real system)

  change failure rate     8%   (was 14% in Q1 — after the characterization push)
  lead time, p50          2.1d (was 5.0d)
  deployments / week      11   (was 3)
  MTTR                    41m  (was 3.5h — rollback drills credited)
  defect recurrence       2    (billing class — problem mgmt item open)
  EOL exposure            1    (PG12 -> upgrade scheduled, ADR-019)
  open high+ CVEs         0    (median age of fixed: 9 days)
  pages / on-call week    3    (was 9)
`),
H('The limits — read before celebrating anything'),
UL([R`<b>Every metric here can be gamed</b>: deployments split into micro-releases, incidents reclassified as "maintenance windows", MTTR shortened by declaring incidents over early. Pair metrics with each other (frequency with failure rate) so gaming one visibly breaks another.`,
R`<b>None is complete</b>: a perfect four-keys scorecard says nothing about security posture, knowledge concentration, or the cost of the next change to the scariest module. The dashboard is a camera array, not a verdict.`,
R`<b>Trends beat snapshots</b>: every number above means something only against its own history and its context (release size, team size, business season).`,
R`<b>Goodhart is watching</b>: the moment a metric becomes a target on a performance review, it stops measuring the system and starts measuring the target&#39;s pressure on people.`]),
CALL('warn',R`Do not treat any single metric — or any dashboard — as a complete measure of software quality. The full truth of maintainability lives in the next change&#39;s cost, the next incident&#39;s duration, and the next engineer&#39;s onboarding time, and those are only ever partially visible. The dashboard&#39;s job is to start arguments with evidence, not to end them with numbers.`)
]);

LES('m20-code','m20','Case studies: legacy foundations, God classes and first tests',3,10,[
P(R`Fifteen case studies close the curriculum — each one a compressed real-world engagement with its full anatomy: where it started, what the business needed, what was actually wrong, what was risky, how it was investigated, the plan, the tests, the rollback thinking, and the lessons that generalize. This lesson covers three that every maintainer eventually lives: the aging Java workhorse, the God class, and the untested core.`),
CASES([
{id:'c01',t:'Case 1 — Modernizing a 10-year-old Java monolith',cat:'Legacy modernization',
init:'A 380k-line Java 8 monolith, built with Ant, deployed as a WAR to two manually-managed Tomcat servers. Business-critical (60% of company revenue flows through it), three remaining engineers who know it, no automated tests, 41-minute build.',
req:'Platform must stay fully available; security wants off EOL runtimes within 18 months; product needs a steady feature cadence (roughly monthly releases) throughout.',
prob:'Java 8 EOL exposure; Ant build unmaintainable; deploys were a two-person ritual with a runbook that failed on step 4; every feature touched the same tangled core.',
risk:'Any big-bang attempt would freeze features for quarters and put revenue at risk; the team had already watched a rewrite attempt die after 14 months.',
inv:'Module 02 workflow: module map, entry points, integration inventory (found: PSP over SOAP, warehouse FTP, an undiscovered partner polling API), churn analysis naming the pricing engine as the hotspot.',
appr:'Sequence: build system → runtime → release engineering → structural debt, one slice at a time, each shippable independently.',
plan:['Wrap Ant in a working Maven build that produces the identical artifact (byte-compare JARs); no source changes.','Java 8 → 17 in staged -release bumps behind the full suite plus a staging soak (Module 12).','Introduce a deployment pipeline with smoke tests; retire the manual Tomcat ritual.','Characterization tests on pricing before any refactor there (Module 08).','Extract notifications and reporting as the first modules (Module 10).'],
impl:{lang:'text',code:`
Baseline discipline that made everything else safe:
  - every stage = one PR series, one rollback note, one ADR entry
  - byte-identical artifact rule for toolchain swaps (Ant -> Maven)
  - "no behavior change" verified by: full suite + staging replay of
    recorded production traffic, diffed response-by-response
`},
test:'Golden-master pricing suite (2,300 observed cases) before refactor; staging traffic replay for every infrastructure stage; smoke pack on every deploy from stage 2 onward.',
roll:'Each stage was independently revertible: artifact swap back, JVM version back, pipeline lane back. No stage depended on a later one landing.',
out:'Java 17 in month 7, CI/CD in month 9, release cadence from monthly to weekly; two pricing bugs found by the golden master on day one of capture (documented, then deliberately fixed).',
less:'The "boring" stages (build, pipeline) unlocked everything; the byte-identical artifact rule killed the toolchain debate; and the golden master paid for itself before any refactoring began.'},
{id:'c05',t:'Case 5 — Refactoring a 3,100-line God class',cat:'Refactoring',
init:'OrderService: 3,100 lines, 23 injected dependencies, 140 methods. Every feature since 2019 landed here. Merge conflicts on every release; nobody could hold it in their head; the file had the highest churn and zero tests.',
req:'Pricing rules were changing monthly; the business needed that velocity without the regression tax (three pricing incidents in the prior year).',
prob:'Validation, pricing, persistence, payment calls and email composition interleaved in single methods; the same status strings compared in eleven places.',
risk:'The class was the transactional heart — a wrong refactor is a revenue incident, and the safety net did not exist yet.',
inv:'Churn + complexity confirmed the hotspot (Module 04); dependency cluster analysis showed payment and email concerns were genuinely separable; pricing rules were enumerated by reading + interviewing the two veterans.',
appr:'Safety net first, then extract along responsibility lines, smallest blast radius first — the Module 06 sequence at class scale.',
plan:['Capture behavior: golden master over the pricing methods; characterization tests for the order state machine.','Extract OrderNotifications (lowest coupling) — email templating and sends.','Extract OrderPayment — gateway calls, retry, refund rules behind a PaymentGateway seam.','Extract PricingPolicy — one rule object per loyalty tier, replacing the switch.','OrderService shrinks to orchestration; ArchUnit rules forbid new dependencies crossing the new seams.'],
impl:{lang:'java',code:`
// the seam that made payment extraction testable (Module 06 + 08)
public interface PaymentGateway {
  Receipt charge(PaymentToken token, Money amount);
}
// production wiring untouched; tests inject a fake with scripted receipts
`},
test:'Characterization suite (observed, labeled with suspected quirks) + new focused tests per extracted class + the golden master rerun after every extraction.',
roll:'Each extraction was its own PR, revertible independently; the orchestrator kept delegating, so reverting one extraction never invalidated the others.',
out:'OrderService at 380 lines (orchestration only); pricing incidents stopped; the monthly pricing change went from a two-day fear ritual to a two-hour one-file change.',
less:'Extract the edges before the core; the golden master found two pricing quirks nobody remembered; and the ArchUnit rules are what kept the class from regrowing.'},
{id:'c06',t:'Case 6 — Introducing tests into an untested codebase',cat:'Legacy testing',
init:'A 140k-line pricing and rating engine (insurance domain), 2% coverage, last release had escaped to production with a rounding defect that cost a six-figure settlement.',
req:'Regulatory change arriving in two quarters required touching the deepest calculation paths; the business mandated "no more settlement-class escapes".',
prob:'Calculations read global configuration singletons; date handling was non-deterministic (new Date() inline); the only "tests" were a manual spreadsheet comparison ritual.',
risk:'Untestable-looking code invites the rewrite temptation; the regulatory deadline made a rewrite impossible and a careless refactor dangerous.',
inv:'Seam analysis (Module 08): configuration and clock were the two substitutions that made 80% of calculation paths deterministic.',
appr:'Characterization-first: pin current behavior including its quirks, then refactor for testability only where the regulatory change would land.',
plan:['Introduce Clock and ConfigProvider seams via wrap-class (behavior-preserving, one PR each).','Golden master: replay two years of historical policies through the engine, capture outputs, diff on every run.','Characterization suite on the paths the regulatory change would touch.','Refactor those paths only; leave the frozen rest alone.','Quirk backlog: each suspicious pinned behavior became a ticket with a business ruling — bug or rule.'],
impl:{lang:'java',code:`
// the seam that made time stop mattering
public class RatingEngine {
  private final Clock clock;                     // injected
  public BigDecimal rate(Policy p) {
    LocalDate asOf = LocalDate.now(clock);       // deterministic under test
    ...
  }
}
// golden master pinned 14,000 historical ratings; first run found the
// rounding quirk that had caused the settlement — captured, reported, fixed
// as a deliberate, reviewed behavior change.
`},
test:'The golden master was the test strategy for the refactor; unit tests grew only in refactored paths; the quirk backlog items became bug-fix PRs each with a regression test.',
roll:'Seams were additive; reverting any step restored prior behavior exactly. The one behavior fix (rounding) was a separate, deliberately-signed change.',
out:'Coverage on the touched paths went to 87%; the regulatory change shipped a week early; the historical-replay harness became a permanent release gate.',
less:'Two seams (clock, config) were 80% of the untestability; the quirk backlog converted fear into a decision queue; and replaying history beat writing fresh tests for six months.'}
])
]);
LES('m20-deps','m20','Case studies: dependency and platform upgrades',3,10,[
P(R`Five upgrades, from a Spring Boot major to a full CI/CD adoption — same skeleton every time: inventory, compatibility math, staged rollout, and the rollback rehearsal that turns courage into procedure.`),
CASES([
{id:'c02',t:'Case 2 — Upgrading a Spring Boot 1.5 service (the long way round)',cat:'Framework upgrade',
init:'A customer-facing service on Spring Boot 1.5 (2017), Java 8, Hibernate 5.0, running in production untouched for four years. EOL for years; security had flagged the dependency line.',
req:'No functional changes during the upgrade; zero-downtime for a service serving 900 rps at peak; done without a dedicated platform team.',
prob:'Three majors to cross (1.5 → 2.7 → 3.x), each with breaking changes; javax→jakarta would touch every servlet import; the service had 71% coverage — good, but on stale mocks.',
risk:'A failed major-step could break the customer-facing path at 900 rps; each hop needed a rehearsed flip-back before it was allowed.',
inv:'Upgrade-path research (release notes per major), grep inventory of javax usage, property audit (340 properties, 60 renamed along the path), partner contract check (no API shape change required).',
appr:'One major at a time, each a full release with its own soak; the database layer kept compatible with both versions during each cutover (expand-and-contract).',
plan:['1.5 → 2.7 first (the long-stable target): property migrations, deprecated API fixes; full-suite + contract tests green; one-month soak.','Java 8 → 17 as its own release (Module 12 pattern).','2.7 → 3.2: OpenRewrite for jakarta + property moves; human review of the codemod diff; Hibernate 6 SQL audit against Testcontainers.','Canary rollout per stage; error-budget watch for a week per bump.','ADR-021 documenting the path and the next horizon (Boot 3.x line maintenance).'],
test:'Contract tests against two consumer pacts (Module 14); Testcontainers integration suite comparing Hibernate 5 vs 6 generated SQL; load test to catch the GC-default changes at 900 rps.',
roll:'Blue-green per stage: old version kept warm; gateway flip-back rehearsed before each cutover. Schema changes additive-only throughout.',
out:'Fourteen weeks, three majors, zero downtime, one mid-flight rollback (a property rename the migrator missed — caught by canary error rates, fixed in a day).',
less:'Soak time per major was the schedule&#39;s best spend; the codemod did 90% of jakarta and missed the 10% that mattered in custom filters; canary caught what the suite missed.'},
{id:'c04',t:'Case 4 — Replacing a deprecated dependency (the abandoned SDK)',cat:'Dependency replacement',
init:'A payment SDK, unmaintained for three years (last release predates its maintainer&#39;s shutdown), vendored into the repo with local patches, calling a PSP API that itself was being deprecated.',
req:'The PSP&#39;s old API endpoint would shut down on a fixed date; the replacement had to be in place two weeks early for the holiday freeze.',
prob:'The SDK&#39;s API leaked into 47 call sites; its error taxonomy (string-typed) was load-bearing in retry logic; nobody trusted the vendored fork.',
risk:'Money path: a broken swap drops charges or doubles refunds; the flag and the shadow phase keep it reversible.',
inv:'Call-site inventory; PSP&#39;s new API documentation; a spike proving the new client library in a scratch service against the PSP sandbox.',
appr:'Anti-corruption, not substitution: introduce a PaymentGateway interface owned by the service, adapter the old SDK behind it, then swap adapters.',
plan:['Define PaymentGateway from the service&#39;s needs (charge, refund, verify) — not from either SDK&#39;s shape.','Adapter A wraps the vendored SDK; all 47 call sites migrate to the interface (mechanical, tested).','Adapter B implements the new PSP API behind the same interface; feature-flagged.','Shadow traffic: 5% of charges through B, responses compared, then 100%.','Delete the vendored SDK and Adapter A after a clean business cycle.'],
test:'Contract tests on the gateway interface; shadow-traffic comparison logs; the retry logic&#39;s tests rerun against Adapter B&#39;s typed error model.',
roll:'Flag back to Adapter A at any point — the old SDK stayed functional until the PSP&#39;s shutdown date made the decision for everyone.',
out:'Swapped two weeks before the deadline; the typed error model surfaced a retry-on-non-retryable bug that had been silently doubling refunds for months.',
less:'The interface you own is the migration tool; shadow traffic is the only honest test of a money-path swap; and vendored forks are debt with a countdown timer.'},
{id:'c10',t:'Case 10 — Upgrading a Kafka consumer without losing messages',cat:'Messaging upgrade',
init:'A legacy consumer on the old high-level Kafka API (zookeeper-based offsets), single-threaded, at-risk poll loop, manually tuned rebalance behavior that nobody could explain; 40 million events/day.',
req:'Move to the modern consumer API with consumer-group rebalancing; no message loss and no duplicate side-effects during the transition; the processing must stay idempotent.',
prob:'Old client pinned to an EOL Kafka broker version; at-least-once semantics were accidental rather than designed; poison messages caused full-partition stalls.',
risk:'Message loss or duplicate side-effects during cutover; the ack-semantics fix itself changes redelivery behavior under crashes.',
inv:'Offset-consumer audit; side-effect inventory (what does processing one event touch?); duplicate-exposure analysis showing processing was already accidentally idempotent (natural keys in the sink).',
appr:'Blue-green the consumer group: new client consuming the same topics in a shadow group, then cutover by offset handoff.',
plan:['Make processing explicitly idempotent (upsert by event key) — a prerequisite, not an optimization.','Deploy the new consumer in a shadow group from current offsets; compare downstream state for drift.','Rebalance drills in staging: kill instances mid-poll, verify partition assignment and no gaps.','Cutover: stop old group at a logged offset; start new group from that offset; verify counts.','Add dead-letter queue handling for poison messages (previously: stall).'],
impl:{lang:'java',code:`
// the cutover handshake, in outline
// old group: commit nothing further; log last-seen offsets per partition
// new group: assign(partitions) + seek(eachPartition, loggedOffset)
// verification: end-to-end counts per minute, old vs new, must match exactly
`},
test:'Staging chaos: broker restarts, consumer kills mid-batch, poison-message injection; a reconciliation job counting events in vs side-effects out.',
roll:'The old consumer stayed deployable for one full cycle; cutover back = restart old group from the new group&#39;s committed offsets (the handshake worked both ways — rehearsed).',
out:'Cutover with zero loss and zero duplicate side-effects; the DLQ turned three monthly stall incidents into zero; consumer lag dashboards became boring.',
less:'Idempotency first, infrastructure second; the shadow-group pattern is the messaging version of the Module 09 facade; and counts-per-minute is the rollback argument-ender.'},
{id:'c11',t:'Case 11 — Modernizing a Docker deployment',cat:'Platform modernization',
init:'A hand-built deployment: openjdk:11 images (mutable tag), application running as root, secrets in environment variables committed to a private repo, deploy = docker pull && restart on four VMs, no health checks.',
req:'Security compliance (the audit findings were becoming blockers); reproducible deploys; the service must stay up throughout.',
prob:'Every image build was a surprise (mutable base); configuration lived in three overlapping .env files with per-VM drift; the root-running container was a finding with a deadline.',
risk:'A bad image takes the service down on all VMs at once; per-VM cutover with health gates contains the blast radius.',
inv:'VM inventory and drift diff; base-image analysis (two VMs were running a build from a different year); secret inventory from the repo history (the embarrassing part).',
appr:'Module 15&#39;s checklist: multi-stage builds, digest pinning, non-root, healthchecks, IaC for the VMs — then a clean cut to a small orchestrator.',
plan:['Multi-stage Dockerfile, digest-pinned temurin base, non-root user, HEALTHCHECK — deployed to one VM, watched for a week.','Secrets to a managed store; the overlap maneuver for the three .env readers.','IaC the four VMs (import, then manage); deploy becomes a pipeline artifact push.','Cut VMs over to the new image one at a time behind a load balancer health gate.'],
test:'Pipeline smoke tests post-deploy (health endpoint + synthetic order); restore drill on the IaC-managed config; secret-rotation verification.',
roll:'Per-VM cutover with instant traffic drain-back to the previous VM; images tagged and retained for one cycle.',
out:'Audit findings closed; deploys went from a 40-minute ritual to a 6-minute pipeline; the two "mystery" VMs converged onto one known-good build.',
less:'Mutable tags are a reproducibility bug you have not noticed yet; the overlap maneuver applies to config exactly as it does to APIs; and one-week observation windows caught what tests could not.'},
{id:'c12',t:'Case 12 — From manual deployments to CI/CD',cat:'Release engineering',
init:'Deployments performed by one release engineer over SSH: a 14-step wiki runbook, ~2 hours, after hours, roughly every three weeks (the fear tax). Rollback = "restore the database and pray".',
req:'Weekly releases without heroics; auditable deploys (regulated industry); the release engineer going on parental leave in four months.',
prob:'The runbook had seven steps that could fail silently; environments drifted (staging matched production only by coincidence); nobody else could deploy.',
risk:'A broken pipeline freezes releases org-wide; the shadow phase exists to catch divergence before the pipeline becomes the only path.',
inv:'Time-lapse the manual deploy (screen recording); classified each step: automatable / human-judgment / cargo cult; environment diff inventory.',
appr:'Shadow pipeline first (Module 15): the pipeline reproduces the runbook, compared against manual deploys until parity, then the pipeline becomes the only path.',

test:'Each pipeline run self-verifies (deploy → smoke → canary promote); rollback job rehearsed quarterly; audit trail assertion (every deploy traceable to a commit + approver).',

out:'Deploys in 9 minutes, twice a week, by anyone on the team; the parental leave passed without a incident; the audit finding closed.',

])
]);
LES('m20-data','m20','Case studies: data, messaging and API migrations',3,10,[
P(R`Three migrations where the data was the protagonist: a schema split done live, a message system modernization, and an API version retirement done without breaking a single client.`),
CASES([
{id:'c03',t:'Case 3 — Migrating PostgreSQL schemas safely (splitting customer names)',cat:'Database migration',
init:'customers.name (one free-text field, 4.2M rows) feeding billing labels, shipping addresses, fraud matching and analytics — all with different parsing assumptions; the fraud team wanted first/last separately, and shipping wanted delivery salutations.',
req:'Zero downtime; both shapes available during a two-release transition; no data loss; the fraud model retraining deadline six weeks out.',
prob:'Any single-statement rewrite would lock the table for minutes; names were messy (mononyms, suffixes, non-Latin scripts); four consumer systems read the column with their own parsing.',
risk:'A lock-heavy backfill stalls the 900-rps order path; the drop is irreversible — consumer inventory gates it.',
inv:'Consumer inventory (the Module 02 integration list — found a fifth consumer nobody remembered: the data warehouse); name-pattern profiling (3.1% mononyms, 0.4% with suffixes); lock-time rehearsal on a production snapshot.',
appr:'Expand-and-contract (Module 11), with the parsing rules documented at the seam.',
plan:['Expand: add first_name, last_name (nullable).','Dual-write both shapes in the same transaction.','Backfill in 5,000-row keyset batches, resumable, progress-metered.','Flag-switch readers per consumer (fraud first — they asked).','Warehouse consumer migrates; old column stops being written; contract: drop name.'],
impl:{lang:'sql',code:`
-- the backfill pass, resumable by design (Module 11 step 3)
UPDATE customers
SET first_name = split_part(name, ' ', 1),
    last_name  = trim(substring(name from position(' ' in name)))
WHERE id IN (SELECT id FROM customers
             WHERE first_name IS NULL ORDER BY id LIMIT 5000);
-- mononyms: last_name stays NULL by documented rule; suffixes (0.4%)
-- routed to a manual review queue of 17,000 rows — humans for the weird tail.
`},
test:'Reconciliation counts after every batch; a consumer-parity harness replaying warehouse queries against both shapes; lock-time rehearsal gated each migration on the staging snapshot.',
roll:'Every step additive and revertible until the drop; the drop itself waited for one clean business cycle plus explicit sign-off from all five consumers.',
out:'Six weeks, no downtime, 17k manual-review rows resolved in four days; the fraud model retrained on schedule; the parse rules now live in one tested class.',
less:'The fifth consumer was found by inventory, not luck; the manual queue for the weird tail was cheaper than a perfect parser; and per-consumer flag flips kept every blast radius tiny.'},
{id:'c09',t:'Case 9 — Migrating RabbitMQ message processing',cat:'Messaging migration',
init:'A 2016-era consumer: manual acknowledgements with a bug (ack before side-effects committed — silently losing messages on crash), no dead-letter queue, prefetch = unlimited (a memory footgun), classic queue mirroring on an old cluster.',
req:'No message loss during migration; poison messages must stop stalling queues; move to quorum queues and a current client.',
prob:'The ack-before-commit bug meant "at-least-once" was actually "at-most-once"; unlimited prefetch caused OOM kills under backlog; poison messages parked in the head of queues blocking everything behind them.',
risk:'The ack fix changes redelivery semantics; the queue-type migration can stall consumers mid-cutover if done in one move.',
inv:'Queue-by-queue inventory with rates; crash-testing the consumer (kill -9 mid-process) to prove the loss window; DLQ design per queue.',
appr:'Fix semantics before infrastructure: idempotent processing + ack-after-commit, then queue-type migration with dual consumption.',
plan:['Make side-effects idempotent (upsert by message key) — the prerequisite.','Fix the ack bug: commit side-effects, then ack; crash-test proves the window closed.','Set prefetch to a sane bound (tested at 50); add DLQs with max-retry + alerting.','Migrate queues classic → quorum during a low-traffic window, one queue at a time, consumers reconnecting behind a circuit breaker.'],
impl:{lang:'java',code:`
// before: ack, then work — a loss window the crash test exposed
handleMessage delivery -> { channel.basicAck(tag, false); process(delivery); }

// after: work, commit, then ack — at-least-once, made safe by idempotency
@RabbitListener(queues = "orders.new", ackMode = "MANUAL")
void on(Delivery d, Channel ch) {
  process(d);                       // upsert by message key: idempotent
  ch.basicAck(d.getTag(), false);   // crash here? redelivery is harmless
}
`},
test:'Crash-injection suite (kill between process and ack; assert redelivery produces no duplicate side-effects); backlog soak test with prefetch bound; poison-message drill.',
roll:'Queue migration was per-queue revertible (classic queues kept until the quorum twin proved clean); the ack fix was a normal release with the crash tests as its gate.',
out:'Message loss window closed (provable); OOM kills stopped under backlog; poison messages now land in a DLQ with an alert instead of stalling 40k messages behind them.',
less:'Semantics bugs hide in the gap between "works in demo" and "works when killed"; crash tests are cheap and decisive; and idempotency is the license every messaging migration needs.'},
{id:'c13',t:'Case 13 — Migrating a REST API to v2, breaking zero clients',cat:'API migration',
init:'A public REST API (300+ registered consumers, unknown mobile app versions in the wild) on /v1, with a data model that had grown three incompatible field semantics since 2018 (the total field meant three different things depending on a query parameter).',
req:'A coherent v2 model; v1 retired within 12 months; zero breaking-change incidents tolerated (a partner SLA with teeth).',
prob:'The field-semantics split could not be fixed inside v1 without breaking someone; 300 consumers meant the long tail was the project; strict-schema consumers existed (surprise).',
risk:'Three hundred registered consumers, one partner SLA with teeth: a single breaking change is a contract incident, not a bug.',
inv:'Gateway log analysis: 300 registered, 190 actually calling, 62 with traffic in the last month; per-consumer field usage from request/response sampling; the strict-schema consumers identified by their user-agents.',
appr:'Module 14 lifecycle: v2 canonical with v1 as an adapter; deprecation signals machine-readable; the tail chased personally.',

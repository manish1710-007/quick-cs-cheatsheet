LES('m21-decide','m21','Refactor, rewrite, replace, or leave it alone',3,10,[
P(R`Every maintenance program eventually faces the question this module exists for: what do we do with <i>this</i> system? The four answers — refactor, rewrite, replace, leave — are not flavors of courage; they are different engineering bets with different failure modes. Choosing well is the highest-leverage judgment a senior engineer makes, and it deserves a framework instead of a mood.`),
H('The decision matrix'),
TB(['Verdict','Choose it when','The honest risk'],[
['<b>Refactor in place</b>','The architecture fits the next 3-5 years; the pain is local (structure, tests, boundaries); the team can grow the code incrementally behind a safety net','Sunk-cost creep: five years of "refactoring" that never changes the curve — the register and the velocity trend are your lie detector'],
['<b>Rewrite</b>','Requirements shifted fundamentally; the platform/stack is dead-ending; the codebase actively fights every safe change even after serious modularization attempts; and the org can fund a parallel runway','Second-system effect (the rewrite tries to fix everything, ships in year three); lost learning; parallel maintenance of old + new for the whole runway; the graveyard of rewrites abandoned at 80%'],
['<b>Replace (buy/adopt)</b>','The capability is commodity (auth, billing, email, CMS); a maintained product does it better than your team ever will','Data migration out of the old system; vendor lock-in; the integration seam still needs an owner — you outsource the code, not the responsibility'],
['<b>Leave it alone</b>','Change is rare, the system is stable, risk dominates cost, and containment (tests around it, monitoring, documentation) is in place','Neglect dressed as judgment: "leave alone" is only a decision if it is reviewed — Module 07&#39;s posture, revisited yearly with an owner&#39;s signature']]),
H('The rewrite checklist — run it before you fall in love'),
UL([R`<b>Have we actually modularized?</b> Most "we must rewrite" systems have never had their seams built. A rewrite of an unmodularized system inherits the chaos, plus a deadline.`,
R`<b>Is the domain knowledge recoverable?</b> The old system contains twenty years of business rules, including the undocumented ones. Who extracts them, and when? (Modules 02 and 08 are the extraction toolkit.)`,
R`<b>What is the parallel-run plan?</b> Old and new will coexist for the whole runway: shadow traffic, reconciliation, double the on-call. Budget it or do not start.`,
R`<b>What scope discipline exists?</b> The rewrite that also fixes every past grievance never ships. Freeze scope to the old system&#39;s actual behavior, then improve incrementally after cutover.`,
R`<b>What is the exit cost of stopping at 60%?</b> Rewrite projects die at 60%. If that happens, are you better off than today — or running two half-systems forever? The strangler pattern&#39;s whole advantage is that its 60% state is still a win.`]),
H('Incremental vs. big-bang, one more time'),
TB(['Dimension','Incremental (strangler, expand-and-contract)','Big-bang'],[
['Reversibility','Every slice reversible; pause = partial win','One cutover; pause = two systems'],
['Learning','Each slice informs the next','All assumptions tested on day one — in production'],
['Funding','Sustainable cadence, cancellable','Lumpy, politically hard to cancel (which is sometimes why it is chosen)'],
['Fits when','The system must keep serving','Genuinely greenfield, or total platform swap with an old system kept as read-only reference']]),
CALL('note',R`Modernization vs. migration, defined for the last time: <b>modernization</b> changes what the system is built on and how it is shaped (Java 21, modular monolith, current platform); <b>migration</b> moves it (new cloud, new region, new provider). They share every technique in this guide and differ in the risk register — migrations have a stronger data-integrity lens, modernizations a stronger architecture lens. Both are incremental or they are gambles.`)
]);
LES('m21-balance','m21','Sustainable evolution: judgment under constraints',3,9,[
P(R`The final skill is not a technique — it is the calibration of all techniques against each other, under the constraints that are always real: finite capacity, competing roadmaps, imperfect knowledge, and the strong gravitational pull of industry fashion.`),
H('Balancing features against maintenance'),
UL([R`<b>The budget is the argument-ender</b> (Module 05): a fixed maintenance share stops the weekly renegotiation. What is negotiated is which register items the budget buys this sprint — a fifteen-minute conversation, not a values debate.`,
R`<b>Maintenance that unblocks a feature wins scheduling</b> almost automatically: refactor the module the roadmap is about to touch. Keep the roadmap adjacent when prioritizing.`,
R`<b>When the error budget burns, the argument is over</b> (Module 16): reliability work jumps the queue by policy, not by seniority of the person shouting.`,
R`<b>Name the deferred work</b>: "we are choosing to take debt X to ship Y by Z" — said out loud, with a register row — is engineering; the same decision made silently is drift.`]),
H('Managing architectural change'),
UL([R`Architecture changes ride the same incremental rails as code: an ADR per decision, a boundary per release, an extraction per quarter — never a quarter&#39;s worth of redesign in one branch.`,
R`The architecture follows the organization&#39;s shape (team boundaries, ownership) as much as the domain&#39;s — reorgs are architecture events, and deserve the ADR treatment.`,
R`Reversibility is the design property to optimize: prefer decisions you can undo cheaply (flags, facades, adapters) over decisions you cannot (shared databases, hard vendor integration).`]),
H('Resisting trends'),
UL([R`<b>Ask what problem the trend solves, then ask whether you have that problem.</b> Microservices solve team-collision problems (Module 10); Kubernetes solves fleet-scale operations; event streaming solves integration at scale. Solutions without problems are complexity with a logo.`,
R`<b>Beware the resume-driven rewrite</b> — the modernization whose strongest argument is the team&#39;s curiosity. Curiosity is real engineering currency, but spend it where the debt register says it pays.`,
R`<b>Adopt at the edge first</b>: a new pattern in a leaf service is an experiment you can survive; in the transactional core, it is a bet the company is making without knowing.`,
R`<b>The boring-technology discipline</b>: for the money path, prefer boring and proven; spend your innovation tokens where failure is cheap.`]),
H('Deciding under constraints — the closing checklist'),
P(R`When you inherit a mess and must choose under uncertainty, run this sequence, in order: <b>1.</b> Measure before judging (Modules 02, 04) — most "disasters" are two hotspots and a myth. <b>2.</b> Build the safety net before anything else moves (Module 08). <b>3.</b> Fix the flow of new debt before repaying the old (Module 05) — or you are bailing with the tap open. <b>4.</b> Prefer reversible, incremental moves; make big irreversible ones rare, rehearsed and signed (Modules 09, 11, 16). <b>5.</b> Write the decision down (Module 18) so the next engineer inherits reasoning, not folklore. And <b>6.</b> review the decision on a calendar — a verdict that was right at the time goes stale, quietly, like every other debt in the register.`),
CALL('tip',R`The whole guide in one sentence: <b>keep the system changeable, and change it a little, all the time, with evidence.</b> Every module — the debt register, the characterization tests, the expand-and-contract migrations, the rollback drills, the postmortems — is that sentence wearing different clothes. The <a href="#decsim">Decision Simulator</a> and the <a href="#risktool">Risk Assessment tool</a> are the final practice rounds; the interview arena&#39;s advanced questions are where you defend the judgment out loud.`)
]);

  public TrackingResponse track(String trackingNr) {

        || "In-Transit".equals(s.getStatus())) {

public void syncWarehouse(Order o) {

/* ================= INTERVIEW ARENA ================= */
const INTERVIEW=[
{id:'i1',level:1,cat:'Fundamentals',q:'What is software maintenance?',a:R`The engineering activities performed after delivery: correcting faults, adapting the system to a changed environment, improving it for new requirements, and preventing future problems. The ISO/IEC 14764 vocabulary splits this into corrective, adaptive, perfective and preventive maintenance. The framing that matters in an interview: maintenance is where most lifecycle cost and most real engineering difficulty live (commonly cited estimates put it at 40-80 percent of total cost), and it is a continuous responsibility — not a cleanup sprint. Strong answers connect maintenance to changeability: a system is maintainable exactly when the next required change is cheap, safe and understood.`},
{id:'i2',level:1,cat:'Fundamentals',q:'What are the four types of software maintenance?',a:R`<b>Corrective</b>: fixing observed faults (a hotfix for double-charged orders). <b>Adaptive</b>: adjusting to environmental change (Java 8 EOL, a partner API adding mandatory auth). <b>Perfective</b>: improving against new or evolving requirements (partial refunds) — scheduled like feature work, because it is feature work. <b>Preventive</b>: reducing future cost or risk (extracting a God class before the next big change lands in it). The useful follow-up point: the types blur in practice — a framework upgrade is adaptive but uncovers corrective work — yet the vocabulary makes invisible work visible in stakeholder conversations, which is half of managing maintenance politically.`},
{id:'i3',level:1,cat:'Technical debt',q:'What is technical debt?',a:R`A gap between the design the system has and the design current requirements and knowledge would justify, carried forward because closing it now costs more than it returns — Ward Cunningham's metaphor, where the gap charges interest on every future change. The crisp interview distinctions: debt is about tomorrow's cost, bugs are about today's correctness; a documented trade-off with living context is not debt, but becomes debt the moment its justification is lost. Fowler's quadrant adds the useful axes: deliberate vs. inadvertent, prudent vs. reckless — the remedy differs by quadrant (a repayment plan vs. capability building), and deliberate-prudent debt is simply engineering.`},
{id:'i4',level:1,cat:'Refactoring',q:'What is refactoring?',a:R`Changing internal structure without changing external behavior — Fowler's definition, with "external behavior" doing the heavy lifting: same outputs, same side effects, same error behavior. Refactoring requires a safety net (tests that fail if behavior changes), small individually-revertible steps, and separation from feature commits. The contrast set an interviewer wants: rewriting re-specifies behavior and replaces the implementation wholesale; optimization preserves behavior but changes resource profiles; taste-driven restructuring has no contract at all. The senior addendum: refactoring is prioritized by the debt register — you refactor code that is about to change, not code that is about to retire.`},
{id:'i5',level:1,cat:'Legacy systems',q:'What is a legacy system?',a:R`The working definition I use is Feathers': legacy code is code without tests — because without tests, every change is an experiment run in production. Age is a risk factor, not the diagnosis; a fifteen-year-old tested, documented, owned system is mature, while a two-year-old service nobody understands or can deploy is legacy. The real dimensions: undocumented behavior, tight coupling, missing safety nets, fragile deployment, knowledge silos, unsupported dependencies. The reframe that lands with stakeholders: the opposite of legacy is not "new" but <i>changeable</i> — which points investment at control (tests, seams, runbooks) rather than novelty.`},
{id:'i6',level:1,cat:'Testing',q:'Why is regression testing important in maintenance?',a:R`Because maintenance changes are usually small edits into old, entangled code — precisely the situation where "obviously safe" changes break distant behavior. Regression testing is the accumulated memory of every defect the system has ever had: each test encodes a way the system once failed and must never fail again. In maintenance practice it is also the enabling capability for everything else: refactoring, upgrades and migrations all borrow confidence from the regression suite, and a frozen zone unfreezes the day characterization tests (its regression net) exist. Strategy: risk-based re-running — critical flows always, changed areas selectively, full suite on releases.`},
{id:'i7',level:2,cat:'Codebase analysis',q:'How do you understand an unfamiliar codebase?',a:R`Structured exploration before any change: build files first (they are the fastest architecture summary), then repository layout and entry points (controllers, listeners, scheduled jobs), then configuration (the integration inventory), then the schema (constraints are years of encoded learning), then git archaeology (churn tells you where the business lives). Then trace one workflow end to end with a debugger or logs and write it down as a five-to-ten-line note. I keep four headings: map, behavior, risks, questions. Two disciplines matter most: change nothing while exploring, and distrust documentation proportionally to its age. The stopping test: I can say where my change goes, what behavior must not change, how I verify, and how I roll back.`},
{id:'i8',level:2,cat:'Technical debt',q:'How do you prioritize technical debt?',a:R`With a transparent scoring model: Impact × Likelihood × Exposure, each 1-5 — an illustrative heuristic, not an industry standard — with remediation effort kept out of the score and used as the negotiation variable instead. Impact: what the business loses if it bites. Likelihood: probability per unit of change (churn data informs this). Exposure: blast radius across system, traffic and teams. The findings live in a debt register with ten fields (description, component, root cause, business/technical impact, risk, effort, priority, owner, recommended action), reviewed quarterly. Two honest caveats: the argument during scoring is the real work, and cosmetic findings in cold code must lose to structural findings in hot code — complexity × churn is the tiebreaker.`},
{id:'i9',level:2,cat:'Strategy',q:'Refactoring vs. rewriting — how do you decide?',a:R`Refactor when the architecture fits the next several years and the pain is local: structure, tests, boundaries. Consider rewriting only when requirements shifted fundamentally, the platform is dead-ending, and serious modularization has already been attempted and failed. The rewrite checklist: can the domain knowledge be extracted from the old system (it usually lives only there)? What is the parallel-run plan and its cost? What scope discipline prevents the second-system effect? What happens if it dies at 60% — are you better off, or running two half-systems? The honest default for a business-critical system is incremental: a strangler migration whose every pause-state is a partial win. Most "we need a rewrite" verdicts are actually "we never built the seams" — fix that first.`},
{id:'i10',level:2,cat:'Dependencies',q:'How do you safely upgrade a dependency or framework?',a:R`A ten-step habit: inventory; read the release notes and migration guide (the highest-leverage 30 minutes); grep for the breaking changes relevant to your usage; upgrade one major at a time; run the full suite; verify compatibility mechanically (dependency convergence, flyway validate, contract tests); benchmark where notes warn of performance changes; deploy progressively with the old version still running; monitor a full business cycle; write the ADR. Spring Boot 3 as the concrete example: Java 17 first as its own release, jakarta imports via codemod with human review, the temporary properties-migrator to surface renamed keys, Hibernate 6 SQL audit against Testcontainers. And the standing habit that makes it all cheap: Renovate/Dependabot keeping bumps small and routine.`},
{id:'i11',level:2,cat:'Testing',q:'What is characterization testing?',a:R`Tests that pin the behavior the code currently has, including behavior that looks wrong — the assertion derives from observation, not intention. They invert normal testing (where expectation comes from requirements) because their job is certifying stability, not correctness: they are how you earn the right to refactor code you do not fully understand. Golden-master/approval testing is the scaled version: run a broad fixed input set, capture complete outputs, diff on every later run. Workflow: capture first, refactor behind the net, and promote each pinned quirk to an explicit bug-or-rule decision — a behavior change becomes a deliberate, reviewed edit to a characterization test, never an accident. Coverage strategy: the code the next change touches, not a quest for 100 percent.`},
{id:'i12',level:2,cat:'Documentation',q:'How do you handle outdated documentation?',a:R`First, triage by consequence: docs that mislead during incidents (runbooks, on-call guides) get fixed immediately; docs that mislead during development (READMEs, architecture overviews) get fixed on the next touch; docs nobody reads get deleted — a wrong document is worse than a missing one. The durable fix is structural, not heroic: docs-as-code, reviewed in the same PR as the change they document, so drift becomes a visible diff instead of a silent lie. ADRs preserve decision context (dated, immutable, superseded rather than edited); runbooks get corrected every time they are used, as part of incident close-out; and the drift signal to watch is any doc whose "last verified" age exceeds its subject's change rate.`},
{id:'i13',level:2,cat:'Architecture',q:'What is the Strangler Fig pattern?',a:R`Fowler's 2004 pattern for gradually replacing a legacy system: build the new system around the old one's edge — a facade/gateway routes each capability to old or new — and migrate route by route, capability by capability, keeping both running until the legacy core has nothing left to do, then decommission it. Why it beats the big-bang rewrite: risk becomes a staircase of small reversible steps instead of one cliff; value ships continuously; each slice teaches the next; and rollback is a routing change, not a project. The hard parts people underestimate: data ownership and synchronization (outbox/CDC beats dual-write, with reconciliation from day one), the anti-corruption layer that keeps legacy models from leaking, and the decommissioning discipline that prevents running two systems forever.`},
{id:'i14',level:2,cat:'Databases',q:'How do you safely modify a database schema under load?',a:R`Expand-and-contract: (1) expand — add nullable columns/tables/indexes, non-breaking, each alone in its own migration; (2) compatibility release — the application writes both shapes in one transaction; (3) backfill — batched, resumable, keyset-paginated updates with sleeps, never one giant UPDATE; (4) switch reads behind a flag after verifying completeness; (5) stop writing the old shape once no deployed version uses it; (6) contract — drop the old columns, the only irreversible step, after a full business cycle and a consumer inventory. The mechanics that keep it safe: know your locks (CREATE INDEX CONCURRENTLY, ADD CONSTRAINT NOT VALID + VALIDATE), remember old and new app versions coexist during rollouts, rehearse durations on a production snapshot, and decide your recovery story (restore vs. forward fix) before the destructive step — not during it.`},
{id:'i15',level:3,cat:'Modernization',q:'How would you modernize a 10-year-old monolithic Java application?',a:R`In dependency order, every stage independently valuable. First make it changeable: working build in Maven/Gradle if needed, a pipeline with tests, and the Module 02 investigation (churn, hotspots, integration inventory). Then the runtime: staged Java upgrades behind the suite, framework majors one at a time with the migration-tooling discipline. In parallel, build the safety net where the roadmap touches (characterization first on the money path). Then structure: modularize inside the monolith — bounded contexts, ArchUnit enforcement, table ownership — before any service extraction. Extract services only where a business reason (team autonomy, scaling profile) survives the microservices cost table. Throughout: a debt register driving a maintenance budget, ADRs for every decision, progressive delivery with real rollback, and a scoreboard if it becomes a strangler program. What I would NOT do: rewrite, adopt microservices by default, or modernize syntax repo-wide for taste.`},
{id:'i16',level:3,cat:'Databases',q:'How would you migrate a database with zero downtime?',a:R`Expand-and-contract is the spine (see the schema answer), but zero-downtime at scale adds: batching discipline with progress meters and resumability; lock-time rehearsal on a production snapshot as a design gate, not a discovery; verification as a first-class phase (counts, sample joins, a routing rule for the unfillable tail — the manual review queue for weird rows); and the coexistence rule — every intermediate state must serve both application versions, because rolling deploys and canaries guarantee overlap. For moving between engines or major versions: logical replication or dump/restore with a cutover window measured by replication lag, dual-run verification with reconciliation, and a rehearsed reversal. The senior point: "zero downtime" is really "zero visible inconsistency" — the design work is making every intermediate state correct for both readers and writers, and having the reconciliation numbers to prove it.`},
{id:'i17',level:3,cat:'Testing',q:'How would you introduce tests into a legacy system that has none?',a:R`Safety net before change, and only where the next change lands. Start with the two seams that usually unlock most code: inject the clock and the configuration (determinism), and wrap or sprout the worst construction-in-method dependencies. Then capture: golden masters over historical or recorded inputs (replaying real history beats inventing test cases — the quirks you find are the undocumented business rules), plus pinpoint characterization tests on the paths about to change. Then the quirk backlog: every suspicious pinned behavior becomes an explicit bug-or-rule decision, so behavior changes are deliberate reviews, not regressions. What I would not do: chase coverage percentages across cold code, redesign for testability before capturing behavior, or write fresh "intended behavior" tests for code nobody understands — those tests just encode guesses.`},
{id:'i18',level:3,cat:'Architecture',q:'How would you migrate from a monolith to microservices?',a:R`Challenge the premise first: microservices solve organizational problems (many teams colliding on one deployable), and a modular monolith delivers most of the maintainability without the distributed bill — so the first question is what business constraint actually demands extraction. If it survives: modularize inside the monolith first (bounded contexts, enforced boundaries, table ownership) — those modules are the extraction units. Extract in risk order: edge capabilities (notifications, search), then bounded stateful contexts, transactional cores last. Each extraction runs the strangler mechanics: gateway route, event-fed data (outbox/CDC, reconciliation from day one), ownership flip per aggregate, rehearsed rollback, and honest decommissioning. The anti-pattern to name: distributing the monolith — same tangle, now with network calls and eventual consistency you did not design for.`},
{id:'i19',level:3,cat:'APIs',q:'A third-party API you depend on announces a breaking change. How do you handle it?',a:R`Triage the impact: what exactly breaks for us — request shape, response shape, auth, error semantics, rate limits — found by grepping our usage and replaying our traffic against their sandbox. Then containment behind an interface we own: an adapter isolates their version from our code (the anti-corruption layer discipline), so their change becomes an adapter change. If overlap is technically possible, dual-support the old and new during their deprecation window and switch by configuration; measure which path we use; never assume the sunset date slips. If their change is truly incompatible (semantics, not just syntax), that is a supplier decision: plan a controlled migration or a supplier replacement — with contract tests pinning our needs either way. Throughout: inventory every consumer of OUR API that the workaround might ripple into, and communicate early if our behavior shifts by even a day.`},
{id:'i20',level:3,cat:'Security',q:'How do you prioritize security vulnerabilities?',a:R`CVSS is an input, never the verdict: a 9.8 on an unreachable code path loses to a 5.3 on my internet-facing auth flow. My triage: exploitability (public exploit? worm? easy primitive?), reachability in OUR deployment (network position, configuration, feature flags — verified, not assumed), exposure (internet-facing vs internal; auth required?), impact (RCE vs disclosure vs DoS, against what data and promises), and available mitigations (patch, config-off, WAF rule — mitigation buys time for the real fix). Policy bands, adapted per context: critical-and-reachable in days through the emergency lane; highs within the month; unreachable findings are documented acceptances with revisit dates. Two standing capabilities make this possible at all: a dependency inventory you can query in minutes (the Log4Shell lesson) and a patch pipeline that exists before the CVE does.`},
{id:'i21',level:3,cat:'Dependencies',q:'How would you plan a Spring Boot major-version upgrade (e.g. 2.x to 3.x)?',a:R`Sequence runtimes first: Java 17 as its own release, verified and soaked, before the framework touches anything. Then the Boot migration in stages: read the migration guide and enumerate the breaking changes relevant to us (grep-driven, not vibe-driven); run OpenRewrite or the upgrade tooling for the mechanical 90 percent — jakarta imports, renamed properties, deprecated APIs — with human review of the codemod diff; add the temporary spring-boot-properties-migrator so startup logs flag every renamed property we actually use, then fix them and remove it. The transitive majors are the real work: Hibernate 6 means an SQL audit (Testcontainers against real PostgreSQL, comparing generated SQL), and any custom integrations touching javax.servlet get compiled early. Deploy progressively with both versions able to run against the same schema (Flyway migrations shared by both must not use 3.x-only features). Rollback rehearsed; ADR written; error budget watched for a full cycle after cutover.`},
{id:'i22',level:3,cat:'Strategy',q:'How do you balance technical debt repayment against feature development?',a:R`Structurally, so it stops being a weekly argument: a fixed maintenance budget (the 15-25 percent band, tuned to our measured drag) that ships every sprint from a prioritized register — plus the error-budget override: when the SLO burns, reliability work jumps the queue by policy, not seniority. Within the budget, priority follows the roadmap: refactor what the next feature touches (maintenance that unblocks features schedules itself), schedule the EOL horizons (they have external deadlines), and let cold-code debt wait its turn. The political half is visibility: labeled maintenance work in the tracker, the velocity curve plotted against deferral periods, and debt taken on deliberately with a register row — "we are choosing debt X to ship Y by Z" — so the ledger is honest and the interest is arguable in numbers instead of vibes.`}
];

/* ================= PRACTICAL CHALLENGES ================= */
const PRACTICALS=[
{id:'p1',t:'Investigate an unfamiliar repository',lvl:1,cat:'Codebase analysis',
 sc:'You are handed ShipFast (the Investigation Lab system): a Spring Boot 2.3 monolith with a 1,940-line TrackingService, an untested PricingService, manual-ack RabbitMQ listeners and a schema held together by a wiki page. Produce the first-day report a tech lead would trust.',
 approach:'Run the Module 02 workflow and write the four-section note: <b>map</b> (modules, entry points, integration inventory from config), <b>behavior</b> (one traced workflow, written as 5-10 lines), <b>risks</b> (each with evidence and a Module 03 category — the untested money path and the ack-before-commit suspicion lead), <b>questions</b> (what only humans can answer). Deliverable: the risk list, ranked, with the first change you would make and its safety net. Practice it live in the <a href="#invlab">Investigation Lab</a>.'},
{id:'p2',t:'Identify technical debt in a sample project',lvl:1,cat:'Technical debt',
 sc:'The OrderFlow audit found nine findings across code, architecture, testing, dependencies, infrastructure, database, documentation and security. Classify and name each one before scoring it.',
 approach:'For each finding: name the debt category (Module 03 taxonomy), separate symptom from risk, and write the one-sentence description a newcomer understands. Distinguish debt from bug and from preference — the register only holds what you would pay to close. Then score: the <a href="#debtlab">Assessment Simulator</a> gives you the nine findings with feedback on your classification and prioritization.'},
{id:'p3',t:'Prioritize maintenance issues',lvl:2,cat:'Technical debt',
 sc:'Nine findings, capacity for two this sprint, a roadmap that needs the billing-shipping cycle fixed next quarter, and a security review with a deadline. Choose.',
 approach:'Score Impact × Likelihood × Exposure per finding; keep effort as the negotiation variable. The criticals (duplicate pricing rule, EOL framework with CVEs, credentials in the repo) argue among themselves by urgency and reachability; the cycle fix scores high because it gates the roadmap despite being quiet today. Write the register rows with owners and recommended actions. The <a href="#debtlab">simulator</a> scores the same nine against the model.'},
{id:'p4',t:'Refactor a legacy Java service',lvl:2,cat:'Refactoring',
 sc:'A 120-line placeOrder method does validation, pricing, persistence, payment and email in one body, with a drifted discount rule. Refactor it — without changing what the business relies on.',
 approach:'Write the behavior contract first (exceptions, side-effect order, rounding). Extract method along the section comments; introduce OrderStatus.cancellable() to kill the stringly duplication; parameter-object the query clump; extract the payment concern behind a PaymentGateway seam. One move per commit, suite green between moves. The <a href="#refac">Refactoring Playground</a> walks six such moves with contracts and diffs.'},
{id:'p5',t:'Write characterization tests',lvl:2,cat:'Testing',
 sc:'PricingService computes loyalty discounts, quantity breaks and a bulk tier. It has no tests, and a refactor is scheduled for next sprint. Build the safety net.',
 approach:'Fix the inputs: a controlled catalog and fixed customers (tier × years matrix). Capture: run the service across a golden-master grid, observe, and pin — including the quirks (the exclusive shipping threshold, the 10% on exactly two units). Label suspected bugs in test names; file the quirk backlog for business rulings. The pattern and its tooling (JUnit @TestFactory, pytest parametrize, Jest snapshots) are in Module 08.'},
{id:'p6',t:'Upgrade an outdated dependency',lvl:2,cat:'Dependencies',
 sc:'Spring Boot 2.3.12 on Java 8 with a scanner deadline. Plan and execute the upgrade path — simulated, but the reasoning must be real.',
 approach:'Inventory; read the migration guides for each major hop; sequence Java 17 before Boot 3; plan jakarta via codemod with review; surface renamed properties with the migrator; audit Hibernate 6 SQL against Testcontainers; canary the rollout with Boot 2.7 still runnable as the fallback lane. Run the same reasoning in the <a href="#deplab">Dependency Upgrade Simulator</a> and read its remediation plan.'},
{id:'p7',t:'Design a PostgreSQL migration',lvl:3,cat:'Databases',
 sc:'Split orders.customer_name into receipt emails: 2.4M rows, 900 rps, zero downtime, five consumer systems, a warehouse job nobody remembers.',
 approach:'Expand-and-contract, all six steps, with the lock mechanics per step (nullable add, dual-write atomicity, batched keyset backfill with verification, flag-switched reads, dependency removal proven by deployment logs, drop after a full business cycle). Inventory consumers before the drop; write the forward-fix runbook before step 6. Walk it in the <a href="#dblab">Database Migration Simulator</a>, then push the failure buttons.'},
{id:'p8',t:'Plan an API version migration',lvl:3,cat:'APIs',
 sc:'Three hundred registered consumers (190 active, 62 with recent traffic), a v1 whose total field means three things, and a twelve-month horizon. Migrate to v2 without breaking a client.',
 approach:'Design v2 with explicit semantics; serve v1 through an adapter, never a fork. Deprecation lifecycle: announce with dates, dual-run, signal with Deprecation/Sunset headers on every v1 response, watch per-consumer traffic dashboards, chase the tail personally, 410 with a migration guide for the grace window, then delete. Contract tests replay the 190 active shapes against v2 nightly. Case 13 is the worked story.'},
{id:'p9',t:'Create a rollback strategy',lvl:3,cat:'Production',
 sc:'A release next Thursday bundles a new pricing service, a schema change and a framework patch. Design the rollback before the release ships.',
 approach:'Decompose: the framework patch reverts independently; the pricing service ships behind a flag (kill-switch default); the schema change must be expand-only this release (contract steps never share a release with a cutover). Write the compatibility constraint explicitly — the old application version must run against the new schema — and rehearse: flag-off drill, instance drain-back, artifact swap. A release is not done until its reversal has been executed once. The <a href="#risktool">Risk Assessment tool</a> then scores the profile honestly.'},
{id:'p10',t:'Design a legacy modernization roadmap',lvl:3,cat:'Modernization',
 sc:'One year, one team of six, an 800k-line monolith on an EOL stack, four teams colliding, and a business that cannot stop shipping. Produce the roadmap.',
 approach:'Dependency-ordered stages, each independently valuable: investigation and safety nets (characterization on the money path) → build/pipeline → runtime and framework majors → modularization (bounded contexts, ArchUnit, table ownership) → edge extractions where autonomy pays → transactional core last, if ever. Budget: register-driven maintenance share plus the modernization line item; governance: ADRs, scoreboard, decommission discipline. Defend it against the rewrite temptation with Module 21&#39;s checklist — and rehearse the judgment in the <a href="#decsim">Decision Simulator</a>.'}
];
/* ================= KNOWLEDGE CHECKS ================= */
const QUIZ=[
{id:'q1',topic:'m01',type:'tf',q:'Preventive maintenance means fixing problems after users report them.',opts:['True','False'],a:1,why:'Fixing reported faults is corrective maintenance. Preventive maintenance reduces future cost or risk before failure — refactoring a hotspot, rotating secrets, deleting dead code.'},
{id:'q2',topic:'m01',type:'mcq',q:'Your partner API now requires OAuth headers, so you must change your service. Which maintenance type is this?',opts:['Corrective','Adaptive','Perfective','Preventive'],a:1,why:'The environment changed under the system — the classic adaptive maintenance trigger. The deadline is external, which is exactly why horizon tracking matters.'},
{id:'q3',topic:'m02',type:'mcq',q:'You have one hour before your first look at an unfamiliar Maven project. What gives you the fastest architecture summary?',opts:['The largest Java file','The build file (pom.xml) and repository layout','The changelog','The test folder'],a:1,why:'Build files name the stack, versions, modules and dependency posture in minutes — the highest-density architectural information in the repo. Then build untouched and run the tests.'},
{id:'q4',topic:'m02',type:'scenario',q:'The README says orders are archived after 90 days; the schema and the data show 30 days, verified in production. Which do you trust?',opts:['The README — it is the documentation','The schema and observed production behavior','Whichever the team lead remembers','Neither — ask the database vendor'],a:1,why:'Observed, verified behavior is the specification; documentation drift is the rule. Record the divergence as a documentation-debt finding rather than "fixing" either side silently.'},
{id:'q5',topic:'m03',type:'mcq',q:'Which statement best distinguishes technical debt from a bug?',opts:['Debt is always cheaper to fix than bugs','A bug is wrong behavior today; debt raises the cost and risk of tomorrow&#39;s changes','Bugs live in code, debt lives in infrastructure','There is no real difference'],a:1,why:'Bugs violate current requirements now; debt is about future change cost. They interact — debt hides and breeds bugs — but the test "would remediating it now make future changes cheaper or safer?" separates them.'},
{id:'q6',topic:'m03',type:'mcq',q:'"We ship the simple version now and schedule the abstraction for next sprint, with a ticket and an owner." Which quadrant is this?',opts:['Deliberate and reckless','Deliberate and prudent','Inadvertent and prudent','Inadvertent and reckless'],a:1,why:'Fowler&#39;s quadrant: chosen consciously (deliberate) with a repayment plan (prudent). It is the healthiest kind of debt — engineering, not failure. The same shortcut without the ticket is the reckless cousin.'},
{id:'q7',topic:'m03',type:'tf',q:'A documented trade-off whose context is still alive and known to the team counts as technical debt.',opts:['True','False'],a:1,why:'It is a legitimate engineering trade-off. It becomes debt when the justification expires or its context is lost — the moment the organization can no longer make an informed decision about it.'},
{id:'q8',topic:'m04',type:'mcq',q:'What does a code hotspot combine?',opts:['Complexity and test coverage','Complexity and change frequency (churn)','Lines of code and dependencies','Age and defect count'],a:1,why:'Complexity × churn: a monstrous but frozen file is trivia; a moderately complex file changed weekly is where regressions are born. Git history supplies the churn half.'},
{id:'q9',topic:'m04',type:'mcq',q:'Which audit finding is high-risk rather than cosmetic?',opts:['A 30% duplication rate across five report generators, changed yearly','A stable utility class named HelperUtils with 60 static methods','A drifted discount rule duplicated in two layers of the hottest file in the repo','Old comments in a frozen module'],a:2,why:'Risk lives where change is frequent and failure is expensive: money logic, already drifted, in the highest-churn file. The rest are real but cold findings — register them, do not chase them.'},
{id:'q10',topic:'m05',type:'mcq',q:'A finding scores Impact 4, Likelihood 3, Exposure 4. What is its priority score and band (≥60 Critical, 25-59 High, 8-24 Medium)?',opts:['11 — Medium','24 — Medium','48 — High','80 — Critical'],a:2,why:'4 × 3 × 4 = 48 — High band. The model is a transparent heuristic: its value is surfacing disagreement about the three inputs, not mathematical precision.'},
{id:'q11',topic:'m05',type:'mcq',q:'Why is remediation effort deliberately kept OUT of the priority score?',opts:['Effort is impossible to estimate','Effort is the negotiation variable against capacity — mixing it in hides conscious trade-offs','Effort equals impact anyway','To make the formula harder'],a:1,why:'Score tells you what matters; effort tells you what it costs. A Critical two-week fix and a High two-day fix may both land in one sprint — but the team should know it traded score for effort consciously, not implicitly.'},
{id:'q12',topic:'m06',type:'mcq',q:'Which of these must remain identical after a refactoring?',opts:['Line count','The external behavior: outputs, side effects, error behavior','Internal method names','The number of classes'],a:1,why:'Fowler&#39;s contract is behavior preservation. Writing down exactly what stays invariant (exceptions thrown, side-effect order, rounding) is the review checklist and the test plan in one.'},
{id:'q13',topic:'m06',type:'tf',q:'Fixing a bug and refactoring the surrounding code in the same commit is fine if both are small.',opts:['True','False'],a:1,why:'It breaks the contract: the reviewer cannot see which changes preserve behavior and which change it. Structure changes and behavior changes are separate commits, separate reviews, always.'},
{id:'q14',topic:'m06',type:'mcq',q:'Replace Conditional with Polymorphism pays off when…',opts:['…the conditional has two stable branches','…the branches vary by type AND change often — new types appear','…the code has no tests','…the switch returns void'],a:1,why:'Polymorphism earns its indirection when new types arrive frequently (compiler-enforced exhaustiveness) and rules vary per type. A stable two-branch if is clearer as an if — do not polymorph trivia.'},
{id:'q15',topic:'m07',type:'mcq',q:'Which system is LEAST legacy by the working definition used in this guide?',opts:['A 12-year-old billing core with 70% coverage, current runbooks and a rotating owner team','A 2-year-old Kotlin service only its author can deploy','A mainframe module nobody touches, wrapped behind a tested facade','A PHP app on a dead framework, zero tests'],a:0,why:'Legacy = loss of control, not age. The old-but-tested, documented, owned system is mature (Module 07); the young single-deployer service is legacy on every dimension that matters.'},
{id:'q16',topic:'m08',type:'mcq',q:'A characterization test&#39;s expected value comes from…',opts:['…the requirements document','…observing what the code currently does','…the original developer&#39;s intent','…the most common industry behavior'],a:1,why:'Observation, not intention: you certify stability, not correctness. Suspected bugs get labeled in the test name and promoted to an explicit bug-or-rule decision — never silently "fixed".'},
{id:'q17',topic:'m08',type:'mcq',q:'What is a test seam?',opts:['A tear in the fabric of the test suite','A place where behavior can be altered without editing the code under test — where a double substitutes a dependency','A special test-only database','A breakpoint in the debugger'],a:1,why:'Feathers&#39; definition: seams (object, link, compile-time) are where tests substitute doubles. Legacy code is short on seams, so the craft is creating them with minimal behavior-preserving edits.'},
{id:'q18',topic:'m09',type:'mcq',q:'Which capability is the BEST first strangler slice?',opts:['The transactional order-placement core','Notifications: low coupling, no transactional writes, high tolerance for glitches','Authentication for every route','The shared customer database'],a:1,why:'Start at the edge, not the heart: notifications read events and send emails — few shared tables, no money at risk if a send is late. The transactional core comes last, after the team has earned the pattern.'},
{id:'q19',topic:'m09',type:'mcq',q:'Why is dual-write called a trap during data migration?',opts:['It is too slow','The two writes can diverge — and teams skip building reconciliation until divergence is discovered in an incident','It requires two databases','It doubles the code size'],a:1,why:'Dual-write looks like progress and quietly accumulates drift. If used for a phase, reconciliation measuring per-table divergence must exist from day one — or prefer the outbox/CDC strategy.'},
{id:'q20',topic:'m09',type:'scenario',q:'Two hours after flipping 10% of search traffic to the new service, its error rate crosses 5%. What is the correct first move?',opts:['Debug live traffic on the new service','Flip the route back to the legacy path, then investigate','Restart the legacy monolith','Raise the percentage to gather more data'],a:1,why:'The whole architecture of incremental migration is reversibility: route back (seconds, config), stop the bleeding, fix forward, re-migrate with the lesson. Debugging live on a failing slice serves the incident, not the customer.'},
{id:'q21',topic:'m10',type:'mcq',q:'A single team owns a product with unclear domain boundaries and no platform engineering. What architecture should they probably choose?',opts:['Microservices for autonomy','A modular monolith with enforced boundaries','A service mesh','Serverless everything'],a:1,why:'Microservices solve many-team collision problems and price in distributed-systems costs. One team, unclear boundaries, no platform: modularize first — the module boundaries will teach where services are, if ever.'},
{id:'q22',topic:'m10',type:'mcq',q:'What makes ArchUnit the right enforcement tool for modular monolith boundaries?',opts:['It is faster than unit tests','The rules are executable tests — a boundary violation fails the build','It generates the modules automatically','It replaces code review'],a:1,why:'Conventions die in the first deadline; ArchUnit rules are tests that run in CI, so "shipping must not import billing internals" becomes physics, not folklore.'},
{id:'q23',topic:'m11',type:'mcq',q:'Which schema change is safe to apply to a busy table with minimal ceremony?',opts:['Adding a nullable column, alone in its own migration','Adding a NOT NULL column with a default on PG 10','Dropping a column "later this sprint"','Renaming a column while both app versions run'],a:0,why:'A nullable ADD COLUMN takes a brief lock and no rewrite — the cheap, safe expand direction. Everything else needs the staging described in Module 11 (backfill then SET NOT NULL; drop only after dependency removal; rename is two-phase).'},
{id:'q24',topic:'m11',type:'mcq',q:'What is true of CREATE INDEX CONCURRENTLY?',opts:['It is faster than a plain CREATE INDEX','It does not block writes, but cannot run inside a transaction and may leave an INVALID index on failure','It works on expression indexes only','It locks the table for reads only'],a:1,why:'The concurrent build trades duration for non-blocking behavior; it needs two scans, cannot run in a transaction block, and a failed run leaves an INVALID index you must check for, drop and retry.'},
{id:'q25',topic:'m11',type:'mcq',q:'Order the expand-and-contract steps correctly.',opts:['Drop, dual-write, backfill, expand','Expand, dual-write, backfill, switch reads, stop writing old, drop','Backfill, expand, drop, switch','Expand, switch, backfill, drop'],a:1,why:'Add (harmless) → write both → migrate existing data → read new behind a flag → retire the old write → drop. The drop is last and destructive; every earlier step is additive and reversible.'},
{id:'q26',topic:'m11',type:'scenario',q:'A developer drops a column one release after the dual-write started, "to keep things tidy". What is the most likely consequence?',opts:['Nothing — dual-write protects everything','The still-deployed old application version fails its writes; ordering goes down','A slower query planner','Flyway refuses to run the migration'],a:1,why:'Old and new application versions always coexist during rollouts. Dropping at "step 2" breaks every writer that still references the column — the exact failure the Database Migration Simulator lets you trigger.'},
{id:'q27',topic:'m12',type:'mcq',q:'According to SemVer, a MINOR version bump (2.7 → 2.8) promises…',opts:['…breaking changes are allowed','…backward-compatible additions only','…bug fixes only','…nothing — version numbers are random'],a:1,why:'Patch = fixes only; minor = compatible additions; major = breaking allowed. The caveat worth saying out loud: the promise covers API signatures, not performance, serialization output or timing — those still surprise.'},
{id:'q28',topic:'m12',type:'mcq',q:'Spring Boot 3.x requires which two things your 2.x service may not have yet?',opts:['Maven and Lombok','Java 17+ and the jakarta.* namespace','Hibernate and Flyway','Gradle and Docker'],a:1,why:'Boot 3 moved from Java 8 to a 17 baseline and from javax.* to jakarta.* across EE-related imports. Sequence: Java 17 first as its own release, then the framework with codemod support and the properties migrator.'},
{id:'q29',topic:'m13',type:'mcq',q:'When is modernizing syntax (records, pattern matching) worth the diff?',opts:['Repo-wide, every two years, for consistency','Where the code is hot (about to change) and the safety net exists','Never — new syntax is riskier','Only in utility classes'],a:1,why:'Modernization follows the same economics as refactoring: stable code pays no interest — leave it. Convert what you touch, behind tests, in reviewable slices; never mix a runtime upgrade with a syntax sweep.'},
{id:'q30',topic:'m14',type:'mcq',q:'Which API change is breaking for existing clients?',opts:['Adding an optional request field','Adding a response field (for tolerant readers)','Tightening validation to reject values you previously accepted','Adding a new endpoint'],a:2,why:'Requests that worked yesterday now get 400s — "fixing" your API breaks clients. Adding optional/extra fields is the compatible direction; removals, renames, type changes and status-code changes are the breaking ones.'},
{id:'q31',topic:'m14',type:'mcq',q:'What does the Sunset response header (RFC 8594) communicate?',opts:['The server&#39;s timezone','The date the resource or version is scheduled to become unavailable','Cache expiry for static assets','The API&#39;s rate limit reset'],a:1,why:'Paired with Deprecation headers, it turns vague "someday" warnings into machine-readable dates consumers can alert on — and per-consumer traffic dashboards turn retirement into telemetry instead of nagging.'},
{id:'q32',topic:'m15',type:'mcq',q:'Which Terraform state practice is correct?',opts:['Commit the state file to git for backups','Remote state with locking, one workspace per environment, apply only from CI','State per developer on laptops for speed','Ignore state — the cloud is the truth'],a:1,why:'Remote, locked, encrypted state prevents concurrent applies; git-committed state is not a backup — it leaks secrets in plain text and invites conflicts. Import before managing; never recreate "to be tidy".'},
{id:'q33',topic:'m15',type:'mcq',q:'The safest way to migrate a team from an old CI pipeline to a new one is…',opts:['…big-bang on a quiet weekend','…shadow pipeline: both run, results compared, then per-project takeover, then delete the old path','…keep both forever, choose per release','…let each developer pick'],a:1,why:'The strangler logic applied to process: shadow parity proves the new pipeline, per-project takeover limits blast radius, and deleting the old path after three clean cycles prevents zombie-pipeline divergence.'},
{id:'q34',topic:'m16',type:'mcq',q:'Why must a liveness probe NOT check the database?',opts:['Databases are too fast to measure','A database blip would restart every healthy pod — converting one outage into two','Probes cannot make network calls','It would leak credentials'],a:1,why:'Liveness answers "is the process wedged?" and failure means restart. Readiness may check dependencies (drain traffic, no restart); liveness checking a dependency restarts your whole fleet when the dependency sneezes.'},
{id:'q35',topic:'m16',type:'mcq',q:'What makes application rollback actually possible after a release that changed the schema?',opts:['Deploying faster than the errors arrive','Schema changes are expand-only: the old application version keeps working against the new schema','Disabling the error budget','Taking a database backup right before rollback'],a:1,why:'Rollback is a designed capability: additive schema changes (expand-and-contract, pre-drop) keep the previous application version compatible. A restore is not a rollback — it discards writes.'},
{id:'q36',topic:'m17',type:'mcq',q:'Two CVEs: one CVSS 9.8 in an unreachable code path, one 5.3 on your internet-facing auth flow. Which gets the emergency lane?',opts:['The 9.8 — always sort by score','The 5.3 — reachability and exposure in YOUR deployment decide real risk','Both equally','Whichever was published first'],a:1,why:'CVSS describes the vulnerability in the abstract; your triage adds exploitability, reachability (verified, not assumed), exposure and mitigations. The scanner ranks anxiety; the engineer ranks risk.'},
{id:'q37',topic:'m17',type:'mcq',q:'During secrets rotation, why do verifiers accept old and new credentials simultaneously?',opts:['Hashing is too slow to change','Long-lived holders (mobile apps, batch jobs, partner integrations) migrate at their own pace — overlap is the migration','It halves the audit trail','Old credentials cannot be disabled'],a:1,why:'The overlap maneuver again: retire only when telemetry shows zero uses of the old secret — measured, never assumed. First rotation of an ancient secret is archaeology; the second is routine.'},
{id:'q38',topic:'m18',type:'mcq',q:'A decision recorded in ADR-012 turns out to be wrong. What happens to the ADR?',opts:['Edit it to describe the new decision','A new ADR supersedes it; the old one stays, immutable, with its context','Delete it to avoid confusion','Move it to an archive folder'],a:1,why:'ADRs are dated and immutable — the wrong decision with its context is exactly the institutional memory the next engineer needs. Supersede, never rewrite: the chain of reasoning is the artifact.'},
{id:'q39',topic:'m19',type:'mcq',q:'Which set are the DORA four keys?',opts:['Coverage, complexity, duplication, churn','Deployment frequency, lead time for changes, change failure rate, time to restore','MTBF, MTTR, SLA, SLO','Story points, velocity, burn-down, cycle time'],a:1,why:'The DORA delivery metrics measure the outcomes of maintenance investment: failure rate and restore time fall, lead time shrinks as debt is repaid — interest payments made visible.'},
{id:'q40',topic:'m19',type:'tf',q:'A perfect DORA scorecard proves the system is maintainable.',opts:['True','False'],a:1,why:'It proves nothing about security posture, knowledge concentration or the cost of the next change to the scariest module. Metrics are cameras, not verdicts — pair them, watch trends, and read Goodhart his rights.'},
{id:'q41',topic:'m21',type:'mcq',q:'Before approving a rewrite, which question is MOST important?',opts:['Is the new stack trendy?','Can the domain knowledge locked in the old system be extracted, and by whom, and when?','Will the rewrite be cheaper than one year of maintenance?','Do we have a designer?'],a:1,why:'The old system is the only specification of twenty years of business rules, including the undocumented ones. The rewrite plan that cannot answer the extraction question is a wish with a Gantt chart.'},
{id:'q42',topic:'m21',type:'mcq',q:'"Leave it alone" is a legitimate verdict only when…',opts:['…the team is busy with features','…change is rare, risk dominates cost, containment exists, and the decision is reviewed on a calendar with an owner','…nobody remembers who wrote it','…the rewrite was already tried once'],a:1,why:'Acceptance is a decision, not neglect: containment (tests around it, monitoring, docs) plus a yearly revisit with a signature. "We&#39;ll get to it someday" is the shadow list — the register exists to kill it.'},
{id:'q43',topic:'m21',type:'scenario',q:'A startup&#39;s 2-year-old prototype carries all revenue: no tests, three engineers, pricing rules discovered by trial and error, founder demands a rewrite. What is the sound advice?',opts:['Rewrite properly — prototypes are not for production','Characterize the pricing rules, then refactor the hot paths; rewrite is the trap here','Freeze features for a quarter and rewrite in parallel','Buy a product'],a:1,why:'The domain knowledge exists only in the code; a rewrite must re-derive it while the prototype keeps mutating (freeze-or-diverge). Characterization first, refactor the roadmap&#39;s hot paths, extract later if ever — the Decision Simulator&#39;s sixth scenario.'},
{id:'q44',topic:'m20',type:'mcq',q:'Case 13 (API v2 migration) measured 300 registered consumers and found 190 active, 62 recent. The general lesson?',opts:['Registered consumers are active consumers — measure, do not assume','Email is the best deprecation tool','Public APIs cannot be versioned','Sunset headers break clients'],a:0,why:'Inventory by measurement, not registration: gateway logs and per-consumer dashboards defined the actual migration tail — and turned retirement into telemetry instead of hope.'},
{id:'q45',topic:'m20',type:'mcq',q:'Case 15 diagnosed a fragile production system. What was the actual root cause cluster?',opts:['The code language was too old','Maintenance-process failures: no rollback design, schema changes incompatible with reversal, no observability, no error budget','Insufficient server count','The on-call rotation was too small'],a:1,why:'Fragility is a process diagnosis: deploy-related and migration-related failures dominated six months of incidents. Fixing the processes (rollback as capability, expand-and-contract, SLOs with teeth) took outages from twice monthly to quarterly.'}
];

const CHALLENGES=[
{id:'dc1',cat:'Identify technical debt',lvl:2,q:'Two findings from the OrderFlow audit: (A) 30% duplication across five report generators, changed once per year; (B) a drifted loyalty-discount rule, duplicated in two layers of the highest-churn file. Which is the higher priority?',
 opts:['A — duplication is the textbook smell','B — it sits on a hot, money-bearing path and has already drifted','Both equally — debt is debt','Neither — file them and move on'],a:1,
 why:'Priority = impact × likelihood × exposure. B is money logic, on the file the team touches weekly, with observed drift — a Critical. A is real debt in cold code: register it, fix on touch. Risk lives where change and cost intersect.',
 hints:['Which file does the team touch every week?','One of these two has already produced a divergence once.']},
{id:'dc2',cat:'Investigate unfamiliar code',lvl:1,q:'Day one in an unfamiliar repository. Which sequence is the Module 02 discipline?',
 opts:['Start fixing the first bug you find — learning by doing','README (with dated trust) → build files → build untouched → run tests → trace one workflow','Read every file alphabetically','Ask for the architecture diagram and trust it fully'],a:1,
 why:'Exploration before change: build files give the fastest architecture summary; an untouched build and a test run reveal reproducibility; one traced workflow beats a week of passive reading. And change nothing while exploring.',
 hints:['What is the cheapest artifact that reveals the whole stack?','You want a mental model — and proof the project builds.']},
{id:'dc3',cat:'Find a risky dependency',lvl:2,q:'A scanner flags four dependencies: an EOL framework on your internet-facing service, an old JSON library in a CLI tool used offline, a beta library in a batch job, and a font package in the docs site. Which jumps the queue?',
 opts:['The JSON library — data corruption risk','The EOL framework — internet-facing + end-of-life means unbounded security debt','The beta library — instability','The font package'],a:1,
 why:'Triage = exploitability × reachability × exposure. The EOL framework is reachable from the internet and will never receive patches — critical-and-reachable goes first. The others: queue by the same arithmetic.',
 hints:['Which one faces the internet AND will never be patched?','Reachability is about network position.']},
{id:'dc4',cat:'Choose a refactoring strategy',lvl:2,q:'A 40-line method does validation, pricing and persistence. It has decent tests around it. What is the first move?',
 opts:['Rewrite the class from scratch','Extract Method along its natural sections, one commit per extraction','Add more comments explaining the sections','Convert it to a lambda'],a:1,
 why:'With a safety net in place, Extract Method is the mechanical, low-risk move — each extraction is green-tested and independently revertible. Rewrites are for architecture that no longer fits, not for long methods with tests.',
 hints:['The tests exist — what does that unlock?','Small steps, each one revertible.']},
{id:'dc5',cat:'Design a safe migration',lvl:3,q:'You must replace a free-text customer name column with first/last name columns on a 4M-row table with zero downtime. What is the shape of the solution?',
 opts:['One migration: ALTER TABLE with a computed backfill, deployed at night','Expand (add nullable columns) → dual-write → batched backfill → switch reads → stop old writes → drop','Dump, transform, reload from a backup','Add the columns and let the application backfill lazily forever'],a:1,
 why:'Expand-and-contract: every intermediate state serves both application versions, the backfill is batched and resumable, the switch is flag-protected, and the destructive drop waits for proven dependency removal.',
 hints:['Old and new app versions coexist during any rollout.','What order keeps every step reversible until the very last one?']},
{id:'dc6',cat:'Dangerous database change',lvl:2,q:'Which statement is the riskiest to run on a busy production table?',
 opts:['ALTER TABLE orders ADD COLUMN note TEXT (nullable)','UPDATE orders SET note = ... (all 2.4M rows, one statement)','CREATE INDEX CONCURRENTLY idx ON orders(note)','ALTER TABLE orders ADD CONSTRAINT ... NOT VALID'],a:1,
 why:'The single giant UPDATE holds locks for minutes: writers pile up, replicas lag, autovacuum stalls. Backfills are batched, keyset-paginated and resumable — Module 11 step 3, and a failure button in the migration simulator.',
 hints:['Think about locks held per unit of work.','One of these was designed to avoid blocking.']},
{id:'dc7',cat:'Diagnose a legacy system',lvl:2,q:'A five-year-old service has "worked fine" but every deploy since March fails on the first try. Logs show a certificate the app calls expired in March. What is the actual diagnosis?',
 opts:['The deploy pipeline is broken','Maintenance debt: certificate renewal was never automated — the "works fine" system was running on borrowed time','The service needs a rewrite','March was unlucky'],a:1,
 why:'Expiry-based failures are scheduled incidents: certificates, tokens, licenses, EOL dates. The fix is the horizon table — automation plus a calendar — not heroics on deploy day. Fragility that arrives on a date is the most preventable kind.',
 hints:['What happened in March that never happens again on its own?','Some failures are scheduled months in advance.']},
{id:'dc8',cat:'Prioritize maintenance work',lvl:2,q:'Sprint capacity: enough for one item. (A) Rename HelperUtils for taste. (B) Decouple the billing-shipping cycle blocking next quarter&#39;s extraction. (C) Update the team wiki page about onboarding. Choose.',
 opts:['A — names are documentation','B — it gates the roadmap with days of effort','C — onboarding matters','Do a third of each'],a:1,
 why:'Scoring: B is Impact 4 × Likelihood 3 × Exposure 3 with effort 2 — high score, low cost, roadmap-unblocking. A is preference (not debt); C is real but lower band. Slicing capacity three ways buys nothing finished.',
 hints:['One of these blocks a planned project.','Cheap + high-scoring + unblocks the roadmap.']},
{id:'dc9',cat:'Refactor or rewrite',lvl:3,q:'A stable 12-year-old system: two changes per year, 70% test coverage, current runbooks, happy owner team. The CTO wants "a modern rewrite on current tech." Your professional answer?',
 opts:['Agree — 12 years is ancient','Recommend leaving it (contained, reviewed yearly); rewrite spends risk to buy novelty','Propose microservices as a compromise','Suggest rewriting just the tests'],a:1,
 why:'The opposite of legacy is changeable, not new: this system is controlled and cheap to keep. A rewrite introduces a two-year parallel-run risk to solve... nothing measurable. Register the CTO&#39;s concern as a horizon item (EOL watch), not a project.',
 hints:['What problem would the rewrite actually solve?','Loss of control is the diagnosis of legacy — does this system have it?']},
{id:'dc10',cat:'Production maintenance risk',lvl:3,q:'Thursday&#39;s release bundles: a new pricing engine, an expand-only schema change, and a framework patch. Rollback is…',
 opts:['…impossible with three changes — hope','…designed: the patch reverts independently, pricing ships behind a kill-switch flag, and expand-only schema keeps the old app version compatible','…a database restore from Wednesday&#39;s backup','…the on-call engineer&#39;s problem'],a:1,
 why:'Rollback is a designed capability built from decomposed, compatible changes: independent artifacts, flag-gated behavior, additive schema. Restores are not rollbacks — they discard writes. A release is not done until its reversal has been rehearsed.',
 hints:['What does the old application version need to keep working after rollback?','Feature flags and expand-only schema are the ingredients.']},
{id:'dc11',cat:'Legacy code testing',lvl:2,q:'You must refactor a pricing engine with zero tests and a deadline. Where do the expected values for your first tests come from?',
 opts:['The original requirements docs','Running the current code and pinning what it actually does — characterization','The most common pricing rules in the industry','The product manager&#39;s memory'],a:1,
 why:'Characterization: observe, then assert the observation — you certify stability, not correctness. The quirks you find become the bug-or-rule backlog, and behavior changes become deliberate edits to those tests, reviewed on their own.',
 hints:['Whose behavior can you actually verify today?','You are building a net, not a specification.']},
{id:'dc12',cat:'Strangler fig pattern',lvl:3,q:'During a strangler migration, the new notification service&#39;s route serves 100% for three weeks with zero errors, but the legacy monolith still publishes events to it. What is missing?',
 opts:['Nothing — the migration is complete','Decommissioning: the monolith&#39;s notification code (and its event publishing, once unused) must be deleted on schedule','More monitoring','A second notification service for redundancy'],a:1,
 why:'Strangler programs die by ninety-percent-forever: routes flip, but the legacy side keeps running (and rotting). The pattern ends with deletion — code, tables, jobs, config — each removal its own revertible commit, after a clean business cycle.',
 hints:['What still exists on the legacy side that no longer needs to?','The pattern is named after a fig that replaces the tree completely.']}

const REF=[
{id:'r-debt',t:'Technical debt essentials',items:[
'<b>The debt test:</b> would you pay to close it now? If not, it is preference, not debt.',
'<b>Debt vs. bug:</b> a bug is wrong behavior today; debt raises the cost and risk of tomorrow&#39;s changes.',
'<b>Trade-off vs. debt:</b> a documented decision with living context is a trade-off; it becomes debt when the context is lost.',
'<b>The quadrant (deliberate/inadvertent × prudent/reckless):</b> deliberate-prudent is engineering; each quadrant has a different remedy.',
'<b>Interest</b> is the recurring drag (change amplification, cognitive load, unknown unknowns, fragility, immobilization); <b>principal</b> is the fix cost.',
'Categories: code, architecture, testing, documentation, infrastructure, dependency, security, database, operational, organizational — name findings by remediation skill.',
'Debt compounds through the speed loop (slow → pressure → shortcuts) and the knowledge loop (tangled → learned by fewer → riskier → more tangled).']},
{id:'r-prio',t:'Debt prioritization and the register',items:[
'<b>Score = Impact × Likelihood × Exposure</b> (each 1-5; illustrative heuristic, not a standard).',
'Bands: ≥ 60 Critical · 25-59 High · 8-24 Medium · &lt; 8 Low.',
'Effort stays OUT of the score — it is the negotiation variable against capacity.',
'Register fields: description · component · root cause · business impact · technical impact · risk level · remediation effort · priority · owner · recommended action.',
'Strategies: fix now (Critical) · scheduled (High) · opportunistic fix-on-touch (Medium) · contain/accept with revisit date (Low).',
'Budget: the 15-25% band per sprint, visible in planning; unspent rolls over (bounded); a share funds prevention.',
'Quarterly: re-score the whole register — the business moved.']},
{id:'r-smells',t:'Code smell quick reference',items:[
'<b>Long method</b> — sections marked by comments; extract method. Leave when stable and linear.',
'<b>Duplicated logic</b> — same rule, several homes; introduce a type that owns it.',
'<b>God class</b> — 23 dependencies and every feature; extract collaborators one seam at a time.',
'<b>Circular dependency</b> — modules importing each other; break with an event or an interface.',
'<b>Shotgun surgery</b> — one change scattered over twenty files; missing abstraction.',
'<b>Primitive obsession</b> — strings and longs doing a type&#39;s job; the reason duplication survives.',
'Rule: a smell in cold code is trivia; the same smell in weekly-churn code is a five-alarm finding.']},
{id:'r-metrics',t:'Metrics reference',items:[
'<b>Cyclomatic complexity</b> (McCabe): decision points + 1; 10+ review, 25+ refactor candidate.',
'<b>Cognitive complexity</b>: human-weighted (nesting penalized) — better proxy for maintainer error.',
'<b>Hotspot = complexity × churn</b> — the prioritization metric for refactoring capacity.',
'<b>DORA four keys:</b> deployment frequency, lead time for changes, change failure rate, time to restore.',
'<b>Coverage</b>: a map of the untested, never proof of quality — pair with mutation testing for assertion strength.',
'Pair metrics so gaming one visibly breaks another; trends beat snapshots; Goodhart&#39;s law applies to all of them.',
'No single metric — or dashboard — is a complete measure of software quality.']},
{id:'r-refac',t:'Refactoring moves',items:[
'<b>Extract Method</b>: sections → named intentions; the workhorse.',
'<b>Extract Class</b>: split along responsibility lines; extract the most isolated concern first.',
'<b>Rename</b> (IDE-driven): the documentation that cannot rot.',
'<b>Introduce Parameter Object</b>: clumps that travel together are a concept with invariants.',
'<b>Replace Magic Numbers</b>: name the why; type the units (Duration, Money).',
'<b>Replace Conditional with Polymorphism</b>: when branches vary by type AND types arrive often.',
'<b>Dependency inversion</b>: policy owns the interface; details implement it — that interface is the test seam.',
'Every move answers: what observable behavior stays identical? Write it down first.']},
{id:'r-char',t:'Characterization and legacy testing',items:[
'<b>Characterization test:</b> assertion from observation, not intention — certifying stability, not correctness.',
'<b>Golden master:</b> fixed input set → captured outputs → diff on every run; normalize time, randomness, ordering.',
'<b>Approval/snapshot testing:</b> the tool-supported golden master; approvals are deliberate, never reflexive.',
'Coverage strategy: the code the next change touches + the money path. Not a 100% quest.',
'Seams: object (inject), link (classpath), compile-time. Link seams must be documented at the substitution point.',
'<b>Sprout class</b> = new behavior in a new, tested class. <b>Wrap class</b> = intercept a legacy collaborator.',
'Quirk backlog: every pinned suspicious behavior becomes an explicit bug-or-rule decision.',
'Two seams unlock most legacy code: the clock and the configuration.']},
{id:'r-strangler',t:'Strangler fig runbook',items:[
'Anatomy: facade/gateway · routing table · increments · data strategy · scoreboard.',
'Stage 0: gateway in pass-through mode — prove the facade under production load before moving anything.',
'First slice: edge capability (notifications, search) — low coupling, no transactional writes.',
'Anti-corruption layer: legacy shapes in, domain shapes out; the only code that knows both worlds.',
'Data: prefer outbox/CDC over dual-write; if dual-write, reconcile from day one and treat drift as a defect.',
'Each route flip is config, not code; rollback = route back.',
'Decommission discipline: 100% for a full business cycle + zero reconciliation drift + owner sign-off → delete code, tables, jobs, config — in that order.',
'Scoreboard: traffic %, old-vs-new error/latency, drift, capabilities fully decommissioned.']},
{id:'r-migration',t:'Migration patterns',items:[
'<b>Expand-and-contract</b> (parallel change): expand → compat deploy (dual-write) → backfill → switch → remove dependency → contract.',
'<b>Blue-green</b>: two environments, atomic flip, old kept warm; schema must stay compatible with both.',
'<b>Canary</b>: 1→5→25→100% gated on error rate and latency; the gap between hops is where you buy safety.',
'<b>Feature flag cutover</b>: code ships dark; behavior flips per cohort; flags have owners and expiry dates.',
'<b>Backfill</b>: keyset-batched, resumable, metered, with verification counts — never one giant UPDATE.',
'<b>Rollback vs. forward fix:</b> restores discard writes; decide before the destructive step which recovery you are signing up for.',
'<b>Overlap maneuver</b> (APIs, auth, secrets, TLS): both accepted during the window; retire only when telemetry shows zero old-path usage.']},
{id:'r-db',t:'Database migration reference',items:[
'Flyway: <code>V&lt;n&gt;__desc.sql</code> versioned (runs once), <code>R__desc.sql</code> repeatable (checksum-triggered); history in flyway_schema_history.',
'<code>mvn flyway:migrate</code> · <code>flyway:validate</code> · <code>flyway:info</code> — validate refuses edited, already-applied files.',
'Liquibase: XML/YAML/SQL changesets, richer diffing; Alembic (SQLAlchemy), Prisma Migrate, Django migrations elsewhere.',
'Hibernate: <code>ddl-auto=validate</code> in production — never update; Flyway owns the schema.',
'PostgreSQL lock guide: ADD COLUMN nullable = cheap; constraints = NOT VALID then VALIDATE; indexes = CONCURRENTLY (no transaction, may leave INVALID).',
'Rename = two-phase (add, dual-write, switch, drop); DROP only after proven dependency removal.',
'PostgreSQL DDL is transactional (except e.g. CREATE INDEX CONCURRENTLY); MySQL DDL implicit-commits — know your regime.',
'Test: from-scratch build in CI · production-snapshot rehearsal with timing · data round-trip smoke.']},
{id:'r-deps',t:'Dependency management',items:[
'<code>mvn dependency:tree -Dverbose</code> — the map; conflicts read as "omitted for conflict".',
'Pin in dependencyManagement (Maven) / platforms (Gradle) / lockfiles (npm) with a comment naming the reason.',
'SemVer: patch = fixes, minor = compatible additions, major = breaking — a promise about signatures, not about performance or serialization.',
'Upgrade workflow: inventory → read release notes → grep breaking changes → one major at a time → full suite → mechanical verification → benchmark if warned → progressive deploy → monitor a cycle → ADR.',
'Spring Boot 3: Java 17 first · jakarta via codemod + review · properties-migrator (temporary) · Hibernate 6 SQL audit.',
'Automate: Renovate/Dependabot, patch weekly, minor monthly, majors as tracked issues.',
'EOL horizon table reviewed quarterly — upgrades enter the roadmap as planned work, not incidents.']},
{id:'r-prod',t:'Production maintenance',items:[
'Hotfix: reproduce → smallest fix off the release tag → fast-lane CI → two-person review → progressive deploy → morning: cherry-pick, postmortem slot, escape-analysis ticket.',
'Rollback checklist: plan written before deploy · old app version compatible with new schema · rehearsed · smoke-gated (rollback is a deployment too).',
'Liveness = "wedge?" (restart; never check dependencies). Readiness = "can serve?" (drain; may check).',
'SLO = numeric reliability target; error budget = allowed failure; burned budget freezes releases by policy.',
'Postmortem: timeline, impact, root + contributing causes, what went well, owned action items tagged by debt category — blameless, or the causes go underground.',
'Problem management: the second occurrence of anything gets an owner whose job is killing the class, not the instance.',
'Drill quarterly: rollback, restore, failover — timed and improved. A backup untested is a rumor.']},
{id:'r-sec',t:'Security maintenance',items:[
'Triage = exploitability × reachability (verified) × exposure × impact, with mitigations as time-buyers; CVSS is an input, not the verdict.',
'Example SLA bands (adapt): critical-and-reachable in days via the emergency lane · highs within the month · unreachable = documented acceptance with revisit date.',
'<code>mvn org.owasp:dependency-check-maven:check</code> with <code>failBuildOnCVSS</code>; suppressions carry justification + expiry.',
'Rotation runbook: inventory → stage new → overlap (verifier accepts both) → migrate readers → retire on zero measured usage → schedule the next.',
'TLS/crypto deprecation: dual-stack, measure old-protocol traffic to zero, refuse, then pin with a security regression test.',
'Log4Shell lesson: you cannot patch what you cannot inventory — BOMs and lockfiles are standing capabilities.',
'Hardening ratchet: every fix gets a test that keeps it fixed.']},
{id:'r-templates',t:'Templates: ADR, runbook, maintenance record',items:[
'<b>ADR:</b> title · status (+date) · context · decision · consequences (+revisit trigger). Immutable; supersede, never edit.',
'<b>Runbook:</b> what this is · dashboards/SLOs · alerts with first three commands · failure modes + rehearsed responses · dependencies with owners · numbered procedures (deploy, rollback, failover, restore).',
'<b>Maintenance record:</b> scope · why now (register link) · ADR link · plan · outcome (+timing) · lessons · follow-ups.',
'<b>Postmortem:</b> summary/impact · timeline · root + contributing causes · what went well · action items (owner + date + debt category).',
'Docs-as-code: reviewed in the same PR as the change; runbooks corrected on every use; ADRs are the decision history.',
'Drift rule: any document whose "last verified" age exceeds its subject&#39;s change rate is a finding.']}

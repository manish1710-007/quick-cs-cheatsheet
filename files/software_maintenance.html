/* ================= GLOSSARY (revision source) ================= */
const GLOSSARY=[
{t:'Characterization test',d:'A test whose expected value comes from observing current behavior rather than from requirements — it certifies stability so refactoring can proceed; suspected bugs get labeled and promoted to explicit decisions.'},
{t:'Golden master',d:'A captured set of complete outputs for a fixed input collection, diffed on every later run — the scaled version of characterization testing for rule-dense code.'},
{t:'Test seam',d:'A place where program behavior can be altered without editing the code under test — where a dependency is substituted with a double (object, link or compile-time).'},
{t:'Sprout class / wrap class',d:'Dependency-breaking moves: sprout puts NEW behavior in a new tested class called from legacy code; wrap intercepts a legacy collaborator behind the same surface.'},
{t:'Technical debt',d:'A gap between the design a system has and the design current knowledge would justify, carried forward because closing it now costs more than it returns; it charges interest on future changes.'},
{t:'Debt quadrant',d:'Fowler&#39;s deliberate/inadvertent × prudent/reckless grid; each quadrant prescribes a different remedy, and deliberate-prudent debt is simply engineering.'},
{t:'Debt register',d:'The team&#39;s scored inventory of debts: description, component, root cause, impacts, risk, effort, priority, owner, recommended action — reviewed quarterly.'},
{t:'Hotspot',d:'Complexity × churn: files that are both tangled and frequently changed — where refactoring capacity pays the highest return.'},
{t:'Interest vs. principal',d:'Interest is the recurring drag debt imposes on every change; principal is the one-time cost of paying it down. Repay when interest exceeds principal.'},
{t:'Strangler fig pattern',d:'Fowler&#39;s incremental replacement: a facade routes each capability to old or new; slices migrate one by one; the legacy core is decommissioned piece by piece.'},
{t:'Anti-corruption layer',d:'A translating boundary that converts legacy data models into clean domain shapes — the only code allowed to know both worlds.'},
{t:'Expand-and-contract (parallel change)',d:'Zero-downtime evolution in six steps: add the new shape, dual-write, backfill, switch reads, stop the old write, drop the old shape — destructive only at the last step.'},
{t:'Backfill',d:'Batched, resumable, keyset-paginated migration of existing rows to a new shape — never a single giant UPDATE on a production table.'},
{t:'Dual-write',d:'Writing both old and new data shapes during a compatibility window; a known trap unless reconciliation measures divergence from day one.'},
{t:'Outbox pattern',d:'Transactional outbox: the owning service writes its event to a local table in the same transaction; a relay publishes it — solving dual-write divergence.'},
{t:'Change data capture (CDC)',d:'Streaming committed changes from a database&#39;s log to consumers — the data-sync strategy that scales to decommissioning.'},
{t:'Blue-green deployment',d:'Two full environments with an atomic traffic flip; the old one stays warm for instant rollback — schema must remain compatible with both.'},
{t:'Canary release',d:'Routing a small, growing percentage of traffic to a new version, gated on error rate and latency — buying safety in the gap between hops.'},
{t:'Feature flag',d:'A runtime switch that decouples deploy from release; needs an owner, an expiry date and a kill-switch default, or flags become their own debt.'},
{t:'Error budget',d:'The complement of an SLO: the failure you are allowed; when it burns, releases freeze and reliability work jumps the queue by policy.'},
{t:'SLO',d:'A numeric reliability objective on a user-visible path (e.g. 99.9% of requests under 400ms over 30 days) — the number that makes "reliable" arguable.'},
{t:'MTTR / MTBF',d:'Mean time to restore (incident → recovery; measures response capability) and mean time between failures (reliability of the system).'},
{t:'Change failure rate',d:'The share of deployments causing degraded service — a DORA four-key metric and the visible interest payment on testing and release debt.'},
{t:'SemVer',d:'The versioning contract: MAJOR breaks, MINOR adds compatibly, PATCH fixes — a promise about API signatures, not about behavior, performance or serialization.'},
{t:'End-of-life (EOL)',d:'The date maintainers stop shipping fixes for a version; past it, every remaining vulnerability is permanent — tracked on a horizon table, not in memory.'},
{t:'CVSS',d:'A severity score describing a vulnerability in the abstract — an input to triage, never the verdict; reachability in your deployment decides real risk.'},
{t:'ADR (architecture decision record)',d:'A dated, immutable note capturing a decision, its context and its consequences; changed decisions get new ADRs that supersede old ones.'},
{t:'Runbook',d:'The operational contract for a system: dashboards, alerts with first commands, failure modes with rehearsed responses, and numbered procedures. Corrected on every use.'},
{t:'Blameless postmortem',d:'An incident analysis focused on systemic causes and owned action items; blame drives causes underground and stops the system from learning.'},
{t:'Second-system effect',d:'The rewrite&#39;s classic failure mode: the replacement tries to fix every past grievance, grows unshippable, and dies at 80%.'}];

function qHtml(q,idx){return `<div class="q"><div class="qt">${idx||''}${({mcq:'Multiple choice',tf:'True or false',scenario:'Scenario'})[q.type]||'Question'}</div><p>${q.q}</p><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fbx" role="status" aria-live="polite" aria-atomic="true"></div></div>`}
function mountQ(el,q,cb){let fin=false;
  const fbx=$('.fbx',el);
  $$('.opt',el).forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const i=+b.dataset.i,ok=i===q.a;
    $$('.opt',el).forEach(o=>{o.disabled=true;if(+o.dataset.i===q.a)o.classList.add('right')});if(!ok)b.classList.add('wrong');
    fbx.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${q.why}</div>`;
    if(q.id){if(ok){delete S.qw[q.id]}else{S.qw[q.id]=(S.qw[q.id]||0)+1}save()}
    cb(ok)})}
function record(ok){S.qs.a++;if(ok)S.qs.c++;touch();save()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const dailyQ=()=>CHALLENGES[hash(today())%CHALLENGES.length];
function recordDaily(ok){const t=today();S.daily[t]={ok};
  S.chhist=S.chhist.filter(h=>h.d!==t);S.chhist.unshift({d:t,ok,title:dailyQ().id});S.chhist=S.chhist.slice(0,30);save()}
/* ---- daily challenge ---- */
function mountDaily(){
  const box=$('#daily');if(!box)return;
  const dq=dailyQ(),dd=S.daily[today()];
  let hints=0;
  const draw=()=>{
    box.innerHTML=`<div class="q"><div class="qt">Daily challenge · ${dq.cat} · ${LV[dq.lvl]}</div><p style="font-size:16px">${dq.q}</p>
    <div class="opts">${dq.opts.map((o,i)=>`<button class="opt" data-i="${i}" ${dd?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:8px">${dd?'':`<button class="btn sm" id="dh">Hint (${hints}/${dq.hints.length})</button>`}<button class="btn sm" id="dr">Practice another (random)</button></div>
    <div id="dhints">${dq.hints.slice(0,hints).map((h,i)=>`<div class="call tip" style="margin-top:8px"><b class="lb">Hint ${i+1}</b><p>${h}</p></div>`).join('')}</div>
    <div class="fbx" role="status" aria-live="polite" aria-atomic="true">${dd?`<div class="fb ${dd.ok?'ok':'no'}"><b>${dd.ok?'Answered correctly today.':'Answered today — the answer was '}${dd.ok?'':'ABCD'[dq.a]+'.'}</b> ${dq.why}</div>`:''}</div></div>`;
    if(dd)$$('.opt',box)[dq.a].classList.add('right');
    const h=$('#dh');if(h)h.onclick=()=>{hints++;draw()};
    $('#dr').onclick=()=>{mountRandom()};
    if(!dd)$$('.opt',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===dq.a;
      $$('.opt',box).forEach(o=>{o.disabled=true;if(+o.dataset.i===dq.a)o.classList.add('right')});if(!ok)b.classList.add('wrong');
      $('.fbx',box).innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite — '}${ok?'':'the answer was '+'ABCD'[dq.a]+'.'}</b> ${dq.why}</div>`;
      recordDaily(ok);draw()})};
  draw()}
function mountRandom(){
  const box=$('#daily');if(!box)return;
  const others=CHALLENGES.filter(c=>c.id!==dailyQ().id);const dq=others[Math.floor(Math.random()*others.length)];
  let hints=0,fin=false;
  const draw=()=>{box.innerHTML=`<div class="q"><div class="qt">Practice challenge · ${dq.cat} · ${LV[dq.lvl]}</div><p style="font-size:16px">${dq.q}</p>
    <div class="opts">${dq.opts.map((o,i)=>`<button class="opt" data-i="${i}" ${fin?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:8px">${fin?'':`<button class="btn sm" id="dh">Hint (${hints}/${dq.hints.length})</button>`}<button class="btn sm" id="db">Back to today&#39;s challenge</button></div>
    <div id="dhints">${dq.hints.slice(0,hints).map((h,i)=>`<div class="call tip" style="margin-top:8px"><b class="lb">Hint ${i+1}</b><p>${h}</p></div>`).join('')}</div>
    <div class="fbx" role="status" aria-live="polite" aria-atomic="true"></div></div>`;
    if(fin)$$('.opt',box)[dq.a].classList.add('right');
    const h=$('#dh');if(h)h.onclick=()=>{hints++;draw()};
    $('#db').onclick=()=>mountDaily();
    if(!fin)$$('.opt',box).forEach(b=>b.onclick=()=>{fin=true;const i=+b.dataset.i,ok=i===dq.a;
      $$('.opt',box).forEach(o=>{o.disabled=true;if(+o.dataset.i===dq.a)o.classList.add('right')});if(!ok)b.classList.add('wrong');
      $('.fbx',box).innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite — the answer was '+'ABCD'[dq.a]+'.'}</b> ${dq.why}</div>`;draw()})};
  draw()}

V.debtlab=()=>{
  const st=S.lab.debt||(S.lab.debt={});
  const band=sc=>sc>=60?'Critical':sc>=25?'High':sc>=8?'Medium':'Low';
  main.innerHTML=crumbs([['Debt assessment']])+`<h1>Technical debt assessment simulator</h1><p class="lede">${DEBTX.intro}</p>

  <div>${DEBTX.issues.map(is=>`<div class="q"><div class="qt">${is.cat}</div><p style="font-size:16px"><b>${is.title}</b></p><p style="color:var(--dim);font-size:14px">${is.desc}</p>
  <div class="row"><label for="pr-${is.id}">Your priority</label><select id="pr-${is.id}" class="btn"><option value="">— choose —</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div></div>`).join('')}</div>
  <div class="row"><button class="btn pri" id="dsub">Submit assessment</button>${st.score!=null?`<span class="tag ok">best score ${st.score}/${DEBTX.issues.length}</span>`:''}</div>
  <div id="dres">${st.last?st.last:''}</div>`;
  $('#dsub').onclick=()=>{
    const missing=DEBTX.issues.filter(is=>!$('#pr-'+is.id).value);
    if(missing.length){toast('Set a priority for every finding first');return}
    let match=0,over=0,under=0;
    const rows=DEBTX.issues.map(is=>{
      const sc=is.i*is.l*is.e,b=band(sc),u=$('#pr-'+is.id).value;
      const order=['Low','Medium','High','Critical'];
      const cmp=order.indexOf(u)-order.indexOf(b);
      if(cmp===0)match++;else if(cmp>0)over++;else under++;
      return `<tr><td>${is.title}</td><td>${u}</td><td>${is.i} × ${is.l} × ${is.e} = <b>${sc}</b></td><td class="${b==='Critical'?'bad':''}">${b}</td><td>${cmp===0?'<span class="ok">match</span>':cmp>0?'over':'under'}</td><td>${is.effort}</td></tr>`}).join('');
    const score=match;st.score=Math.max(st.score||0,score);
    st.last=`<h2 style="margin-top:22px">Model verdict</h2>
    <div class="fb ${match>=6?'ok':match>=4?'':'no'}" style="margin-top:0"><b>You matched ${match} of ${DEBTX.issues.length} bands.</b> ${over?`You rated ${over} finding${over>1?'s':''} higher than the model; `:''}${under?`rated ${under} lower; `:''}disagreement is the point — each gap is a conversation about impact, likelihood or exposure worth having with your team. Effort (last column) stays outside the score: it is what you negotiate against capacity.</div>
    <div class="tw"><table><thead><tr><th>Finding</th><th>Your call</th><th>I × L × E</th><th>Model band</th><th></th><th>Effort</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2>Why each finding scores what it scores</h2>
    ${DEBTX.issues.map(is=>`<details class="acc"><summary>${is.title} — ${band(is.i*is.l*is.e)} (${is.i*is.l*is.e})</summary><div><p>${is.note}</p></div></details>`).join('')}
    <div class="call tip"><b class="lb">Reminder</b><p>Impact × Likelihood × Exposure is an illustrative heuristic for making judgment explicit — not an industry-standard formula, and never a substitute for the register conversation where the team argues the numbers.</p></div>`;
    save();touch();$('#dres').innerHTML=st.last};
  if(st.last)$('#dres').innerHTML=st.last;
};

V.deplab=()=>{
  const st=S.lab.dep||(S.lab.dep={});
  main.innerHTML=crumbs([['Dependency upgrade']])+`<h1>Dependency upgrade simulator</h1><p class="lede">${DEPX.intro}</p>
  <div class="call warn"><b class="lb">Simulated results</b><p>${DEPX.note}</p></div>
  <h2>Choose target versions</h2>
  <div class="card" style="margin-bottom:14px">${DEPX.deps.map(d=>`<div class="frow"><span class="fn">${d.name} <span class="fx">current: ${d.cur} · ${d.kind}</span></span><select id="dep-${d.id}">${d.opts.map(o=>`<option value="${o.v}" ${o.v===d.cur?'selected':''}>${o.v} — ${o.n}</option>`).join('')}</select></div>`).join('')}</div>
  <div class="row"><button class="btn pri" id="drun">Run simulated checks</button>${st.best?`<span class="tag ok">best plan so far: ${st.best}</span>`:''}</div>
  <div id="dres">${st.last?st.last:''}</div>`;
  $('#drun').onclick=()=>{
    const val=id=>$('#dep-'+id).value;
    const java=val('java'),boot=val('boot'),pg=val('pg'),jack=val('jackson'),junit=val('junit');
    const javaN=parseInt(java,10),boot3=boot.startsWith('3');
    const results=[];
    if(boot3&&javaN<17)results.push(['Compilation',false,'FAIL — Spring Boot 3 requires Java 17 or later; the build does not compile on Java '+java+'. Sequence the runtime upgrade first.']);
    else if(!boot3&&javaN>=21)results.push(['Compilation',null,'CAUTION — Java '+java+' with a Boot 2.x line is an unsupported combination; stay on supported pairings.']);
    else results.push(['Compilation',true,'PASS — the target combination compiles.']);
    results.push(['jakarta.* migration',boot3?null:true,boot3?'PLANNED WORK — javax.* → jakarta.* across 41 files (servlet, persistence, validation). Run the OpenRewrite recipe, review the diff, compile early.':'PASS — not applicable on the 2.x line.']);
    const cveBoot=boot.startsWith('2.3')?{n:6,c:2}:boot.startsWith('2.7')?{n:3,c:0}:{n:0,c:0};
    const cvePg=pg.startsWith('42.2')?1:0,cveJ=jack.startsWith('2.13')?1:0;
    const tot=cveBoot.n+cvePg+cveJ,crit=cveBoot.c;
    results.push(['CVE scan',tot===0,tot===0?'PASS — no findings on the selected line.':`FAIL — ${tot} finding${tot>1?'s':''}${crit?` (${crit} critical)`:''} remain. Critical-and-reachable goes through the emergency lane (Module 17).`]);
    const props=boot.startsWith('2.3')?['12 properties renamed on the way to 2.7 — add the temporary spring-boot-properties-migrator, fix what it flags, remove it.']:
      boot.startsWith('2.7')?['7 renames plus 2 moved starters on the way to 3.x — migrator again; audit custom configuration.']:
      ['PASS — current line, names stable.'];
    results.push(['Configuration properties',props[0].startsWith('PASS')?true:null,props[0]]);
    results.push(['Test suite runs',junit.startsWith('4')?null:true,junit.startsWith('4')?'RUNS — JUnit 4 is in maintenance mode; under Boot 3 you would need the vintage engine. Plan the 5.x move as its own slice.':'PASS — JUnit 5, current line.']);
    const blockers=results.filter(r=>r[1]===false);
    const warns=results.filter(r=>r[1]===null);
    const ready=blockers.length===0&&tot===0;
    const plan=[];
    if(boot3&&javaN<17)plan.push('Upgrade Java to 17+ first, as its own release, full suite and a staging soak (Module 12).');
    if(boot3)plan.push('Run the OpenRewrite jakarta recipe; human-review the diff; compile and fix.');
    if(props[0].startsWith('PASS')===false)plan.push('Add spring-boot-properties-migrator temporarily; fix every renamed property it flags; remove it.');
    if(cvePg)plan.push('Bump the PostgreSQL driver to the 42.6+ line and verify connection behavior under load.');
    if(cveJ)plan.push('Align Jackson via dependencyManagement; check serialization output on the golden-master tests.');
    if(junit.startsWith('4'))plan.push('Schedule the JUnit 4 → 5 migration as a separate slice (vintage engine only as a bridge).');
    if(boot3)plan.push('Audit Hibernate 6 generated SQL against Testcontainers PostgreSQL (real engine, not H2).');
    plan.push('Canary the rollout with the previous line still runnable; watch the error budget for a full business cycle.');
    const label=boot+' on Java '+java;
    st.last=`<h2 style="margin-top:22px">Simulated check results</h2>
    <div class="tw"><table><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>${results.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]===true?'ok':r[1]===false?'bad':''}">${r[1]===true?'pass':r[1]===false?'fail':'planned work'}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <div class="fb ${ready?'ok':'no'}"><b>${ready?'Ready to schedule.':'Not ready — blockers first.'}</b> ${ready?`The ${label} plan compiles clean, scans clean and names its planned work. What remains is execution discipline:`:`Fix the blockers, then re-run the checks. The remediation order matters:`}</div>
    <ol class="steps-list" style="padding-left:20px;margin:10px 0">${plan.map(p=>`<li>${p}</li>`).join('')}</ol>
    <div class="call tip"><b class="lb">The habit behind the exercise</b><p>One major at a time, read the guide, grep your usage, verify mechanically, deploy progressively — and let Renovate keep the small bumps routine so the big ones stay rare.</p></div>`;
    if(ready&&(!st.best))st.best=label;
    save();touch();$('#dres').innerHTML=st.last};
  if(st.last)$('#dres').innerHTML=st.last;
};

V.risktool=()=>{
  main.innerHTML=crumbs([['Risk assessment']])+`<h1>Migration risk assessment</h1><p class="lede">${RISKX.intro}</p>
  <div class="card" style="margin:14px 0">${RISKX.factors.map(f=>`<div class="sld"><label for="rk-${f.id}" title="${esc(f.lo)} / ${esc(f.hi)}">${f.label}</label><input type="range" min="0" max="10" step="1" value="5" id="rk-${f.id}" data-rk="${f.id}" data-inv="${f.invert?1:0}"><span class="sv" id="rv-${f.id}">5</span></div>`).join('')}</div>
  <div class="card" id="rres"></div>
  <div class="call note"><b class="lb">How the score is computed</b><p>Risk per factor = your slider value, except downtime tolerance, rollback availability and testing confidence, which are inverted (more tolerance, better rollback and stronger tests mean lower risk). The overall score is the mean of the seven, on a 0-10 scale. Every threshold and weight here is an illustrative heuristic for discussion — rehearse real migrations with real data.</p></div>`;
  const draw=()=>{
    const vals=RISKX.factors.map(f=>{
      const v=+$('#rk-'+f.id).value;
      $('#rv-'+f.id).textContent=v;
      return {f,v,eff:f.invert?10-v:v}});
    const risk=vals.reduce((a,x)=>a+x.eff,0)/vals.length;
    const band=RISKX.bands.find(b=>risk>=b[0]&&risk<b[1]);
    const col={green:'var(--good)',cyan:'var(--cyan)',warn:'var(--warn)',bad:'var(--bad)'}[band[2]];
    const precs=[];
    vals.forEach(x=>{
      if(x.v>=7)precs.push(`<li><b>${x.f.label} (high):</b> ${RISKX.precs[x.f.id].hi}</li>`);
      else if(x.v<=3)precs.push(`<li><b>${x.f.label} (low — a strength):</b> ${RISKX.precs[x.f.id].lo}</li>`)});
    $('#rres').innerHTML=`<div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">Risk: ${risk.toFixed(1)} / 10</h2><span class="tag" style="color:${col};border-color:${col}">${band[2].toUpperCase()}</span></div>
    <div class="bar" style="margin:10px 0"><i style="width:${risk*10}%"></i></div>
    <p>${band[3]}</p>
    ${precs.length?`<h3>Precautions for this profile</h3><ul class="b">${precs.join('')}</ul>`:'<p style="color:var(--dim)">No factor at an extreme — standard change management with the precautions above.</p>'}`};
  $$('[data-rk]').forEach(r=>r.addEventListener('input',draw));
  draw();
};

  main.innerHTML=crumbs([['Quick reference']])+`<h1>Quick reference</h1><p class="lede">Formulas with honest limits, scoring models, runbooks, commands and checklists — the parts of this guide you will want open in a second tab. Filter by any word.</p>
  <label class="search" style="max-width:420px;margin-bottom:14px"><span class="sr">Filter reference</span>⌕<input id="rf" type="search" placeholder="Filter, e.g. flyway, rollback, hotspot, SLA"></label><div id="rl"></div>
  <h2 id="glossary">Glossary — maintenance vocabulary</h2><p class="lede">${GLOSSARY.length} terms, from characterization tests to the second-system effect. These are also the flashcards in <a href="#revision">revision mode</a>.</p><div id="gl"></div>`;
  const draw=q=>{
    const shown=cards.filter(c=>!q||strip(c.t+' '+c.html).toLowerCase().includes(q));
    $('#rl').innerHTML=shown.map(c=>`<section class="card" style="margin:12px 0"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${c.t}</h2><button class="btn sm" data-cp="${cards.indexOf(c)}">Copy</button></div>${c.html}</section>`).join('')||'<p>No matches. Try a broader term.</p>';
    $$('[data-cp]').forEach(b=>b.onclick=()=>copy(cards[+b.dataset.cp].txt));
    const gs=GLOSSARY.filter(g=>!q||(g.t+' '+g.d).toLowerCase().includes(q));
    $('#gl').innerHTML=`<div class="grid">${gs.map(g=>`<article class="card"><h3 style="margin:0 0 4px;font-size:15px">${g.t}</h3><p style="font-size:13.5px;color:var(--dim);margin:0">${g.d}</p></article>`).join('')||'<p>No glossary matches.</p>'}</div>`};
  $('#rf').oninput=e=>draw(e.target.value.toLowerCase().trim());draw('')};
V.resources=()=>{const grp=t=>({'Official documentation':'Official documentation','Industry guide':'Industry guides','Article':'Articles','Book':'Books','Community':'Community material'})[t];
  const order=['Official documentation','Industry guides','Articles','Books','Community material'];
  main.innerHTML=crumbs([['Resources']])+`<h1>Additional learning resources</h1><p class="lede">Categories are labeled so you can tell official documentation from books, articles and community material. Link status: <b>Link checked</b> means the page was opened and its content confirmed while this guide was built. <b>Link not checked</b> means the URL is the widely published address but was not opened from this build environment. Books without a link have none listed because a stable link could not be confirmed — find them through your library or the publisher.</p>`+order.map(g=>{const rs=RESOURCES.filter(r=>grp(r.type)===g);return rs.length?`<h2>${g}</h2><div class="grid">${rs.map(r=>`<article class="card"><h3 style="margin:0 0 4px">${r.t}</h3><p style="color:var(--dim);font-size:13px;margin:0 0 8px">${r.by}</p><p style="font-size:14px">${r.d}</p><div class="row"><span class="tag">${r.type}</span><span class="tag">${r.lvl}</span><span class="tag no">${r.mod}</span>${r.url?`<span class="tag ${r.ver?'ok':'no'}">${r.ver?'Link checked':'Link not checked'}</span>`:'<span class="tag no">No link</span>'}</div>${r.url?`<p style="margin:10px 0 0"><a href="${r.url}" target="_blank" rel="noopener noreferrer">Open resource ↗</a></p>`:''}</article>`).join('')}</div>`:''}).join('')+
  `<div class="notice">This guide is part of the Cyber Formula Library (Formula DB), category 09 — Software Engineering &amp; Professional Practices. Related guides in the series: <a href="clean_code_mastery.html">Clean Code Mastery</a>, <a href="software_testing_patterns.html">Software Testing Patterns</a>, <a href="code_review_mastery.html">Code Review Mastery</a>, <a href="software_documentation.html">Software Documentation</a>, Java Mastery, Java Concurrency, Spring Boot Mastery, PostgreSQL Mastery, Database Internals, Distributed Systems, Microservices, Design Patterns, Git Mastery, DevOps &amp; CI/CD and Observability — the sibling guides open when they sit in the same folder as this file.</div>`};
V.revision=()=>{
  main.innerHTML=crumbs([['Revision mode']])+`<h1>Revision mode</h1><p class="lede">Build a flashcard session from the sources you have collected: bookmarked lessons, saved snippets, glossary terms, and the quiz questions you have missed. Cards you mark "again" return later in the same session.</p>
  <div id="revsrc"></div><div id="revrun"></div>`;
  const sources={bm:{label:'Bookmarked lessons',n:LESSONS.filter(l=>S.bm[l.id]).length},snips:{label:'Saved snippets',n:S.snips.length},gloss:{label:'Glossary terms',n:GLOSSARY.length},wrong:{label:'Missed quiz questions',n:QUIZ.filter(q=>S.qw[q.id]).length}};
  const drawSrc=()=>{$('#revsrc').innerHTML=`<div class="card">${Object.entries(sources).map(([k,v])=>`<label class="chk"><input type="checkbox" data-src="${k}" ${v.n?'checked':'disabled'}><span>${v.label} <span class="ex">${v.n} card${v.n===1?'':'s'}</span></span></label>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn pri" id="revgo" ${Object.values(sources).some(s=>s.n)?'':'disabled'}>Start session</button></div>
    ${Object.values(sources).every(s=>!s.n)?'<p style="color:var(--dim);margin:8px 0 0">No personal sources yet: bookmark a lesson, save a snippet, or miss a quiz question — they all become cards here. Glossary terms are always available.</p>':''}</div>`;
    $('#revgo').onclick=()=>{const sel=$$('#revsrc [data-src]:checked').map(i=>i.dataset.src);run(sel)}};
  const run=sel=>{
    let deck=[];
    if(sel.includes('bm'))LESSONS.filter(l=>S.bm[l.id]).forEach(l=>deck.push({front:l.title,back:`Module ${mod(l.mod).n} — ${mod(l.mod).title}. ${mod(l.mod).blurb}`,link:'#lesson-'+l.id,kind:'Lesson'}));
    if(sel.includes('snips'))S.snips.forEach(s=>deck.push({front:`Snippet: ${s.lang} (from ${s.from||'lesson'})`,back:'<pre style="overflow-x:auto;font-size:11.5px;margin:0"><code>'+esc(s.code.slice(0,400))+(s.code.length>400?'…':'')+'</code></pre>',kind:'Snippet'}));
    if(sel.includes('gloss'))GLOSSARY.forEach(g=>deck.push({front:g.t,back:g.d,kind:'Glossary'}));
    if(sel.includes('wrong'))QUIZ.filter(q=>S.qw[q.id]).forEach(q=>deck.push({front:strip(q.q),back:q.why,link:'#lesson-'+mLessons(q.topic)[0].id,kind:'Question'}));
    deck=shuffle(deck);let i=0,again=[],got=0,shown=false;
    const step=()=>{if(i>=deck.length){
        $('#revrun').innerHTML=`<div class="card"><h2 style="margin-top:0">Session complete</h2><p>${got} of ${deck.length} marked "got it" first try${again.length?`; ${again.length} sent back for another pass`:''}.</p><div class="row"><button class="btn pri" id="rev2">New session</button></div></div>`;
        $('#rev2').onclick=()=>{drawSrc();$('#revrun').innerHTML=''};return}
      const c=deck[i];shown=false;
      $('#revrun').innerHTML=`<p style="font:12px var(--f-mono);color:var(--dim)">Card ${i+1} of ${deck.length} · ${esc(c.kind)}${again.length?` · ${again.length} waiting for another pass`:''}</p>
      <div class="flash"><div class="fk">${esc(c.kind)}</div><div class="fx2">${esc(c.front)}</div></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="revshow">Show answer</button></div><div id="revback"></div>`;
      $('#revshow').onclick=()=>{if(shown)return;shown=true;
        $('#revback').innerHTML=`<div class="flash" style="margin-top:10px"><div class="fk">Answer</div><div class="fx2" style="font-size:15px">${c.back}${c.link?` <a href="${c.link}">Open →</a>`:''}</div></div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn on" id="revgot">Got it</button><button class="btn" id="revag">Again, later</button></div>`;
        $('#revgot').onclick=()=>{got++;i++;step()};
        $('#revag').onclick=()=>{deck.push(c);i++;step()}}};
    step()};
  drawSrc()};
V.search=()=>{const q=($('#q').value||'').trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);
  const res=terms.length?INDEX.map(e=>{const hay=(e.t+' '+e.x).toLowerCase();if(!terms.every(t=>hay.includes(t)))return null;let sc=0;terms.forEach(t=>{if(e.t.toLowerCase().includes(t))sc+=5;sc+=Math.min(3,hay.split(t).length-1)});return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40):[];
  const snip=e=>{const x=e.x,l=x.toLowerCase(),k=l.indexOf(terms[0]);const s=Math.max(0,k-50);let t=esc(x.slice(s,s+160));terms.forEach(w=>{t=t.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return (s>0?'…':'')+t+'…'};
  main.innerHTML=crumbs([['Search']])+`<h1>Search</h1><p class="lede">${terms.length?res.length+' result'+(res.length===1?'':'s')+' for “'+esc(q)+'”':'Type in the search box above to search lessons, labs, case studies, references, interview questions, practicals and resources.'}</p><div class="res">${res.map(r=>`<a class="card" style="text-decoration:none;color:inherit" href="${r.e.href}"><div class="row"><span class="tag">${r.e.ty}</span><span style="color:var(--dim);font-size:12px">${r.e.sub}</span></div><h3 style="margin:6px 0 4px">${r.e.t}</h3><p style="font-size:13px;color:var(--dim);margin:0">${snip(r.e)}</p></a>`).join('')}</div>`};
/* ---- router ---- */
function route(){const r=(location.hash||'#home').slice(1)||'home';side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  if(r.startsWith('lesson-'))V.lesson(r.slice(7));else if(V[r]&&r!=='lesson')V[r]();else V.home();
  navState(r.startsWith('lesson-')?r:(V[r]?r:'home'));window.scrollTo(0,0);main.focus({preventScroll:true});document.title=(r.startsWith('lesson-')&&les(r.slice(7))?les(r.slice(7)).title+' · ':'')+'Software Maintenance Mastery'}
/* ---- events ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='copy')copy(CODES[+b.dataset.ci]);
  else if(a==='save'){const code=CODES[+b.dataset.ci];if(!S.snips.some(s=>s.code===code)){S.snips.unshift({code,lang:b.dataset.lang,from:(location.hash.startsWith('#lesson-')&&les(location.hash.slice(8))||{}).title||'guide'});S.snips=S.snips.slice(0,30);save()}toast('Saved to your library')}
  else if(a==='cmp'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=b.dataset.v;s.dataset.v=v;$$('.seg button',s).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('.cv',s).innerHTML=cmpView(c,v);const lab=b.textContent;$('.vl',s).textContent=c.lang+' · '+lab.toLowerCase()}
  else if(a==='cmpcopy'||a==='cmpsave'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=s.dataset.v,code=v==='bad'?c.bad:c.good;if(a==='cmpcopy')copy(code);else{if(!S.snips.some(x=>x.code===code)){S.snips.unshift({code,lang:c.lang,from:c.title});save()}toast('Saved to your library')}}
  else if(a==='snipcopy')copy(S.snips[+b.dataset.i].code);
  else if(a==='snipdel'){S.snips.splice(+b.dataset.i,1);save();V.home()}});
$('#menu').onclick=()=>{const o=side.classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(o))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
document.addEventListener('click',e=>{if(side.classList.contains('open')&&!side.contains(e.target)&&!$('#menu').contains(e.target)){side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}});
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'dark';S.theme=cur==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save()};
$('#q').addEventListener('input',e=>{if(e.target.value.trim()){if(location.hash!=='#search')history.replaceState(null,'','#search');V.search();navState('search');window.scrollTo(0,0)}else if(location.hash==='#search'){location.hash='#home'}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();if(location.hash==='#search')location.hash='#home'}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
const up=$('#up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>700),{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('hashchange',()=>{if(location.hash!=='#search')$('#q').value='';route()});
load();if(S.theme)document.documentElement.dataset.theme=S.theme;
buildSide();route();
</script>
</body>

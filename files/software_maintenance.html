LES('m01-what','m01','What software maintenance really is',1,8,[
P(R`Software maintenance is the set of engineering activities performed after a system is delivered: modifying it to fix defects, adapting it to a changing environment, improving its structure, and preparing it for future change. The ISO/IEC 14764 standard is the classic reference, and it defines maintenance as the modification of a software product after delivery to correct faults, improve performance or other attributes, or adapt the product to a changed environment. Far from being an afterthought, maintenance is where most software engineering happens: commonly cited estimates in software engineering literature put maintenance at roughly 40 to 80 percent of total lifecycle cost, and every experienced engineering organization will confirm that the delivered system is the beginning of the work, not the end.`),
H('The four maintenance types'),
P(R`ISO/IEC 14764 classifies maintenance into four activities. Knowing the vocabulary matters because the four types have different triggers, different urgency and different testing needs.`),
TB(['Type','Trigger','Typical example','Urgency'],[
['Corrective','A fault has been observed in production','A discount is applied twice for orders paid by invoice; ship a hotfix','Immediate — the system is wrong now'],
['Adaptive','The environment changed under the system','Java 8 is end-of-life; PostgreSQL 12 reaches EOL; a partner API adds mandatory auth headers','Planned — a deadline exists but is external'],
['Perfective','New or evolving requirements','Marketing needs partial refunds; the pricing engine gains a new tier','Planned, prioritized like features — because it is feature work'],
['Preventive','Future risk or cost reduction','Extracting a 3,000-line God class before the next big change touches it','Scheduled by the team — the hardest type to justify and the easiest to cut']]),
P(R`In practice the types blur: upgrading a framework (adaptive) usually uncovers bugs (corrective) and is the moment to modernize syntax (a perfective touch). The classification is still useful in conversation with stakeholders, because it makes the invisible work visible: "this quarter we did 60 percent feature work, 25 percent adaptive maintenance for the platform upgrades, 10 percent corrective and 5 percent preventive" is a sentence every engineering manager should be able to say truthfully.`),
H('Maintenance, development and modernization'),
P(R`Maintenance vs. development is a false boundary. A feature added to a five-year-old service is development and maintenance at once: you must understand the existing system, respect its invariants, and leave it more maintainable than you found it. Modernization is a subset of maintenance with a specific flavor: deliberately moving a system toward a target architecture or platform (monolith to services, Java 8 to 21, self-hosted VMs to Kubernetes) while it keeps serving production traffic.`),
TB(['','Routine maintenance','Modernization'],[
['Goal','Keep the system correct, secure and operable','Move the system to a better architecture or platform'],
['Horizon','Continuous','Months to years, staged'],
['Risk','Small, frequent, reversible','Larger, must be sliced into reversible increments'],
['Failure mode','A bad change rolls back','A stalled program leaves two architectures running']]),
H('Software entropy and system degradation'),
P(R`Meir Lehman's laws of software evolution (formulated between 1974 and 1997) describe what every maintainer knows viscerally: a system in real-world use must be continually adapted or it becomes progressively less useful (continuing change), and unless work is done to reduce it, the complexity of an evolving system increases (increasing complexity). Untended, "up-front design" decays: shortcuts accumulate, documentation drifts, dead code piles up, and the cost of the next change creeps upward. Engineers call this software entropy. Preventive maintenance — refactoring, deleting dead code, updating dependencies before they rot — is the ongoing fight against it.`),
CALL('note',R`Maintenance is a continuous engineering responsibility, not an occasional cleanup sprint. Teams that schedule "hardening weeks" twice a year and ignore maintainability the rest of the time are not doing maintenance; they are doing emergency repayment of accumulated interest. The healthy pattern is a steady budget of maintenance capacity that ships with every iteration.`),
H('Maintainability as a quality attribute'),
P(R`Maintainability is one of the ISO/IEC 25010 product quality characteristics, and its sub-characteristics read like a maintenance checklist: <b>modularity</b> (changes stay local), <b>reusability</b>, <b>analysability</b> (how fast can a newcomer find the code that matters), <b>modifiability</b> (how cheap is a correct change), and <b>testability</b> (how cheap is it to prove the change did not break anything). Every practice in this guide — characterization tests, dependency hygiene, ADRs, expand-and-contract migrations — is ultimately an investment in one of those five properties.`),
CALL('trap',R`The most expensive maintenance misconception is that maintenance is junior work. In reality the hardest engineering problems in most companies live in maintenance: changing a live schema without downtime, migrating a message consumer without losing messages, upgrading a framework underneath a running business. Staffing maintenance with the least experienced people is how systems become legacy ahead of schedule.`)
]);
LES('m01-ops','m01','Running maintenance as an engineering discipline',2,8,[
P(R`What separates teams that keep systems healthy for a decade from teams that drown in their own code is not talent — it is whether maintenance is managed: planned, owned, budgeted and visible. This lesson sets up the operating model that the rest of the guide assumes.`),
H('Ownership and maintenance planning'),
UL([R`<b>Every component has an owner</b> — a team, not a person. Unowned code is where undocumented behavior, dead configuration and security debt accumulate first.`,
R`<b>Maintenance is on the calendar</b>, not squeezed in after features: dependency upgrades, rotation of secrets and certificates, index maintenance and documentation refresh are scheduled work with names attached.`,
R`<b>Work arrives through the same pipeline as features</b>: a ticket, a priority, a reviewer. "We'll fix it later" without a ticket is a decision to never fix it.`,
R`<b>Plans are reviewed</b> when the system changes: a maintenance plan written for a three-node deployment is obsolete under Kubernetes.`]),
TB(['Cadence','Maintenance activity','Owner'],[
['Every change','Code review of maintainability, tests with the change, docs updated in the same PR','Author + reviewer'],
['Every sprint','A slice of the debt budget (see <a href="#lesson-m05-budget">Module 05</a>), flaky-test triage, small refactors that unblock current features','Team'],
['Every month','Dependency and CVE review, error-budget check, runbook spot-checks','Tech lead + platform'],
['Every quarter','Debt register review and re-prioritization, recovery drill, EOL horizon check (runtimes, frameworks, certificates)','Engineering management'],
['Every year','Architecture review against the business roadmap; decide refactor, modularize, migrate or leave (Module 21)','Architecture + management']]),
H('What maintenance actually costs'),
P(R`Maintenance cost has a visible component (the hours spent fixing, adapting, upgrading) and a much larger invisible component: the drag on every feature that touches tangled code, the on-call load from fragile deployments, the interview loops caused by engineers leaving unmaintainable systems, and the risk premium of changes nobody can test. Module 19 covers the economics properly — total cost of ownership, DORA metrics, cost of delay. The planning takeaway is simpler: if you only count visible maintenance cost, you will systematically underfund it.`),
H('Common maintenance challenges'),
UL([R`<b>Invisible work</b>: preventive maintenance competes with features that have stakeholders and deadlines. Make it visible with a debt register and a budget.`,
R`<b>Knowledge concentration</b>: one engineer understands the billing module. Rotation, pairing and documentation (Module 18) are the countermeasures.`,
R`<b>Legacy tooling friction</b>: if the build takes 40 minutes, every maintenance task costs 40 minutes more. Tooling investment is maintenance.`,
R`<b>Unowned integrations</b>: partners change APIs on their schedule; adaptive maintenance must be someone's job.`,
R`<b>Frozen zones</b>: code everyone is afraid to touch calcifies. Characterization tests (Module 08) unfreeze them.`]),
CALL('tip',R`The boy scout rule — leave the code cleaner than you found it — works, with two amendments. First, "cleaner" must mean behavior-preserving in the same change or a separate, labeled refactor commit, never both mixed silently. Second, the rule is a floor, not a strategy: it fights entropy locally, but it does not retire architectural debt. Pair it with an explicit budget.`),
P(R`Long-term sustainability is the sum of these habits: owned components, scheduled work, honest budgets, documentation that survives staff turnover, and a codebase where the next change is cheaper than the last. The rest of this guide teaches the techniques; this module is the operating system they run on.`)
]);

LES('m02-first','m02','First contact: exploring an unfamiliar repository',1,9,[
P(R`You just got access to a repository you have never seen, and next week you are expected to change something in it. The worst move is to start editing. The professional move is a structured hour of exploration that builds a mental model: what the system is, where behavior lives, what the risks are, and what "done" looks like for your change. This lesson is the checklist; the next two add depth and a full worked workflow.`),
H('The first thirty minutes'),
UL([R`<b>Read the README and any docs/ or architecture/ folder</b> — then distrust it proportionally to its age. Documentation drift is the rule, not the exception.`,
R`<b>Look at the build files before the code</b>: pom.xml, build.gradle, package.json, requirements.txt, go.mod. They tell you the stack, the module boundaries and the dependency posture faster than any file.`,
R`<b>Build it once, untouched</b>. If the clean build fails on a fresh machine, you have learned something crucial about the project's reproducibility.`,
R`<b>Run the tests once</b>. A suite that is red before your first change recalibrates how much you trust it later.`,
R`<b>Run the application locally</b> if there is a dev profile. Click through the one workflow you will change.`]),
H('Read the shape of the project'),
P(R`Repository layout encodes the architects' intentions — and their decay. This is the structure of the running example used throughout the workshop labs:`),
CODE('text',`
orderflow/                        # multi-module Maven monolith
├── pom.xml                       # parent: modules, dependency management
├── orderflow-api/                # DTOs and interfaces shared with partners
├── orderflow-service/            # business logic
│   └── src/main/java/com/acme/order/
│       ├── OrderApplication.java # @SpringBootApplication entry point
│       ├── web/                  # @RestController layer
│       ├── service/              # OrderService, PricingService, ...
│       ├── persistence/          # JPA entities + repositories
│       └── integration/          # payment gateway, email, warehouse
├── orderflow-batch/              # nightly jobs (separate deployable)
└── db/migration/                 # Flyway scripts, but see note below
`),
CALL('note',R`In this project the Flyway scripts live in <code>orderflow-service/src/main/resources/db/migration</code> as well as a stray <code>db/migration</code> at the root that the batch module does not use. Discovering which one is actually on the classpath — and which is a fossil — is exactly the kind of undocumented behavior Module 07 prepares you for.`),
H('Identify the entry points'),
P(R`An entry point is anywhere the outside world hands control to the system. In a Spring Boot service the main class is trivial to find; the load-bearing entry points are the web controllers, scheduled jobs and message listeners.`),
CODE('java',`
@SpringBootApplication
public class OrderApplication {
  public static void main(String[] args) {
    SpringApplication.run(OrderApplication.class, args);
  }
}
`),
UL([R`<b>Web layer</b>: search for <code>@RestController</code>, <code>@RequestMapping</code>, <code>@GetMapping</code> — this is your API surface.`,
R`<b>Scheduled work</b>: <code>@Scheduled</code>, <code>@EnableScheduling</code>, or a separate batch deployable.`,
R`<b>Messaging</b>: <code>@RabbitListener</code>, <code>@KafkaListener</code>, <code>@JmsListener</code> — asynchronous entry points that fail differently from HTTP.`,
R`<b>Older stacks</b>: web.xml servlet mappings, Spring XML contexts, main() in a plain Java project, a callable script in Python and JavaScript projects.`,
R`<b>Triggers you cannot see in the repo</b>: cron entries, Kubernetes CronJobs, upstream systems calling you. Ask, do not assume.`]),
H('Configuration and environments'),
P(R`Configuration tells you what the system needs to survive: databases, brokers, caches, external URLs, feature flags. Read it once, carefully, and write down the dependencies you find — this becomes your integration inventory.`),
CODE('yaml',`
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: order_app
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual      # red flags live in config too
payment:
  gateway:
    url: https://psp.example.com/v1   # external integration
    timeout-ms: 5000
`),
CALL('trap',R`Config files routinely lie about production: the real values come from environment variables, a config server or Kubernetes secrets. Treat application.yml as the schema of the configuration, then find where the values actually come from per environment. A "local" default pointing at a shared test database is a finding, not a convenience.`)
]);
LES('m02-trace','m02','Tracing behavior: from request to database',2,9,[
P(R`Static structure tells you where code lives; tracing tells you what the system actually does. Pick one business workflow — the one you must change — and follow a single request through every layer: controller, service, repository, external call, and back. Do this once with the debugger or logs, and you will have learned more than a week of passive reading.`),
H('The trace'),
UL([R`Start at the controller that receives the request; note the validation, the status codes, and who is allowed to call it.`,
R`Follow the service method: where does it branch, where does it write, where does it call other services or integrations?`,
R`Open the repository and the entity: what tables are written, in what transaction, with what isolation assumptions?`,
R`Note everything asynchronous: events published, messages queued, scheduled follow-ups. The workflow does not end at the HTTP response.`,
R`Write the sequence down as five to ten lines of text. That note is the first honest documentation this workflow has probably ever had.`]),
H('The database schema is documentation'),
P(R`Schema discovery is behavior discovery: constraints, defaults and indexes encode years of bug-driven learning. Read the tables involved in your workflow before you touch anything.`),
CODE('sql',`
CREATE TABLE orders (
  id            BIGSERIAL PRIMARY KEY,
  customer_id   BIGINT NOT NULL REFERENCES customers(id),
  status        VARCHAR(20) NOT NULL DEFAULT 'NEW',
  total_cents   INTEGER NOT NULL CHECK (total_cents >= 0),
  created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
  CONSTRAINT orders_status_check
    CHECK (status IN ('NEW','PAID','SHIPPED','CANCELLED'))
);
CREATE INDEX idx_orders_customer ON orders(customer_id);
-- the CHECK and the status enum in code had better agree; verify they do
`),
P(R`While reading, collect anomalies: nullable columns that code assumes are present, duplicate-looking tables, columns whose names no longer match their contents, indexes that obviously serve queries that no longer exist. Each is an entry for the debt register you will meet in Module 05.`),
H('Read the tests you have — and notice the ones you do not'),
P(R`Existing tests are the cheapest specification of intent: their names document intended behavior, their fixtures document realistic data, their assertions document invariants. Two cautions. First, some tests are fossils — disabled, ignored, or asserting nothing; count only tests that would fail if behavior broke. Second, map what is <i>not</i> covered: in the running example the web layer has a handful of tests, the pricing service has none, and the batch module's only test asserts that a file exists. That distribution is your risk map, and Module 08 tells you what to do about it.`),
H('External integrations and the deployment view'),
UL([R`<b>Outbound HTTP</b>: search for <code>RestTemplate</code>, <code>WebClient</code>, <code>RestClient</code>, <code>HttpClient</code> — list every external base URL.`,
R`<b>Messaging</b>: <code>KafkaTemplate</code>, <code>RabbitTemplate</code>, <code>@KafkaListener</code>, <code>@RabbitListener</code> — topics, queues, and delivery semantics in use.`,
R`<b>Shared infrastructure</b>: Redis, Elasticsearch, S3-compatible storage — each one is a migration constraint later.`,
R`<b>Deployment</b>: find the Dockerfile, the CI pipeline and the deployment descriptors. They tell you how the system actually runs: JVM flags, health checks, replica counts, resource limits.`,
R`<b>Consumers</b>: who calls this service? API docs, gateway routes, and team interviews answer what the code cannot.`]),
H('Git archaeology'),
P(R`The version history is the project's long-term memory. Before changing a file, ask it three questions:`),
CODE('bash',`
git log --oneline --follow -- src/main/java/.../PricingService.java   # how often does this change?
git log -S "totalCents" --oneline                                     # when did this concept appear?
git blame -L 120,145 src/main/java/.../OrderService.java              # who last touched these lines, when, why (read the commit)
`),
P(R`A file changed weekly and a file changed once in four years are different maintenance problems. The churn-plus-complexity combination becomes a measurable risk signal in Module 04.`),
CALL('tip',R`While exploring, keep a single file with four headings: <b>map</b> (what is where), <b>behavior</b> (traces you verified), <b>risks</b> (everything that surprised you), <b>questions</b> (things only humans can answer). Writing those four sections for an hour now is the difference between a careful change and an archaeology dig disguised as a pull request. The Legacy Code Investigation Lab in the workshop lets you practice this end to end.`)
]);
LES('m02-workflow','m02','Practical workflow: analyzing a multi-module Maven project',2,8,[
P(R`Here is the full first-day workflow, compressed. It assumes the OrderFlow layout from the previous lessons — a multi-module Maven monolith with a Spring Boot service, a batch module and a shared API module — but the shape transfers to Gradle, npm or pip projects with the commands swapped.`),
H('The workflow'),
UL([R`<b>1. Inventory the modules.</b> Read the parent pom: every <code>&lt;module&gt;</code> entry, the dependencyManagement block (who pins versions), and the plugins. Note module dependency direction — you are looking for cycles.`,
R`<b>2. Build untouched.</b> <code>mvn -T 1C clean install -DskipTests</code> first for speed; then <code>mvn test</code> on the service module alone to see the real state.`,
R`<b>3. Map the dependency graph.</b> <code>mvn dependency:tree</code> per module; flag duplicate versions of the same library and anything with a hard-coded old version.`,
R`<b>4. Measure churn.</b> Which files changed most in the last year? That is where the business lives — and where tests pay off most.`,
R`<b>5. Enumerate entry points.</b> Controllers, listeners, scheduled jobs — one grep each, results into your notes.`,
R`<b>6. Read the schema</b> and the migration history: <code>ls db/migration | sort</code> is a compressed history of the data model.`,
R`<b>7. Trace one workflow end to end</b> (previous lesson).`,
R`<b>8. List the risks</b> you found in the shape: the untested pricing module, the manual-ack listener, the stray migration folder, the 40-minute build.`]),
CODE('bash',`
# 3. dependency map for the service module
mvn -pl orderflow-service dependency:tree -Dverbose | grep -E ".*(com\\.acme|SNAPSHOT|:[0-9]+\\.[0-9]+\\.[0-9]+)" | head -40

# 4. churn: most-changed source files, last 12 months
git log --since="1 year ago" --name-only --pretty=format: -- "*.java" |
  grep -v "^$" | sort | uniq -c | sort -rn | head -15

# 5. entry points
grep -r "@RestController" orderflow-service/src/main/java --include="*.java" -l
grep -r "@KafkaListener\\|@RabbitListener\\|@Scheduled" orderflow-service/src/main/java -l
`),
H('Interpreting what you find'),
TB(['Signal','Likely meaning'],[
['A module with zero tests and the highest churn','Highest-risk component; characterization tests first (Module 08)'],
['Two modules with cyclic dependencies','Architecture debt; boundary fix needed before extraction (Module 10)'],
['Migration scripts in two folders','Schema drift; establish the source of truth (Module 11)'],
['dependency:tree shows three versions of one library','Classpath risk; align via dependencyManagement (Module 12)'],
['README last touched three years ago','Documentation debt; treat all claims as hypotheses to verify'],
['One file with 3,000+ lines and weekly commits','God class hotspot; refactor behind tests before the next feature (Modules 06 and 20)']]),
CALL('warn',R`The exploration discipline that matters most: change nothing while exploring — not a "trivial" rename, not a typo in a comment. Every change you make before you understand the system is a change you cannot explain in review, and the diff noise destroys the archaeology for the next person. Keep a list; merge nothing.`),
P(R`When do you stop exploring? When you can answer four questions precisely: where does my change go, what behavior must not change, how will I verify that, and how do I roll back if I am wrong. If any answer is fuzzy, the next module to read is Module 08 — because the fastest way to be allowed to change scary code is to put a safety net under it.`)
]);

LES('m03-what','m03','What technical debt is — and is not',1,8,[
P(R`Ward Cunningham coined the technical debt metaphor in 1992: shipping first-time code is like going into debt — a little debt speeds development, as long as it is paid back promptly, but every minute spent on not-quite-right code is interest on that debt. The metaphor caught on because it explains a phenomenon every team feels: development that gets slower with every feature, on a codebase that was fast to change a year ago. The metaphor is also routinely abused to label anything someone dislikes. This lesson draws the line precisely, because mislabeled debt is how teams end up "paying down debt" for a year with nothing to show.`),
H('Debt, bugs and trade-offs'),
TB(['Concept','Definition','Key test'],[
['Technical debt','A deliberate or emergent gap between the design the system has and the design the current requirements and knowledge would justify — carried forward because closing the gap now costs more than it returns','Would remediating it now make future changes cheaper or safer? If yes, it is debt'],
['Bug','The system behaves incorrectly with respect to current requirements','The system is wrong today; debt is about tomorrow&#39;s cost. Debt often hides bugs; they are still distinct'],
['Engineering trade-off','A justified limitation accepted with eyes open and documented','A trade-off becomes debt when the justification expires or was never written down']]),
P(R`The classic collapse case makes the distinction concrete. A team ships a hard-coded one-percent loyalty discount "just for launch" — a documented trade-off. Eighteen months later, the hard-coded value has quietly grown business rules around it, nobody remembers why it exists, and a pricing incident is traced to it. The trade-off became debt the day its context was lost. Nothing about the code changed; what changed is that the organization can no longer make an informed decision about it.`),
H('The debt quadrant'),
P(R`Martin Fowler's technical debt quadrant cross-references two questions: was the debt <b>deliberate or inadvertent</b>, and was it <b>prudent or reckless</b>? The quadrant is diagnostic, not moralizing — each quadrant has a different remedy.`),
TB(['','Prudent','Reckless'],[
['Deliberate','"We ship the simple version now and schedule the abstraction for next sprint" — with a ticket and an owner. The healthiest kind of debt: intentional, visible, repaid on a plan','"We don&#39;t have time for design" — no ticket, no plan, no owner. Interest starts compounding immediately'],
['Inadvertent','"We thought this design was right; two years of learning say otherwise." Common and forgivable — the remedy is a rewrite of the decision, not blame','"What is layering?" Debt incurred without knowing the field. The remedy is capability building, not just refactoring']]),
P(R`Note what the quadrant implies: debt incurred deliberately-and-prudently is not a failure — it is engineering. Fast-growing products cannot build every abstraction at the right time, because they do not yet know the requirements. The sin is not owing; the sin is owing invisibly, without a register, an owner and an expiry.`),
CALL('note',R`A useful vocabulary rule for your team: reserve "technical debt" for gaps you would pay to close. If you would not spend a sprint closing it even at zero opportunity cost, it is not debt — it is a preference. This single rule keeps the debt register from becoming a wish list, which is the most common way debt programs die.`),
H('Intentional vs. accidental — the second axis that matters'),
UL([R`<b>Intentional debt</b>: chosen under constraint — deadlines, unknown requirements, migration staging. Manage with a register entry and a repayment plan (Module 05).`,
R`<b>Accidental debt</b>: emerges from drift — the design fit 2019's requirements, not today's; the framework's defaults changed; the team grew and conventions diverged. Manage with periodic assessment (Module 04), because nobody will remember to schedule it.`]),
P(R`Both are real debt. The difference is who has to notice it: intentional debt is a promise the team made to itself (visible in the register), accidental debt is discovered by audit or by pain. Mature teams run both mechanisms.`)
]);
LES('m03-tax','m03','The debt taxonomy: ten kinds of debt',2,9,[
P(R`"Technical debt" is an umbrella. Under it live very different animals with different symptoms, different remediation skills and different risk profiles. The taxonomy below is the working vocabulary used by the assessment simulator in the workshop — learn to name what you see, because you cannot prioritize what you cannot name.`),
TB(['Category','What it is','Typical symptoms','Where it hurts first'],[
['Code debt','Duplication, long methods, God classes, poor names','30-line conditionals; copy-paste with one line changed; grep finds the same method five times','Every feature touching the file; bug-fix regressions'],
['Architecture debt','Boundaries that no longer fit the problem','Cyclic module dependencies; everything imports everything; no seams to test through','Testability; extraction; parallel team work'],
['Testing debt','Missing, weak or misleading tests','Core flows at zero coverage; tests that assert nothing; the suite that is permanently red','Refactoring confidence; release safety; on-call courage'],
['Documentation debt','Docs that are missing, wrong or unreadable','README from 2019; runbooks that fail on step 2; ADRs that never existed','Incident response; onboarding; decisions relitigated monthly'],
['Infrastructure debt','Manual, fragile or undocumented operations','Deploy is "run these 12 commands"; no infrastructure as code; snowflake servers','Recovery time; environment drift; scaling events'],
['Dependency debt','Outdated, vulnerable or abandoned dependencies','Framework three majors behind; libraries at end-of-life; last release four years ago','Security exposure; hiring; blocked upgrades compound'],
['Security debt','Known weaknesses with no plan','Unpatched CVEs; secrets in the repo; TLS 1.0 still enabled; no rotation runbook','Breach risk; compliance; emergency patching under pressure'],
['Database debt','Schema problems and unversioned change','No migration tooling; schema drift between environments; columns with three meanings','Data integrity; migration risk; analytics trust'],
['Operational debt','Missing observability and reliability practice','No dashboards for the money path; alerts pages for noise; no SLOs','Incident duration; silent data issues; weekend pages'],
['Organizational debt','Structure and incentives that produce the above','The billing team owns the code the shipping team changes; knowledge silos of one; "that&#39;s just how it works here"','Everything above, recurring']]),
H('Reading the taxonomy honestly'),
P(R`Three cautions keep the taxonomy useful. First, categories interact: dependency debt forces security debt; organizational debt manufactures all the others. Fixing a symptom while the factory that produces it still runs is a common failure of debt programs. Second, categorize by <i>remediation skill</i>, not just by symptom — renaming a variable (code debt) and splitting a shared database (database + architecture debt) are different professions. Third, the register entry should name the category explicitly, because the category determines who reviews the fix: refactoring by engineers, security debt with security engineering, organizational debt with management.`),
CALL('trap',R`The most seductive mislabel: calling missing tests "testing debt" and moving on. Tests are not a category of polish — they are the instrument that makes every other remediation safe. A team that schedules test debt after architecture debt has the order backwards: Module 08 exists because the safety net comes first.`),

LES('m03-interest','m03','Interest, principal and the velocity drag',2,8,[
P(R`The debt metaphor earns its keep when it explains numbers. <b>Principal</b> is the cost of paying the debt down: the sprint of refactoring, the migration project, the documentation week. <b>Interest</b> is the recurring tax every future change pays while the debt exists: the extra day every feature spends navigating the God class, the weekly flaky-test reruns, the hour of tribal-knowledge archaeology before anyone dares touch billing. Debt repayment is an investment decision: pay the principal when the interest you will otherwise pay exceeds it.`),
H('Where the interest actually collects'),
UL([R`<b>Change amplification</b>: one conceptual change requires touching many places (duplication, missing abstraction). Interest per feature.`,
R`<b>Cognitive load</b>: engineers must hold more context to change anything safely (long methods, no boundaries). Interest per hour.`,
R`<b>Unknown unknowns</b>: behavior exists that nobody can predict (untested, undocumented). Interest per incident — the most expensive kind.`,
R`<b>Fragility</b>: changes break things far away (hidden coupling). Interest per regression.`,
R`<b>Immobilization</b>: some changes stop being attempted at all (frozen zones). Interest compounds silently until a business-critical change is unavoidable.`]),
H('The compounding mechanism'),
P(R`Debt compounds through two feedback loops. The <b>speed loop</b>: debt slows changes, pressure grows, shortcuts get taken under pressure, adding debt. The <b>knowledge loop</b>: tangled code is hard to learn, so fewer people understand it, so changes get riskier and more defensive, so the code gets more tangled. This is why debt programs that wait for a convenient quarter fail — the convenient quarter never arrives, and the cost curve is convex. It is also why the incremental techniques in this guide (small refactors, strangler migrations, expand-and-contract) insist on slicing: every paid installment flattens the curve for the changes that remain.`),
TB(['Situation','Principal','Interest (per month, illustrative)','Sane decision'],[
['God class blocks a feature; refactor takes 2 weeks','2 weeks','3-4 days of navigation per feature across 3 features','Pay now — in slices, behind tests'],
['Hard-coded discount documented, changing next quarter','2 days','~0 while documented and stable','Defer — it is a trade-off, not debt, until context expires'],
['No tests on the module you must rewrite','4-6 weeks of characterization work','Every change risks production; hotfixes take days','Pay the safety net first, always'],
['Framework one major behind, no pressure','3 weeks','Slow bleed: security patches, hiring, morale','Schedule within 2 quarters; budget it']]),
CALL('note',R`The numbers above are illustrative shapes, not benchmarks — every team must measure its own interest. What transfers is the decision procedure: estimate the interest you pay per unit of change, estimate the principal, and treat debt repayment as an investment with a payback period. Module 19 turns this into metrics (change failure rate, lead time) that make the interest visible on a dashboard instead of in vibes.`),
P(R`One more connection to hold for later: velocity drag is the reason "just rewrite it" feels attractive — a rewrite promises zero interest forever after. Module 21 examines that promise skeptically, because rewrite projects pay their own interest: lost learning, parallel maintenance, and the second-system effect. The disciplined path is almost always targeted repayment.`)
]);

P(R`A code smell is a surface indication that usually corresponds to a deeper problem in the system — Kent Beck's phrase, popularized by Martin Fowler and Joshua Kerievsky. Smells are not bugs: the code works. Smells are risk multipliers: they predict where changes will be expensive, regressions likely, and archaeology necessary. You met the risk vocabulary in Module 03; here is how it looks in source code.`),
SM('Long method',

R`Every new rule lands in the same crowded place; branches multiply; testing requires setting up the whole world. Change amplification and cognitive load in one artifact.`,
R`Methods that need scrolling; deeply nested conditionals; comments acting as section headers ("// validate", "// charge") inside a method.`,
R`Leave it when the method is stable (touched yearly), linear, and about to be deleted. Refactoring a fossil is charity work for nobody.`,

public OrderResult placeOrder(OrderRequest req) {
  if (req.getItems() == null || req.getItems().isEmpty()) throw new IllegalArgumentException("no items");
  if (req.getCustomerId() == null) throw new IllegalArgumentException("no customer");
  Customer c = customerRepo.findById(req.getCustomerId()).orElseThrow();
  BigDecimal total = BigDecimal.ZERO;
  for (CartItem it : req.getItems()) {
    Product p = productRepo.findById(it.getProductId()).orElseThrow();
    total = total.add(p.getPrice().multiply(BigDecimal.valueOf(it.getQty())));
    if (p.getStock() < it.getQty()) throw new IllegalStateException("insufficient stock: " + p.getId());
  }
  if (c.getTier() == CustomerTier.GOLD) total = total.multiply(new BigDecimal("0.90"));
  Order o = new Order(c, total, OrderStatus.NEW);
  orderRepo.save(o);
  paymentClient.charge(c.getPaymentToken(), total);
  o.setStatus(OrderStatus.PAID);
  orderRepo.save(o);
  emailService.send(c.getEmail(), "Order " + o.getId() + " confirmed");
  return new OrderResult(o.getId(), total);
}

SM('Duplicated logic',
R`The same rule — or a drifted cousin of it — implemented in multiple places.`,
R`A rule change becomes a treasure hunt; the fifth copy you did not find becomes the production incident. This is the smell behind most "we fixed that bug twice" stories.`,
R`grep for a business term (a status name, a constant, a formula) finds multiple definitions; modules with parallel validation layers.`,
R`Leave it when two copies look similar but encode genuinely different rules that only coincidentally match today — deduplicating those fuses unrelated lifecycles.`,
'java',
`
// web layer

  throw new ResponseStatusException(CONFLICT, "order cannot be cancelled");
}
// service layer, drifted cousin

public enum OrderStatus {
  NEW, PAID, SHIPPED, CANCELLED;

  /** One rule, one owner: cancellable unless already shipped or cancelled. */
  public boolean cancellable() { return this == NEW || this == PAID; }
}
// web layer and service layer both call status.cancellable() — the rule cannot drift
`),

R`Constructor with 12+ dependencies; the file everyone has open; git churn concentrated in one path; merge conflicts on every release.`,
R`Leave it when it is a stable mediator about to be replaced wholesale (then it is a strangler target, not a refactor target).`,

SM('Circular dependency',
R`Module A depends on B, and B depends back on A — directly or through a chain.`,
R`Neither module can be understood, tested or extracted alone; the boundary you need for any future migration does not exist. Architecture debt in its purest form.`,
R` IntelliJ-style cycle warnings; a module diagram where arrows form loops; "shared" packages that import from both sides.`,
R`Almost never. Rare exception: tightly-coupled algorithm internals inside one module — that is a package boundary problem, not debt.`,

}
`,

P(R`Two more smells to keep in your field notes. <b>Shotgun surgery</b> is the inverse of the God class: one conceptual change scatters into twenty files (missing abstraction). <b>Primitive obsession</b> passes strings and longs where a small domain type (OrderStatus, Money, CustomerId) would carry the rules — it is why the duplicated-logic smell survives: there is no home for the rule to live in. Both are usually fixed by the same move — introduce a type, then move behavior into it.`),
CALL('tip',R`Smells are heuristics for attention, not laws for enforcement. The professional question is never "is this a smell?" but "what does this smell predict about the next change, and is that change coming?" A smell in cold code is trivia; the same smell in the file the team touches weekly is a five-alarm finding. The next lesson makes that combination quantitative.`)

CODE('bash',`
# churn: changes per file over the last year
git log --since="1 year ago" --pretty=format: --name-only -- "*.java" |
  sort | uniq -c | sort -rn > churn.txt

for f in $(awk '{print $2}' churn.txt | head -20); do
  printf "%5d %s\n" $(grep -cE "if|for|while|case|catch|&&|\|\|" "$f") "$f"
done
# multiply mentally: high churn AND high complexity = your hotspot list
`),

LES('m04-audit','m04','Audits, static analysis and the assessment toolbox',2,9,[

R`<b>Static analysis</b>: run the linters and analyzers before forming any human judgment, so the obvious is already tabulated.`,
R`<b>Dependency audit</b>: versions, EOL status, known vulnerabilities, maintenance health of each library (Module 12 has the workflow).`,
R`<b>Architecture review</b>: module dependency graph, cycles, layering violations — C4 diagrams and dependency-graph tools make this visible in hours.`,
R`<b>Test coverage analysis</b>: coverage as a map of untested risk, cross-referenced with the hotspot list.`,

['SpotBugs','Bytecode-level bug patterns: null derefs, resource leaks, concurrency hazards','Finding what source-level tools miss'],

TB(['Input','Question it answers','Where the evidence comes from'],[

['Exposure','How much of the system, traffic or team stands in the blast radius?','Architecture map; call graphs; deployment topology'],
['Remediation effort','What does the fix cost, in engineering time and risk?','Spiked estimates; similar past work'],

CODE('text',`
Debt Priority Score = Impact × Likelihood × Exposure     (range 1–125)

 25–59  → High        schedule this quarter, with an owner
  8–24  → Medium      schedule opportunistically; fix when touched
   < 8  → Low         the register remembers it; do not chase it
`),
CALL('note',R`This is an illustrative prioritization heuristic, not a universal industry-standard formula. Its value is not mathematical precision — it is that three people scoring the same finding must surface their disagreements explicitly, and the disagreement is where the real analysis happens. Bands and weights should be tuned to your context and re-checked when the business changes.`),

['Stable 30% duplication across five report generators','2','2','3','12','Medium','Real debt, cold code; fix opportunistically when a report changes'],
['HelperUtils renamed everywhere for taste','1','1','2','2','Low','This is preference, not debt — keep it out of the register']]),

LES('m07-what','m07','What makes a system legacy',1,8,[
P(R`"Legacy" does not mean old. A fifteen-year-old billing core with tests, runbooks and three people who know it cold is not legacy — it is mature. A two-year-old microservice that nobody understands, cannot deploy without the person who wrote it, and cannot take a dependency upgrade is legacy on every dimension that matters. Michael Feathers offered the sharpest working definition in Working Effectively with Legacy Code: <b>legacy code is code without tests</b> — because without tests, every change is an experiment run in production. Age is a risk factor; the diagnosis is loss of control.`),

LES('m08-safety','m08','Building the safety net: characterization testing',2,9,[
P(R`You cannot improve code you are afraid to change, and you cannot be unafraid without evidence that behavior survived the change. Legacy systems rarely have that evidence — which is why Feathers' book is fundamentally a book about <b>getting tests around existing behavior before changing it</b>. The instrument is the characterization test.`),
H('Why legacy code resists testing'),
UL([R`Dependencies are constructed, not injected: <code>new PaymentHttpClient(...)</code> inside the method means the test pays for, or waits on, the real gateway.`,
R`Mixed responsibilities: testing one rule requires standing up the database, the broker and the mail server.`,
R`Hidden global state: statics, singletons, system clocks and randomness make results non-deterministic.`,
R`No seams: nothing can be substituted without editing the code under test — the next lesson's topic.`,
R`Fear itself: the suite (if any) is red, so nobody knows what green means.`]),
H('The characterization test'),
P(R`A characterization test pins the behavior the code <i>currently</i> has — including behavior that looks wrong. Its assertion is derived from observation, not from intention: run the code, observe the output, then lock that output in as the expected value. This inverts normal testing (where the expected value comes from requirements), and the inversion is the point: you are not certifying correctness, you are certifying <b>stability</b>. Once the net exists, refactoring can proceed — and any behavior change you actually want becomes a deliberate, visible edit to a characterization test, reviewed on its own.`),
CODE('java',`
@Test   // characterization: observed, not specified
void loyaltyDiscount_goldTier_observedTenPercent() {
  PricingService service = new PricingService(fixedCatalog());  // controlled inputs
  BigDecimal observed = service.priceFor(customer(GOLD), cart("SKU-1", 2));
  // run once, print observed, assert the value you saw — that is the capture
  assertThat(observed).isEqualByComparingTo(new BigDecimal("19.80"));
}
`),
H('Golden master and approval testing'),
P(R`A <b>golden master</b> scales characterization from single values to whole outputs: run a broad, fixed set of inputs through the system, save the complete outputs (the master), and every later run diffs against it. <b>Approval testing</b> is the same idea with tool support — the test "approves" a snapshot; a change produces a diff you either approve (new truth) or reject (regression). Golden masters shine on code with many small rules — pricing engines, tax calculators, report generators — where enumerating individual assertions would take days. Their cost: the master must be reviewed once, carefully, and every intentional change re-approves it deliberately.`),

['Characterization test','One observed value per case','Pinpoint rules before refactor','Asserting garbage enshrines garbage — label suspected bugs in the test name'],
['Golden master','A whole output file/set','Rule-dense algorithms, serializers','Timestamps, randomness and ordering must be normalized or the master flakes'],
['Approval/snapshot tests','A structured snapshot (JSON, serialized form)','Interfaces you must not break','Snapshot files reviewed by reflex — approvals become clicks'],
['Regression tests','The bug&#39;s reproduction, post-fix','Every defect that reaches production','They grow forever; prune and merge duplicates']]),
CALL('note',R`Coverage strategy for the safety net: start where the next change will land, and where failure is expensive — the hotspot list from Module 04, not a quest for 100 percent. The net exists to make a specific upcoming change safe; grow it ahead of the work, one slice at a time. This is also the honest answer to "how long will the tests take?" — as long as the code you intend to touch, plus the margin of fear.`)
]);
LES('m08-seams','m08','Test seams and dependency breaking',3,9,[
P(R`Feathers defines a <b>seam</b> as a place where you can alter program behavior without editing the code itself — the point where a test substitutes a double for a real dependency. Legacy code is short on seams, so the craft is <i>creating</i> them with minimal, behavior-preserving edits.`),
H('The three seam families'),
TB(['Seam','Where the substitution happens','Example'],[
['Object seam','A collaborator is passed in instead of constructed','Constructor injection of PaymentGateway'],
['Link seam (JVM classpath)','A different implementation loads for the same class name','Test-classpath H2/fake where production loads PostgreSQL driver — use sparingly and visibly'],
['Compile-time seam (conditional compilation)','Rare in Java; common in C/C++ via preprocessor','#ifdef TEST builds substituting a fake']]),
H('Two dependency-breaking moves'),
P(R`<b>Sprout class</b>: when you must add behavior to tangled code, write the new logic in a new, fully-tested class and call it from the old code — the one new seam, the one clean room. <b>Wrap class</b>: when you must intercept a legacy collaborator, wrap it in a class implementing the same surface, delegating by default and overriding where the new behavior belongs — the seam for logging, caching or throttling without touching the wrapped code. Both moves follow the same contract: the legacy code keeps its behavior; the new capability lives in new code with real tests.`),
CODE('java',`
// the legacy method constructs its dependency — no seam exists
public Invoice invoiceFor(Long customerId) {
  TaxClient client = new TaxClient(config.getTaxUrl(), config.getApiKey()); // real HTTP
  BigDecimal tax = client.rateFor(customerId);
  ...
}

// step 1 (behavior-preserving): extract construction behind an overridable seam
public class BillingService {
  protected TaxClient taxClient() {                    // seam, default = production
    return new TaxClient(config.getTaxUrl(), config.getApiKey());
  }
  public Invoice invoiceFor(Long customerId) {
    BigDecimal tax = taxClient().rateFor(customerId);  // same behavior, new route
    ...
  }
}

// step 2 (test only): subclass-and-override at the seam
class TestableBilling extends BillingService {
  @Override protected TaxClient taxClient() { return new FakeTaxClient(FIXED_RATE); }
}
// step 3 (later, when the design can afford it): interface + constructor injection,
// and the protected-method seam retires. Seams are scaffolding; keep them only while needed.
`),
CALL('warn',R`The link seam (swapping classes on the test classpath) is powerful and dangerous: production behavior and test behavior diverge silently, and nothing in the source tree tells a reader it is happening. If you must use it, document it in the build configuration next to the substitution itself, and prefer object seams as soon as the code allows them.`),
P(R`Seam placement is design work: each seam you add is a place where the system became more modular, more honest about its dependencies. Dependency breaking is therefore not a testing trick — it is the first installment of the architecture debt repayment the audit identified in Module 04.`)
]);

<script>
'use strict';
const R=String.raw;
const LESSONS=[],MODS=[];
const P=t=>({k:'p',t}), H=t=>({k:'h',t}), UL=a=>({k:'ul',a});
const CODE=(lang,c)=>({k:'code',lang,c:c.trim()});
const CALL=(type,t)=>({k:'call',type,t});
const TB=(head,rows)=>({k:'tb',head,rows});
const CMP=(title,lang,bad,good,notes,trade)=>({k:'cmp',title,lang,bad:bad.trim(),good:good.trim(),notes,trade});
const SM=(name,what,why,spot,ok,lang,bad,good)=>({k:'smell',name,what,why,spot,ok,lang,bad:bad.trim(),good:good.trim()});
const MOD=(id,n,title,blurb,rel)=>MODS.push({id,n,title,blurb,rel:rel||[]});
const LES=(id,mod,title,level,mins,blocks)=>LESSONS.push({id,mod,title,level,mins,blocks});
const REFACT=[]; // catalog entries: name, when, how
const RF=(name,when,how,lang,bad,good)=>{REFACT.push({name,when,how});return {k:'smell',name,what:when,why:how,spot:null,ok:null,lang,bad:bad.trim(),good:good.trim(),rf:true}};
MOD('m01','01','Foundations of Clean Code','What clean code is, what it costs to skip it, and when "clean" turns into over-engineering.',['Java Mastery Guide','Architecture & Distributed Systems']);
MOD('m02','02','Naming','Names carry most of the meaning in a codebase. Learn to choose them on purpose.',['Java Mastery Guide']);
MOD('m03','03','Functions & Methods','Small, honest functions with few arguments and no surprises.',['Java Mastery Guide']);
MOD('m04','04','Classes, Objects & Abstraction','Cohesion, coupling, encapsulation and where to draw boundaries.',['Java Mastery Guide','Spring Backend Mastery']);
MOD('m05','05','SOLID in Practice','Five design guidelines, each with a violation, a fix and a limit.',['Architecture & Distributed Systems','Spring Backend Mastery']);

LES('m01-what','m01','What is clean code?',1,8,[
P(R`Clean code is code that another competent developer can read, change and trust without asking you what it does. It is a property of how the code reads to a team, so it can only be judged by someone other than the author. Working code is the entry fee. Whether it is clean decides what the next change costs.`),
TB(['Quality','Question to ask','Signal when it is missing'],[
['Readable','Can a new teammate explain this in 2 minutes?','Needs a walkthrough call; comments restate code'],
['Maintainable','How many places change for one requirement?','Shotgun surgery; fear of touching a file'],
['Extensible','Can I add a case without editing old, tested code?','Growing if/else or switch chains'],
['Testable','Can I test the rule without a database or the network?','Tests need mocks of 6 collaborators, or a running server']]),
H('Messy vs clean, side by side'),
CMP('Same behavior, different cost','java',R`
public double calc(List<Object[]> d, int t) {
  double r = 0;
  for (Object[] x : d) {
    if ((int) x[2] == t) {
      r += (double) x[0] * (int) x[1];
      if (r > 1000) r = r * 0.9;
    }
  }
  return r;
}`,R`
public Money totalFor(List<OrderLine> lines, CustomerTier tier) {
  Money subtotal = lines.stream()
      .filter(line -> line.tier() == tier)
      .map(OrderLine::total)
      .reduce(Money.ZERO, Money::plus);
  return discountPolicy.apply(subtotal);
}`,[
'Types replace <code>Object[]</code> and index lookups, so a wrong cast becomes a compile error.',
'Names state the intent: <code>totalFor</code>, <code>OrderLine</code>, <code>CustomerTier</code>.',
'The magic <code>1000</code> and <code>0.9</code> moved into a named <code>discountPolicy</code>, where the business can find and change them.',

LES('m01-debt','m01','Technical debt and the Boy Scout Rule',1,7,[
P(R`Technical debt is the extra cost of future changes caused by shortcuts or decay in the code. Ward Cunningham's original metaphor was about learning: shipping with your current understanding, then paying back as you learn more. Today the word also covers plain neglect. The "interest" is the slowdown every later change pays.`),
TB(['Type','Example','Typical response'],[
['Deliberate, prudent','Ship with a simple queue now; plan a broker at 10x load','Record it, add a ticket with a trigger'],
['Deliberate, reckless','"We have no time for tests"','Push back; this usually costs more than it saves'],
['Inadvertent','Learned a better model after shipping','Refactor as part of the next feature'],
['Bit rot','Outdated dependencies, dead flags','Regular cleanup budget']]),
H('The Boy Scout Rule'),
P(R`"Leave the code a little cleaner than you found it." Each change includes one small improvement in the area you touched: a clearer name, one extracted method, a deleted dead branch. Small steps keep reviews readable and risk low. Large unrelated cleanups belong in their own pull request.`),
CMP('A Boy Scout change inside a feature','java',R`
// feature: add VIP free shipping
if (o.t > 100 && u.v == 1) { s = 0; }
else if (o.t > 100) { s = 5; }
else { s = 10; }`,R`
// feature: add VIP free shipping (and name what we touched)
Money shipping = shippingFee(order, customer);

private Money shippingFee(Order order, Customer customer) {
  if (customer.isVip() && order.total().isAbove(FREE_SHIPPING_MIN)) return Money.ZERO;
  if (order.total().isAbove(FREE_SHIPPING_MIN)) return STANDARD_REDUCED;
  return STANDARD;
}`,['The new rule landed in a named method, not in the middle of a long function.','Magic numbers became constants while we were there.','The diff stays reviewable: one concept, one method.'],'Trade-off: touching old code adds risk. Do it only where tests exist or where you add them first.'),
CALL('warn',R`"We will clean it up later" has a poor track record. Make debt visible: a ticket, a <code>TODO(owner, date)</code> with a link, and a team rule for when it must be repaid.`)

LES('m01-over','m01','Clean code vs over-engineering',2,8,[
P(R`Clean code is not "more abstraction". Abstractions have a cost: more types, more indirection, more places to look. They only pay for themselves when they remove a real, recurring change cost. Software craftsmanship means choosing the simplest design that handles today's known requirements and keeps tomorrow's likely changes cheap.`),
CMP('Speculative generality','java',R`
interface PriceStrategyFactoryProvider { PriceStrategyFactory get(); }
interface PriceStrategyFactory { PriceStrategy create(Context c); }
interface PriceStrategy { Money price(Cart c); }
class DefaultPriceStrategy implements PriceStrategy { /* the only one */ }`,R`
Money price(Cart cart) {
  return cart.subtotal().minus(cart.coupon().discount());
}
// extract a Strategy the day a second pricing rule actually appears`,['Three interfaces for one implementation hide a one-line rule.','Rule of thumb: abstract on the second or third real variation, not the first.','Deleting an unused abstraction is cheap; unwinding a wrong one is not.'],'Trade-off: waiting means one later refactor. With tests that refactor is routine.'),
UL(['<b>Signs of too little structure:</b> copy-paste, 300-line methods, one class that everything imports.','<b>Signs of too much:</b> a class per verb, interfaces with one implementer and no test double, config for things that never change.','<b>Heuristic:</b> if explaining the structure takes longer than explaining the problem, simplify.']),

]);

P(R`Use the vocabulary the business uses. If support calls it a "refund", the code should not call it <code>ReverseTransaction</code>. This shared vocabulary is called the ubiquitous language in domain-driven design. A name that diverges from the domain forces a translation step in every conversation and every bug report.`),

P(R`A function should do one thing at one level of abstraction. "One thing" means all its steps are at the same level: <code>validate(order)</code> and <code>save(order)</code> in the same body is fine; <code>validate(order)</code> next to a raw SQL string is not. Length follows from that. There is no magic line count, but a function that needs a scroll bar usually mixes levels.`),

  if (user.getCoupon() != null) total -= total * user.getCoupon().getPct() / 100;
  Connection c = ds.getConnection();

}`,R`

LES('m04-cohesion','m04','Cohesion, coupling and encapsulation',2,9,[
P(R`<b>Cohesion</b> measures how strongly a class's methods use its fields. High cohesion means the class is about one idea. <b>Coupling</b> measures how much a class knows about others. Aim for high cohesion and low coupling. <b>Encapsulation</b> keeps invariants inside the class: callers ask objects to act and do not reach in to edit their state.`),
CMP('Tell, don\'t ask','java',R`

// the object owns its invariant
account.withdraw(amount);   // throws InsufficientFunds / AccountFrozen

  void withdraw(Money amount) {
    if (frozen) throw new AccountFrozen(id);

LES('m05-ocp','m05','Open/Closed Principle',2,8,[
P(R`Software entities should be open for extension and closed for modification: add behavior by adding code, not by editing tested code. The usual tool is polymorphism or a strategy.`),
CMP('OCP','java',R`
double discount(Customer c, double amt) {
  switch (c.type()) {
    case REGULAR: return amt * 0.0;
    case GOLD:    return amt * 0.1;
    case PLATINUM:return amt * 0.2;
    default: throw new IllegalArgumentException();
  }
}   // new tier = edit this method`,R`
interface DiscountPolicy { Money apply(Money amount); }
enum Tier implements DiscountPolicy {
  REGULAR { public Money apply(Money m) { return m; } },
  GOLD    { public Money apply(Money m) { return m.times(0.90); } },
  PLATINUM{ public Money apply(Money m) { return m.times(0.80); } }
}
Money total = customer.tier().apply(amount);`,['A new tier is a new constant; callers stay untouched.','The compiler forces each tier to define its discount.'],'Limit: do not build extension points for variation that may never come. A simple <code>switch</code> that exists in one place is often fine (see Module 01).'),

Client --> <<interface>> DiscountPolicy
                 ^
        +--------+---------+
      Regular   Gold    Platinum`)

LES('m05-lsp','m05','Liskov Substitution Principle',3,9,[
P(R`Code that works with a base type must keep working when given any subtype. A subtype must honor the base contract: accept at least what the parent accepts (no stricter preconditions), promise at least what it promises (no weaker postconditions), and preserve invariants.`),
CMP('LSP','java',R`
class Rectangle { void setWidth(int w){...} void setHeight(int h){...} int area(){...} }
class Square extends Rectangle {
  void setWidth(int w)  { super.setWidth(w);  super.setHeight(w); }
  void setHeight(int h) { super.setWidth(h);  super.setHeight(h); }
}
// client: r.setWidth(4); r.setHeight(5); assert r.area() == 20;   // fails for Square`,R`
interface Shape { int area(); }
record Rectangle(int width, int height) implements Shape { public int area(){ return width*height; } }
record Square(int side) implements Shape { public int area(){ return side*side; } }`,['Mutable setters made the "is-a" relationship false. Immutable value types remove the conflict.','Modeling by behavior (<code>Shape.area()</code>) is safer than modeling by taxonomy.'],'Smell check: a subclass that throws <code>UnsupportedOperationException</code>, overrides to do nothing, or needs <code>instanceof</code> checks in callers is violating LSP.')
]);

LES('m05-isp','m05','Interface Segregation Principle',2,7,[
P(R`Clients should not depend on methods they do not use. Prefer several small, role-focused interfaces to one wide interface.`),
CMP('ISP','java',R`
interface Worker { void work(); void eat(); void sleep(); }
class Robot implements Worker {
  public void work() {...}
  public void eat()   { throw new UnsupportedOperationException(); }
  public void sleep() { throw new UnsupportedOperationException(); }
}`,R`
interface Workable { void work(); }
interface Feedable { void eat(); }

LES('m05-dip','m05','Dependency Inversion Principle',3,9,[
P(R`High-level policy should not depend on low-level details. Both should depend on abstractions, and the abstraction is owned by the high-level side. The business code defines what it needs (<code>PaymentGateway</code>); infrastructure adapts to it (<code>StripeGateway</code>).`),

class CheckoutService {
  private final StripeClient stripe = new StripeClient(apiKey);
  void pay(Order o) { stripe.charge(o.cardToken(), o.total().cents()); }
}`,R`
interface PaymentGateway { PaymentResult charge(PaymentRequest r); }   // owned by the domain

class CheckoutService {
  private final PaymentGateway gateway;
  CheckoutService(PaymentGateway gateway) { this.gateway = gateway; }
  void pay(Order o) { gateway.charge(PaymentRequest.of(o)); }
}

(domain/policy)       (owned by domain)               (infrastructure)`),
CALL('note',R`DIP is the principle; dependency injection is a technique to supply the dependency. You can follow DIP without a framework.`)
]);

P(R`Michael Feathers defines legacy code as code without tests. The method for changing it safely: find a seam, get the code under test, make the change, then refactor.`),
UL(['<b>Characterization tests:</b> call the code, observe the output, assert it. They document behavior, not correctness.','<b>Seams:</b> places where you can change behavior without editing in place (a constructor parameter, an overridable method, an interface).','<b>Strangler fig:</b> route one feature at a time to the new implementation behind the old entry point; delete the old path when unused.','<b>Branch by abstraction:</b> introduce an interface, switch callers to it, add the new implementation, flip, remove the old.','<b>Safe release:</b> feature flags, dark launches, canary release, and an easy rollback. Compare old and new outputs in production before trusting the new path.']),

const SMELLX=[
{id:'sd1',title:'Order processor',level:1,code:R`public class OrderProcessor {
  public double proc(List<Object[]> d, String t, boolean f) {
    double r = 0;
    for (int i = 0; i < d.size(); i++) {
      if (d.get(i)[2].equals(t)) {
        r += (double) d.get(i)[0] * (int) d.get(i)[1];
        if (f) { r = r * 0.9; }
      }
    }
    // send email
    EmailClient.getInstance().send("admin@shop.com", "done");
    return r;
  }
}`,findings:[
{t:'Unclear names (proc, d, t, f, r)',ok:true,why:'Names say nothing about intent. Rename to something like totalFor(lines, category, applyDiscount).'},
{t:'Flag argument f switches behavior',ok:true,why:'A boolean parameter means the method does two things.'},
{t:'Object[] with index access and casts instead of a typed class',ok:true,why:'Primitive/structure obsession; casts can fail at runtime. Use an OrderLine type.'},
{t:'Magic number 0.9',ok:true,why:'Name the discount and put it in a policy.'},
{t:'Mixed responsibilities: pricing and sending email',ok:true,why:'SRP violation. A calculation method should not send mail, and it hides a side effect.'},
{t:'Hard-wired singleton EmailClient makes it untestable',ok:true,why:'Inject a Notifier (DIP) so tests can use a fake.'},
{t:'The for loop must be a while loop',ok:false,why:'Loop style is a preference here. The real issue is index access via casts, not for vs while.'},
{t:'The class is too small',ok:false,why:'Size is not the problem. The responsibilities are.'}]},
{id:'sd2',title:'Shipping calculator',level:2,code:R`double shipping(Order o) {
  if (o.getType().equals("STANDARD")) {
    if (o.getWeight() > 20) return 25.0;
    return 5.0;
  } else if (o.getType().equals("EXPRESS")) {

{t:'Type-switching on strings; a new type means editing this method (OCP)',ok:true,why:'Use an enum with behavior or a strategy per shipping type.'},
{t:'Returning -1 as an error code for unknown types',ok:true,why:'Callers may add -1 to a total. Throw an exception or use a closed type.'},
{t:'Magic numbers (20, 25.0, 5.0, 45.0, 15.0)',ok:true,why:'Rates and thresholds belong in named constants or configuration.'},
{t:'String comparison for type; a typo compiles fine',ok:true,why:'An enum makes invalid types unrepresentable and the compiler checks coverage.'},
{t:'double used for money',ok:true,why:'Use BigDecimal or a Money type to avoid rounding errors.'},
{t:'Nested if inside if is a SOLID violation',ok:false,why:'Shallow nesting is not itself a SOLID problem. The real issues are listed above.'},

/* ---------- INTERVIEW ---------- */
const INTERVIEW=[
{id:'i1',level:1,cat:'Fundamentals',q:'What makes code "clean"?',a:R`Code that other developers can understand, change and test with low effort. It is readable (clear names, small focused functions), has low duplication, expresses intent, and is covered by tests. Example: replacing <code>Object[]</code> index access with typed <code>OrderLine</code> objects. Add that clean is contextual; a one-off script does not need the same investment as a long-lived service.`},
{id:'i2',level:1,cat:'Fundamentals',q:'What is technical debt and how do you manage it?',a:R`Extra future cost caused by shortcuts or decay. Make it visible (tickets with owners and triggers), prioritize by how often the code changes, pay down steadily (a capacity slice or the Boy Scout Rule), and avoid reckless debt. Deliberate, recorded debt to hit a deadline can be a reasonable trade.`},
{id:'i3',level:1,cat:'Naming',q:'How do you name a method that returns a boolean?',a:R`As a true/false statement in positive form: <code>isActive</code>, <code>hasPermission</code>, <code>canRetry</code>. Avoid negatives like <code>isNotDisabled</code> because they force mental inversion.`},
{id:'i4',level:1,cat:'Functions',q:'Why avoid flag arguments?',a:R`A boolean that switches behavior means the function does two things and the call site (<code>render(true)</code>) is unreadable. Split into two methods, or use an enum or parameter object. In languages with named arguments the problem is smaller.`},
{id:'i5',level:2,cat:'Java',q:'When would you use a record, and when not?',a:R`Use for immutable data carriers with value semantics (DTOs, value objects like <code>Money</code>, map keys). Records give constructor, accessors, <code>equals</code>, <code>hashCode</code>, <code>toString</code> and can validate in a compact constructor. Avoid for entities with identity and mutable lifecycle (typical JPA entities) and where you need inheritance.`},
{id:'i6',level:2,cat:'Java',q:'Optional: where is it appropriate?',a:R`As a return type signaling that absence is expected. Not for fields, method parameters or collection elements; use an empty collection instead of <code>Optional<List></code>. Avoid <code>get()</code> without a check; prefer <code>orElseThrow</code>, <code>map</code>, <code>orElse</code>.`},
{id:'i7',level:2,cat:'SOLID',q:'Explain the Open/Closed Principle with an example.',a:R`Extend behavior without modifying existing, tested code. A discount calculator with a <code>switch</code> on customer tier needs editing for each tier. Replace with a <code>DiscountPolicy</code> interface (or enum with behavior); new tiers are new implementations. Caveat: do not add extension points before a second variation exists.`},
{id:'i8',level:2,cat:'SOLID',q:'Give a Liskov Substitution violation and a fix.',a:R`<code>Square extends Rectangle</code> with mutable setters: code that sets width and height independently breaks because <code>Square</code> couples them. Fix: immutable shapes behind a <code>Shape.area()</code> interface, or avoid the hierarchy. General signs: subclass throws <code>UnsupportedOperationException</code>, strengthens preconditions, or callers use <code>instanceof</code>.`},
{id:'i9',level:2,cat:'SOLID',q:'Dependency Inversion vs Dependency Injection?',a:R`DIP is a design principle: high-level policy depends on abstractions it owns, and low-level details implement them. DI is a technique for supplying dependencies from outside (constructor injection). You can do DI without DIP (injecting a concrete class) and DIP without a framework.`},
{id:'i10',level:2,cat:'Smells',q:'How do you tell shotgun surgery from divergent change?',a:R`Shotgun surgery: one change requires many small edits across many classes (a concept is scattered). Divergent change: one class changes for many unrelated reasons (several concepts in one place). Fixes go in opposite directions: gather scattered logic (Move Method, Extract Class), or split the class.`},
{id:'i11',level:2,cat:'Refactoring',q:'How do you refactor safely?',a:R`Have tests (characterization tests if none), work in small steps, run tests after each, commit on green, use IDE refactorings, keep refactors separate from behavior changes, and revert rather than debug a long failed refactor. For production risk, use feature flags and compare old and new outputs.`},
{id:'i12',level:2,cat:'Error handling',q:'Checked or unchecked exceptions?',a:R`Checked exceptions force handling at compile time but leak through layers and break lambdas. Most modern Java codebases use unchecked domain exceptions, translate low-level exceptions at boundaries, preserve the cause, and handle errors once at a boundary (e.g. a controller advice). Use checked for recoverable conditions callers should handle.`},
{id:'i13',level:2,cat:'Testing',q:'Mock or real implementation?',a:R`Prefer real objects or fakes for logic and in-memory collaborators; they test behavior and survive refactoring. Use mocks to verify important interactions with external systems (an email sent once) or when real ones are slow or non-deterministic. Over-mocking couples tests to implementation.`},
{id:'i14',level:2,cat:'Testing',q:'Does 100% coverage mean good tests?',a:R`No. Coverage shows executed lines, not asserted behavior. A test with no assertion can reach 100%. Use coverage to find untested code, together with mutation testing or review of assertions for quality.`},
{id:'i15',level:3,cat:'Design',q:'Your team wants an interface and factory for every class. Respond.',a:R`Ask what change each abstraction makes cheaper. Abstract at real seams: boundaries (DB, network, clock), real variation, or test isolation. For a single stable implementation, the abstraction costs navigation and hides logic. Propose extracting when a second implementation or a test need appears.`},
{id:'i16',level:3,cat:'Architecture',q:'When is hexagonal/clean architecture not worth it?',a:R`For small CRUD services with little business logic, short-lived tools, or prototypes, the extra interfaces and mapping outweigh the benefit. It pays off in long-lived systems with real rules, multiple adapters, or a need to test logic without infrastructure.`},
{id:'i17',level:3,cat:'Design',q:'Composition vs inheritance: how do you decide?',a:R`Inheritance only for a genuine is-a relationship with a stable contract the subclass fully honors (LSP). Otherwise composition: it hides unneeded API, lets you swap behavior at runtime and avoids the fragile base class problem. Example: <code>Stack</code> holding a <code>Deque</code> rather than extending <code>ArrayList</code>.`},
{id:'i18',level:3,cat:'Legacy',q:'You inherit a 3,000-line class with no tests. Plan?',a:R`1) Find hot spots from version control and bug history. 2) Add characterization tests around the parts you will change. 3) Find seams (constructor parameters, extract interfaces). 4) Extract classes with the clearest responsibility, keeping delegation until callers move. 5) Add CI, formatter and linter so it does not regress. 6) Measure change lead time and failures.`},
{id:'i19',level:3,cat:'Review',q:'You find a security flaw in a colleague\'s PR. How do you comment?',a:R`Mark it blocking, explain the exploit in one or two sentences, link a fix or give a snippet, and stay collaborative: "This concatenates user input into SQL, so <code>status=' OR '1'='1</code> returns all rows. Could we use a bind parameter?" Critique the code, not the person.`},
{id:'i20',level:3,cat:'Scenario',q:'Two services share duplicated pricing logic and keep drifting. What do you do?',a:R`Identify the single owner of the rule. If both services are in one codebase, extract a shared policy class with tests. Across services, avoid a shared library coupling if teams deploy independently: make one service the owner and call it, or publish the rule as a versioned library with a deprecation policy. Add a test that compares both until the duplication is removed.`},
{id:'i21',level:1,cat:'Comments',q:'When should you write a comment?',a:R`To explain why: intent, non-obvious constraints, warnings, legal notices, public API contracts. Not to restate what the code does. First try to express it with a better name or an extracted method.`},
{id:'i22',level:2,cat:'Practice',q:'How do you keep refactors from blocking feature delivery?',a:R`Refactor in the area you are changing (Boy Scout), keep refactor commits separate from behavior changes, ship in small PRs, and schedule larger debt items with a clear payoff such as less time per change in a hot area.`}
];

const REF=[
{id:'r-clean',t:'Clean Code checklist',items:['Names reveal intent and are searchable','Functions do one thing at one level of abstraction','No duplicated rules; no dead code','No magic numbers or strings','Errors are handled once, with context','Comments explain why, not what','Formatting is automated','Tests exist and read like specifications','Dependencies point toward business code']},
{id:'r-solid',t:'SOLID cheat sheet',items:['S: one reason to change (one actor)','O: add behavior by adding code, not editing tested code','L: subtypes honor the base contract; no surprises for callers','I: small role-based interfaces; clients depend only on what they use','D: policy owns the abstraction; details implement it','Limit: apply when there is real variation, a real boundary, or a test need']},
{id:'r-name',t:'Naming conventions',items:['Classes: nouns, PascalCase (OrderValidator)','Methods: verb phrases, camelCase (cancelOrder)','Booleans: isX, hasX, canX in positive form','Constants: UPPER_SNAKE_CASE (Java), named for meaning','Packages: lowercase, by feature','Python: snake_case functions, PascalCase classes; C#: PascalCase methods','Avoid: Manager, Helper, Util, Data, Info, process, handle without context']},
{id:'r-func',t:'Function design checklist',items:['Can I name it with a verb phrase that is not "and"?','0-2 arguments (3+ → parameter object)','No flag arguments','Queries do not change state; commands return nothing','Guard clauses; nesting of 2 or less','All statements at one abstraction level','Side effects are visible in the name']},
{id:'r-class',t:'Class design checklist',items:['One responsibility; name has no "And"/"Manager"','Fields are used by most methods (cohesion)','Invariants protected; no public mutable state','Dependencies injected, not constructed inside','Small public surface','Composition preferred; inheritance honors the contract']},
{id:'r-review',t:'Code review checklist',items:['Does it do what the PR says, and is the design sound?','Are edge cases and failures handled?','Is there a security risk (input, auth, secrets, SQL)?','Are tests meaningful and readable?','Are names clear? Is anything over-engineered?','Is it small enough to review? Are refactors separate?','Comments are phrased as questions or suggestions with reasons']},
{id:'r-pr',t:'Pull request checklist',items:['Title and description say what and why','Linked issue','Tests added or updated, build green','No unrelated changes; refactor split from behavior change','No debug code, secrets or commented-out code','Docs / changelog updated if behavior changed','Migration and rollback noted if relevant']},
{id:'r-test',t:'Testing checklist',items:['Each test has one reason to fail','Name states the behavior','Arrange-Act-Assert visible','No dependence on order, clock, network or shared state','Assert outcomes, not implementation','Bug fix has a regression test','Few slow integration tests; many fast unit tests']},
{id:'r-java',t:'Java-specific conventions',items:['Records for data carriers; sealed types for closed hierarchies','Constructor injection and final fields','try-with-resources for closeables','Optional as a return type only','Unchecked domain exceptions translated at boundaries','No wildcard imports; formatter enforces style','Prefer immutable collections (List.of, toList())','Use BigDecimal or a Money type for currency']},
{id:'r-anti',t:'Common anti-patterns',items:['God object / Manager class','Anemic domain model with all logic in services','Singleton used as hidden global state','Swallowed exceptions','Copy-paste inheritance','Primitive obsession','Service locator hiding dependencies','Returning JPA entities from controllers','Premature abstraction and premature optimization']},
{id:'r-debt',t:'Technical debt assessment guide',items:['Impact: how much slower is each change here?','Frequency: how often does this code change?','Risk: how likely and costly is a production failure?','Cost to fix: size of the refactor and test gap','Priority = frequency × impact × risk, relative to cost','Record: owner, trigger, ticket, date','Review the list every quarter and delete what no longer matters']}
];
/* ================= ENGINE ================= */
const KEY='fdb-cleancode-v1';
let S={},memOnly=false;
const DEF=()=>({done:{},bm:{},snips:[],notes:{},recent:[],last:'',streak:{last:'',n:0},daily:{},qs:{a:0,c:0},sd:{},rf:{},pr:{},theme:''});
function load(){try{const r=localStorage.getItem(KEY);S=Object.assign(DEF(),r?JSON.parse(r):{})}catch(e){S=DEF();memOnly=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
const $=(s,r)=> (r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LV=['','Beginner','Intermediate','Advanced'];
const lvTag=l=>`<span class="tag l${l}">${LV[l]}</span>`;
const today=()=>new Date().toLocaleDateString('en-CA');
function touch(){const t=today();if(S.streak.last===t)return;const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;save()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function copy(text){const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?'Copied':'Select the text and copy it manually')};
  try{navigator.clipboard.writeText(text).then(()=>toast('Copied'),fb)}catch(e){fb()}}
const mod=id=>MODS.find(m=>m.id===id);
const les=id=>LESSONS.find(l=>l.id===id);
const mLessons=mid=>LESSONS.filter(l=>l.mod===mid);
const doneCount=()=>LESSONS.filter(l=>S.done[l.id]).length;
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* ---- highlighter ---- */
const KW=new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long new package private protected public return short static super switch synchronized this throw throws try void volatile while var record sealed permits yield null true false def lambda from as with pass None True False elif in is not and or async await function let export type readonly undefined typeof namespace using foreach string decimal bool get set init'.split(' '));
const RE_C=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?[dDfFlL]?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
const RE_P=/(#.*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(@\w+)|(\b[A-Za-z_]\w*\b)/g;
function hl(code,lang){
  if(lang==='text'||lang==='markdown')return esc(code);
  const re=new RegExp((lang==='python'?RE_P:RE_C).source,'g');let out='',last=0,m;
  while((m=re.exec(code))){out+=esc(code.slice(last,m.index));last=re.lastIndex;const t=m[0];
    if(m[1])out+=`<span class="t-c">${esc(t)}</span>`;else if(m[2])out+=`<span class="t-s">${esc(t)}</span>`;
    else if(m[3])out+=`<span class="t-n">${t}</span>`;else if(m[4])out+=`<span class="t-a">${t}</span>`;
    else if(KW.has(t))out+=`<span class="t-k">${t}</span>`;else if(/^[A-Z]/.test(t)&&/[a-z]/.test(t))out+=`<span class="t-t">${t}</span>`;else out+=t}
  return out+esc(code.slice(last))}
function diff(a,b){const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const o=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){o.push([' ',A[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push(['-',A[i++]]);else o.push(['+',B[j++]])}
  while(i<n)o.push(['-',A[i++]]);while(j<m)o.push(['+',B[j++]]);return o}
const CODES=[];
function codeBlock(lang,code,opts){opts=opts||{};const ci=CODES.push(code)-1;
  return `<div class="code"><div class="ch"><span>${esc(lang)}</span><span class="sp"></span><button class="btn sm" data-act="copy" data-ci="${ci}">Copy</button>${opts.noSave?'':`<button class="btn sm" data-act="save" data-ci="${ci}" data-lang="${esc(lang)}">Save</button>`}</div><pre><code>${hl(code,lang)}</code></pre></div>`}
const CMPS={};let cmpN=0;
function cmpView(c,v){const lang=c.lang;
  if(v==='diff')return diff(c.bad,c.good).map(([k,t])=>`<span class="dl ${k==='+'?'add':k==='-'?'del':''}">${k===' '?'  ':k+' '}${hl(t,lang)}</span>`).join('');
  return hl(v==='bad'?c.bad:c.good,lang)}
function cmpHtml(c,labels){const id='c'+(cmpN++);CMPS[id]=c;labels=labels||['Before','After'];
  return `<section class="cmp" data-cmp="${id}" data-v="bad"><div class="cb"><b>${c.title}</b><div class="seg" role="group" aria-label="Choose view"><button class="bad" aria-pressed="true" data-act="cmp" data-v="bad">${labels[0]}</button><button class="good" aria-pressed="false" data-act="cmp" data-v="good">${labels[1]}</button><button aria-pressed="false" data-act="cmp" data-v="diff">Changes</button></div></div>
  <div class="code"><div class="ch"><span class="vl">${esc(c.lang)} · ${labels[0].toLowerCase()}</span><span class="sp"></span><button class="btn sm" data-act="cmpcopy">Copy</button><button class="btn sm" data-act="cmpsave">Save</button></div><pre><code class="cv">${cmpView(c,'bad')}</code></pre></div>
  ${c.notes&&c.notes.length?`<div class="why"><b>What changed and why</b><ol>${c.notes.map(n=>`<li>${n}</li>`).join('')}</ol>${c.trade?`<div class="tr">${c.trade}</div>`:''}</div>`:''}</section>`}
const CL={tip:'Tip',warn:'Caution',trap:'Trap',note:'Note'};
function inl(t){return t}
function blockHtml(b){
  switch(b.k){
    case 'p':return `<p>${b.t}</p>`;
    case 'h':return `<h3>${b.t}</h3>`;
    case 'ul':return `<ul class="b">${b.a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'code':return codeBlock(b.lang,b.c);
    case 'call':return `<div class="call ${b.type}"><b class="lb">${CL[b.type]}</b><p>${b.t}</p></div>`;
    case 'tb':return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'cmp':return cmpHtml(b);
    case 'smell':{const c={title:b.rf?'Before and after':'Bad example and refactoring',lang:b.lang,bad:b.bad,good:b.good,notes:[],trade:''};
      return `<article class="smell"><h3>${b.name}</h3><dl>${b.rf?`<dt>When</dt><dd>${b.what}</dd><dt>How</dt><dd>${b.why}</dd>`:`<dt>What</dt><dd>${b.what}</dd><dt>Why it hurts</dt><dd>${b.why}</dd><dt>How to spot</dt><dd>${b.spot}</dd><dt>Leave it when</dt><dd>${b.ok}</dd>`}</dl>${cmpHtml(c,['Bad','Refactored'])}</article>`}
  }return ''}

/* ---- derived catalogs & search index ---- */
const SMELLS=[];LESSONS.forEach(l=>l.blocks.forEach(b=>{if(b.k==='smell'&&!b.rf)SMELLS.push({name:b.name,what:b.what,why:b.why,spot:b.spot,ok:b.ok,lid:l.id})}));
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
function lessonText(l){const o=[l.title];l.blocks.forEach(b=>{switch(b.k){case 'p':case 'h':case 'call':o.push(b.t);break;case 'ul':o.push(...b.a);break;case 'tb':o.push(...b.head,...b.rows.flat());break;case 'cmp':o.push(b.title,...(b.notes||[]),b.trade||'',b.bad,b.good);break;case 'smell':o.push(b.name,b.what,b.why,b.spot||'',b.ok||'');break;case 'code':o.push(b.c)}});return strip(o.join(' '))}
const INDEX=[];
LESSONS.forEach(l=>INDEX.push({ty:'Lesson',t:l.title,x:lessonText(l),href:'#lesson-'+l.id,sub:'Module '+mod(l.mod).n}));
REF.forEach(r=>INDEX.push({ty:'Reference',t:r.t,x:strip(r.items.join(' ')),href:'#reference',sub:'Quick reference'}));
INTERVIEW.forEach(q=>INDEX.push({ty:'Interview',t:q.q,x:strip(q.q+' '+q.a),href:'#interview',sub:q.cat}));
RESOURCES.forEach(r=>INDEX.push({ty:'Resource',t:r.t,x:strip(r.t+' '+r.by+' '+r.d),href:'#resources',sub:r.by}));

/* ---- layout pieces ---- */
const main=$('#main'),side=$('#side');
function crumbs(parts){return `<nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Library</a><span class="s">/</span><span>09 Software Engineering</span><span class="s">/</span><a href="#home">Clean Code Mastery</a>${parts.map(p=>`<span class="s">/</span>${p[1]?`<a href="${p[1]}">${p[0]}</a>`:`<span aria-current="page">${p[0]}</span>`}`).join('')}</nav>`}
function buildSide(){
  const tools=[['home','Dashboard'],['paths','Learning paths'],['smells','Smell detector'],['refactor','Refactoring playground'],['review','Review simulator'],['quiz','Knowledge checks'],['interview','Interview arena'],['reference','Quick reference'],['resources','Resources']];
  side.innerHTML=`<h4>Practice and library</h4><div class="nav">${tools.map(t=>`<a href="#${t[0]}" data-r="${t[0]}"><span class="ck"></span>${t[1]}</a>`).join('')}</div><h4>Lessons</h4>`+MODS.map(m=>{const ls=mLessons(m.id);const d=ls.filter(l=>S.done[l.id]).length;
    return `<details class="mod" data-m="${m.id}"><summary><span class="n">${m.n}</span>${m.title}<span class="pc">${d}/${ls.length}</span></summary><div class="nav">${ls.map(l=>`<a href="#lesson-${l.id}" data-r="lesson-${l.id}" class="${S.done[l.id]?'done':''}"><span class="ck">${S.done[l.id]?'✓':'·'}</span>${l.title}</a>`).join('')}</div></details>`}).join('')}
function navState(r){$$('.nav a',side).forEach(a=>{const on=a.dataset.r===r;a.classList.toggle('cur',on);if(on){a.setAttribute('aria-current','page');const d=a.closest('details');if(d)d.open=true}else a.removeAttribute('aria-current')});
  $$('details.mod',side).forEach(d=>{const ls=mLessons(d.dataset.m);const x=ls.filter(l=>S.done[l.id]).length;d.querySelector('.pc').textContent=x+'/'+ls.length;$$('.nav a',d).forEach((a,i)=>{const dn=!!S.done[ls[i].id];a.classList.toggle('done',dn);a.querySelector('.ck').textContent=dn?'✓':'·'})})}

/* ---- question component ---- */
function qHtml(q,idx){return `<div class="q"><div class="qt">${idx||''}${({mcq:'Multiple choice',tf:'True or false',bug:'Find the bug',smell:'Identify the smell',scenario:'Scenario',code:'Short exercise'})[q.type]}</div><p>${q.q}</p>${q.code?codeBlock('java',q.code,{noSave:true}):''}<div class="opts">${q.type==='code'?`<textarea class="ans" aria-label="Your answer" placeholder="Write your answer here (it is not executed)"></textarea><div class="row"><button class="btn" data-q="show">Show model answer</button></div><div class="fbx"></div>`:q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')+'<div class="fbx"></div>'}</div></div>`}
function mountQ(el,q,cb){let fin=false;
  const fbx=$('.fbx',el);
  if(q.type==='code'){$('[data-q=show]',el).onclick=()=>{fbx.innerHTML=`<div class="fb">${codeBlock('java',q.model,{noSave:true})}<p>${q.why}</p><div class="row"><span>How did you do?</span><button class="btn sm" data-self="1">I got it</button><button class="btn sm" data-self="0">Not yet</button></div></div>`;$$('[data-self]',fbx).forEach(b=>b.onclick=()=>{if(fin)return;fin=true;$$('[data-self]',fbx).forEach(x=>x.disabled=true);cb(b.dataset.self==='1')});$('[data-q=show]',el).disabled=true};return}
  $$('.opt',el).forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const i=+b.dataset.i,ok=i===q.a;
    $$('.opt',el).forEach(o=>{o.disabled=true;if(+o.dataset.i===q.a)o.classList.add('right')});if(!ok)b.classList.add('wrong');
    fbx.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${q.why}</div>`;cb(ok)})}
function record(ok){S.qs.a++;if(ok)S.qs.c++;touch();save()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const dailyQ=()=>{const p=QUIZ.filter(q=>q.type!=='code');return p[hash(today())%p.length]};

const V={};

  t+='\nPractice\n';SMELLEX_LIST().forEach(x=>t+=' ['+(S.sd[x.id]!=null?'x':' ')+'] Smell detector: '+x.title+'\n');REFX.forEach(x=>t+=' ['+(S.rf[x.id]?'x':' ')+'] Refactoring: '+x.title+'\n');PRS.forEach(x=>t+=' ['+(S.pr[x.id]!=null?'x':' ')+'] Review: '+x.title+'\n');
  t+='\nKey checks\n';REF.slice(0,1).concat(REF.filter(r=>r.id==='r-solid')).forEach(r=>{t+=r.t+'\n';r.items.forEach(i=>t+=' [ ] '+i+'\n')});return t}

V.home=()=>{

  <h2>Daily Clean Code challenge</h2><div id="daily"></div>

  <h2>Revision checklist</h2><p>A plain-text checklist of everything in this guide with your current progress. Copy it into your notes app.</p><textarea class="nt" id="rev" readonly rows="8" aria-label="Revision checklist text">${esc(revisionText())}</textarea><div class="row" style="margin-top:8px"><button class="btn" id="revcopy">Copy checklist</button></div>
  <div class="notice">${memOnly?'Browser storage is unavailable here, so progress lasts only until you close this page. ':''}Progress, notes, bookmarks and snippets are saved only in this browser using local storage. Clearing site data, using a private window or switching browsers or devices will remove or hide them.</div>`;
  const box=$('#daily');box.innerHTML=qHtml(dq);mountQ(box.firstElementChild,dq,ok=>{S.daily[today()]={ok};record(ok);toast(ok?'Daily challenge done':'Daily challenge answered')});

};

V.paths=()=>{main.innerHTML=crumbs([['Learning paths']])+`<h1>Learning paths</h1><p class="lede">Four routes through the material. Each shows prerequisites, estimated time, your completion and the next lesson to take.</p>`+PATHS.map((p,pi)=>{const ls=p.lessons.map(les),d=ls.filter(l=>S.done[l.id]).length,nx=ls.find(l=>!S.done[l.id]);
    return `<section class="card" style="margin:14px 0"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${p.name}</h2><span class="tag">${p.time}</span></div><p style="color:var(--dim);margin:6px 0 10px">Prerequisites: ${p.pre}</p><div class="bar"><i style="width:${pct(d,ls.length)}%"></i></div><p style="font:12px var(--f-mono);color:var(--dim)">${d}/${ls.length} complete</p>
    <ol style="padding-left:20px;margin:8px 0">${ls.map(l=>`<li><a href="#lesson-${l.id}">${l.title}</a> ${S.done[l.id]?'<span class="tag ok">done</span>':''}</li>`).join('')}</ol>

V.smells=()=>{main.innerHTML=crumbs([['Smell detector']])+`<h1>Code smell detector</h1><p class="lede">Read the flawed code, tick every real problem you see, then submit. This is a learning exercise with a fixed answer key. It is not a static analysis tool and does not analyze code you paste.</p><div class="grid">${SMELLX.map(x=>`<button class="card" style="text-align:left" data-sd="${x.id}"><div class="eyebrow">${LV[x.level]}</div><h3 style="margin:0">${x.title}</h3><p style="color:var(--dim);font-size:13px;margin:6px 0 0">${S.sd[x.id]!=null?'Best score '+S.sd[x.id]+'%':'Not attempted'}</p></button>`).join('')}</div><div id="ex"></div>`;
  $$('[data-sd]').forEach(b=>b.onclick=()=>{const x=SMELLX.find(s=>s.id===b.dataset.sd);const ord=shuffle(x.findings);
    $('#ex').innerHTML=`<h2>${x.title}</h2>${codeBlock('java',x.code,{noSave:true})}<h3>Which of these are real problems?</h3><div id="fl">${ord.map((f,i)=>`<label class="chk"><input type="checkbox" data-i="${i}"><span>${f.t}<span class="ex" hidden></span></span></label>`).join('')}</div><div class="row"><button class="btn pri" id="sub">Submit</button></div><div id="res"></div>`;
    $('#ex').scrollIntoView({behavior:'smooth'});
    $('#sub').onclick=()=>{let ok=0,miss=0,fp=0;$$('#fl .chk').forEach((lb,i)=>{const f=ord[i],c=$('input',lb).checked;lb.classList.remove('ok','miss','fp');const ex=$('.ex',lb);ex.hidden=false;ex.textContent=f.why;
      if(f.ok&&c){ok++;lb.classList.add('ok')}else if(f.ok&&!c){miss++;lb.classList.add('miss')}else if(!f.ok&&c){fp++;lb.classList.add('fp')}$('input',lb).disabled=true});
      const tot=x.findings.filter(f=>f.ok).length,sc=Math.max(0,Math.round(100*(ok-fp)/tot));S.sd[x.id]=Math.max(S.sd[x.id]||0,sc);touch();save();$('#sub').disabled=true;
      $('#res').innerHTML=`<div class="fb ${sc>=70?'ok':'no'}"><b>Score ${sc}%.</b> Found ${ok} of ${tot} real problems, missed ${miss}, and ticked ${fp} that are not problems. Green = correct, amber = missed, red = false alarm. Read each explanation, then reopen the exercise to try again.</div>`}})};
V.refactor=()=>{main.innerHTML=crumbs([['Refactoring playground']])+`<h1>Refactoring playground</h1><p class="lede">Each exercise has the original code, a goal, hints, step-by-step solutions and the expected behavior. Write your attempt in the scratchpad (it is not executed), then reveal hints and steps as needed.</p><div class="grid">${REFX.map(x=>`<button class="card" style="text-align:left" data-rf="${x.id}"><div class="eyebrow">${LV[x.level]}</div><h3 style="margin:0">${x.title}</h3><p style="color:var(--dim);font-size:13px;margin:6px 0 0">${S.rf[x.id]?'Solved':'Not solved'}</p></button>`).join('')}</div><div id="ex"></div>`;
  $$('[data-rf]').forEach(b=>b.onclick=()=>{const x=REFX.find(s=>s.id===b.dataset.rf);let hi=0,si=0;
    const draw=()=>{$('#ex').innerHTML=`<h2>${x.title}</h2><p><b>Goal:</b> ${x.goal}</p><h3>Original</h3>${codeBlock('java',x.code,{noSave:true})}<h3>Your scratchpad</h3><textarea class="ans" id="pad" aria-label="Your refactoring attempt" placeholder="Rewrite the code here"></textarea>
      <h3>Hints (${hi}/${x.hints.length})</h3>${x.hints.slice(0,hi).map((h,i)=>`<div class="call tip"><p>${i+1}. ${h}</p></div>`).join('')}${hi<x.hints.length?'<button class="btn" id="hint">Show next hint</button>':''}
      <h3>Solution steps (${si}/${x.steps.length})</h3>${x.steps.slice(0,si).map((s,i)=>`<p><b>Step ${i+1}: ${s.t}</b></p>${codeBlock('java',s.c)}`).join('')}${si<x.steps.length?'<button class="btn" id="step">Reveal next step</button>':`<h3>Expected output</h3><p>${x.expected}</p><h3>Why this design is better</h3><p>${x.explain}</p><button class="btn ${S.rf[x.id]?'on':'pri'}" id="solved">${S.rf[x.id]?'✓ Solved':'Mark solved'}</button>`}`;
      const pad=$('#pad');pad.value=draw.pad||'';pad.oninput=()=>draw.pad=pad.value;

    draw.pad='';draw();$('#ex').scrollIntoView({behavior:'smooth'})})};
V.review=()=>{main.innerHTML=crumbs([['Review simulator']])+`<h1>Code review simulator</h1><p class="lede">Open a pull request, click any line to write a review comment, then compare your review with an expert one. Phrase comments the way you would in a real review.</p><div class="grid">${PRS.map(x=>`<button class="card" style="text-align:left" data-pr="${x.id}"><h3 style="margin:0">${x.title}</h3><p style="color:var(--dim);font-size:13px;margin:6px 0 0">${S.pr[x.id]!=null?'Last result: found '+S.pr[x.id]+' issues':'Not reviewed'}</p></button>`).join('')}</div><div id="ex"></div>`;

    const draw=()=>{$('#ex').innerHTML=`<h2>${x.title}</h2><p>${x.desc}</p><p style="color:var(--dim);font-size:13px">Click a line to add or edit a comment.</p><div class="pr" id="prc">${x.lines.map((t,i)=>{const n=i+1;return `<div class="ln hot${cm[n]!==undefined?' sel':''}" data-l="${n}" tabindex="0" role="button" aria-label="Line ${n}"><span class="no">${n}</span><span class="tx">${esc(t)||' '}</span></div>`+(cm[n]!==undefined?`<div class="cm"><b>Your comment</b><textarea class="ans" data-c="${n}" aria-label="Comment on line ${n}" placeholder="Write your review comment">${esc(cm[n])}</textarea></div>`:'')+(shown?x.issues.filter(s=>s.l===n).map(s=>`<div class="cm exp"><b>Expert · ${s.sev}${cm[n]!==undefined&&cm[n].trim()?' · you commented here':' · missed'}</b>${s.c}</div>`).join(''):'')}).join('')}</div>
      <div class="row"><button class="btn pri" id="cmpb">${shown?'Hide expert review':'Compare with expert review'}</button></div><div id="sum"></div>`;
      $$('.ln.hot').forEach(r=>{const fn=()=>{const n=+r.dataset.l;if(cm[n]===undefined)cm[n]='';else if(!cm[n].trim())delete cm[n];draw();const t=$(`[data-c="${n}"]`);if(t)t.focus()};r.onclick=fn;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}});
      $$('[data-c]').forEach(t=>t.oninput=()=>{cm[+t.dataset.c]=t.value});
      $('#cmpb').onclick=()=>{shown=!shown;draw();if(shown){const found=x.issues.filter(s=>cm[s.l]!==undefined&&cm[s.l].trim()).length,bl=x.issues.filter(s=>s.sev==='blocking'),bf=bl.filter(s=>cm[s.l]!==undefined&&cm[s.l].trim()).length;S.pr[x.id]=found;touch();save();

V.quiz=()=>{
  main.innerHTML=crumbs([['Knowledge checks']])+`<h1>Knowledge checks</h1><p class="lede">${QUIZ.length} questions: multiple choice, true/false, find-the-bug, identify-the-smell, scenarios and short coding exercises. Each answer gets immediate feedback and an explanation.</p>
  <div class="card row"><label for="qt">Topic</label><select id="qt" class="btn"><option value="all">All modules</option>${MODS.filter(m=>QUIZ.some(q=>q.topic===m.id)).map(m=>`<option value="${m.id}">${m.n} ${m.title}</option>`).join('')}</select><label for="qn">Questions</label><select id="qn" class="btn"><option>5</option><option selected>10</option><option>20</option></select><button class="btn pri" id="go">Start</button></div><div id="run"></div>`;

V.resources=()=>{const grp=t=>t==='Book'?'Books':['Official documentation','Specification','Style guide'].includes(t)?'Official documentation and style guides':t==='Industry guide'?'Industry guides':'Community material';
  const order=['Official documentation and style guides','Industry guides','Books','Community material'];
  main.innerHTML=crumbs([['Resources']])+`<h1>Additional learning resources</h1><p class="lede">Categories are labeled so you can tell official documentation from books and community material. Link status: <b>Link checked</b> means the page was opened and its title confirmed while this guide was built. <b>Link not checked</b> means the URL is the publisher's published address but could not be opened from the build environment. Books without a link have none listed because a link could not be confirmed; find them through your library or publisher.</p>`+order.map(g=>{const rs=RESOURCES.filter(r=>grp(r.type)===g);return rs.length?`<h2>${g}</h2><div class="grid">${rs.map(r=>`<article class="card"><h3 style="margin:0 0 4px">${r.t}</h3><p style="color:var(--dim);font-size:13px;margin:0 0 8px">${r.by}</p><p style="font-size:14px">${r.d}</p><div class="row"><span class="tag">${r.type}</span><span class="tag">${r.lvl}</span>${r.url?`<span class="tag ${r.ver?'ok':'no'}">${r.ver?'Link checked':'Link not checked'}</span>`:'<span class="tag no">No link</span>'}</div>${r.url?`<p style="margin:10px 0 0"><a href="${r.url}" target="_blank" rel="noopener noreferrer">Open resource ↗</a></p>`:''}</article>`).join('')}</div>`:''}).join('')};
V.search=()=>{const q=($('#q').value||'').trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);
  const res=terms.length?INDEX.map(e=>{const hay=(e.t+' '+e.x).toLowerCase();if(!terms.every(t=>hay.includes(t)))return null;let sc=0;terms.forEach(t=>{if(e.t.toLowerCase().includes(t))sc+=5;sc+=Math.min(3,hay.split(t).length-1)});return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40):[];
  const snip=e=>{const x=e.x,l=x.toLowerCase(),k=l.indexOf(terms[0]);const s=Math.max(0,k-50);let t=esc(x.slice(s,s+160));terms.forEach(w=>{t=t.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return (s>0?'…':'')+t+'…'};
  main.innerHTML=crumbs([['Search']])+`<h1>Search</h1><p class="lede">${terms.length?res.length+' result'+(res.length===1?'':'s')+' for “'+esc(q)+'”':'Type in the search box above to search lessons, references, interview questions and resources.'}</p><div class="res">${res.map(r=>`<a class="card" style="text-decoration:none;color:inherit" href="${r.e.href}"><div class="row"><span class="tag">${r.e.ty}</span><span style="color:var(--dim);font-size:12px">${r.e.sub}</span></div><h3 style="margin:6px 0 4px">${r.e.t}</h3><p style="font-size:13px;color:var(--dim);margin:0">${snip(r.e)}</p></a>`).join('')}</div>`};

/* ---- router ---- */
function route(){const r=(location.hash||'#home').slice(1)||'home';side.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  if(r.startsWith('lesson-'))V.lesson(r.slice(7));else if(V[r]&&r!=='lesson')V[r]();else V.home();
  navState(V[r]||r.startsWith('lesson-')?r:'home');window.scrollTo(0,0);main.focus({preventScroll:true});document.title=(r.startsWith('lesson-')&&les(r.slice(7))?les(r.slice(7)).title+' · ':'')+'Clean Code Mastery'}
/* ---- events ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='copy')copy(CODES[+b.dataset.ci]);
  else if(a==='save'){const code=CODES[+b.dataset.ci];if(!S.snips.some(s=>s.code===code)){S.snips.unshift({code,lang:b.dataset.lang,from:(location.hash.startsWith('#lesson-')&&les(location.hash.slice(8))||{}).title});S.snips=S.snips.slice(0,30);save()}toast('Saved to dashboard')}
  else if(a==='cmp'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=b.dataset.v;s.dataset.v=v;$$('.seg button',s).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('.cv',s).innerHTML=cmpView(c,v);const lab=b.textContent;$('.vl',s).textContent=c.lang+' · '+lab.toLowerCase()}
  else if(a==='cmpcopy'||a==='cmpsave'){const s=b.closest('.cmp'),c=CMPS[s.dataset.cmp],v=s.dataset.v,code=v==='bad'?c.bad:c.good;if(a==='cmpcopy')copy(code);else{if(!S.snips.some(x=>x.code===code)){S.snips.unshift({code,lang:c.lang,from:c.title});save()}toast('Saved to dashboard')}}
  else if(a==='snipcopy')copy(S.snips[+b.dataset.i].code);
  else if(a==='snipdel'){S.snips.splice(+b.dataset.i,1);save();V.home()}});
$('#menu').onclick=()=>{const o=side.classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(o))};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'dark';S.theme=cur==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save()};
$('#q').addEventListener('input',e=>{if(e.target.value.trim()){if(location.hash!=='#search')history.replaceState(null,'','#search');V.search();navState('search');window.scrollTo(0,0)}else if(location.hash==='#search'){location.hash='#home'}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();if(location.hash==='#search')location.hash='#home'}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
const up=$('#up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>700),{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('hashchange',()=>{if(location.hash!=='#search')$('#q').value='';route()});
load();if(S.theme)document.documentElement.dataset.theme=S.theme;
buildSide();route();
</script>

</body></html>
